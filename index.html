ar-free dark chocolate, chopped","israelNote":"85% dark chocolate or sugar-free chocolate from the diabetic shelf"},{"amount":"3/4 cup / 144 g","item":"granulated erythritol-monk fruit blend"},{"amount":"3","item":"large eggs (2 for the brownie, 1 for the cheesecake)"},{"amount":"3/4 cup / 75 g","item":"almond flour","israelNote":"kemach shkedim, finely ground"},{"amount":"1/4 cup / 24 g","item":"cocoa powder, unsweetened"},{"amount":"1/4 tsp","item":"salt"},{"amount":"8 oz / 225 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1/4 cup / 30 g","item":"powdered erythritol-monk fruit blend (for the cheesecake layer)"},{"amount":"1 tsp","item":"vanilla extract"}],"ingredientsHe":[{"amount":"1/2 כוס / 113 גרם","item":"חמאה"},{"amount":"85 גרם","item":"שוקולד מריר ללא סוכר, קצוץ","israelNote":"שוקולד מריר 85% או שוקולד ללא סוכר מהמדף לסוכרתיים"},{"amount":"3/4 כוס / 144 גרם","item":"תערובת אריתריטול ומונק פרוט גרגירית"},{"amount":"3","item":"ביצים גדולות (2 לבראוני, 1 לשכבת הגבינה)"},{"amount":"3/4 כוס / 75 גרם","item":"קמח שקדים","israelNote":"קמח שקדים טחון דק"},{"amount":"1/4 כוס / 24 גרם","item":"אבקת קקאו, לא ממותקת"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"225 גרם","item":"גבינת שמנת, מרוככת","israelNote":"גבינת שמנת (נפוליאון/סקי)"},{"amount":"1/4 כוס / 30 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית (לשכבת הגבינה)"},{"amount":"1 כפית","item":"תמצית וניל"}],"instructions":["Heat the oven to 175C / 350F and line a 20x20 cm (8x8 inch) pan with parchment.","Melt the butter and chocolate together in the microwave in 30-second bursts; stir until smooth. Whisk in the granulated sweetener.","Whisk in 2 eggs, then stir in the almond flour, cocoa and salt until you have a thick, glossy brownie batter.","Spread the batter in the pan, reserving about 1/4 cup.","Beat the cream cheese with the powdered sweetener, 1 egg and vanilla until completely smooth. Pour over the brownie layer.","Drop spoonfuls of the reserved brownie batter on top and drag a knife through in figure-eights to marble the two layers.","Bake 28-32 minutes, until the cheesecake is set at the edges with a slight wobble in the center. Cool fully, then chill 1 hour before cutting into 16 squares."],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית 20x20 ס\"מ בנייר אפייה.","ממיסים יחד את החמאה והשוקולד במיקרוגל בפולסים של 30 שניות; מערבבים עד לקבלת תערובת חלקה. טורפים פנימה את הממתיק הגרגירי.","טורפים פנימה 2 ביצים, ואז מערבבים פנימה את קמח השקדים, הקקאו והמלח עד לקבלת בלילת בראוני סמיכה ומבריקה.","מורחים את הבלילה בתבנית, ושומרים בצד כ-1/4 כוס.","מקציפים את גבינת השמנת עם הממתיק האבקתי, ביצה אחת והווניל עד לקבלת קרם חלק לגמרי. יוצקים על שכבת הבראוני.","מטפטפים כפות מבלילת הבראוני ששמרנו מעל ומעבירים סכין בתנועות שמינייה לשיוש שתי השכבות.","אופים 28-32 דקות, עד ששכבת הגבינה מיוצבת בשוליים עם רעד קל במרכז. מצננים לגמרי, ואז מקררים שעה לפני חיתוך ל-16 ריבועים."],"nutrition":{"calories":180,"fatG":17.0,"satFatG":8.5,"proteinG":4.0,"carbsG":4.5,"fiberG":1.5,"netCarbsG":3.0,"sugarG":1.0,"sodiumMg":100},"lowCarbVariant":"Fold 1/4 cup chopped walnuts into the brownie batter for crunch (adds ~0.2 g net carbs per square).","lowCarbVariantHe":"מקפלים 1/4 כוס אגוזי מלך קצוצים לבלילת הבראוני לפריכות (מוסיף כ-0.2 גרם פחמימות נטו לריבוע).","tips":"They firm up a lot in the fridge — slightly underbaked is exactly right. Cut with a hot dry knife, wiping between cuts, for clean marbled squares.","tipsHe":"הם מתייצבים מאוד במקרר — אפייה מעט חסרה היא בדיוק הנכונה. חותכים בסכין חמה ויבשה, ומנגבים בין חיתוך לחיתוך, לריבועים משוישים נקיים.","sources":[{"creator":"Wholesome Yum","url":"https://www.wholesomeyum.com/keto-cheesecake-brownies-recipe/"},{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-cheesecake-brownies/"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-cheesecake-brownies/"}],"comparedVersions":"Compared Wholesome Yum, Sugar Free Londoner and Low Carb Spark. All layer a fudgy almond-flour brownie under a one-bowl cheesecake; melting real chocolate into the base (Sugar Free Londoner) gives noticeably fudgier results than cocoa-only versions, and reserving a little batter to swirl on top makes the classic marbled look with no extra ingredients.","comparedVersionsHe":"השווינו בין Wholesome Yum, Sugar Free Londoner ו-Low Carb Spark. כולם שמים בראוני פאדג\u0027י מקמח שקדים מתחת לשכבת גבינה של קערה אחת; המסת שוקולד אמיתי לתוך הבסיס (Sugar Free Londoner) נותנת תוצאה פאדג\u0027ית בבירור לעומת גרסאות קקאו בלבד, ושמירת מעט בלילה לשיוש מלמעלה יוצרת את המראה המשויש הקלאסי בלי מצרכים נוספים."},{"id":"lemon-curd-whipped-cream","name":"Lemon Curd with Whipped Cream","nameHe":"קרם לימון (לימון קרד) עם קצפת","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":10,"difficulty":"medium","ingredients":[{"amount":"3","item":"large eggs"},{"amount":"1/2 cup / 120 ml","item":"fresh lemon juice (about 3 lemons)"},{"amount":"1 tbsp","item":"lemon zest (from 2 lemons)"},{"amount":"1/2 cup / 100 g","item":"granulated allulose or powdered erythritol-monk fruit blend","israelNote":"allulose stays smooth after chilling; if using erythritol, powder it first in a blender"},{"amount":"6 tbsp / 85 g","item":"butter, cubed"},{"amount":"1 cup / 240 ml","item":"heavy cream, cold","israelNote":"shamenet metuka 38%"},{"amount":"2 tbsp / 15 g","item":"powdered sweetener (for the cream)"},{"amount":"1/2 tsp","item":"vanilla extract"}],"ingredientsHe":[{"amount":"3","item":"ביצים גדולות"},{"amount":"1/2 כוס / 120 מ\"ל","item":"מיץ לימון טרי (כ-3 לימונים)"},{"amount":"1 כף","item":"גרידת לימון (מ-2 לימונים)"},{"amount":"1/2 כוס / 100 גרם","item":"אלולוז גרגירי או תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"אלולוז נשאר חלק אחרי הקירור; אם משתמשים באריתריטול, טוחנים אותו קודם לאבקה בבלנדר"},{"amount":"6 כפות / 85 גרם","item":"חמאה, חתוכה לקוביות"},{"amount":"1 כוס / 240 מ\"ל","item":"שמנת מתוקה 38%, קרה"},{"amount":"2 כפות / 15 גרם","item":"ממתיק אבקתי (לקצפת)"},{"amount":"1/2 כפית","item":"תמצית וניל"}],"instructions":["Whisk the eggs, lemon juice, zest and sweetener in a small heavy-bottomed pot until smooth.","Set over low heat and cook, whisking constantly, 5-8 minutes, until the curd thickens enough to coat the back of a spoon. Never let it boil — it will scramble.","Remove from the heat and whisk in the butter a few cubes at a time until melted and silky.","Strain through a fine sieve into a bowl (catches any bits of cooked egg and the zest). Press plastic wrap onto the surface and chill at least 2 hours — it thickens as it cools.","Whip the cold cream with the powdered sweetener and vanilla to soft peaks.","Layer curd and whipped cream in 6 small glasses, or fold them together loosely for a marbled lemon fool."],"instructionsHe":["טורפים את הביצים, מיץ הלימון, הגרידה והממתיק בסיר קטן עם תחתית עבה עד לקבלת תערובת חלקה.","מבשלים על אש נמוכה תוך טריפה מתמדת, 5-8 דקות, עד שהקרם מסמיך מספיק כדי לצפות גב של כף. לא נותנים לו לרתוח בשום שלב — הוא יתקרש כמו חביתה.","מסירים מהאש וטורפים פנימה את החמאה כמה קוביות בכל פעם, עד שהיא נמסה והקרם משיי.","מסננים דרך מסננת דקה לקערה (תופסת חתיכות ביצה מבושלת ואת הגרידה). מצמידים ניילון נצמד לפני השטח ומקררים לפחות שעתיים — הקרם מסמיך כשהוא מתקרר.","מקציפים את השמנת הקרה עם הממתיק האבקתי והווניל לפסגות רכות.","מסדרים שכבות של קרם לימון וקצפת ב-6 כוסות קטנות, או מקפלים אותם יחד ברישול לקינוח לימון משויש."],"nutrition":{"calories":290,"fatG":29.0,"satFatG":17.0,"proteinG":4.0,"carbsG":3.5,"fiberG":0.2,"netCarbsG":3.3,"sugarG":1.5,"sodiumMg":70},"lowCarbVariant":"Serve over 1/4 cup fresh raspberries per glass (~5 g net carbs total).","lowCarbVariantHe":"מגישים על 1/4 כוס פטל טרי בכל כוס (כ-5 גרם פחמימות נטו בסך הכול).","tips":"Low and slow is the whole game — if you see the first bubble, pull the pot off the heat and keep whisking. The curd keeps a week in the fridge and is excellent on keto pancakes.","tipsHe":"לאט ועל אש נמוכה — זה כל הסוד. אם רואים את הבועה הראשונה, מורידים את הסיר מהאש וממשיכים לטרוף. הקרם נשמר שבוע במקרר ומצוין על פנקייק קיטו.","sources":[{"creator":"Low Carb Maven","url":"https://www.lowcarbmaven.com/my-favorite-low-carb-lemon-curd/"},{"creator":"Sugar-Free Mom","url":"https://www.sugarfreemom.com/recipes/sugar-free-lemon-curd-parfait/"},{"creator":"Mad Creations","url":"https://madcreationshub.com/recipe/zesty-sugar-free-keto-lemon-curd/"}],"comparedVersions":"Compared Low Carb Maven, Sugar-Free Mom\u0027s parfait and Mad Creations. The whole-egg direct-pot method (no double boiler, no yolk separation) is the simplest and works reliably over low heat; allulose was the consensus best sweetener because erythritol can recrystallize in chilled curd. The parfait presentation follows Sugar-Free Mom.","comparedVersionsHe":"השווינו בין Low Carb Maven, הפרפה של Sugar-Free Mom ו-Mad Creations. שיטת הביצה השלמה ישירות בסיר (בלי בן-מארי, בלי הפרדת חלמונים) היא הפשוטה ביותר ועובדת באמינות על אש נמוכה; אלולוז היה בקונצנזוס הממתיק הטוב ביותר כי אריתריטול עלול להתגבש מחדש בקרם מקורר. הגשת הפרפה בעקבות Sugar-Free Mom."},{"id":"keto-lemon-meringue-pie","name":"Keto Lemon Meringue Pie","nameHe":"פאי לימון קיטו עם מרנג","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":30,"cookTimeMin":20,"difficulty":"medium","ingredients":[{"amount":"2 cups / 200 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"3 tbsp / 45 g","item":"butter, melted (for the crust)"},{"amount":"3/4 cup + 2 tbsp / 110 g total","item":"powdered erythritol-allulose sweetener, divided","israelNote":"blitz granulated sweetener in a blender; allulose stays smooth when chilled"},{"amount":"6 large","item":"egg yolks (keep 4 whites for the meringue)"},{"amount":"3/4 cup / 180 ml","item":"fresh lemon juice (about 4 lemons)"},{"amount":"1 tbsp","item":"lemon zest"},{"amount":"1/4 cup / 60 ml","item":"cold water (for blooming the gelatin)"},{"amount":"2 tsp","item":"kosher gelatin powder","israelNote":"gelatin with a hechsher; no gelatin? whisk in 1/4 tsp xanthan gum instead"},{"amount":"3 tbsp / 45 g","item":"butter, cubed (for the curd)"},{"amount":"1/4 tsp","item":"cream of tartar (or 1 tsp lemon juice)"}],"ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים"},{"amount":"3 כפות / 45 גרם","item":"חמאה מומסת (לקלתית)"},{"amount":"3/4 כוס + 2 כפות / 110 גרם סך הכול","item":"ממתיק אריתריטול-אלולוז טחון, מחולק","israelNote":"טוחנים ממתיק גרגירי בבלנדר; אלולוז נשאר חלק בקירור"},{"amount":"6 גדולים","item":"חלמונים (שומרים 4 חלבונים למרנג)"},{"amount":"3/4 כוס / 180 מ\"ל","item":"מיץ לימון טרי (כ-4 לימונים)"},{"amount":"1 כף","item":"גרידת לימון"},{"amount":"1/4 כוס / 60 מ\"ל","item":"מים קרים (להשריית הג\u0027לטין)"},{"amount":"2 כפיות","item":"אבקת ג\u0027לטין כשר","israelNote":"ג\u0027לטין עם הכשר; אין ג\u0027לטין? אפשר 1/4 כפית קסנטן גאם במקום"},{"amount":"3 כפות / 45 גרם","item":"חמאה בקוביות (לקרם הלימון)"},{"amount":"1/4 כפית","item":"קרם טרטר (או כפית מיץ לימון)"}],"instructions":["Heat the oven to 175°C. Mix the almond flour, melted butter, 2 tbsp of the sweetener and a pinch of salt; press into a 23 cm pie dish and bake 10-12 minutes until the edges turn golden. Cool.","Sprinkle the gelatin over the cold water and let it bloom 5 minutes.","Whisk the yolks, lemon juice, zest and 3/4 cup sweetener in a saucepan. Cook over medium-low heat, whisking constantly, 4-6 minutes until the curd visibly thickens and coats a spoon — do not let it boil.","Off the heat, whisk the bloomed gelatin into the hot curd until fully dissolved, then whisk in the cubed butter until smooth.","Pour the curd into the cooled crust and refrigerate at least 4 hours (or overnight) until fully set.","Beat the 4 reserved egg whites with the cream of tartar to soft peaks; add the remaining 1/4 cup sweetener gradually and beat to stiff, glossy peaks.","Spread the meringue over the chilled filling, sealing it to the crust edge; swirl peaks with the back of a spoon.","Brown under a hot grill (broiler) 1-2 minutes — watch constantly — or torch until golden. Chill until serving."],"instructionsHe":["מחממים תנור ל-175 מעלות. מערבבים קמח שקדים, חמאה מומסת, 2 כפות מהממתיק וקורט מלח; מהדקים לתבנית פאי 23 ס\"מ ואופים 10-12 דקות עד שהשוליים מזהיבים. מצננים.","מפזרים את הג\u0027לטין על המים הקרים ומניחים להשרות 5 דקות.","טורפים בסיר את החלמונים, מיץ הלימון, הגרידה ו-3/4 כוס ממתיק. מבשלים על אש בינונית-נמוכה תוך טריפה מתמדת 4-6 דקות, עד שהקרם מסמיך ומצפה כף — לא מרתיחים.","מחוץ לאש טורפים את הג\u0027לטין המושרה לתוך הקרם החם עד שנמס לגמרי, ואז טורפים פנימה את קוביות החמאה עד לקרם חלק.","יוצקים את קרם הלימון לקלתית הצוננת ומקררים לפחות 4 שעות (או לילה) עד להתייצבות מלאה.","מקציפים את 4 החלבונים ששמרנו עם קרם הטרטר לקצף רך; מוסיפים בהדרגה את 1/4 הכוס ממתיק שנותרה ומקציפים לקצף יציב ומבריק.","מורחים את המרנג על המלית הקרה עד לשולי הקלתית; יוצרים עיטורים עם גב כף.","משחימים מתחת לגריל תנור לוהט 1-2 דקות — משגיחים כל הזמן — או צורבים בברנר עד הזהבה. מקררים עד ההגשה."],"nutrition":{"calories":233,"fatG":20.5,"satFatG":7.6,"proteinG":8.4,"carbsG":6.1,"fiberG":2.8,"netCarbsG":3.3,"sugarG":1.6,"sodiumMg":95},"tips":"Use allulose or an allulose blend for the meringue and curd — plain erythritol recrystallizes into a gritty texture after chilling. The pie keeps 2-3 days in the fridge; don\u0027t freeze (the meringue weeps).","tipsHe":"השתמשו באלולוז או בתערובת אלולוז למרנג ולקרם — אריתריטול לבדו מתגבש למרקם חולי אחרי קירור. הפאי נשמר 2-3 ימים במקרר; לא מקפיאים (המרנג מפריש נוזלים).","ketoVariant":"Already keto at 3.3 g net carbs per slice.","ketoVariantHe":"כבר קיטו — 3.3 גרם פחמימות נטו לפרוסה.","lowCarbVariant":"Pareve option for after a meat meal: use coconut oil in the crust and swap the curd butter for 2 tbsp coconut cream — the flavor shifts slightly tropical but sets the same.","lowCarbVariantHe":"גרסה פרווה לאחרי ארוחה בשרית: שמן קוקוס בקלתית ו-2 כפות קרם קוקוס במקום החמאה בקרם — הטעם מעט קוקוסי אך ההתייצבות זהה.","sources":[{"creator":"Wholesome Yum","url":"https://www.wholesomeyum.com/keto-lemon-meringue-pie/"},{"creator":"Sugar-Free Mom","url":"https://www.sugarfreemom.com/recipes/easy-sugar-free-low-carb-keto-lemon-meringue-pie/"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-lemon-meringue-pie/"}],"comparedVersions":"Compared Wholesome Yum (gelatin + xanthan set, almond crust), Sugar-Free Mom (gelatin curd, Swiss meringue, coconut crust) and The Big Man\u0027s World\u0027s minimal version. Kept the classic gelatin set (kosher gelatin) from the leading recipes on Wholesome Yum\u0027s almond crust, with a simple French meringue; a xanthan-only fallback is noted for when gelatin isn\u0027t on hand.","comparedVersionsHe":"הושוו הגרסאות של Wholesome Yum, Sugar-Free Mom ו-The Big Man\u0027s World. נשמרה ההתייצבות הקלאסית בג\u0027לטין (כשר) מהמתכונים המובילים, על קלתית השקדים של Wholesome Yum ועם מרנג צרפתי פשוט; חלופת קסנטן מצוינת בהערות למי שאין ג\u0027לטין בבית."},{"id":"no-churn-vanilla-ice-cream","name":"No-Churn Vanilla Ice Cream","nameHe":"גלידת וניל ללא מכונת גלידה","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":15,"cookTimeMin":35,"difficulty":"medium","ingredients":[{"amount":"3 tbsp / 42 g","item":"butter"},{"amount":"3 cups / 720 ml","item":"heavy cream, divided (2 cups + 1 cup)","israelNote":"shamenet metuka 38%"},{"amount":"1/3 cup / 43 g","item":"powdered allulose or erythritol-monk fruit sweetener","israelNote":"allulose is hard to find in Israel; use powdered erythritol blend and add the vodka"},{"amount":"1 cup / 240 ml","item":"unsweetened almond milk"},{"amount":"2 tsp / 10 ml","item":"vanilla extract, or 1 tsp extract + seeds of 1/2 vanilla pod"},{"amount":"1 tbsp / 15 ml","item":"vodka (optional, keeps it scoopable)"},{"amount":"1 pinch","item":"fine salt"}],"ingredientsHe":[{"amount":"3 כפות / 42 גרם","item":"חמאה"},{"amount":"3 כוסות / 720 מ\"ל","item":"שמנת מתוקה 38%, מחולקת (2 כוסות + 1 כוס)"},{"amount":"1/3 כוס / 43 גרם","item":"אלולוז טחון או ממתיק אריתריטול-פרי הנזירים טחון","israelNote":"אלולוז קשה להשגה בישראל; משתמשים בתערובת אריתריטול טחונה ומוסיפים את הוודקה"},{"amount":"1 כוס / 240 מ\"ל","item":"משקה שקדים ללא סוכר"},{"amount":"2 כפיות / 10 מ\"ל","item":"תמצית וניל, או כפית תמצית + גרגירים מ-1/2 מקל וניל"},{"amount":"1 כף / 15 מ\"ל","item":"וודקה (לא חובה, שומרת על מרקם רך)"},{"amount":"קורט","item":"מלח דק"}],"instructions":["Melt the butter in a wide pan, add the sweetener and 2 cups of the cream, and simmer gently 30–40 minutes, stirring now and then, until reduced by about half. This homemade \u0027condensed milk\u0027 is what makes no-churn ice cream creamy instead of icy.","Cool the reduced cream to room temperature, then stir in the vanilla, salt and vodka if using.","Whisk in the almond milk and the remaining 1 cup cream until smooth.","Refrigerate the base at least 4 hours or overnight — a cold base freezes with smaller ice crystals.","Pour into a loaf pan, cover, and freeze. Stir thoroughly every 30 minutes for the first 2 hours, then every hour until scoopable, about 4–5 hours total.","If frozen solid overnight, let it stand 10–15 minutes at room temperature before scooping."],"instructionsHe":["ממיסים את החמאה במחבת רחבה, מוסיפים את הממתיק ו-2 כוסות מהשמנת, ומבשלים ברתיחה עדינה 30–40 דקות תוך ערבוב מדי פעם, עד שהנוזל מצטמצם בכמחצית. \u0027החלב המרוכז\u0027 הביתי הזה הוא מה שהופך גלידה ללא מכונה לקרמית במקום קרחונית.","מצננים את השמנת המצומצמת לטמפרטורת החדר, ואז מערבבים פנימה את הווניל, המלח והוודקה אם משתמשים.","טורפים פנימה את משקה השקדים ואת כוס השמנת הנותרת עד למרקם חלק.","מקררים את הבסיס לפחות 4 שעות או לילה שלם — בסיס קר קופא עם גבישי קרח קטנים יותר.","יוצקים לתבנית אינגליש קייק, מכסים ומקפיאים. מערבבים היטב כל 30 דקות בשעתיים הראשונות, ואז כל שעה עד שהגלידה ניתנת לגריפה, כ-4–5 שעות בסך הכול.","אם הגלידה קפאה לגמרי במהלך הלילה, מוציאים ל-10–15 דקות בטמפרטורת החדר לפני הגריפה."],"nutrition":{"calories":467,"fatG":49.3,"satFatG":31,"proteinG":3.4,"carbsG":3.5,"fiberG":0.2,"netCarbsG":3.3,"sugarG":3,"sodiumMg":65},"tips":"Sweetener choice matters most here: allulose keeps ice cream soft, erythritol alone freezes hard — the vodka compensates. It never tastes of alcohol.","tipsHe":"בחירת הממתיק היא הקריטית כאן: אלולוז שומר על גלידה רכה, אריתריטול לבדו קופא קשה — הוודקה מפצה על כך. לא מרגישים טעם של אלכוהול.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/sugar-free-low-carb-ice-cream-no-churn-4-ingredients/"},{"creator":"KetoDiet Blog (Martina Slajerova)","url":"https://ketodietapp.com/Blog/lchf/no-churn-vanilla-keto-ice-cream"},{"creator":"KetoFocus","url":"https://www.ketofocus.com/recipes/keto-vanilla-ice-cream/"}],"comparedVersions":"Compared Wholesome Yum\u0027s reduced-cream \u0027condensed milk\u0027 method, KetoDiet Blog\u0027s egg-based version and KetoFocus\u0027s vodka trick. The reduced-cream base won for creaminess without raw eggs or an ice cream machine; I added KetoFocus\u0027s optional vodka to fix the hard-freeze problem of erythritol, which matters in Israel where allulose is scarce.","comparedVersionsHe":"השוויתי בין שיטת \u0027החלב המרוכז\u0027 משמנת מצומצמת של Wholesome Yum, הגרסה על בסיס ביצים של KetoDiet Blog וטריק הוודקה של KetoFocus. בסיס השמנת המצומצמת ניצח בקרמיות ללא ביצים חיות וללא מכונת גלידה; הוספתי את הוודקה האופציונלית של KetoFocus כדי לפתור את בעיית הקיפאון הקשה של אריתריטול — חשוב בישראל, שבה אלולוז נדיר."},{"id":"keto-chocolate-milkshake","name":"Keto Chocolate Milkshake","nameHe":"מילקשייק שוקולד קיטו","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":2,"prepTimeMin":5,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"3/4 cup / 180 ml","item":"unsweetened almond milk","israelNote":"unsweetened almond drink (check label — no added sugar)"},{"amount":"1/2 cup / 120 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"2 tbsp / 30 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski) — this is what makes it thick"},{"amount":"2 tbsp / 11 g","item":"cocoa powder, unsweetened"},{"amount":"3 tbsp / 22 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it"},{"amount":"1/2 tsp","item":"vanilla extract"},{"amount":"1 cup / 150 g","item":"ice cubes"},{"amount":"1 pinch","item":"salt"}],"ingredientsHe":[{"amount":"3/4 כוס / 180 מ\"ל","item":"משקה שקדים ללא סוכר","israelNote":"לבדוק בתווית — ללא סוכר מוסף"},{"amount":"1/2 כוס / 120 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"2 כפות / 30 גרם","item":"גבינת שמנת, מרוככת","israelNote":"גבינת שמנת (נפוליאון/סקי) — היא מה שעושה אותו סמיך"},{"amount":"2 כפות / 11 גרם","item":"אבקת קקאו, לא ממותקת"},{"amount":"3 כפות / 22 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה"},{"amount":"1/2 כפית","item":"תמצית וניל"},{"amount":"1 כוס / 150 גרם","item":"קוביות קרח"},{"amount":"קורט","item":"מלח"}],"instructions":["Put the almond milk, cream, cream cheese, cocoa, sweetener, vanilla and salt in a blender.","Blend 30 seconds until completely smooth — no cocoa lumps.","Add the ice and blend on high until thick and frosty.","Taste and adjust: more sweetener, or another ice cube if you want it thicker.","Pour into 2 glasses and drink immediately, optionally topped with a spoon of whipped cream and grated dark chocolate."],"instructionsHe":["שמים בבלנדר את משקה השקדים, השמנת, גבינת השמנת, הקקאו, הממתיק, הווניל והמלח.","טוחנים 30 שניות עד לקבלת תערובת חלקה לגמרי — בלי גושי קקאו.","מוסיפים את הקרח וטוחנים במהירות גבוהה עד שהמשקה סמיך וקפוא.","טועמים ומתקנים: עוד ממתיק, או עוד קוביית קרח אם רוצים סמיך יותר.","מוזגים ל-2 כוסות ושותים מיד, אפשר בתוספת כף קצפת ושוקולד מריר מגורר מעל."],"nutrition":{"calories":275,"fatG":27.0,"satFatG":17.0,"proteinG":3.5,"carbsG":5.5,"fiberG":2.0,"netCarbsG":3.5,"sugarG":1.5,"sodiumMg":160},"ketoVariant":"For vanilla: skip the cocoa, use 1 tsp vanilla and a pinch of cinnamon (~2.5 g net carbs).","ketoVariantHe":"לגרסת וניל: מוותרים על הקקאו, שמים כפית וניל וקורט קינמון (כ-2.5 גרם פחמימות נטו).","lowCarbVariant":"Blend in 1/4 cup frozen strawberries for a chocolate-berry shake (~5.5 g net carbs).","lowCarbVariantHe":"טוחנים פנימה 1/4 כוס תותים קפואים לשייק שוקולד-תות (כ-5.5 גרם פחמימות נטו).","tips":"Cream cheese plus ice replaces the ice cream — softened cream cheese blends smoothest. A pinch of salt makes the chocolate taste deeper.","tipsHe":"גבינת שמנת עם קרח מחליפה את הגלידה — גבינת שמנת מרוככת נטחנת הכי חלק. קורט מלח מעמיק את טעם השוקולד.","sources":[{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-chocolate-milkshake/"},{"creator":"Low Carb Yum","url":"https://lowcarbyum.com/creamy-low-carb-chocolate-frosty-shake/"},{"creator":"Keto-Mojo","url":"https://keto-mojo.com/recipes/keto-chocolate-milkshake/"}],"comparedVersions":"Compared Sugar Free Londoner, Low Carb Yum\u0027s frosty shake and Keto-Mojo. All blend cream + almond milk + cocoa; the thickener was the differentiator (xanthan gum vs chia vs cream cheese), and cream cheese won — always available in Israel, adds body and a slight milkshake tang with no gumminess.","comparedVersionsHe":"השווינו בין Sugar Free Londoner, השייק הקפוא של Low Carb Yum ו-Keto-Mojo. כולם טוחנים שמנת + משקה שקדים + קקאו; ההבדל היה במסמיך (קסנטן גאם מול צ\u0027יה מול גבינת שמנת), וגבינת השמנת ניצחה — זמינה תמיד בישראל, מוסיפה גוף וחמצמצות קלה של מילקשייק בלי גומיות."},{"id":"whipped-cream-chocolate-mousse","name":"Chocolate Mousse (Whipped Cream Based)","nameHe":"מוס שוקולד על בסיס קצפת","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 1/2 cups / 360 ml","item":"cold heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"3 tbsp / 16 g","item":"unsweetened cocoa powder, sifted"},{"amount":"1/3 cup / 43 g","item":"powdered erythritol-monk fruit sweetener (blitz granular in a blender)"},{"amount":"1 tsp / 5 ml","item":"vanilla extract"},{"amount":"1 pinch","item":"fine salt"}],"ingredientsHe":[{"amount":"1 1/2 כוסות / 360 מ\"ל","item":"שמנת מתוקה 38% קרה"},{"amount":"3 כפות / 16 גרם","item":"אבקת קקאו ללא סוכר, מנופה"},{"amount":"1/3 כוס / 43 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון (טוחנים גרגירי בבלנדר)"},{"amount":"1 כפית / 5 מ\"ל","item":"תמצית וניל"},{"amount":"קורט","item":"מלח דק"}],"instructions":["Chill the mixing bowl and beaters in the freezer for 10 minutes — cold equipment whips faster and higher.","Put the cream, sifted cocoa, powdered sweetener, vanilla and salt in the bowl together. Whipping everything from the start avoids the over-churned, buttery texture you get when cocoa is beaten into already-stiff cream.","Beat on medium speed until the mousse holds firm peaks, 2–3 minutes. Stop as soon as it is thick — over-beating turns it grainy.","Spoon or pipe into 4 glasses and serve, or chill up to 24 hours; it firms slightly in the fridge."],"instructionsHe":["מקררים את קערת הערבול ואת הווים במקפיא 10 דקות — כלים קרים מקציפים מהר יותר ולנפח גבוה יותר.","שמים בקערה יחד את השמנת, הקקאו המנופה, הממתיק הטחון, הווניל והמלח. הקצפה של הכול מההתחלה מונעת את המרקם החמאתי והמעובד שנוצר כשמקציפים קקאו לתוך קצפת שכבר יציבה.","מקציפים במהירות בינונית עד שהמוס מחזיק פסגות יציבות, 2–3 דקות. עוצרים ברגע שהוא מסמיך — הקצפת יתר הופכת אותו לגרגירי.","מעבירים בכף או מזלפים ל-4 כוסות ומגישים, או מקררים עד 24 שעות; המוס מתייצב מעט במקרר."],"nutrition":{"calories":320,"fatG":33.5,"satFatG":21,"proteinG":2.6,"carbsG":4.8,"fiberG":1.3,"netCarbsG":3.5,"sugarG":2.5,"sodiumMg":60},"tips":"Powdered sweetener is essential — granular erythritol stays crunchy in cold cream. Top with a little grated dark chocolate (dairy or pareve both fine here).","tipsHe":"ממתיק טחון הוא חובה — אריתריטול גרגירי נשאר פריך בשמנת קרה. מקשטים במעט שוקולד מריר מגורר (חלבי או פרווה — שניהם מתאימים כאן).","lowCarbVariant":"Fold in 50 g melted 85% dark chocolate for a richer, denser mousse (about +2 g net carbs per serving).","lowCarbVariantHe":"מקפלים פנימה 50 גרם שוקולד מריר 85% מומס למוס עשיר וסמיך יותר (תוספת של כ-2 גרם פחמימות נטו למנה).","sources":[{"creator":"The Big Man\u0027s World (Arman Liew)","url":"https://thebigmansworld.com/keto-chocolate-mousse/"},{"creator":"Chocolate Covered Katie","url":"https://chocolatecoveredkatie.com/keto-chocolate-mousse-recipe/"},{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/chocolate-mousse-recipe/"}],"comparedVersions":"Compared 3-ingredient whipped versions (Big Man\u0027s World, Chocolate Covered Katie) against egg- and cream-cheese-based mousses. The whipped-cream version won on simplicity and texture; the key technique difference — whipping cocoa in from the start rather than at stiff peaks — came from comparing failure notes across the recipes.","comparedVersionsHe":"השוויתי גרסאות קצפת מ-3 מרכיבים (Big Man\u0027s World, Chocolate Covered Katie) מול מוסים על בסיס ביצים וגבינת שמנת. גרסת הקצפת ניצחה בפשטות ובמרקם; ההבדל הטכני המרכזי — הקצפת הקקאו מההתחלה במקום הוספתו לקצפת יציבה — עלה מהשוואת הערות הכישלון בין המתכונים."},{"id":"keto-tiramisu","name":"Keto Tiramisu","nameHe":"טירמיסו קיטו","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":30,"cookTimeMin":18,"difficulty":"medium","ingredients":[{"amount":"1 1/2 cups / 150 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/3 cup / 43 g","item":"granular erythritol-monk fruit sweetener, for the cake"},{"amount":"2 tsp","item":"baking powder"},{"amount":"1/4 tsp","item":"fine salt"},{"amount":"2","item":"large eggs"},{"amount":"1/4 cup / 57 g","item":"butter, melted"},{"amount":"3 tbsp / 45 ml","item":"water"},{"amount":"1/2 cup / 120 ml","item":"strong espresso or brewed coffee, cooled"},{"amount":"1 tbsp / 15 ml","item":"dark rum (optional)"},{"amount":"450 g / 16 oz","item":"mascarpone, softened","israelNote":"mascarpone (Gad) or gvinat shamenet"},{"amount":"2/3 cup / 85 g","item":"powdered erythritol-monk fruit sweetener, for the filling"},{"amount":"3/4 cup / 180 ml","item":"cold heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1 tbsp / 5 g","item":"unsweetened cocoa powder, for dusting"}],"ingredientsHe":[{"amount":"1 1/2 כוסות / 150 גרם","item":"קמח שקדים מולבן"},{"amount":"1/3 כוס / 43 גרם","item":"ממתיק אריתריטול-פרי הנזירים גרגירי, לעוגה"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"1/4 כפית","item":"מלח דק"},{"amount":"2","item":"ביצים גדולות"},{"amount":"1/4 כוס / 57 גרם","item":"חמאה מומסת"},{"amount":"3 כפות / 45 מ\"ל","item":"מים"},{"amount":"1/2 כוס / 120 מ\"ל","item":"אספרסו חזק או קפה מוכן, מצונן"},{"amount":"1 כף / 15 מ\"ל","item":"רום כהה (לא חובה)"},{"amount":"450 גרם","item":"מסקרפונה מרוככת","israelNote":"מסקרפונה (גד) או גבינת שמנת"},{"amount":"2/3 כוס / 85 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון, למלית"},{"amount":"3/4 כוס / 180 מ\"ל","item":"שמנת מתוקה 38% קרה"},{"amount":"1 כף / 5 גרם","item":"אבקת קקאו ללא סוכר, לפיזור מעל"}],"instructions":["Heat the oven to 165°C / 325°F. Line a large baking sheet with baking paper.","Whisk the almond flour, granular sweetener, baking powder and salt. Beat in the eggs, melted butter and water to a spreadable batter.","Spread the batter into a thin rectangle roughly 20 x 30 cm and bake 15–18 minutes until golden and springy. Cool, then cut into fingers sized to fit a 20 cm (8 inch) square dish in two layers.","Stir the coffee and rum together in a shallow bowl.","Beat the mascarpone with half the powdered sweetener until smooth. In another bowl whip the cream with the remaining sweetener to firm peaks, then fold it into the mascarpone.","Dip half the cake fingers briefly in the coffee — a quick dunk, they absorb fast — and arrange in the dish. Spread with half the mascarpone cream.","Repeat with the remaining fingers and cream.","Cover and refrigerate at least 4 hours (overnight is better), then dust generously with cocoa before serving."],"instructionsHe":["מחממים תנור ל-165 מעלות. מרפדים תבנית אפייה גדולה בנייר אפייה.","מערבבים במטרפה את קמח השקדים, הממתיק הגרגירי, אבקת האפייה והמלח. מוסיפים את הביצים, החמאה המומסת והמים ומערבבים לבלילה הניתנת למריחה.","מורחים את הבלילה למלבן דק בגודל של כ-20x30 ס\"מ ואופים 15–18 דקות עד שהעוגה זהובה וקפיצית. מצננים, ואז חותכים לאצבעות בגודל שמתאים לתבנית מרובעת של 20 ס\"מ בשתי שכבות.","מערבבים את הקפה והרום בקערה שטוחה.","מקציפים את המסקרפונה עם מחצית הממתיק הטחון עד למרקם חלק. בקערה נוספת מקציפים את השמנת עם שארית הממתיק לקצפת יציבה, ומקפלים אותה לתוך המסקרפונה.","טובלים מחצית מאצבעות העוגה בקפה בטבילה קצרה — הן סופגות מהר — ומסדרים בתבנית. מורחים מעל מחצית מקרם המסקרפונה.","חוזרים על הפעולה עם שארית האצבעות והקרם.","מכסים ומקררים לפחות 4 שעות (לילה שלם עדיף), ולפני ההגשה מפזרים מעל שכבה נדיבה של קקאו."],"nutrition":{"calories":340,"fatG":33.6,"satFatG":18.5,"proteinG":5.8,"carbsG":5.4,"fiberG":1.6,"netCarbsG":3.8,"sugarG":1.5,"sodiumMg":130},"ketoVariant":"Skip the rum and add 1/4 tsp rum extract to the coffee — zero carbs, same aroma.","ketoVariantHe":"מוותרים על הרום ומוסיפים לקפה 1/4 כפית תמצית רום — אפס פחמימות, אותו ארומה.","tips":"The sponge tastes best after a full night in the fridge, when the coffee and cream have fully softened it. Israeli mascarpone (Gad) is slightly looser than Italian — beat it gently or it can split.","tipsHe":"העוגה הכי טעימה אחרי לילה שלם במקרר, כשהקפה והקרם ריככו אותה לגמרי. מסקרפונה ישראלית (גד) רכה מעט מהאיטלקית — מקציפים אותה בעדינות כדי שלא תיפרד.","sources":[{"creator":"All Day I Dream About Food (Carolyn Ketchum)","url":"https://alldayidreamaboutfood.com/keto-tiramisu/"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-tiramisu/"},{"creator":"MyKetoPlate","url":"https://myketoplate.com/keto-tiramisu/"}],"comparedVersions":"Compared Carolyn Ketchum\u0027s sheet-cake method, Low Carb Spark and MyKetoPlate. Ketchum\u0027s thin sheet-pan sponge won for simplicity over piping individual ladyfingers; I dropped her whey protein powder (minor texture gain, extra specialty ingredient) and kept the shared whipped-cream-into-mascarpone filling and coffee-rum soak.","comparedVersionsHe":"השוויתי בין שיטת עוגת המשטח של קרולין קצ\u0027ם, Low Carb Spark ו-MyKetoPlate. עוגת המשטח הדקה של קצ\u0027ם ניצחה בפשטות לעומת זילוף אצבעות בודדות; ויתרתי על אבקת חלבון המי-גבינה שלה (שיפור מרקם קטן, מרכיב מיוחד נוסף) ושמרתי על המלית המשותפת של קצפת מקופלת במסקרפונה ועל טבילת הקפה-רום."},{"id":"frozen-yogurt-berry-bark","name":"Frozen Yogurt Bark with Berries","nameHe":"שברי יוגורט קפוא עם פירות יער","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":8,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"2 cups / 450 g","item":"full-fat Greek yogurt","israelNote":"yogurt Yevani 5-10%"},{"amount":"3 tbsp / 36 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/2 cup / 75 g","item":"strawberries, thinly sliced"},{"amount":"1/4 cup / 35 g","item":"blueberries"},{"amount":"2 tbsp / 20 g","item":"chopped pistachios or sugar-free chocolate chips (optional)"}],"ingredientsHe":[{"amount":"2 כוסות / 450 גרם","item":"יוגורט יווני מלא","israelNote":"יוגורט יווני 5-10% שומן"},{"amount":"3 כפות / 36 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/2 כוס / 75 גרם","item":"תותים, פרוסים דק"},{"amount":"1/4 כוס / 35 גרם","item":"אוכמניות"},{"amount":"2 כפות / 20 גרם","item":"פיסטוקים קצוצים או שבבי שוקולד ללא סוכר (לא חובה)"}],"instructions":["Line a rimmed baking sheet with parchment paper.","Stir the yogurt, powdered sweetener and vanilla together until the sweetener is fully dissolved. Taste and adjust sweetness.","Spread the yogurt on the parchment in an even layer about 1/2 cm (1/4 inch) thick.","Scatter the strawberry slices, blueberries and nuts or chocolate chips over the top, pressing them in lightly.","Freeze flat for at least 3 hours, until completely firm.","Break or cut into 8 pieces. Store in a sealed container in the freezer and eat within a few minutes of taking out — it softens fast."],"instructionsHe":["מרפדים תבנית אפייה עם שוליים בנייר אפייה.","מערבבים את היוגורט, הממתיק האבקתי והווניל עד שהממתיק נמס לגמרי. טועמים ומתקנים מתיקות.","מורחים את היוגורט על הנייר בשכבה אחידה בעובי כחצי ס\"מ.","מפזרים מעל את פרוסות התות, האוכמניות והפיסטוקים או שבבי השוקולד, ולוחצים אותם קלות פנימה.","מקפיאים במאוזן לפחות 3 שעות, עד שהכול קפוא לגמרי.","שוברים או חותכים ל-8 חתיכות. שומרים בקופסה אטומה במקפיא ואוכלים תוך דקות ספורות מההוצאה — זה מתרכך מהר."],"nutrition":{"calories":85,"fatG":4.5,"satFatG":2.5,"proteinG":5.5,"carbsG":4.5,"fiberG":0.6,"netCarbsG":3.9,"sugarG":3.2,"sodiumMg":25},"lowCarbVariant":"Add 2 tbsp sugar-free granola or coconut flakes for crunch (adds ~1 g net carbs per piece).","lowCarbVariantHe":"מוסיפים 2 כפות גרנולה ללא סוכר או שבבי קוקוס לפריכות (מוסיף כ-1 גרם פחמימות נטו לחתיכה).","tips":"Full-fat yogurt freezes creamier and less icy than low-fat. Thin layer = easy snapping; thick layer = ice brick.","tipsHe":"יוגורט מלא בשומן קופא קרמי ופחות קרחוני מיוגורט רזה. שכבה דקה = שבירה קלה; שכבה עבה = לבנת קרח.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/keto-frozen-yogurt-bark/"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/frozen-yogurt-bark/"},{"creator":"Hip2Keto","url":"https://hip2keto.com/recipes/keto-frozen-greek-yogurt-bark/"}],"comparedVersions":"Compared All Day I Dream About Food, Low Carb Spark and Hip2Keto. All use the same spread-and-freeze technique; the differences are the sweetener and toppings. This version uses full-fat Greek yogurt (creamier when frozen) and a powdered sweetener that dissolves without grit, with the classic berry topping that scored best across versions.","comparedVersionsHe":"השווינו בין All Day I Dream About Food, Low Carb Spark ו-Hip2Keto. כולם משתמשים באותה טכניקה של מריחה והקפאה; ההבדלים הם בממתיק ובתוספות. הגרסה הזו משתמשת ביוגורט יווני מלא (קרמי יותר בהקפאה) ובממתיק אבקתי שנמס בלי גרגיריות, עם תוספת פירות היער הקלאסית שיצאה הכי טוב בכל הגרסאות."},{"id":"strawberries-cream-popsicles","name":"Strawberries \u0026 Cream Popsicles","nameHe":"ארטיק תות-שמנת","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 1/2 cups / 220 g","item":"strawberries, hulled"},{"amount":"1 cup / 240 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"4 oz / 115 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1/3 cup / 40 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it; allulose gives a softer bite"},{"amount":"1 tsp","item":"lemon juice"},{"amount":"1/2 tsp","item":"vanilla extract"}],"ingredientsHe":[{"amount":"כוס וחצי / 220 גרם","item":"תותים, ללא העלים"},{"amount":"1 כוס / 240 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"115 גרם","item":"גבינת שמנת, מרוככת","israelNote":"גבינת שמנת (נפוליאון/סקי)"},{"amount":"1/3 כוס / 40 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה; אלולוז נותן מרקם רך יותר"},{"amount":"1 כפית","item":"מיץ לימון"},{"amount":"1/2 כפית","item":"תמצית וניל"}],"instructions":["Put the cream cheese, cream, sweetener, lemon juice and vanilla in a blender and blend until completely smooth.","Add two-thirds of the strawberries and blend again until smooth and pink.","Chop the remaining strawberries small and stir them in by hand for berry pieces in every pop.","Pour into 6 popsicle molds, insert sticks, and freeze at least 4 hours or overnight.","To release, run the mold under warm water for 10-20 seconds and pull gently."],"instructionsHe":["שמים בבלנדר את גבינת השמנת, השמנת, הממתיק, מיץ הלימון והווניל וטוחנים עד לקבלת תערובת חלקה לגמרי.","מוסיפים שני שלישים מהתותים וטוחנים שוב עד שהתערובת חלקה וורודה.","קוצצים קטן את שאר התותים ומערבבים אותם פנימה ביד, כדי שיהיו חתיכות תות בכל ארטיק.","יוצקים ל-6 תבניות ארטיק, נועצים מקלות ומקפיאים לפחות 4 שעות או לילה שלם.","לחילוץ, מעבירים את התבנית תחת מים פושרים 10-20 שניות ומושכים בעדינות."],"nutrition":{"calories":225,"fatG":21.5,"satFatG":13.0,"proteinG":2.5,"carbsG":5.0,"fiberG":0.8,"netCarbsG":4.2,"sugarG":3.0,"sodiumMg":60},"ketoVariant":"Swap half the strawberries for raspberries — slightly fewer net carbs and a sharper berry flavor.","ketoVariantHe":"מחליפים חצי מהתותים בפטל — קצת פחות פחמימות נטו וטעם פירות יער חד יותר.","tips":"The cream cheese is what keeps these creamy instead of icy — do not skip it. Allulose (if available) keeps the pops softer straight from the freezer.","tipsHe":"גבינת השמנת היא מה ששומר על הארטיקים קרמיים במקום קרחוניים — לא מוותרים עליה. אלולוז (אם משיגים) שומר על הארטיקים רכים יותר ישר מהמקפיא.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/keto-strawberry-cheesecake-popsicles/"},{"creator":"KetoDiet Blog (Martina Slajerova)","url":"https://ketodietapp.com/Blog/lchf/strawberry-keto-popsicles"},{"creator":"Fit to Serve Group","url":"https://www.fittoservegroup.com/keto-berries-and-cream-popsicles/"}],"comparedVersions":"Compared All Day I Dream About Food, KetoDiet Blog and Fit to Serve Group. All rely on a high-fat dairy base to prevent iciness; cream cheese plus heavy cream (ADIDAF, Fit to Serve) won over mascarpone for Israel availability and tang. The stir-in-chopped-berries step from Fit to Serve adds texture for zero extra effort.","comparedVersionsHe":"השווינו בין All Day I Dream About Food, KetoDiet Blog ו-Fit to Serve Group. כולם נשענים על בסיס חלבי עתיר שומן שמונע קרחוניות; גבינת שמנת עם שמנת מתוקה (ADIDAF, Fit to Serve) ניצחה את המסקרפונה בזמינות בישראל ובחמצמצות. שלב ערבוב התותים הקצוצים מ-Fit to Serve מוסיף מרקם בלי שום מאמץ נוסף."},{"id":"keto-ice-cream-sandwiches","name":"Keto Ice Cream Sandwiches","nameHe":"כריכוני גלידה קיטו","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":25,"cookTimeMin":10,"difficulty":"medium","ingredients":[{"amount":"1 cup / 100 g","item":"almond flour","israelNote":"kemach shkedim, finely ground"},{"amount":"1/4 cup / 24 g","item":"cocoa powder, unsweetened"},{"amount":"1/4 cup / 48 g","item":"granulated erythritol-monk fruit blend"},{"amount":"3 tbsp / 42 g","item":"butter, softened"},{"amount":"1","item":"large egg"},{"amount":"1/2 tsp","item":"baking powder"},{"amount":"1 pinch","item":"salt"},{"amount":"1 1/2 cups / 360 ml","item":"heavy cream, cold (for the no-churn filling)","israelNote":"shamenet metuka 38%"},{"amount":"1/3 cup / 40 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it"},{"amount":"1 tsp","item":"vanilla extract"}],"ingredientsHe":[{"amount":"1 כוס / 100 גרם","item":"קמח שקדים","israelNote":"קמח שקדים טחון דק"},{"amount":"1/4 כוס / 24 גרם","item":"אבקת קקאו, לא ממותקת"},{"amount":"1/4 כוס / 48 גרם","item":"תערובת אריתריטול ומונק פרוט גרגירית"},{"amount":"3 כפות / 42 גרם","item":"חמאה, מרוככת"},{"amount":"1","item":"ביצה גדולה"},{"amount":"1/2 כפית","item":"אבקת אפייה"},{"amount":"קורט","item":"מלח"},{"amount":"כוס וחצי / 360 מ\"ל","item":"שמנת מתוקה 38%, קרה (למילוי ללא מכונת גלידה)"},{"amount":"1/3 כוס / 40 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה"},{"amount":"1 כפית","item":"תמצית וניל"}],"instructions":["Heat the oven to 175C / 350F. Beat the butter and granulated sweetener, then beat in the egg. Stir in the almond flour, cocoa, baking powder and salt to form a soft dough.","Divide the dough in two. On parchment, roll or pat each half into a thin rectangle about 12x18 cm (5x7 inch). Prick all over with a fork.","Bake 8-10 minutes until just set. While still warm, trim the edges and cut each slab into 6 equal rectangles (12 cookies total). Cool completely — they crisp as they cool.","For the filling, whip the cold cream with the powdered sweetener and vanilla to stiff peaks. Spread it about 2 cm (3/4 inch) thick in a parchment-lined pan roughly the size of one cookie slab, and freeze 2-3 hours until scoopable-firm.","Cut the frozen cream slab into 6 rectangles matching the cookies and sandwich each piece between two cookies, pressing gently.","Wrap each sandwich and freeze at least 1 hour more. Let sit 2-3 minutes at room temperature before eating."],"instructionsHe":["מחממים תנור ל-175 מעלות. מקציפים את החמאה והממתיק הגרגירי, ואז מקציפים פנימה את הביצה. מערבבים פנימה את קמח השקדים, הקקאו, אבקת האפייה והמלח לבצק רך.","מחלקים את הבצק לשניים. על נייר אפייה מרדדים או משטחים כל חצי למלבן דק בגודל כ-12x18 ס\"מ. מחוררים היטב במזלג.","אופים 8-10 דקות עד שהבצק בדיוק מתייצב. בעודו חם, גוזרים את השוליים וחותכים כל מלבן ל-6 מלבנים שווים (12 עוגיות בסך הכול). מצננים לגמרי — הן נעשות פריכות כשהן מתקררות.","למילוי, מקציפים את השמנת הקרה עם הממתיק האבקתי והווניל לקצפת יציבה. מורחים בשכבה בעובי כ-2 ס\"מ בתבנית מרופדת בנייר אפייה בגודל של מלבן עוגיות אחד בערך, ומקפיאים 2-3 שעות עד למרקם יציב.","חותכים את לוח הקצפת הקפוא ל-6 מלבנים בגודל העוגיות וסוגרים כל חתיכה בין שתי עוגיות, בלחיצה עדינה.","עוטפים כל כריכון ומקפיאים לפחות שעה נוספת. מוציאים ל-2-3 דקות בטמפרטורת החדר לפני האכילה."],"nutrition":{"calories":370,"fatG":36.0,"satFatG":17.5,"proteinG":6.0,"carbsG":7.5,"fiberG":3.0,"netCarbsG":4.5,"sugarG":1.5,"sodiumMg":105},"ketoVariant":"Use store-bought keto vanilla ice cream instead of the no-churn filling to save a step.","ketoVariantHe":"משתמשים בגלידת וניל קיטו קנויה במקום המילוי הביתי כדי לחסוך שלב.","tips":"The cookie slabs must be thin — thick cookies freeze rock-hard. Cutting both cookies and filling to matching rectangles before assembly makes neat sandwiches with no squeeze-out.","tipsHe":"לוחות העוגיות חייבים להיות דקים — עוגיות עבות קופאות לאבן. חיתוך העוגיות והמילוי למלבנים תואמים לפני ההרכבה נותן כריכונים מסודרים בלי מילוי שנמרח החוצה.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/keto-ice-cream-sandwich/"},{"creator":"KetoConnect","url":"https://www.ketoconnect.net/keto-ice-cream-sandwich/"},{"creator":"KetoFocus","url":"https://www.ketofocus.com/recipes/keto-ice-cream-sandwiches/"}],"comparedVersions":"Compared All Day I Dream About Food, KetoConnect and KetoFocus. The slab method (bake two thin rectangles, cut, sandwich a frozen cream slab) beat drop-cookie versions for even, neat sandwiches; the sweetened-whipped-cream no-churn filling is the simplest that stays scoopable without an ice cream machine.","comparedVersionsHe":"השווינו בין All Day I Dream About Food, KetoConnect ו-KetoFocus. שיטת הלוחות (אופים שני מלבנים דקים, חותכים וסוגרים על לוח קצפת קפוא) ניצחה גרסאות של עוגיות בודדות בכריכונים אחידים ומסודרים; מילוי הקצפת הממותקת ללא מכונת גלידה הוא הפשוט ביותר שנשאר רך גם בהקפאה."},{"id":"chocolate-ganache-tart-almond-crust","name":"Chocolate Ganache Tart with Almond Crust","nameHe":"טארט גנאש שוקולד עם קלתית שקדים","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":10,"prepTimeMin":20,"cookTimeMin":12,"difficulty":"medium","ingredients":[{"amount":"1 1/2 cups / 150 g","item":"almond flour","israelNote":"kemach shkedim, finely ground"},{"amount":"3 tbsp / 18 g","item":"cocoa powder, unsweetened"},{"amount":"1/4 cup / 48 g","item":"granulated erythritol-monk fruit blend (for the crust)"},{"amount":"1/4 cup / 56 g","item":"butter, melted"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1 cup / 240 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"7 oz / 200 g","item":"sugar-free dark chocolate, finely chopped","israelNote":"85% dark chocolate or sugar-free chocolate from the diabetic shelf"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/2 cup / 60 g","item":"fresh raspberries, for topping (optional)"}],"ingredientsHe":[{"amount":"כוס וחצי / 150 גרם","item":"קמח שקדים","israelNote":"קמח שקדים טחון דק"},{"amount":"3 כפות / 18 גרם","item":"אבקת קקאו, לא ממותקת"},{"amount":"1/4 כוס / 48 גרם","item":"תערובת אריתריטול ומונק פרוט גרגירית (לקלתית)"},{"amount":"1/4 כוס / 56 גרם","item":"חמאה, מומסת"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1 כוס / 240 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"200 גרם","item":"שוקולד מריר ללא סוכר, קצוץ דק","israelNote":"שוקולד מריר 85% או שוקולד ללא סוכר מהמדף לסוכרתיים"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/2 כוס / 60 גרם","item":"פטל טרי, לקישוט (לא חובה)"}],"instructions":["Heat the oven to 175C / 350F. Mix the almond flour, cocoa, granulated sweetener and salt, then stir in the melted butter until the mixture looks like wet sand.","Press evenly into the bottom and sides of a 23 cm (9 inch) tart pan with a removable bottom. Prick the base with a fork.","Bake 10-12 minutes until set and fragrant. Cool completely — the crust crisps as it cools.","Heat the cream in a small pot until it just begins to simmer at the edges — do not boil.","Pour the hot cream over the chopped chocolate, wait 2 minutes, then stir from the center outward until smooth and glossy. Stir in the vanilla.","Pour the ganache into the cooled crust and smooth the top.","Refrigerate at least 2 hours until fully set. Top with raspberries and a pinch of flaky salt before serving."],"instructionsHe":["מחממים תנור ל-175 מעלות. מערבבים את קמח השקדים, הקקאו, הממתיק הגרגירי והמלח, ואז מערבבים פנימה את החמאה המומסת עד שהתערובת נראית כמו חול רטוב.","מהדקים באופן אחיד לתחתית ולדפנות של תבנית טארט בקוטר 23 ס\"מ עם תחתית נשלפת. מחוררים את הבסיס במזלג.","אופים 10-12 דקות עד שהקלתית מתייצבת וריחנית. מצננים לגמרי — היא נעשית פריכה כשהיא מתקררת.","מחממים את השמנת בסיר קטן עד שהיא רק מתחילה לבעבע בשוליים — לא מרתיחים.","יוצקים את השמנת החמה על השוקולד הקצוץ, ממתינים 2 דקות, ואז מערבבים מהמרכז החוצה עד לקבלת גנאש חלק ומבריק. מערבבים פנימה את הווניל.","יוצקים את הגנאש לתוך הקלתית המצוננת ומיישרים את פני השטח.","מקררים לפחות שעתיים עד להתייצבות מלאה. מקשטים בפטל ובקורט מלח גס לפני ההגשה."],"nutrition":{"calories":310,"fatG":30.0,"satFatG":14.0,"proteinG":5.5,"carbsG":12.5,"fiberG":4.5,"netCarbsG":4.5,"sugarG":1.5,"sodiumMg":75},"ketoVariant":"Stevia/erythritol-sweetened chocolate keeps it ~4.5 g net carbs; with 85% dark chocolate it is ~7 g net carbs per slice.","ketoVariantHe":"שוקולד הממותק בסטיביה/אריתריטול שומר על כ-4.5 גרם פחמימות נטו; עם שוקולד מריר 85% מקבלים כ-7 גרם פחמימות נטו לפרוסה.","tips":"Chop the chocolate finely so the hot cream melts it fully; if a few pieces remain, microwave the ganache 10 seconds and stir. Slice with a hot dry knife for clean wedges.","tipsHe":"קוצצים את השוקולד דק כדי שהשמנת החמה תמיס אותו לגמרי; אם נשארו כמה חתיכות, מחממים את הגנאש 10 שניות במיקרוגל ומערבבים. פורסים בסכין חמה ויבשה למשולשים נקיים.","sources":[{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/low-carb-chocolate-tart-sugar-free/"},{"creator":"Joy Filled Eats","url":"https://joyfilledeats.com/chocolate-tart-recipe/"},{"creator":"KetoDiet Blog (Martina Slajerova)","url":"https://ketodietapp.com/Blog/lchf/low-carb-chocolate-and-cardamom-ganache-tart"}],"comparedVersions":"Compared Sugar Free Londoner, Joy Filled Eats and KetoDiet Blog. All use a pressed almond-flour crust with a classic hot-cream-over-chocolate ganache; this version adds cocoa to the crust (deeper chocolate flavor, hides almond-flour color) and uses the simplest 2-ingredient ganache — no eggs, no baking of the filling — which set reliably in every source.","comparedVersionsHe":"השווינו בין Sugar Free Londoner, Joy Filled Eats ו-KetoDiet Blog. כולם משתמשים בקלתית קמח שקדים מהודקת עם גנאש קלאסי של שמנת חמה על שוקולד; הגרסה הזו מוסיפה קקאו לקלתית (טעם שוקולד עמוק יותר, מסתיר את צבע קמח השקדים) ומשתמשת בגנאש הפשוט ביותר מ-2 מצרכים — בלי ביצים ובלי אפיית המילוי — שהתייצב באמינות בכל המקורות."},{"id":"classic-baked-keto-cheesecake","name":"Classic Baked Keto Cheesecake","nameHe":"עוגת גבינה אפויה קלאסית קיטו","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":20,"cookTimeMin":55,"difficulty":"medium","ingredients":[{"amount":"1 1/2 cups / 170 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"4 tbsp / 56 g","item":"butter, melted"},{"amount":"2 tbsp / 20 g","item":"powdered erythritol-monk fruit sweetener (blitz granular in a blender)","israelNote":"erythritol blends: health-food stores"},{"amount":"900 g / 32 oz","item":"full-fat cream cheese, at room temperature","israelNote":"gvinat shamenet (Napoleon/Ski), well drained"},{"amount":"1 cup / 130 g","item":"powdered erythritol-monk fruit sweetener"},{"amount":"3","item":"large eggs, at room temperature"},{"amount":"1 tbsp / 15 ml","item":"fresh lemon juice"},{"amount":"2 tsp / 10 ml","item":"vanilla extract"}],"ingredientsHe":[{"amount":"1 1/2 כוסות / 170 גרם","item":"קמח שקדים מולבן"},{"amount":"4 כפות / 56 גרם","item":"חמאה מומסת"},{"amount":"2 כפות / 20 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון (טוחנים גרגירי בבלנדר)","israelNote":"תערובות אריתריטול: חנויות טבע"},{"amount":"900 גרם","item":"גבינת שמנת שמנה, בטמפרטורת החדר","israelNote":"גבינת שמנת (נפוליאון/סקי), מסוננת היטב"},{"amount":"1 כוס / 130 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון"},{"amount":"3","item":"ביצים גדולות, בטמפרטורת החדר"},{"amount":"1 כף / 15 מ\"ל","item":"מיץ לימון סחוט טרי"},{"amount":"2 כפיות / 10 מ\"ל","item":"תמצית וניל"}],"instructions":["Heat the oven to 175°C / 350°F and line the bottom of a 23 cm (9 inch) springform pan with baking paper.","Stir the almond flour, melted butter and 2 tbsp sweetener into a damp sand texture. Press evenly into the pan bottom and bake 10 minutes, until the edges just turn golden. Cool while you make the filling.","Beat the cream cheese and 1 cup powdered sweetener on low-medium speed until smooth. Low speed matters — extra air causes cracks.","Beat in the eggs one at a time, then the lemon juice and vanilla, mixing only until combined.","Pour the filling over the crust and smooth the top. Bake 45–55 minutes, until the edges are set but the center still jiggles slightly when nudged.","Turn off the oven, crack the door open and let the cake sit 15 minutes (gentler cooling means fewer cracks).","Cool completely on the counter, then refrigerate at least 4 hours, preferably overnight, before releasing from the pan and slicing."],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים את תחתית תבנית קפיצית בקוטר 23 ס\"מ בנייר אפייה.","מערבבים את קמח השקדים, החמאה המומסת ו-2 כפות ממתיק למרקם של חול לח. מהדקים בשכבה אחידה לתחתית התבנית ואופים 10 דקות, עד שהשוליים רק מתחילים להזהיב. מצננים בזמן שמכינים את המלית.","מקציפים את גבינת השמנת עם כוס הממתיק הטחון במהירות נמוכה-בינונית עד למרקם חלק. המהירות הנמוכה חשובה — עודף אוויר גורם לסדקים.","מוסיפים את הביצים אחת-אחת תוך כדי ערבול, ואז את מיץ הלימון והווניל, ומערבבים רק עד לאיחוד.","יוצקים את המלית על הבסיס ומיישרים את החלק העליון. אופים 45–55 דקות, עד שהשוליים יציבים אך המרכז עדיין רוטט מעט כשמזיזים את התבנית.","מכבים את התנור, פותחים מעט את הדלת ומשאירים את העוגה בפנים 15 דקות (צינון עדין = פחות סדקים).","מצננים לחלוטין על השיש, ואז מעבירים למקרר ל-4 שעות לפחות, עדיף ללילה שלם, לפני שמחלצים מהתבנית ופורסים."],"nutrition":{"calories":390,"fatG":37,"satFatG":17.5,"proteinG":9,"carbsG":6.3,"fiberG":1.6,"netCarbsG":4.7,"sugarG":2.6,"sodiumMg":280},"tips":"If the Israeli tub-style gvinat shamenet is softer than brick cream cheese, drain it in a cloth-lined sieve for an hour first, or the cake may need 5–10 extra minutes to set.","tipsHe":"גבינת שמנת ישראלית בגביע רכה יותר מגבינת שמנת אמריקאית בבלוק — מומלץ לסנן אותה שעה מראש במסננת מרופדת בבד, אחרת העוגה עשויה להזדקק ל-5–10 דקות אפייה נוספות כדי להתייצב.","lowCarbVariant":"Serve slices with 2–3 fresh strawberries (adds about 2 g net carbs).","lowCarbVariantHe":"מגישים כל פרוסה עם 2–3 תותים טריים (תוספת של כ-2 גרם פחמימות נטו).","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/low-carb-cheesecake-keto-gluten-free-sugar-free/"},{"creator":"Low Carb with Jennifer (Jennifer Banz)","url":"https://jenniferbanz.com/the-best-keto-cheesecake"},{"creator":"Texanerin Baking","url":"https://www.texanerin.com/keto-cheesecake/"}],"comparedVersions":"Compared Wholesome Yum, Jennifer Banz and Texanerin: all use the same cream cheese + eggs + powdered sweetener core, so I took Wholesome Yum\u0027s proportions (scaled to 12 slices), Banz\u0027s no-water-bath approach for simplicity, and the shared low-speed-mixing and jiggly-center cues that prevent cracking.","comparedVersionsHe":"השוויתי בין Wholesome Yum, ג\u0027ניפר באנז ו-Texanerin: כולם מבוססים על אותו בסיס של גבינת שמנת + ביצים + ממתיק טחון, ולכן לקחתי את הפרופורציות של Wholesome Yum (מותאמות ל-12 פרוסות), את הגישה ללא אמבט מים של באנז לפשטות, ואת הסימנים המשותפים — ערבול במהירות נמוכה ומרכז רוטט — שמונעים סדקים."},{"id":"mascarpone-berry-cups","name":"Mascarpone Berry Cups","nameHe":"כוסות מסקרפונה ופירות יער","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 cup / 250 g","item":"mascarpone, cold","israelNote":"mascarpone (Gad/Tnuva) — or half mascarpone, half gvina levana for a lighter version"},{"amount":"1/2 cup / 120 ml","item":"heavy cream, cold","israelNote":"shamenet metuka 38%"},{"amount":"1/4 cup / 30 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/2 tsp","item":"lemon zest"},{"amount":"1 cup / 140 g","item":"mixed berries (strawberries, raspberries, blueberries)"}],"ingredientsHe":[{"amount":"1 כוס / 250 גרם","item":"מסקרפונה, קרה","israelNote":"מסקרפונה (גד/תנובה) — או חצי מסקרפונה וחצי גבינה לבנה לגרסה קלה יותר"},{"amount":"1/2 כוס / 120 מ\"ל","item":"שמנת מתוקה 38%, קרה"},{"amount":"1/4 כוס / 30 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/2 כפית","item":"גרידת לימון"},{"amount":"1 כוס / 140 גרם","item":"פירות יער מעורבים (תותים, פטל, אוכמניות)"}],"instructions":["Put the cold mascarpone, cream, powdered sweetener, vanilla and lemon zest in a mixing bowl.","Beat with an electric mixer on medium, just until the mixture is thick, smooth and holds soft peaks — 1-2 minutes. Stop as soon as it thickens; overbeating turns mascarpone grainy.","Chop the strawberries; leave small berries whole.","Layer cream and berries in 4 glasses, ending with berries on top.","Serve immediately, or chill up to 24 hours — the texture firms up nicely in the fridge."],"instructionsHe":["שמים בקערת ערבוב את המסקרפונה הקרה, השמנת, הממתיק האבקתי, הווניל וגרידת הלימון.","מקציפים במיקסר חשמלי במהירות בינונית, רק עד שהתערובת סמיכה, חלקה ומחזיקה פסגות רכות — 1-2 דקות. עוצרים ברגע שהיא מסמיכה; הקצפת יתר הופכת מסקרפונה לגרגירית.","קוצצים את התותים; פירות יער קטנים משאירים שלמים.","מסדרים שכבות של קרם ופירות יער ב-4 כוסות, ומסיימים בפירות יער למעלה.","מגישים מיד, או מצננים עד 24 שעות — המרקם מתייצב יפה במקרר."],"nutrition":{"calories":390,"fatG":39.0,"satFatG":25.0,"proteinG":4.5,"carbsG":6.0,"fiberG":1.2,"netCarbsG":4.8,"sugarG":3.5,"sodiumMg":45},"lowCarbVariant":"Double the berries for a fruitier dessert (~8 g net carbs per cup).","lowCarbVariantHe":"מכפילים את כמות פירות היער לקינוח פירותי יותר (כ-8 גרם פחמימות נטו לכוס).","tips":"Mascarpone must be cold and beaten briefly — warm or overbeaten mascarpone splits. If it does split, fold in a splash of cold cream by hand.","tipsHe":"המסקרפונה חייבת להיות קרה ומוקצפת בקצרה — מסקרפונה חמימה או מוקצפת יתר נשברת. אם היא בכל זאת נשברה, מקפלים פנימה ביד מעט שמנת קרה.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/keto-mascarpone-mousse/"},{"creator":"Low Carb Yum","url":"https://lowcarbyum.com/mascarpone-cheese-mousse-berries/"},{"creator":"Gourmet Girl Cooks","url":"https://www.gourmetgirlcooks.com/2017/08/strawberry-mascarpone-dessert-cups-no.html"}],"comparedVersions":"Compared All Day I Dream About Food\u0027s 3-ingredient mousse, Low Carb Yum\u0027s mascarpone-berry mousse and Gourmet Girl Cooks\u0027 dessert cups. The whip-everything-together-in-one-bowl method won for simplicity over versions that whip cream separately, and lemon zest (from Low Carb Yum) adds brightness that plain versions lack.","comparedVersionsHe":"השווינו בין המוס מ-3 מצרכים של All Day I Dream About Food, מוס המסקרפונה-פירות יער של Low Carb Yum וכוסות הקינוח של Gourmet Girl Cooks. שיטת ההקצפה של הכול יחד בקערה אחת ניצחה בפשטותה גרסאות שמקציפות שמנת בנפרד, וגרידת הלימון (מ-Low Carb Yum) מוסיפה רעננות שחסרה בגרסאות הפשוטות."},{"id":"keto-chocolate-lava-cake","name":"Chocolate Lava Cake (Ramekin, Single-Serve)","nameHe":"עוגת לאבה שוקולד אישית (ברמקין)","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":2,"prepTimeMin":10,"cookTimeMin":9,"difficulty":"easy","ingredients":[{"amount":"2 oz / 60 g","item":"sugar-free dark chocolate (or 85% dark), chopped","israelNote":"85% dark chocolate (e.g. Splendid/Carmit) or sugar-free chocolate from the diabetic shelf"},{"amount":"3 tbsp / 42 g","item":"butter, plus extra for the ramekins"},{"amount":"2","item":"large eggs"},{"amount":"3 tbsp / 36 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it"},{"amount":"2 tbsp / 14 g","item":"almond flour","israelNote":"kemach shkedim, finely ground"},{"amount":"1/2 tsp","item":"vanilla extract"},{"amount":"1 pinch","item":"salt"},{"amount":"1 tsp","item":"cocoa powder, for dusting the ramekins"}],"ingredientsHe":[{"amount":"60 גרם","item":"שוקולד מריר ללא סוכר (או 85% מוצקי קקאו), קצוץ","israelNote":"שוקולד מריר 85% (למשל ספלנדיד/כרמית) או שוקולד ללא סוכר מהמדף לסוכרתיים"},{"amount":"3 כפות / 42 גרם","item":"חמאה, ועוד מעט לשימון הרמקינים"},{"amount":"2","item":"ביצים גדולות"},{"amount":"3 כפות / 36 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה"},{"amount":"2 כפות / 14 גרם","item":"קמח שקדים","israelNote":"קמח שקדים טחון דק"},{"amount":"1/2 כפית","item":"תמצית וניל"},{"amount":"קורט","item":"מלח"},{"amount":"1 כפית","item":"אבקת קקאו, לאיבוק הרמקינים"}],"instructions":["Heat the oven to 220C / 425F. Butter two 180 ml (6 oz) ramekins generously and dust the insides with cocoa powder.","Melt the chocolate and butter together in the microwave in 30-second bursts, stirring between bursts, until smooth.","Whisk the powdered sweetener into the warm chocolate mixture until dissolved.","Beat in the eggs one at a time, whisking well, then stir in the almond flour, vanilla and salt just until combined.","Divide the batter between the ramekins and bake 8-10 minutes: the edges should be set but the center still soft and slightly jiggly.","Rest 1-2 minutes, run a thin knife around the edge, invert each cake onto a plate and serve immediately while the center is molten."],"instructionsHe":["מחממים תנור ל-220 מעלות. משמנים היטב בחמאה שני רמקינים בנפח 180 מ\"ל ומאבקים את הדפנות באבקת קקאו.","ממיסים יחד את השוקולד והחמאה במיקרוגל בפולסים של 30 שניות, מערבבים בין פולס לפולס, עד לקבלת תערובת חלקה.","טורפים את הממתיק האבקתי לתוך תערובת השוקולד החמימה עד שהוא נמס לגמרי.","טורפים פנימה את הביצים אחת אחת, ואז מערבבים פנימה את קמח השקדים, הווניל והמלח רק עד לאיחוד.","מחלקים את הבלילה בין הרמקינים ואופים 8-10 דקות: השוליים צריכים להתייצב אבל המרכז נשאר רך ורוטט מעט.","ממתינים 1-2 דקות, מעבירים סכין דקה סביב השוליים, הופכים כל עוגה על צלחת ומגישים מיד כשהמרכז עוד נוזלי."],"nutrition":{"calories":435,"fatG":41.0,"satFatG":21.5,"proteinG":10.5,"carbsG":9.0,"fiberG":4.0,"netCarbsG":5.0,"sugarG":1.0,"sodiumMg":160},"ketoVariant":"Use stevia-sweetened sugar-free chocolate to drop net carbs to about 3.5 g per cake.","ketoVariantHe":"משתמשים בשוקולד ללא סוכר הממותק בסטיביה כדי לרדת לכ-3.5 גרם פחמימות נטו לעוגה.","tips":"Every oven differs — err on the side of underbaking; an overbaked lava cake is just a brownie. The batter can wait, covered, in the fridge for a day; add 1-2 minutes to the bake time.","tipsHe":"כל תנור שונה — עדיף לאפות פחות מדי מאשר יותר מדי; עוגת לאבה שנאפתה יתר על המידה היא פשוט בראוני. הבלילה יכולה להמתין במקרר, מכוסה, עד יממה; מוסיפים 1-2 דקות לזמן האפייה.","sources":[{"creator":"Wholesome Yum","url":"https://www.wholesomeyum.com/keto-lava-cake/"},{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/5-ingredient-low-carb-chocolate-lava-cake/"},{"creator":"Gimme Delicious","url":"https://gimmedelicious.com/keto-chocolate-lava-cakes/"}],"comparedVersions":"Compared Wholesome Yum, Sugar Free Londoner and Gimme Delicious. All agree on the melt-chocolate-and-butter base with eggs and a small amount of almond flour; this version follows the hot-oven/short-bake approach (425F, ~9 min) that gives the most reliable molten center, with Sugar Free Londoner\u0027s minimal 5-ingredient list for simplicity.","comparedVersionsHe":"השווינו בין Wholesome Yum, Sugar Free Londoner ו-Gimme Delicious. כולם מסכימים על בסיס של שוקולד וחמאה מומסים עם ביצים ומעט קמח שקדים; הגרסה הזו הולכת בגישת תנור חם ואפייה קצרה (220 מעלות, כ-9 דקות) שנותנת את המרכז הנוזלי האמין ביותר, עם רשימת המצרכים המינימלית של Sugar Free Londoner בשביל הפשטות."},{"id":"keto-peanut-butter-mousse","name":"Peanut Butter Mousse","nameHe":"מוס חמאת בוטנים","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 cup / 240 ml","item":"heavy cream, cold","israelNote":"shamenet metuka 38%"},{"amount":"4 oz / 115 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1/2 cup / 130 g","item":"peanut butter","israelNote":"natural 100% peanut butter (check label — no sugar)"},{"amount":"1/3 cup / 40 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated erythritol in a blender to powder it"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1 pinch","item":"salt"},{"amount":"1 tbsp / 10 g","item":"chopped roasted peanuts or grated sugar-free chocolate, for topping (optional)"}],"ingredientsHe":[{"amount":"1 כוס / 240 מ\"ל","item":"שמנת מתוקה 38%, קרה"},{"amount":"115 גרם","item":"גבינת שמנת, מרוככת","israelNote":"גבינת שמנת (נפוליאון/סקי)"},{"amount":"1/2 כוס / 130 גרם","item":"חמאת בוטנים טבעית 100%","israelNote":"לבדוק בתווית — ללא סוכר"},{"amount":"1/3 כוס / 40 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"טוחנים אריתריטול גרגירי בבלנדר עד לקבלת אבקה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"קורט","item":"מלח"},{"amount":"1 כף / 10 גרם","item":"בוטנים קלויים קצוצים או שוקולד מגורר ללא סוכר, לקישוט (לא חובה)"}],"instructions":["Whip the cold cream to stiff peaks with an electric mixer. Set aside.","In a second bowl, beat the softened cream cheese, peanut butter, powdered sweetener, vanilla and salt until completely smooth and creamy.","Beat in about a third of the whipped cream to loosen the peanut butter mixture.","Gently fold in the rest of the whipped cream with a spatula until no streaks remain — do not overmix or it will deflate.","Spoon or pipe into 6 small glasses and top with chopped peanuts or grated chocolate.","Serve right away for a soft mousse, or chill 1 hour for a firmer set."],"instructionsHe":["מקציפים את השמנת הקרה במיקסר חשמלי לקצפת יציבה. מניחים בצד.","בקערה שנייה מקציפים את גבינת השמנת המרוככת, חמאת הבוטנים, הממתיק האבקתי, הווניל והמלח עד לקבלת קרם חלק לגמרי.","מקציפים פנימה כשליש מהקצפת כדי לרכך את תערובת חמאת הבוטנים.","מקפלים בעדינות את שאר הקצפת עם מרית עד שלא נשארים פסים — לא מערבבים יותר מדי, אחרת המוס יתרוקן מאוויר.","מעבירים בכף או מזלפים ל-6 כוסות קטנות ומקשטים בבוטנים קצוצים או בשוקולד מגורר.","מגישים מיד למוס רך, או מצננים שעה למרקם יציב יותר."],"nutrition":{"calories":330,"fatG":31.5,"satFatG":13.5,"proteinG":7.0,"carbsG":6.5,"fiberG":1.3,"netCarbsG":5.2,"sugarG":2.5,"sodiumMg":125},"ketoVariant":"Fold in 1 tbsp cocoa powder with the peanut butter for a chocolate-PB version (~5.7 g net carbs).","ketoVariantHe":"מקפלים כף אבקת קקאו יחד עם חמאת הבוטנים לגרסת שוקולד-בוטנים (כ-5.7 גרם פחמימות נטו).","tips":"Room-temperature cream cheese and peanut butter blend smoothly; cold ones leave lumps. Natural peanut butter must be well stirred before measuring.","tipsHe":"גבינת שמנת וחמאת בוטנים בטמפרטורת החדר נטמעות חלק; קרות משאירות גושים. חמאת בוטנים טבעית חייבת ערבוב טוב לפני המדידה.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/low-carb-5-minute-peanut-butter-mousse/"},{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-peanut-butter-mousse/"},{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/keto-peanut-butter-mousse/"}],"comparedVersions":"Compared All Day I Dream About Food\u0027s 5-minute mousse, Sugar Free Londoner and That Low Carb Life. The cream-cheese versions hold their texture for days versus cream-only versions that weep; the separate whip-then-fold technique (from That Low Carb Life) gives the lightest result, so this synthesis combines both.","comparedVersionsHe":"השווינו בין המוס של 5 דקות של All Day I Dream About Food, Sugar Free Londoner ו-That Low Carb Life. הגרסאות עם גבינת שמנת שומרות על מרקמן ימים לעומת גרסאות שמנת בלבד שמפרישות נוזל; טכניקת ההקצפה הנפרדת והקיפול (מ-That Low Carb Life) נותנת את התוצאה הקלילה ביותר, אז השילוב כאן לוקח את שניהם."},{"id":"no-bake-cheesecake-cups","name":"No-Bake Cheesecake Cups","nameHe":"כוסות עוגת גבינה ללא אפייה","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":20,"cookTimeMin":5,"difficulty":"easy","ingredients":[{"amount":"3/4 cup / 84 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"2 tbsp / 28 g","item":"butter"},{"amount":"1 tbsp / 10 g","item":"powdered erythritol-monk fruit sweetener, plus 1/2 cup / 65 g for the filling"},{"amount":"1/2 tsp","item":"ground cinnamon"},{"amount":"340 g / 12 oz","item":"full-fat cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"3/4 cup / 180 ml","item":"cold heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1 tbsp / 15 ml","item":"fresh lemon juice"},{"amount":"1 tsp / 5 ml","item":"vanilla extract"},{"amount":"1/2 cup / 60 g","item":"raspberries or sliced strawberries, for topping"}],"ingredientsHe":[{"amount":"3/4 כוס / 84 גרם","item":"קמח שקדים מולבן"},{"amount":"2 כפות / 28 גרם","item":"חמאה"},{"amount":"1 כף / 10 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון, ועוד 1/2 כוס / 65 גרם למלית"},{"amount":"1/2 כפית","item":"קינמון טחון"},{"amount":"340 גרם","item":"גבינת שמנת שמנה, מרוככת","israelNote":"גבינת שמנת (נפוליאון/סקי)"},{"amount":"3/4 כוס / 180 מ\"ל","item":"שמנת מתוקה 38% קרה"},{"amount":"1 כף / 15 מ\"ל","item":"מיץ לימון סחוט טרי"},{"amount":"1 כפית / 5 מ\"ל","item":"תמצית וניל"},{"amount":"1/2 כוס / 60 גרם","item":"פטל או תותים פרוסים, לקישוט"}],"instructions":["Toast the almond flour with the butter, 1 tbsp sweetener and the cinnamon in a dry pan over medium heat, stirring, 3–5 minutes until golden and fragrant. Cool — this is the \u0027crumble crust\u0027.","Beat the cream cheese with 1/2 cup powdered sweetener, the lemon juice and vanilla until completely smooth.","In a separate bowl whip the cold cream to stiff peaks, then fold it into the cream cheese mixture in two additions.","Divide the crumble between 6 small glasses or jars, reserving a spoonful for garnish.","Pipe or spoon the filling over the crumble layers.","Chill at least 1 hour, then top with berries and the reserved crumble before serving."],"instructionsHe":["קולים את קמח השקדים עם החמאה, כף הממתיק והקינמון במחבת יבשה על אש בינונית, תוך ערבוב, 3–5 דקות עד שהתערובת מזהיבה וריחנית. מצננים — זהו \u0027בסיס הקראמבל\u0027.","מקציפים את גבינת השמנת עם 1/2 כוס ממתיק טחון, מיץ הלימון והווניל עד למרקם חלק לגמרי.","בקערה נפרדת מקציפים את השמנת הקרה לקצפת יציבה, ומקפלים אותה לתערובת הגבינה בשתי פעמים.","מחלקים את הקראמבל בין 6 כוסות או צנצנות קטנות, ושומרים כף אחת לקישוט.","מזלפים או מניחים בכף את המלית מעל שכבות הקראמבל.","מקררים שעה לפחות, ולפני ההגשה מעטרים בפירות יער ובקראמבל ששמרנו."],"nutrition":{"calories":425,"fatG":41,"satFatG":21,"proteinG":7.5,"carbsG":8.7,"fiberG":2.8,"netCarbsG":5.9,"sugarG":3.2,"sodiumMg":210},"tips":"Use powdered sweetener only — granular stays gritty in a no-bake filling. The jars keep 4 days covered in the fridge, so they are great to make ahead.","tipsHe":"משתמשים רק בממתיק טחון — ממתיק גרגירי נשאר גרגירי במלית ללא אפייה. הצנצנות נשמרות 4 ימים מכוסות במקרר, כך שהן מצוינות להכנה מראש.","sources":[{"creator":"Sugar-Free Mom (Brenda Bennett)","url":"https://www.sugarfreemom.com/recipes/easy-sugar-free-low-carb-keto-lemon-cheesecake-jars/"},{"creator":"Fittoserve Group","url":"https://www.fittoservegroup.com/keto-no-bake-cheesecake/"},{"creator":"Keen for Keto","url":"https://keenforketo.com/no-bake-keto-mini-cheesecake-cups/"}],"comparedVersions":"Compared Sugar-Free Mom\u0027s jars, Fittoserve\u0027s no-bake cheesecake and Keen for Keto\u0027s cups. Kept the whipped-cream-folded filling all three share (lighter than cream-cheese-only), and swapped their food-processor nut crusts for a quicker pan-toasted almond flour crumble with fewer ingredients.","comparedVersionsHe":"השוויתי בין הצנצנות של Sugar-Free Mom, עוגת הגבינה ללא אפייה של Fittoserve והכוסות של Keen for Keto. שמרתי על מלית הקצפת המקופלת המשותפת לשלושתם (קלילה יותר מגבינת שמנת בלבד), והחלפתי את בסיסי האגוזים במעבד מזון בקראמבל קמח שקדים קלוי במחבת — מהיר יותר ועם פחות מרכיבים."},{"id":"berry-parfait-whipped-cream","name":"Berry Parfait with Whipped Cream","nameHe":"פרפה פירות יער עם קצפת","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 1/2 cups / 360 ml","item":"cold heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"3 tbsp / 25 g","item":"powdered erythritol-monk fruit sweetener (blitz granular in a blender)"},{"amount":"1 tsp / 5 ml","item":"vanilla extract"},{"amount":"200 g / 7 oz","item":"mixed berries (strawberries, raspberries, blueberries)","israelNote":"frozen berry mix works — thaw and drain first"},{"amount":"1 tsp / 5 ml","item":"lemon juice"},{"amount":"4 tbsp / 28 g","item":"chopped toasted pecans or almonds"}],"ingredientsHe":[{"amount":"1 1/2 כוסות / 360 מ\"ל","item":"שמנת מתוקה 38% קרה"},{"amount":"3 כפות / 25 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון (טוחנים גרגירי בבלנדר)"},{"amount":"1 כפית / 5 מ\"ל","item":"תמצית וניל"},{"amount":"200 גרם","item":"פירות יער מעורבים (תות, פטל, אוכמניות)","israelNote":"תערובת פירות יער קפואה מתאימה — מפשירים ומסננים קודם"},{"amount":"1 כפית / 5 מ\"ל","item":"מיץ לימון"},{"amount":"4 כפות / 28 גרם","item":"פקאנים או שקדים קלויים קצוצים"}],"instructions":["Slice the strawberries and toss all the berries with the lemon juice and a teaspoon of the sweetener. Let stand 10 minutes so they release a little juice.","Whip the cold cream with the remaining powdered sweetener and vanilla to firm peaks.","In 4 glasses, layer a spoonful of berries, a layer of cream, and a sprinkle of nuts; repeat so each glass has two layers of each.","Finish with a few berries and nuts on top. Serve at once, or chill up to 4 hours."],"instructionsHe":["פורסים את התותים ומערבבים את כל פירות היער עם מיץ הלימון וכפית מהממתיק. מניחים ל-10 דקות כדי שישחררו מעט מיץ.","מקציפים את השמנת הקרה עם שארית הממתיק הטחון והווניל לקצפת יציבה.","ב-4 כוסות מסדרים שכבות: כף פירות יער, שכבת קצפת ופיזור אגוזים; חוזרים כך שבכל כוס יהיו שתי שכבות מכל אחד.","מסיימים בכמה פירות יער ואגוזים מלמעלה. מגישים מיד, או מקררים עד 4 שעות."],"nutrition":{"calories":382,"fatG":38.5,"satFatG":21,"proteinG":3,"carbsG":9.5,"fiberG":2.9,"netCarbsG":6.6,"sugarG":6,"sodiumMg":35},"ketoVariant":"Use only raspberries and strawberries (skip blueberries) to drop to about 5 g net carbs.","ketoVariantHe":"משתמשים רק בפטל ותות (מוותרים על האוכמניות) כדי לרדת לכ-5 גרם פחמימות נטו.","tips":"The 10-minute maceration with lemon and sweetener makes even winter berries taste like a sauce — no cooking needed.","tipsHe":"ההשריה של 10 דקות עם לימון וממתיק גורמת גם לפירות יער חורפיים לטעום כמו רוטב — בלי שום בישול.","sources":[{"creator":"Low Carb Yum (Lisa MarcAurele)","url":"https://lowcarbyum.com/mascarpone-cheese-mousse-berries/"},{"creator":"Grumpy\u0027s Honeybunch","url":"https://grumpyshoneybunch.com/keto-cheesecake-parfait/"},{"creator":"All Day I Dream About Food (Carolyn Ketchum)","url":"https://alldayidreamaboutfood.com/keto-mascarpone-mousse/"}],"comparedVersions":"Compared mascarpone-mousse parfaits (Low Carb Yum, Carolyn Ketchum) with cheesecake-style parfaits (Grumpy\u0027s Honeybunch). Went with pure whipped cream per the category brief — fewest ingredients and lightest result — and borrowed the berry-maceration and nut-crunch layers that made the richer versions interesting.","comparedVersionsHe":"השוויתי פרפה על בסיס מוס מסקרפונה (Low Carb Yum, קרולין קצ\u0027ם) עם פרפה בסגנון עוגת גבינה (Grumpy\u0027s Honeybunch). בחרתי בקצפת נקייה בהתאם להגדרת הקטגוריה — הכי מעט מרכיבים והתוצאה הקלילה ביותר — ושאלתי מהגרסאות העשירות את השריית פירות היער ואת שכבות הקראנץ\u0027 של האגוזים."},{"id":"coconut-macaroon-bars","name":"Chocolate-Dipped Coconut Macaroon Bars","nameHe":"חטיפי קוקוס מצופים שוקולד","category":"desserts-pareve","kosherType":"pareve","dietTags":"keto","servings":14,"prepTimeMin":15,"cookTimeMin":18,"difficulty":"easy","ingredients":[{"amount":"3","item":"large egg whites"},{"amount":"1 pinch","item":"salt"},{"amount":"3 tbsp / 24 g","item":"powdered erythritol-monk fruit blend","israelNote":"erythritol/Sukrin - health-food stores"},{"amount":"3 tbsp / 40 g","item":"coconut butter or very thick coconut cream, melted","israelNote":"kremet kokos 22%+ (the thick part) or coconut butter from health-food stores"},{"amount":"2 cups / 200 g","item":"unsweetened desiccated coconut","israelNote":"kokos tachun, unsweetened"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"60 g / 2 oz","item":"sugar-free pareve dark chocolate (check pareve label)","israelNote":"sugar-free or 85% dark chocolate marked parve"},{"amount":"1 tsp","item":"coconut oil","israelNote":"shemen kokos"}],"ingredientsHe":[{"amount":"3","item":"חלבוני ביצה גדולה"},{"amount":"קורט","item":"מלח"},{"amount":"3 כפות / 24 גרם","item":"תערובת אריתריטול ומונק פרוט אבקתית","israelNote":"אריתריטול/סוכרין — חנויות טבע"},{"amount":"3 כפות / 40 גרם","item":"חמאת קוקוס או קרם קוקוס סמיך מאוד, מומס","israelNote":"קרם קוקוס 22% ומעלה (החלק הסמיך) או חמאת קוקוס מחנויות טבע"},{"amount":"2 כוסות / 200 גרם","item":"קוקוס טחון לא ממותק"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"60 גרם","item":"שוקולד מריר פרווה ללא סוכר (לבדוק סימון פרווה)","israelNote":"שוקולד ללא סוכר או מריר 85% בסימון פרווה"},{"amount":"1 כפית","item":"שמן קוקוס"}],"instructions":["Heat the oven to 170 C / 340 F and line a baking sheet with parchment.","Whip the egg whites with the salt in a clean, grease-free bowl until stiff peaks form.","Fold in the powdered sweetener, melted coconut butter and vanilla, then the desiccated coconut, until evenly moistened.","With damp hands, press the mixture firmly into 14 small bars (about 6 x 2 cm) and place on the sheet.","Bake 15-18 minutes until golden at the edges. Cool completely on the tray - they set as they cool.","Melt the chocolate with the coconut oil in short bursts, dip the base of each bar (or drizzle over the tops), and chill until the chocolate sets."],"instructionsHe":["מחממים תנור ל-170 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מקציפים את החלבונים עם המלח בקערה נקייה ונטולת שומן עד לקבלת קצף יציב.","מקפלים פנימה את הממתיק האבקתי, חמאת הקוקוס המומסת והווניל, ואז את הקוקוס הטחון, עד שהכול לח באופן אחיד.","בידיים לחות מהדקים את התערובת היטב ל-14 חטיפים קטנים (כ-6x2 ס\"מ) ומניחים על התבנית.","אופים 15-18 דקות עד להזהבה בשוליים. מצננים לגמרי על התבנית — הם מתייצבים כשהם מתקררים.","ממיסים את השוקולד עם שמן הקוקוס בפולסים קצרים, טובלים את תחתית כל חטיף (או מזלפים מעל), ומקררים עד שהשוקולד מתייצב."],"nutrition":{"calories":138,"fatG":12.9,"satFatG":10.9,"proteinG":2.1,"carbsG":5.6,"fiberG":3.4,"netCarbsG":1.3,"sugarG":1.2,"sodiumMg":35},"tips":"Press the bars together firmly - the meringue is the only glue. They keep a week in an airtight tin.","tipsHe":"מהדקים את החטיפים היטב — המרנג הוא הדבק היחיד. הם נשמרים שבוע בקופסה אטומה.","sources":[{"creator":"Sugar Free Londoner (Katrin Nurnberger)","url":"https://sugarfreelondoner.com/keto-macaroons-sugar-free/"},{"creator":"Sugar-Free Mom","url":"https://www.sugarfreemom.com/recipes/coconut-macaroons-gluten-sugar-dairy-free/"},{"creator":"The Best Keto Recipes","url":"https://thebestketorecipes.com/chocolate-coconut-macaroons/"}],"comparedVersions":"Compared Sugar Free Londoner (whipped-egg-white meringue base, crisp outside and chewy inside), Sugar-Free Mom\u0027s dairy-free macaroons and The Best Keto Recipes\u0027 dipping method. The meringue technique won on texture; shaped as bars for the book\u0027s format and finished with the chocolate-dip step, using coconut oil to thin the chocolate.","comparedVersionsHe":"השווינו בין Sugar Free Londoner (בסיס מרנג של חלבונים מוקצפים, פריך מבחוץ ולעיס מבפנים), עוגיות הקוקוס ללא חלב של Sugar-Free Mom ושיטת הטבילה של The Best Keto Recipes. טכניקת המרנג ניצחה במרקם; עיצבנו כחטיפים לפורמט הספר וסיימנו בשלב טבילת השוקולד, עם שמן קוקוס לדילול השוקולד."},{"id":"lemon-coconut-energy-balls","name":"Lemon Coconut Energy Balls","category":"desserts-pareve","kosherType":"pareve","dietT
