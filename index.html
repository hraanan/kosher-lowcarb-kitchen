cup / 100 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"4 tbsp / 60 g","item":"butter, softened"},{"amount":"4 tbsp / 60 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1/4 cup / 60 g","item":"sour cream (shamenet)"},{"amount":"4 large","item":"eggs"},{"amount":"1 large","item":"lemon - all the zest plus 3 tbsp juice"},{"amount":"1 tsp","item":"vanilla extract"}],"instructions":["Heat the oven to 175C (350F) and line a 12-cup muffin tin.","Beat the butter, cream cheese, and sweetener together until smooth, then beat in the sour cream, eggs, lemon zest, lemon juice, and vanilla.","Stir in the almond flour, coconut flour, baking powder, salt, and poppy seeds until just combined.","Let the batter rest 2-3 minutes so the coconut flour can absorb moisture, then divide between the muffin cups (about 3/4 full).","Bake 15-20 minutes, until lightly golden and a toothpick comes out clean.","Cool before serving; a drizzle of powdered sweetener mixed with lemon juice makes an optional glaze."],"nutrition":{"calories":194,"fatG":17.2,"satFatG":7.0,"proteinG":5.6,"carbsG":4.2,"fiberG":2.2,"netCarbsG":2.0,"sugarG":1.0,"sodiumMg":150},"ketoVariant":"Pareve swap: replace butter with coconut oil, and cream cheese plus sour cream with 1/2 cup thick coconut cream - the crumb is a bit less tender but still moist.","tips":"Zest the lemon before juicing it; the zest carries most of the lemon flavor.","sources":[{"creator":"KetoFocus","url":"https://www.ketofocus.com/recipes/keto-lemon-poppyseed-muffins/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/almond-flour-lemon-poppy-seed-muffins/"},{"creator":"Ruled.me","url":"https://www.ruled.me/keto-lemon-poppyseed-muffins/"}],"comparedVersions":"Compared KetoFocus, Sweet As Honey, and Ruled.me. KetoFocus\u0027s dairy-enriched batter (butter + cream cheese + sour cream) won for the moistest, least eggy crumb - the most common complaint about coconut-oil-only versions - at the same 2 g net carbs."},{"id":"almond-flour-chocolate-chip-cookies","nameHe":"עוגיות שוקולד צ\u0027יפס מקמח שקדים","ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים טחון דק"},{"amount":"1/2 כוס / 115 גרם","item":"חמאה, מומסת ומצוננת מעט"},{"amount":"2/3 כוס / 130 גרם","item":"ממתיק אריתריטול גולדן (בסגנון סוכר חום, אם יש)","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO"},{"amount":"1 גדולה","item":"ביצה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/2 כפית","item":"סודה לשתייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1/2 כוס / 90 גרם","item":"שוקולד צ\u0027יפס ללא סוכר","israelNote":"אם אין, מחליפים בשוקולד מריר 85% קצוץ (לבדוק אם מסומן פרווה או חלבי)"}],"instructionsHe":["מחממים תנור ל-160 מעלות ומרפדים תבנית אפייה בנייר אפייה.","טורפים את החמאה המומסת עם הממתיק עד למרקם של חול רטוב, ואז טורפים פנימה את הביצה והווניל.","מוסיפים את קמח השקדים, הסודה לשתייה והמלח ומערבבים עד שנוצר בצק רך.","מקפלים פנימה את השוקולד צ\u0027יפס.","יוצרים 18 כדורי בצק, מניחים על התבנית ומשטחים כל אחד מעט בכף היד - הן מתפשטות רק מעט באפייה.","אופים 12-15 דקות עד שהשוליים מזהיבים; המרכז עדיין ייראה רך.","מצננים על התבנית לפחות 15 דקות - העוגיות מתייצבות תוך כדי הצינון."],"tipsHe":"לא מדלגים על שלב הצינון; עוגיות מקמח שקדים שבירות מאוד ישר מהתנור ומתייצבות בהצטננות.","lowCarbVariantHe":"לגרסה פרווה אחרי ארוחה בשרית: מחליפים את החמאה בשמן קוקוס מזוכך ומשתמשים בשוקולד מריר עם הכשר פרווה - המרקם יוצא מעט פריך יותר.","comparedVersionsHe":"הושוו הגרסאות של All Day I Dream About Food‏, Healthy Recipes Blog ו-Low Carb with Jennifer. נשמר היחס המוכח של ADIDAF - ‏200 גרם קמח : 115 גרם חמאה : ביצה אחת (עוגייה עבה, לעיסה ומדורגת גבוה) - אך כמות הממתיק צומצמה מעט והתהליך פושט לקערה אחת כמו בגרסה של Jennifer.","name":"Almond Flour Chocolate Chip Cookies","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":18,"prepTimeMin":10,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/2 cup / 115 g","item":"butter, melted and slightly cooled"},{"amount":"2/3 cup / 130 g","item":"golden erythritol/monk-fruit blend (brown-sugar style if available)","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"1 large","item":"egg"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/2 tsp","item":"baking soda"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1/2 cup / 90 g","item":"sugar-free chocolate chips","israelNote":"use chopped 85% dark chocolate if unavailable (check pareve/dairy label)"}],"instructions":["Heat the oven to 160C (325F) and line a baking sheet with parchment paper.","Whisk the melted butter with the sweetener until it looks like wet sand, then whisk in the egg and vanilla.","Stir in the almond flour, baking soda, and salt until a soft dough forms.","Fold in the chocolate chips.","Scoop 18 balls of dough onto the sheet and flatten each one slightly with your palm - they spread only a little.","Bake 12-15 minutes until the edges turn golden; the centers will still look soft.","Cool on the sheet for at least 15 minutes - the cookies firm up as they cool."],"nutrition":{"calories":150,"fatG":13.5,"satFatG":4.5,"proteinG":3.6,"carbsG":5.0,"fiberG":3.0,"netCarbsG":2.0,"sugarG":0.5,"sodiumMg":95},"lowCarbVariant":"For a pareve version after meat meals, swap the butter for refined coconut oil and use dark chocolate with a pareve hechsher - texture is slightly crisper.","tips":"Do not skip the cooling step; almond flour cookies are fragile straight from the oven and set as they cool.","sources":[{"creator":"All Day I Dream About Food (Carolyn Ketchum)","url":"https://alldayidreamaboutfood.com/keto-chocolate-chip-cookies/"},{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/chocolate-chip-cookies/"},{"creator":"Low Carb with Jennifer","url":"https://jenniferbanz.com/healthy-chocolate-chip-cookies"}],"comparedVersions":"Compared All Day I Dream About Food, Healthy Recipes Blog, and Low Carb with Jennifer. Kept ADIDAF\u0027s proven 200 g flour : 115 g butter : 1 egg ratio (thick, chewy, top-rated) but trimmed the sweetener slightly and simplified to one bowl like Jennifer\u0027s version."},{"id":"thumbprint-cookies-chia-berry-jam","nameHe":"עוגיות טביעת אצבע עם ריבת צ\u0027יה ופטל","ingredientsHe":[{"amount":"2 1/4 כוסות / 250 גרם","item":"קמח שקדים"},{"amount":"1/2 כוס / 90 גרם","item":"ממתיק אריתריטול מגורען"},{"amount":"1/2 כוס / 110 גרם","item":"שמן קוקוס מזוכך, רך אך לא מומס"},{"amount":"1","item":"ביצה גדולה"},{"amount":"1/2 כפית","item":"תמצית וניל או תמצית שקדים"},{"amount":"1/2 כפית","item":"אבקת אפייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1 1/2 כוסות / 180 גרם","item":"פטל, טרי או קפוא (לריבה)","israelNote":"פטל קפוא ממדף המקפיאים עובד מצוין"},{"amount":"2 כפות / 20 גרם","item":"זרעי צ\u0027יה (לריבה)","israelNote":"במדפי הבריאות בסופרים"},{"amount":"3 כפות / 35 גרם","item":"ממתיק מגורען + 3 כפות מים (לריבה)"}],"instructionsHe":["מכינים קודם את הריבה: מבשלים את הפטל, 3 כפות הממתיק והמים בסיר קטן 5 דקות תוך מעיכת הפירות. מערבבים פנימה את זרעי הצ\u0027יה ומבשלים עוד 8-10 דקות עד להסמכה. מצננים לגמרי (היא מסמיכה עוד).","מחממים תנור ל-165 מעלות ומרפדים שתי תבניות אפייה בנייר אפייה.","מקציפים את שמן הקוקוס עם 1/2 כוס הממתיק עד לקבלת קרם, ואז מקציפים פנימה את הביצה והתמצית.","מוסיפים את קמח השקדים, אבקת האפייה והמלח ומערבבים לבצק רך. אם דביק, מקררים 20 דקות.","מגלגלים ל-24 כדורים קטנים, מניחים על התבניות, משטחים מעט ולוחצים גומה עמוקה במרכז כל אחד עם האגודל.","אופים 12-15 דקות עד להזהבה בשוליים; אם הגומות תפחו, לוחצים אותן שוב בעדינות עם כפית מיד ביציאה מהתנור.","מצננים את העוגיות, ואז ממלאים כל גומה בכ-1 כפית מריבת הצ\u0027יה המצוננת.","שומרים במקרר; הריבה שומרת על העוגיות טריות כ-5 ימים."],"lowCarbVariantHe":"גרסת חמאה (חלבית): מחליפים את שמן הקוקוס בחמאה רכה לטעם שורטברד עשיר וקלאסי יותר.","tipsHe":"ריבת צ\u0027יה שנשארה נשמרת חודש במקרר ומצוינת גם כתוספת ליוגורט או לפנקייק קיטו.","comparedVersionsHe":"הושוו בצק החמאה עם ריבת הג\u0027לטין של All Day I Dream About Food, בצק שמן הקוקוס ללא חלב של The Roasted Root ושיטת ריבת הצ\u0027יה של The Harvest Skillet. סונתזו יחסי הבצק הבדוקים של ADIDAF ‏(250 גרם קמח : 110 גרם שומן : ביצה) בגרסה פרווה עם שמן קוקוס לפי The Roasted Root, בשילוב ריבת הצ\u0027יה של The Harvest Skillet - צ\u0027יה לא דורשת השריית ג\u0027לטין, מוסיפה סיבים ושומרת על העוגייה כולה פרווה.","name":"Thumbprint Cookies with Chia Berry Jam","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":24,"prepTimeMin":25,"cookTimeMin":15,"difficulty":"medium","ingredients":[{"amount":"2.25 cups / 250 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/2 cup / 90 g","item":"granulated erythritol-monk fruit blend"},{"amount":"1/2 cup / 110 g","item":"refined coconut oil, softened but not melted"},{"amount":"1","item":"large egg"},{"amount":"1/2 tsp","item":"vanilla or almond extract"},{"amount":"1/2 tsp","item":"baking powder"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1.5 cups / 180 g","item":"raspberries, fresh or frozen (for the jam)","israelNote":"frozen petel from the freezer section works perfectly"},{"amount":"2 tbsp / 20 g","item":"chia seeds (for the jam)","israelNote":"zirei chia, health-food aisle"},{"amount":"3 tbsp / 35 g","item":"granulated sweetener + 3 tbsp water (for the jam)"}],"instructions":["Make the jam first: simmer the raspberries, 3 tbsp sweetener, and water in a small pot for 5 minutes, mashing the berries. Stir in the chia seeds and simmer 8-10 minutes more until thick. Cool completely (it thickens further).","Heat the oven to 165°C / 325°F and line two baking sheets with parchment.","Beat the coconut oil with the 1/2 cup sweetener until creamy, then beat in the egg and extract.","Mix in the almond flour, baking powder, and salt to form a soft dough. If sticky, chill 20 minutes.","Roll into 24 small balls, place on the sheets, flatten slightly, and press a deep well into each center with your thumb.","Bake 12-15 minutes until golden at the edges; if the wells puffed up, re-press them gently with a teaspoon right out of the oven.","Cool the cookies, then spoon about 1 tsp of the cooled chia jam into each well.","Store in the fridge; the jam keeps the cookies fresh for about 5 days."],"nutrition":{"calories":114,"fatG":10.3,"satFatG":4.2,"proteinG":2.9,"carbsG":4.0,"fiberG":1.9,"netCarbsG":2.1,"sugarG":0.9,"sodiumMg":42},"lowCarbVariant":"Butter version (dairy): swap the coconut oil for softened butter for a richer, more classic shortbread flavor.","tips":"Leftover chia jam keeps a month in the fridge and doubles as a topping for yogurt or keto pancakes.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/low-carb-raspberry-almond-thumbprints/"},{"creator":"The Roasted Root","url":"https://www.theroastedroot.net/keto-raspberry-thumbprint-cookies-vegan/"},{"creator":"The Harvest Skillet","url":"https://www.theharvestskillet.com/raspberry-thumbprint-cookies/"}],"comparedVersions":"Compared All Day I Dream About Food\u0027s butter dough with gelatin jam, The Roasted Root\u0027s dairy-free coconut-oil dough, and The Harvest Skillet\u0027s chia-jam method. Synthesized ADIDAF\u0027s proven dough ratios (250 g flour : 110 g fat : 1 egg) made pareve with coconut oil per The Roasted Root, paired with the Harvest Skillet chia jam - chia needs no gelatin bloom, adds fiber, and keeps the whole cookie pareve."},{"id":"keto-banana-bread","nameHe":"לחם ״בננה״ קיטו","ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים טחון דק"},{"amount":"1/4 כוס / 28 גרם","item":"קמח קוקוס"},{"amount":"1 כף","item":"אבקת אפייה"},{"amount":"2 כפיות","item":"קינמון טחון"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1/2 כוס / 110 גרם","item":"שמן קוקוס מזוכך, רך (או חמאה לגרסה חלבית)"},{"amount":"2/3 כוס / 130 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO"},{"amount":"4 גדולות","item":"ביצים"},{"amount":"1/2 כוס / 120 מ״ל","item":"משקה שקדים ללא סוכר"},{"amount":"2 כפיות","item":"תמצית בננה","israelNote":"נמכרת במדפי האפייה בסופרים גדולים או באינטרנט (למשל iHerb); לא להשתמש בבננה אמיתית - היא מוסיפה כ-6 גרם פחמימות לפרוסה"},{"amount":"1/2 כוס / 55 גרם","item":"אגוזי מלך קצוצים (לא חובה)"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית אינגליש קייק בגודל 22x11 ס״מ בנייר אפייה.","טורפים את קמח השקדים, קמח הקוקוס, אבקת האפייה, הקינמון והמלח.","בקערה שנייה מקציפים את שמן הקוקוס עם הממתיק, ואז מקציפים פנימה את הביצים, משקה השקדים ותמצית הבננה.","מערבבים את התערובת היבשה לתוך הרטובה; מקפלים פנימה את האגוזים אם משתמשים.","מעבירים לתבנית ומיישרים את החלק העליון.","אופים 35-40 דקות, ואז מכסים ברפיון בנייר אלומיניום ואופים עוד 15-20 דקות, עד שקיסם במרכז יוצא נקי.","מצננים לגמרי בתבנית לפני חיתוך ל-12 פרוסות - הלחם מתייצב מאוד תוך כדי הצינון."],"lowCarbVariantHe":"לגרסה דל-פחמימות (לא קיטו) עם בננה אמיתית: מחליפים את התמצית בבננה קטנה מעוכה ומצמצמים את משקה השקדים ל-1/4 כוס - כ-7 גרם פחמימות נטו לפרוסה.","tipsHe":"בהכנה עם שמן קוקוס הלחם פרווה ולכן מתאים אחרי ארוחת שבת בשרית. כיסוי האלומיניום מונע מהחלק העליון להשחים לפני שהמרכז נאפה.","comparedVersionsHe":"הושוו Wholesome Yum‏, Low Carb with Jennifer ו-The Big Man\u0027s World - כולם מסתמכים על תמצית בננה ולא על פרי. שילוב קמח השקדים והקוקוס של Wholesome Yum ניצח בזכות הפירור הכי דמוי לחם; קסנטן גאם הושמט כאופציונלי כי קמח הקוקוס כבר קושר היטב.","name":"Keto \"Banana\" Bread","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":15,"cookTimeMin":55,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 28 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"1 tbsp","item":"baking powder"},{"amount":"2 tsp","item":"ground cinnamon"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1/2 cup / 110 g","item":"refined coconut oil, softened (or butter for a dairy loaf)"},{"amount":"2/3 cup / 130 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"4 large","item":"eggs"},{"amount":"1/2 cup / 120 ml","item":"unsweetened almond milk"},{"amount":"2 tsp","item":"banana extract","israelNote":"tamtzit banana - baking aisle of larger supermarkets or online (e.g. iHerb); do not use real banana, it adds ~6 g carbs per slice"},{"amount":"1/2 cup / 55 g","item":"chopped walnuts (optional)"}],"instructions":["Heat the oven to 175C (350F) and line a 22x11 cm (8.5x4.5 inch) loaf pan with parchment.","Whisk the almond flour, coconut flour, baking powder, cinnamon, and salt.","In a second bowl beat the coconut oil and sweetener, then beat in the eggs, almond milk, and banana extract.","Stir the dry mix into the wet mix; fold in the walnuts if using.","Scrape into the pan and smooth the top.","Bake 35-40 minutes, then tent loosely with foil and bake another 15-20 minutes, until a toothpick in the center comes out clean.","Cool completely in the pan before slicing into 12 slices - it firms up a lot as it cools."],"nutrition":{"calories":225,"fatG":20.5,"satFatG":10.0,"proteinG":6.5,"carbsG":6.0,"fiberG":3.5,"netCarbsG":2.5,"sugarG":1.0,"sodiumMg":160},"lowCarbVariant":"For a real-banana lowcarb (not keto) loaf, replace the extract with 1 small mashed banana and cut the almond milk to 1/4 cup - about 7 g net carbs per slice.","tips":"Made with coconut oil the loaf is pareve, so it works after a meat Shabbat meal. The foil tent stops the top browning before the middle bakes through.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/low-carb-banana-bread-paleo-gluten-free-sugar-free/"},{"creator":"Low Carb with Jennifer","url":"https://jenniferbanz.com/easy-keto-banana-bread"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-almond-flour-banana-bread/"}],"comparedVersions":"Compared Wholesome Yum, Low Carb with Jennifer, and The Big Man\u0027s World - all rely on banana extract rather than fruit. Wholesome Yum\u0027s almond+coconut flour combination won for the most bread-like crumb; xanthan gum was dropped as optional since the coconut flour already binds well."},{"id":"marble-cake","nameHe":"עוגת שיש","ingredientsHe":[{"amount":"5","item":"ביצים גדולות בטמפרטורת החדר"},{"amount":"2/3 כוס / 120 גרם","item":"ממתיק אריתריטול אבקה"},{"amount":"1/2 כוס / 114 גרם","item":"חמאה, מומסת ומצוננת"},{"amount":"1/4 כוס / 60 גרם","item":"יוגורט טבעי או שמנת מתוקה"},{"amount":"1/4 כוס / 60 מ״ל","item":"משקה שקדים ללא סוכר"},{"amount":"2 1/4 כוסות / 225 גרם","item":"קמח שקדים"},{"amount":"1/4 כוס / 30 גרם","item":"קמח קוקוס"},{"amount":"2 כפות / 12 גרם","item":"אבקת קקאו ללא סוכר"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"2 כפיות","item":"תמצית וניל"}],"instructionsHe":["מחממים תנור ל-180 מעלות (160 בטורבו) ומרפדים תבנית אינגליש קייק 23x13 ס״מ בנייר אפייה.","טורפים את הביצים עם ממתיק האבקה 2-3 דקות עד לתערובת בהירה ומוקצפת.","טורפים פנימה את החמאה המומסת, היוגורט, משקה השקדים והווניל.","מוסיפים את קמח השקדים, קמח הקוקוס ואבקת האפייה ומערבבים לבלילה חלקה וסמיכה.","מעבירים שליש מהבלילה לקערה שנייה ומערבבים פנימה את הקקאו (מדללים במעט משקה שקדים אם סמיך מאוד).","מניחים את שתי הבלילות בתבנית בכפות לסירוגין, טופחים עם התבנית על השיש ליישור, ואז מעבירים סכין בתנועת S לרוחב ופעם אחת לאורך ליצירת דוגמת השיש.","אופים 55-60 דקות עד להזהבה עמוקה ועד שקיסם יוצא נקי; מכסים בנייר אלומיניום אחרי 40 דקות אם משחים מהר.","מצננים בתבנית 15 דקות, ואז מסיימים לצנן על רשת לפני החיתוך."],"lowCarbVariantHe":"החלפה לפרווה: שמן קוקוס מזוכך מומס במקום החמאה ויוגורט על בסיס קוקוס במקום היוגורט החלבי - הפירור נשאר לח והעוגה יכולה לבוא אחרי ארוחה בשרית.","tipsHe":"מערבלים רק פעמיים - ערבול יתר מערבב את הבלילות לצבע אחיד ובוצי.","comparedVersionsHe":"הושוו עוגות השיש של Sugar Free Londoner‏, Low Carb Spark ו-Peace Love and Low Carb. היחסים של Sugar Free Londoner ניצחו: שילוב היוגורט ומשקה השקדים נותן את הפירור הלח ביותר מבין השלוש, חלוקת הקקאו לשליש מהבלילה נותנת את הסווירל הברור ביותר, וטכניקת הסכין שלה מפורשת וניתנת לשחזור. עם 2.6 גרם פחמימות נטו היא גם הדלה ביותר בפחמימות מהגרסאות שהושוו.","name":"Marble Cake","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":20,"cookTimeMin":60,"difficulty":"medium","ingredients":[{"amount":"5","item":"large eggs, room temperature"},{"amount":"2/3 cup / 120 g","item":"powdered erythritol-monk fruit blend"},{"amount":"1/2 cup / 114 g","item":"butter, melted and cooled"},{"amount":"1/4 cup / 60 g","item":"plain yogurt or heavy cream"},{"amount":"1/4 cup / 60 ml","item":"unsweetened almond milk","israelNote":"mashkeh shkedim lo mumtak"},{"amount":"2.25 cups / 225 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 30 g","item":"coconut flour"},{"amount":"2 tbsp / 12 g","item":"unsweetened cocoa powder"},{"amount":"2 tsp","item":"baking powder"},{"amount":"2 tsp","item":"vanilla extract"}],"instructions":["Heat the oven to 180°C / 350°F (160°C fan) and line a 23x13 cm (9x5 in) loaf pan with parchment.","Whisk the eggs with the powdered sweetener until pale and frothy, 2-3 minutes.","Whisk in the melted butter, yogurt, almond milk, and vanilla.","Stir in the almond flour, coconut flour, and baking powder until you have a smooth, thick batter.","Transfer one third of the batter to a second bowl and stir in the cocoa powder (loosen with a splash of almond milk if very thick).","Spoon the two batters into the pan in alternating dollops, tap the pan on the counter to level, then drag a knife through in an S-motion sideways and once lengthwise to marble.","Bake 55-60 minutes until deep golden and a skewer comes out clean; tent with foil after 40 minutes if browning fast.","Cool in the pan 15 minutes, then finish cooling on a rack before slicing."],"nutrition":{"calories":175,"fatG":14.9,"satFatG":5.2,"proteinG":6.1,"carbsG":3.9,"fiberG":2.0,"netCarbsG":2.6,"sugarG":0.7,"sodiumMg":140},"lowCarbVariant":"Pareve swap: melted refined coconut oil for the butter and coconut-based yogurt for the dairy yogurt - the crumb stays moist and the cake can follow a meat meal.","tips":"Swirl only twice - over-marbling blends the batters into a muddy single color.","sources":[{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-marble-cake/"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-marble-cake/"},{"creator":"Peace Love and Low Carb","url":"https://peaceloveandlowcarb.com/keto-chocolate-vanilla-marble-pound-cake/"}],"comparedVersions":"Compared Sugar Free Londoner, Low Carb Spark, and Peace Love and Low Carb marble pound cakes. Sugar Free Londoner\u0027s ratios won: the yogurt plus almond-milk combination gives the moistest crumb of the three, her cocoa-to-one-third-of-batter split gives the clearest swirl, and her knife-swirl technique is explicit and repeatable. At 2.6 g net carbs it is also the lowest-carb of the versions compared."},{"id":"poppy-seed-cake","nameHe":"עוגת פרג","ingredientsHe":[{"amount":"2 1/2 כוסות / 250 גרם","item":"קמח שקדים"},{"amount":"1/3 כוס / 45 גרם","item":"פרג טחון","israelNote":"קונים טחון טרי בחנויות תבלינים, או טוחנים פרג שלם במטחנת תבלינים"},{"amount":"2/3 כוס / 130 גרם","item":"ממתיק אריתריטול מגורען"},{"amount":"4","item":"ביצים גדולות בטמפרטורת החדר"},{"amount":"1/3 כוס / 80 מ״ל","item":"שמן זית עדין או שמן אבוקדו"},{"amount":"1/4 כוס / 60 מ״ל","item":"משקה שקדים ללא סוכר"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1 כף","item":"גרידת לימון (לא חובה אבל קלאסי)"},{"amount":"1/4 כפית","item":"מלח"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית אינגליש קייק 23x13 ס״מ בנייר אפייה.","טורפים את הביצים עם הממתיק 2 דקות עד לתערובת בהירה ומעט סמיכה.","טורפים פנימה את השמן, משקה השקדים, הווניל וגרידת הלימון.","מוסיפים את קמח השקדים, הפרג הטחון, אבקת האפייה והמלח ומערבבים עד לאיחוד - הבלילה תהיה סמיכה אך נוחה לעבודה בכף.","מעבירים לתבנית ומיישרים את החלק העליון.","אופים 45-50 דקות עד להזהבה ועד שקיסם יוצא נקי; מכסים בנייר אלומיניום אם החלק העליון מתכהה מוקדם.","מצננים בתבנית 20 דקות, ואז על רשת. לפני ההגשה אפשר לפזר מעט ממתיק אבקה."],"ketoVariantHe":"זיגוג: טורפים 1/3 כוס ממתיק אבקה עם 1-2 כפות מיץ לימון ומזלפים על העוגה המצוננת, תוספת של כ-0.5 גרם פחמימות נטו לפרוסה.","tipsHe":"פרג טחון משחרר הרבה יותר טעם מפרג שלם - הבחירה הישראלית המסורתית. גם פרג שלם עובד, אבל אם אפשר טוחנים אותו קצרות.","comparedVersionsHe":"הושוו עוגת הבאנדט עם החמאה של All Day I Dream About Food (עם אבקת חלבון מי גבינה), עוגת הפאונד של Fittoserve והגרסה של My Keto Kitchen. סונתזה עוגה על בסיס שמן במסורת עוגת הפרג הישראלית: מבנה הקמח והביצים של ADIDAF בלי אבקת החלבון המיוחדת, שמן במקום חמאה כדי שתישאר פרווה אחרי ארוחה בשרית, ופי שלושה פרג מהרגיל - טחון - לנקודות הפרג הצפופות ולטעם האותנטי.","name":"Poppy Seed Cake (Israeli Style)","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":15,"cookTimeMin":50,"difficulty":"easy","ingredients":[{"amount":"2.5 cups / 250 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/3 cup / 45 g","item":"ground poppy seeds","israelNote":"pereg tachun - buy freshly ground at spice shops, or grind whole seeds in a spice grinder"},{"amount":"2/3 cup / 130 g","item":"granulated erythritol-monk fruit blend"},{"amount":"4","item":"large eggs, room temperature"},{"amount":"1/3 cup / 80 ml","item":"light olive oil or avocado oil"},{"amount":"1/4 cup / 60 ml","item":"unsweetened almond milk","israelNote":"mashkeh shkedim lo mumtak"},{"amount":"2 tsp","item":"baking powder"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1 tbsp","item":"lemon zest (optional but classic)"},{"amount":"1/4 tsp","item":"salt"}],"instructions":["Heat the oven to 175°C / 350°F and line a 23x13 cm (9x5 in) loaf pan with parchment.","Whisk the eggs with the sweetener for 2 minutes until pale and slightly thickened.","Whisk in the oil, almond milk, vanilla, and lemon zest.","Stir in the almond flour, ground poppy seeds, baking powder, and salt until evenly combined - the batter will be thick but spoonable.","Scrape into the pan and smooth the top.","Bake 45-50 minutes until golden and a skewer comes out clean; tent with foil if the top darkens early.","Cool in the pan 20 minutes, then on a rack. Dust with a little powdered sweetener before serving if you like."],"nutrition":{"calories":219,"fatG":19.8,"satFatG":2.3,"proteinG":7.3,"carbsG":6.0,"fiberG":3.0,"netCarbsG":3.0,"sugarG":0.9,"sodiumMg":135},"ketoVariant":"Glaze: whisk 1/3 cup powdered sweetener with 1-2 tbsp lemon juice and drizzle over the cooled cake, about 0.5 g net carbs more per slice.","tips":"Ground poppy (pereg tachun) releases far more flavor than whole seeds - the traditional Israeli choice. Whole seeds still work but grind them briefly if you can.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/lemon-poppyseed-bundt-cake-low-carb-and-gluten-free/"},{"creator":"Fittoserve Group","url":"https://www.fittoservegroup.com/keto-poppy-seed-pound-cake/"},{"creator":"My Keto Kitchen","url":"https://www.myketokitchen.com/keto-recipes/keto-lemon-poppy-seed-loaf/"}],"comparedVersions":"Compared All Day I Dream About Food\u0027s butter bundt (with whey protein), Fittoserve\u0027s pound cake, and My Keto Kitchen\u0027s loaf. Synthesized an oil-based loaf in the Israeli ugat pereg tradition: ADIDAF\u0027s flour-to-egg structure without the specialty protein powder, oil instead of butter to keep it pareve after meat meals, and triple the usual poppy amount using ground pereg for the authentic dense speckle and flavor."},{"id":"keto-cinnamon-rolls","nameHe":"שבלולי קינמון קיטו","ingredientsHe":[{"amount":"2 1/2 כוסות / 280 גרם","item":"מוצרלה מגורדת דלת-לחות","israelNote":"להשתמש במוצרלה המגורדת היבשה מהשקית, לא בכדורי מוצרלה טרייה"},{"amount":"60 גרם","item":"גבינת שמנת, חתוכה לקוביות","israelNote":"למשל נפוליאון או סקי"},{"amount":"1 1/2 כוסות / 150 גרם","item":"קמח שקדים טחון דק"},{"amount":"1/4 כוס / 50 גרם","item":"ממתיק אריתריטול מגורען (לבצק)","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO"},{"amount":"1 כף","item":"אבקת אפייה"},{"amount":"2 גדולות","item":"ביצים"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"3 כפות / 45 גרם","item":"חמאה מומסת (למילוי)"},{"amount":"1/3 כוס / 65 גרם","item":"ממתיק אריתריטול גולדן מעורבב עם 1.5 כפות קינמון (למילוי)"},{"amount":"1/3 כוס / 40 גרם","item":"ממתיק אריתריטול אבקה + 1-2 כפות שמנת מתוקה (לזיגוג)","israelNote":"שמנת מתוקה 38% לזיגוג"}],"instructionsHe":["ממיסים יחד את המוצרלה וגבינת השמנת (במיקרוגל בפולסים של 30 שניות או בסיר על אש נמוכה), תוך ערבוב עד לתערובת חלקה לגמרי.","מעבדים פנימה את קמח השקדים, הממתיק, אבקת האפייה, הביצים והווניל ולשים לבצק אחיד - ידיים משומנות או מעבד מזון עוזרים. מקררים 30-60 דקות עד שהבצק מפסיק להידבק.","מחממים תנור ל-190 מעלות.","מרדדים את הבצק בין שני ניירות אפייה למלבן של כ-30x25 ס״מ בעובי 1/2 ס״מ.","מברישים בחמאה המומסת ומפזרים מעל בשכבה אחידה את תערובת הקינמון והממתיק.","מגלגלים בהידוק מהצד הארוך, פורסים ל-12 פרוסות בסכין חדה ומסדרים אותן עם צד החיתוך כלפי מעלה בתבנית עגולה מרופדת בנייר אפייה, כמעט צמודות.","אופים כ-25 דקות, עד שהשבלולים תופחים ומזהיבים; מכסים בנייר אלומיניום אם החלק העליון משחים מוקדם.","טורפים את ממתיק האבקה עם השמנת ומזלפים על השבלולים אחרי שהצטננו מעט."],"tipsHe":"זהו בצק פאטהד - הוא מתנהג הכי טוב קר, אז מקררים אותו שוב לכמה דקות בכל פעם שהוא נעשה דביק. שבלולים שנשארו מחממים 15 שניות במיקרוגל לריכוך מחדש.","comparedVersionsHe":"הושוו שבלולי בצק הפאטהד של Wholesome Yum‏, Low Carb Yum והגרסה עם השמרים של An Edible Mosaic. בצק הפאטהד ניצח באמינות ובמהירות - בלי התפחה, והמוצרלה נותנת מרקם נמתח אמיתי; היחסים הבדוקים של Wholesome Yum נשמרו והתפוקה עוגלה ל-12 שבלולים.","name":"Keto Cinnamon Rolls","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":30,"cookTimeMin":25,"difficulty":"medium","ingredients":[{"amount":"2 1/2 cups / 280 g","item":"shredded low-moisture mozzarella","israelNote":"mozzarella megoredet - use the drier bagged shredded kind, not fresh balls"},{"amount":"60 g","item":"cream cheese, cubed","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1 1/2 cups / 150 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 50 g","item":"granulated erythritol/monk-fruit blend (dough)","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"1 tbsp","item":"baking powder"},{"amount":"2 large","item":"eggs"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"3 tbsp / 45 g","item":"butter, melted (filling)"},{"amount":"1/3 cup / 65 g","item":"golden erythritol blend mixed with 1.5 tbsp cinnamon (filling)"},{"amount":"1/3 cup / 40 g","item":"powdered erythritol blend plus 1-2 tbsp heavy cream (icing)","israelNote":"shamenet metuka 38% for the cream"}],"instructions":["Melt the mozzarella and cream cheese together (microwave in 30-second bursts or in a pot on low), stirring until fully smooth.","Work in the almond flour, sweetener, baking powder, eggs, and vanilla and knead into a uniform dough - oiled hands or a food processor help. Chill 30-60 minutes so it stops being sticky.","Heat the oven to 190C (375F).","Roll the dough between two sheets of parchment into a rectangle about 30x25 cm and 1/2 cm thick.","Brush with the melted butter and sprinkle the cinnamon-sweetener mix evenly over it.","Roll up tightly from the long side, slice into 12 rounds with a sharp knife, and arrange them cut-side up in a parchment-lined round pan, almost touching.","Bake about 25 minutes, until puffed and golden; tent with foil if the tops brown early.","Whisk the powdered sweetener with the cream and drizzle over the rolls once slightly cooled."],"nutrition":{"calories":205,"fatG":17.0,"satFatG":6.5,"proteinG":9.5,"carbsG":5.0,"fiberG":2.0,"netCarbsG":3.0,"sugarG":1.0,"sodiumMg":290},"tips":"This is fathead dough - it behaves best cold, so chill it again for a few minutes any time it turns sticky. Reheat leftover rolls 15 seconds in the microwave to re-soften.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/fathead-keto-cinnamon-rolls-recipe/"},{"creator":"Low Carb Yum","url":"https://lowcarbyum.com/keto-cinnamon-rolls/"},{"creator":"An Edible Mosaic","url":"https://www.anediblemosaic.com/best-low-carb-cinnamon-rolls-recipe/"}],"comparedVersions":"Compared Wholesome Yum\u0027s fathead-dough rolls, Low Carb Yum, and An Edible Mosaic\u0027s yeast-risen version. Fathead dough won for reliability and speed - no proofing, and the mozzarella gives real pull-apart chew; Wholesome Yum\u0027s tested ratios were kept with the yield rounded to 12 rolls."},{"id":"keto-blueberry-muffins","nameHe":"מאפינס אוכמניות","ingredientsHe":[{"amount":"2 1/2 כוסות / 250 גרם","item":"קמח שקדים טחון דק"},{"amount":"1/2 כוס / 100 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO"},{"amount":"1/2 כף","item":"אבקת אפייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"3 גדולות","item":"ביצים"},{"amount":"1/3 כוס / 75 מ״ל","item":"שמן קוקוס מזוכך, מומס (או חמאה - ראו הערה)"},{"amount":"1/3 כוס / 80 מ״ל","item":"משקה שקדים ללא סוכר"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"3/4 כוס / 110 גרם","item":"אוכמניות טריות"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית של 12 מאפינס במנג\u0027טים.","טורפים בקערה גדולה את קמח השקדים, הממתיק, אבקת האפייה והמלח.","מוסיפים את הביצים, שמן הקוקוס המומס, משקה השקדים והווניל ומערבבים לבלילה סמיכה ואחידה.","מקפלים פנימה בעדינות את האוכמניות.","מחלקים את הבלילה בין 12 השקעים, ואם רוצים משבצים עוד כמה אוכמניות למעלה.","אופים 20-25 דקות, עד שהחלק העליון מזהיב וקיסם יוצא נקי.","מצננים בתבנית 10 דקות לפני החילוץ."],"tipsHe":"אם משתמשים באוכמניות קפואות, מפשירים ומייבשים אותן היטב במגבת נייר, אחרת הן יצבעו וידללו את הבלילה.","lowCarbVariantHe":"בהכנה עם שמן קוקוס ומשקה שקדים המאפינס פרווה ואפשר להגישם אחרי ארוחה בשרית; חמאה מומסת נותנת טעם עשיר יותר אבל הופכת אותם לחלביים.","comparedVersionsHe":"הושוו Wholesome Yum‏, Chocolate Covered Katie ו-KetoConnect. היחס של Wholesome Yum - ‏250 גרם קמח : 3 ביצים : 1/3 כוס שומן - ניצח בזכות פירור עוגתי ולח עם הכי מעט מרכיבים; אפשרות השמן הופכת אותם לפרווה באופן טבעי, מה שהגרסאות האחרות לא מדגישות.","name":"Blueberry Muffins","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":10,"cookTimeMin":22,"difficulty":"easy","ingredients":[{"amount":"2 1/2 cups / 250 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/2 cup / 100 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"1/2 tbsp","item":"baking powder"},{"amount":"1/4 tsp","item":"salt"},{"amount":"3 large","item":"eggs"},{"amount":"1/3 cup / 75 ml","item":"refined coconut oil, melted (or butter - see note)"},{"amount":"1/3 cup / 80 ml","item":"unsweetened almond milk"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"3/4 cup / 110 g","item":"fresh blueberries"}],"instructions":["Heat the oven to 175C (350F) and line a 12-cup muffin tin with paper liners.","Whisk the almond flour, sweetener, baking powder, and salt in a large bowl.","Add the eggs, melted coconut oil, almond milk, and vanilla; stir until you get a thick, even batter.","Gently fold in the blueberries.","Divide the batter between the 12 cups and press a few extra berries into the tops if you like.","Bake 20-25 minutes, until the tops are golden and a toothpick comes out clean.","Cool in the tin 10 minutes before removing."],"nutrition":{"calories":210,"fatG":18.5,"satFatG":6.5,"proteinG":6.8,"carbsG":6.0,"fiberG":3.0,"netCarbsG":3.0,"sugarG":1.8,"sodiumMg":95},"lowCarbVariant":"Made with coconut oil and almond milk the muffins are pareve and can follow a meat meal; melted butter gives a richer flavor but makes them dairy.","tips":"If using frozen blueberries, thaw and pat them fully dry first or they will streak and water down the batter.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/keto-low-carb-paleo-blueberry-muffins-recipe-almond-flour/"},{"creator":"Chocolate Covered Katie","url":"https://chocolatecoveredkatie.com/keto-blueberry-muffins-recipe/"},{"creator":"KetoConnect","url":"https://www.ketoconnect.net/low-carb-muffins"}],"comparedVersions":"Compared Wholesome Yum, Chocolate Covered Katie, and KetoConnect. Wholesome Yum\u0027s 250 g flour : 3 eggs : 1/3 cup fat ratio won for a moist, cake-like crumb with the fewest ingredients; the oil option makes it naturally pareve, which the others do not emphasize."},{"id":"peanut-butter-cookies-3-ingredient","nameHe":"עוגיות חמאת בוטנים מ-3 מרכיבים","ingredientsHe":[{"amount":"1 כוס / 250 גרם","item":"חמאת בוטנים טבעית (בוטנים ומלח בלבד), מעורבבת היטב","israelNote":"חמאת בוטנים 100% בוטנים, ללא סוכר מוסף"},{"amount":"2/3 כוס / 130 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO; גם אלולוז עובד אבל קשה יותר להשיג בארץ"},{"amount":"1 גדולה","item":"ביצה"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מערבבים את חמאת הבוטנים, הממתיק והביצה עד שנוצר בצק סמיך ומבריק - הוא מתייצב אחרי דקה של ערבוב.","מגלגלים ל-12 כדורים ומניחים על התבנית.","משטחים כל כדור במזלג, ולוחצים שוב ב-90 מעלות לקבלת דוגמת השתי-וערב הקלאסית.","אופים 10-12 דקות, עד שהשוליים מתייצבים אבל המרכז עדיין נראה מעט לא אפוי.","מצננים על התבנית 10 דקות - העוגיות פריכות מדי כשהן חמות ומתייצבות לגמרי בהצטננות."],"ketoVariantHe":"מוסיפים כפית תמצית וניל וקורט מלח בפתיתים מעל - עדיין 3 מרכיבי מזווה ותיבול.","tipsHe":"פרווה וללא גלוטן באופן טבעי, ולכן אידיאליות אחרי ארוחה בשרית. אם חמאת הבוטנים נוזלית מאוד, מקררים את הבצק 15 דקות לפני הגלגול.","comparedVersionsHe":"הושוו The Big Man\u0027s World‏, Sweet As Honey ו-Kirbie\u0027s Cravings - כולם מתכנסים ליחס הקלאסי של כוס חמאת בוטנים : ביצה : כ-2/3 כוס ממתיק, ולכן יחס הקונצנזוס ניצח. ממתיק אריתריטול מגורען נבחר על פני אלולוז בגלל הזמינות בישראל.","name":"3-Ingredient Peanut Butter Cookies","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":5,"cookTimeMin":11,"difficulty":"easy","ingredients":[{"amount":"1 cup / 250 g","item":"natural peanut butter (just peanuts and salt), well stirred","israelNote":"chemat botnim tivit - 100% peanuts, no added sugar"},{"amount":"2/3 cup / 130 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products; allulose works too but is harder to find in Israel"},{"amount":"1 large","item":"egg"}],"instructions":["Heat the oven to 175C (350F) and line a baking sheet with parchment.","Stir the peanut butter, sweetener, and egg together until a thick, glossy dough forms - it firms up after a minute of mixing.","Roll into 12 balls and place on the sheet.","Flatten each ball with a fork, then press again at 90 degrees for the classic crosshatch.","Bake 10-12 minutes, until the edges are set but the centers still look slightly underdone.","Cool on the sheet 10 minutes - they are crumbly hot and firm up completely as they cool."],"nutrition":{"calories":135,"fatG":11.0,"satFatG":2.2,"proteinG":5.5,"carbsG":4.5,"fiberG":1.3,"netCarbsG":3.2,"sugarG":0.8,"sodiumMg":60},"ketoVariant":"Add 1 tsp vanilla and a pinch of flaky salt on top - still 3 pantry ingredients plus seasonings.","tips":"Naturally pareve and gluten-free, so ideal after meat meals. If the natural peanut butter is very runny, chill the dough 15 minutes before rolling.","sources":[{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-peanut-butter-cookies/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/3-ingredient-keto-peanut-butter-cookies/"},{"creator":"Kirbie\u0027s Cravings","url":"https://kirbiecravings.com/3-ingredient-keto-peanut-butter-cookies/"}],"comparedVersions":"Compared The Big Man\u0027s World, Sweet As Honey, and Kirbie\u0027s Cravings - all converge on the classic 1 cup PB : 1 egg : about 2/3 cup sweetener ratio, so that consensus ratio won. Granulated erythritol blend chosen over allulose for Israeli availability."},{"id":"chocolate-zucchini-bread","nameHe":"עוגת שוקולד וקישואים","ingredientsHe":[{"amount":"2 כוסות / 250 גרם","item":"קישואים מגוררים (כ-2 בינוניים)","israelNote":"הקישוא הישראלי הבהיר עובד מצוין"},{"amount":"3","item":"ביצים גדולות בטמפרטורת החדר"},{"amount":"2/3 כוס / 130 גרם","item":"ממתיק אריתריטול מגורען"},{"amount":"1 1/2 כוסות / 150 גרם","item":"קמח שקדים"},{"amount":"1/4 כוס / 25 גרם","item":"אבקת קקאו ללא סוכר"},{"amount":"1/4 כוס / 60 מ״ל","item":"שמן קוקוס מומס"},{"amount":"1/4 כוס / 60 מ״ל","item":"קרם קוקוס","israelNote":"החלק הסמיך של חלב קוקוס משימורים"},{"amount":"1 1/2 כפיות","item":"אבקת אפייה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1/3 כוס / 60 גרם","item":"שוקולד צ\u0027יפס מריר 60% ומעלה (לא חובה)","israelNote":"לבדוק סימון פרווה; גם שוקולד מריר 85% קצוץ עובד"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית אינגליש קייק 23x13 ס״מ בנייר אפייה.","עוטפים את הקישואים המגוררים במגבת מטבח נקייה וסוחטים חזק - אמורות לצאת כמה כפות נוזלים ולהישאר כ-1 כוס דחוסה.","טורפים בקערה גדולה את הביצים עם הממתיק עד לקבלת קצף קל, ואז טורפים פנימה את שמן הקוקוס המומס, קרם הקוקוס והווניל.","מוסיפים את קמח השקדים, הקקאו, אבקת האפייה והמלח ומערבבים לבלילה חלקה וסמיכה.","מקפלים פנימה את הקישואים הסחוטים ואת רוב השוקולד צ\u0027יפס.","מעבירים לתבנית, מפזרים מעל את שאר השוקולד צ\u0027יפס ואופים 50-55 דקות עד שקיסם יוצא עם פירורים לחים בלבד.","מצננים בתבנית לפחות 30 דקות לפני החיתוך - העוגה מתייצבת תוך כדי הצינון."],"lowCarbVariantHe":"גרסה חלבית: מחליפים את שמן הקוקוס בחמאה מומסת ואת קרם הקוקוס בשמנת מתוקה (העוגה הופכת לחלבית בהתאם).","tipsHe":"סחיטת הקישואים היא השלב הקריטי - מדלגים עליה והעוגה יוצאת דביקה.","comparedVersionsHe":"הושוו העוגה בקערה אחת של Low Carb Spark, הגרסה של Sweet As Honey וגרסת סווירל חמאת השקדים של Stem and Spoon. היחסים של Low Carb Spark ניצחו בפשטות (קערה אחת, בלי שלב סווירל) ובלחות; אפשרות שמן הקוקוס וקרם הקוקוס נבחרה על פני חמאה ושמנת כדי שהעוגה תישאר פרווה ותוכל לבוא אחרי ארוחה בשרית.","name":"Chocolate Zucchini Bread","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":15,"cookTimeMin":55,"difficulty":"easy","ingredients":[{"amount":"2 cups / 250 g","item":"shredded zucchini (about 2 medium)","israelNote":"kishu - the light-green Israeli variety works well"},{"amount":"3","item":"large eggs, room temperature"},{"amount":"2/3 cup / 130 g","item":"granulated erythritol-monk fruit blend"},{"amount":"1.5 cups / 150 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 25 g","item":"unsweetened cocoa powder"},{"amount":"1/4 cup / 60 ml","item":"melted coconut oil"},{"amount":"1/4 cup / 60 ml","item":"coconut cream","israelNote":"the thick part of canned coconut milk"},{"amount":"1.5 tsp","item":"baking powder"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1/3 cup / 60 g","item":"dark chocolate chips, 60%+ (optional)","israelNote":"check pareve label; chopped 85% dark chocolate works"}],"instructions":["Heat the oven to 175°C / 350°F and line a 23x13 cm (9x5 in) loaf pan with parchment.","Wrap the shredded zucchini in a clean kitchen towel and squeeze hard - you should press out several tablespoons of liquid and end with about 1 cup packed.","In a large bowl, whisk the eggs with the sweetener until frothy, then whisk in the melted coconut oil, coconut cream, and vanilla.","Stir in the almond flour, cocoa, baking powder, and salt until you have a smooth, thick batter.","Fold in the squeezed zucchini and most of the chocolate chips.","Scrape into the pan, scatter the remaining chips on top, and bake 50-55 minutes until a skewer comes out with only moist crumbs.","Cool in the pan at least 30 minutes before slicing - it sets as it cools."],"nutrition":{"calories":152,"fatG":13.3,"satFatG":5.8,"proteinG":4.4,"carbsG":5.6,"fiberG":2.4,"netCarbsG":3.2,"sugarG":1.3,"sodiumMg":92},"lowCarbVariant":"Dairy version: swap coconut oil for melted butter and coconut cream for heavy cream (makes it dairy, kosherType changes accordingly).","tips":"Squeezing the zucchini is the make-or-break step - skip it and the loaf turns gummy.","sources":[{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-chocolate-zucchini-bread/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/keto-chocolate-zucchini-bread/"},{"creator":"Stem and Spoon","url":"https://stemandspoon.com/keto-chocolate-zucchini-bread-with-almond-butter-swirl/"}],"comparedVersions":"Compared Low Carb Spark\u0027s one-bowl loaf, Sweet As Honey\u0027s version, and Stem and Spoon\u0027s almond-butter-swirl variation. Low Carb Spark\u0027s ratios won for simplicity (one bowl, no swirl step) and moisture; the coconut oil + coconut cream option was chosen over butter/heavy cream so the loaf stays pareve and can follow a meat meal."},{"id":"keto-chocolate-cake","nameHe":"עוגת שוקולד קיטו","ingredientsHe":[{"amount":"1 1/2 כוסות / 150 גרם","item":"קמח שקדים טחון דק"},{"amount":"1/2 כוס / 45 גרם","item":"אבקת קקאו ללא סוכר"},{"amount":"3/4 כוס / 150 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO"},{"amount":"1 1/2 כפיות","item":"אבקת אפייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"3 גדולות","item":"ביצים"},{"amount":"1/3 כוס / 75 מ״ל","item":"שמן קוקוס מזוכך, מומס"},{"amount":"1/2 כוס / 120 מ״ל","item":"משקה שקדים ללא סוכר"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"50 גרם","item":"שוקולד מריר 85%, מומס, לזיגוג פשוט (לא חובה)","israelNote":"לוודא סימון פרווה"}],"instructionsHe":["מחממים תנור ל-175 מעלות. משמנים תבנית עגולה בקוטר 20 ס״מ ומרפדים את התחתית בנייר אפייה.","טורפים את קמח השקדים, הקקאו, הממתיק, אבקת האפייה והמלח ומפוררים גושים.","בקערה שנייה טורפים את הביצים, שמן הקוקוס המומס, משקה השקדים והווניל.","מאחדים את הרטובים והיבשים ומערבבים לבלילה סמיכה ומבריקה; משטחים אותה בתבנית בשכבה אחידה.","אופים 25-30 דקות, עד שקיסם שננעץ במרכז יוצא עם פירורים לחים בודדים.","מצננים לגמרי בתבנית - העוגה עדינה כשהיא חמה.","אם רוצים, מזלפים שוקולד מריר 85% מומס לפני החיתוך ל-10 מנות."],"lowCarbVariantHe":"לגרסת יום הולדת חלבית: אופים שתי שכבות (מכפילים את הכמויות) וממלאים בקצפת או בקרם גבינת שמנת.","tipsHe":"קקאו הולנדי (מעובד באלקלי) נותן טעם כהה וחלק יותר; גם קקאו רגיל עובד. בזכות הבסיס השמני העוגה פרווה ויכולה לסיים ארוחה בשרית.","comparedVersionsHe":"הושוו עוגת שתי השכבות העשירה של Wholesome Yum, עוגת השכבה האחת של Healthy Recipes Blog והעוגה על בסיס שמן של Sweet As Honey. נבחר פורמט של שכבה אחת לפשטות וגישת שמן הקוקוס של Sweet As Honey כדי שהעוגה תהיה פרווה, תוך שמירה על יחס 3:1 קמח-קקאו של Wholesome Yum לפירור שוקולדי עמוק.","name":"Keto Chocolate Cake","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":10,"prepTimeMin":15,"cookTimeMin":30,"difficulty":"easy","ingredients":[{"amount":"1 1/2 cups / 150 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/2 cup / 45 g","item":"unsweetened cocoa powder"},{"amount":"3/4 cup / 150 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"1 1/2 tsp","item":"baking powder"},{"amount":"1/4 tsp","item":"salt"},{"amount":"3 large","item":"eggs"},{"amount":"1/3 cup / 75 ml","item":"refined coconut oil, melted"},{"amount":"1/2 cup / 120 ml","item":"unsweetened almond milk"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"50 g","item":"dark chocolate 85%, melted, for a simple glaze (optional)","israelNote":"check pareve label"}],"instructions":["Heat the oven to 175C (350F). Grease a 20 cm (8 inch) round pan and line the bottom with parchment.","Whisk the almond flour, cocoa, sweetener, baking powder, and salt, breaking up any lumps.","In a second bowl whisk the eggs, melted coconut oil, almond milk, and vanilla.","Combine wet and dry and stir into a thick, glossy batter; spread it evenly in the pan.","Bake 25-30 minutes, until a toothpick in the center comes out with just a few moist crumbs.","Cool completely in the pan - the cake is delicate while warm.","If you like, drizzle with melted 85% dark chocolate before slicing into 10 pieces."],"nutrition":{"calories":205,"fatG":18.0,"satFatG":8.5,"proteinG":6.0,"carbsG":7.0,"fiberG":3.5,"netCarbsG":3.5,"sugarG":1.0,"sodiumMg":140},"lowCarbVariant":"For a dairy birthday-cake version, bake two layers (double everything) and fill with whipped cream or cream cheese frosting.","tips":"Dutch-processed cocoa gives a darker, smoother flavor; regular cocoa works too. Being oil-based, the cake is pareve and can end a meat meal.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/keto-chocolate-cake-recipe/"},{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/keto-chocolate-cake/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/chocolate-keto-cake/"}],"comparedVersions":"Compared Wholesome Yum\u0027s rich two-layer cake, Healthy Recipes Blog\u0027s one-layer cake, and Sweet As Honey\u0027s oil-based cake. Chose a one-layer format for simplicity and Sweet As Honey\u0027s coconut-oil approach so the cake is pareve, while keeping Wholesome Yum\u0027s 3:1 flour-to-cocoa balance for a deep chocolate crumb."},{"id":"flourless-almond-orange-cake","nameHe":"עוגת שקדים ותפוזים ללא קמח","ingredientsHe":[{"amount":"2","item":"תפוזים שלמים, לא מצופים בשעווה, שטופים","israelNote":"תפוזים קטנים עם קליפה דקה עובדים הכי טוב; להימנע מתפוזי נאבל גדולים מאוד כדי לשמור על פחמימות נמוכות"},{"amount":"2 1/2 כוסות / 250 גרם","item":"קמח שקדים"},{"amount":"5","item":"ביצים בינוניות, מופרדות"},{"amount":"1/2 כוס / 100 גרם","item":"ממתיק אריתריטול מגורען"},{"amount":"1 כפית","item":"אבקת אפייה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/2 כפית","item":"הל טחון (לא חובה)","israelNote":"זמין בכל חנויות התבלינים"},{"amount":"2 כפות / 15 גרם","item":"שקדים פרוסים, לפיזור מעל"}],"instructionsHe":["מניחים את התפוזים השלמים בסיר, מכסים במים ומבשלים בבעבוע עדין שעה עד שהם רכים לגמרי (זה מסלק את מרירות הקליפה). מסננים ומצננים מעט.","מחממים תנור ל-180 מעלות ומרפדים תבנית אינגליש קייק 23x13 ס״מ או תבנית קפיצית בקוטר 20 ס״מ בנייר אפייה.","חוצים את התפוזים, מוציאים גרעינים אם יש, וטוחנים אותם - כולל הקליפה - למחית חלקה.","טורפים את החלמונים עם הממתיק עד להבהרה, ואז מערבבים פנימה את מחית התפוזים, הווניל וההל.","מוסיפים את קמח השקדים ואבקת האפייה ומערבבים עד לאיחוד.","בקערה נקייה מקציפים את החלבונים לקצף יציב ומקפלים אותם בעדינות לבלילה בשתי פעמים.","יוצקים לתבנית, מפזרים שקדים פרוסים ואופים כ-50 דקות עד שקיסם יוצא נקי; מכסים בנייר אלומיניום אם החלק העליון משחים מהר מדי.","מצננים לגמרי בתבנית לפני החיתוך - העוגה עדינה כשהיא חמה."],"ketoVariantHe":"משתמשים בתפוז אחד ועוד כפית תמצית תפוז במקום 2 תפוזים כדי לרדת לכ-2.5 גרם פחמימות נטו לפרוסה.","tipsHe":"מבשלים את התפוזים יום מראש - אחרי שהם מבושלים וטחונים, העוגה מוכנה תוך 15 דקות.","comparedVersionsHe":"הושוותה השיטה הקלאסית של תפוז שלם מבושל (Sugar Free Londoner‏, Spinach Tiger) מול קיצור הדרך ללא בישול של Thinlicious. גרסת התפוז המבושל ניצחה בעומק הטעם ובלחות; טכניקת החלבונים המוקצפים של Sugar Free Londoner נותנת את הפירור הקליל ביותר, וממתיק מגורען מדוד מחליף את טיפות הסטיביה שלה לרכישה קלה יותר בישראל. פרווה וללא חלב באופן טבעי.","name":"Flourless Almond-Orange Cake","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":20,"cookTimeMin":110,"difficulty":"medium","ingredients":[{"amount":"2","item":"whole oranges, unwaxed, washed","israelNote":"small thin-skinned oranges work best; avoid very large navels to keep carbs down"},{"amount":"2.5 cups / 250 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"5","item":"medium eggs, separated"},{"amount":"1/2 cup / 100 g","item":"granulated erythritol-monk fruit blend"},{"amount":"1 tsp","item":"baking powder"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/2 tsp","item":"ground cardamom (optional)","israelNote":"hel - widely available in spice shops"},{"amount":"2 tbsp / 15 g","item":"flaked almonds, for topping"}],"instructions":["Put the whole oranges in a pot, cover with water, and simmer for 1 hour until completely soft (this removes the peel\u0027s bitterness). Drain and cool slightly.","Heat the oven to 180°C / 350°F and line a 23x13 cm (9x5 in) loaf pan or 20 cm springform with parchment.","Cut the oranges open, remove any seeds, and puree them - peel and all - to a smooth pulp.","Whisk the egg yolks with the sweetener until pale, then stir in the orange pulp, vanilla, and cardamom.","Mix in the almond flour and baking powder until combined.","In a clean bowl, beat the egg whites to stiff peaks and fold them gently into the batter in two additions.","Pour into the pan, scatter with flaked almonds, and bake about 50 minutes until a skewer comes out clean; tent with foil if the top browns too fast.","Cool fully in the pan before slicing - the cake is delicate while warm."],"nutrition":{"calories":180,"fatG":13.4,"satFatG":1.5,"proteinG":7.4,"carbsG":6.4,"fiberG":2.7,"netCarbsG":3.7,"sugarG":2.6,"sodiumMg":62},"ketoVariant":"Use 1 orange plus 1 tsp orange extract instead of 2 oranges to drop to roughly 2.5 g net carbs per slice.","tips":"Boil the oranges a day ahead - once they are cooked and pureed, the cake comes together in 15 minutes.","sources":[{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/orange-almond-breakfast-cake/"},{"creator":"Thinlicious","url":"https://thinlicious.com/almond-and-orange-flourless-cake/"},{"creator":"Spinach Tiger","url":"https://spinachtiger.com/italian-orange-almond-cake-with-whole-oranges-gluten-free-low-carb-paleo/"}],"comparedVersions":"Compared the classic boiled-whole-orange method (Sugar Free Londoner, Spinach Tiger) with Thinlicious\u0027s no-boil shortcut. The boiled-orange version won on flavor depth and moisture; Sugar Free Londoner\u0027s beaten-egg-white technique gives the lightest crumb, and a measured granulated sweetener replaces her stevia drops for easier Israeli sourcing. Naturally pareve and dairy-free."},{"id":"double-chocolate-muffins","nameHe":"מאפינס שוקולד כפול","ingredientsHe":[{"amount":"3","item":"ביצים גדולות"},{"amount":"1/2 כוס / 120 מ״ל","item":"משקה שקדים ללא סוכר","israelNote":"משקה שקדים לא ממותק, למשל אלפרו או בלו דיאמונד"},{"amount":"1 כוס / 100 גרם","item":"קמח שקדים"},{"amount":"1/4 כוס / 28 גרם","item":"קמח קוקוס"},{"amount":"1/4 כוס / 25 גרם","item":"אבקת קקאו ללא סוכר"},{"amount":"1/3 כוס / 65 גרם","item":"ממתיק אריתריטול מגורען"},{"amount":"1/4 כוס / 60 מ״ל","item":"שמן אבוקדו או שמן זית עדין"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1/3 כוס / 60 גרם","item":"שוקולד צ\u0027יפס ללא סוכר או שוקולד מריר 85%","israelNote":"שוקולד מריר 85% קצוץ עובד; לבדוק סימון פרווה"}],"instructionsHe":["מחממים תנור ל-165 מעלות ומרפדים 9 שקעי מאפינס במנג\u0027טים.","מבלנדרים את הביצים, משקה השקדים והווניל בבלנדר (או טורפים היטב ביד) עד לקבלת קצף קל.","מוסיפים את קמח השקדים, קמח הקוקוס, הקקאו, הממתיק, אבקת האפייה והמלח; מבלנדרים עד לבלילה חלקה.","מוסיפים את השמן ומבלנדרים רק עד לאיחוד.","מערבבים פנימה ביד את רוב השוקולד צ\u0027יפס.","מחלקים את הבלילה בין השקעים, מפזרים מעל את שאר השוקולד צ\u0027יפס ואופים 22-25 דקות עד שהחלק העליון יציב ומוצק למגע.","מצננים בתבנית 10 דקות - הפירור מסיים להתייצב תוך כדי הצינון."],"ketoVariantHe":"מוסיפים 1/2 כפית אספרסו נמס למרכיבים היבשים - בלי טעם של קפה, רק שוקולד עמוק יותר.","tipsHe":"שמן נוזלי (לא שמן קוקוס) שומר על בלילת הבלנדר נוזלית; מנג\u0027טים הם חובה כי בלילות קקאו נדבקות.","comparedVersionsHe":"הושוו מאפיני הבלנדר של All Day I Dream About Food, הגרסה על בסיס חמאה של Low Carb Spark והגרסה של Gnom-Gnom. ADIDAF ניצחה גם בפשטות (הכול בבלנדר) וגם בגמישות הכשרות - הבסיס שלה משמן וממשקה שקדים פרווה באופן טבעי, בניגוד לגרסאות החמאה והשמנת החמוצה - עם הממתיק שהוגדל מעט לכיוון הרמה של Low Carb Spark למאפין מתוק כמו שצריך.","name":"Double Chocolate Muffins","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":9,"prepTimeMin":10,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"3","item":"large eggs"},{"amount":"1/2 cup / 120 ml","item":"unsweetened almond milk","israelNote":"mashkeh shkedim lo mumtak (Alpro/Blue Diamond)"},{"amount":"1 cup / 100 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 28 g","item":"coconut flour"},{"amount":"1/4 cup / 25 g","item":"unsweetened cocoa powder"},{"amount":"1/3 cup / 65 g","item":"granulated erythritol-monk fruit blend"},{"amount":"1/4 cup / 60 ml","item":"avocado oil or light olive oil"},{"amount":"2 tsp","item":"baking powder"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1/3 cup / 60 g","item":"sugar-free or 85% dark chocolate chips","israelNote":"chopped 85% dark chocolate works; check pareve label"}],"instructions":["Heat the oven to 165°C / 325°F and line 9 muffin cups with paper liners.","Blend the eggs, almond milk, and vanilla in a blender (or whisk well by hand) until frothy.","Add the almond flour, coconut flour, cocoa, sweetener, baking powder, and salt; blend until smooth.","Add the oil and blend just until combined.","Stir in most of the chocolate chips by hand.","Divide the batter among the cups, top with the remaining chips, and bake 22-25 minutes until the tops are set and firm to the touch.","Cool in the pan 10 minutes - the crumb finishes setting as they cool."],"nutrition":{"calories":204,"fatG":17.2,"satFatG":3.9,"proteinG":6.3,"carbsG":9.3,"fiberG":4.5,"netCarbsG":4.8,"sugarG":0.9,"sodiumMg":190},"ketoVariant":"Add 1/2 tsp instant espresso powder to the dry ingredients - no coffee taste, just deeper chocolate.","tips":"Liquid oil (not coconut oil) keeps the blender batter pourable; paper liners are essential because cocoa batters stick.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/low-carb-double-chocolate-blender-muffins/"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-double-chocolate-muffins/"},{"creator":"Gnom-Gnom","url":"https://www.gnom-gnom.com/paleo-keto-double-chocolate-muffins/"}],"comparedVersions":"Compared All Day I Dream About Food\u0027s blender muffins, Low Carb Spark\u0027s butter-based version, and Gnom-Gnom\u0027s. ADIDAF won on both simplicity (everything in a blender) and kosher flexibility - her oil-and-almond-milk base is naturally pareve, unlike the butter/sour-cream versions - with the sweetener nudged up slightly toward Low Carb Spark\u0027s level for a properly sweet muffin."},{"id":"carrot-cake-cream-cheese-frosting","nameHe":"עוגת גזר עם קרם גבינת שמנת","ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים טחון דק"},{"amount":"1/2 כוס / 115 גרם","item":"חמאה מומסת"},{"amount":"2/3 כוס / 130 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO"},{"amount":"3 גדולות","item":"ביצים"},{"amount":"2 כפיות","item":"קינמון טחון"},{"amount":"1 1/2 כפיות","item":"אבקת אפייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"1 1/2 כוסות / 150 גרם","item":"גזר מגורר דק, ארוז ברפיון"},{"amount":"1/2 כוס / 55 גרם","item":"אגוזי מלך או פקאן קצוצים"},{"amount":"200 גרם","item":"גבינת שמנת רכה (לציפוי)","israelNote":"למשל נפוליאון או סקי"},{"amount":"3 כפות / 45 גרם","item":"חמאה רכה (לציפוי)"},{"amount":"1/2 כוס / 60 גרם","item":"ממתיק אריתריטול אבקה + 1 כפית תמצית וניל (לציפוי)","israelNote":"אם אין אבקה, טוחנים ממתיק מגורען במטחנת תבלינים"}],"instructionsHe":["מחממים תנור ל-175 מעלות. משמנים תבנית עגולה בקוטר 23 ס״מ ומרפדים את התחתית בנייר אפייה.","טורפים את החמאה המומסת, הממתיק והביצים עד לתערובת חלקה.","מוסיפים את קמח השקדים, הקינמון, אבקת האפייה והמלח ומערבבים.","מקפלים פנימה את הגזר המגורר והאגוזים; הבלילה תהיה סמיכה.","משטחים בתבנית ואופים 30-38 דקות, עד להזהבה ועד שקיסם יוצא נקי. מצננים לגמרי.","לציפוי: מקציפים את גבינת השמנת, החמאה, ממתיק האבקה והווניל עד לקבלת קרם אוורירי.","מורחים את הקרם על העוגה שהצטננה לגמרי וחותכים ל-12 מנות. שומרים במקרר."],"ketoVariantHe":"מוותרים על הציפוי ומפזרים ממתיק אבקה מעורבב בקינמון - חוסך כ-90 קלוריות והופך את בסיס העוגה לפרווה (מחליפים את החמאה בבלילה בשמן קוקוס).","tipsHe":"מגררים את הגזר דק בצד הקטן של הפומפייה - גירוד גס שוקע ויוצר כיסים רטובים. גזר בכמות הזו בסדר גמור בקיטו.","comparedVersionsHe":"הושוו עוגת שתי השכבות של Wholesome Yum, עוגת השכבה האחת של The Big Man\u0027s World ו-Joy Filled Eats. היחסים הבדוקים של Wholesome Yum הוקטנו לשכבה אחת לפשטות; הניסויים של The Big Man\u0027s World אישרו שקמח שקדים בלבד (בלי קמח קוקוס) מונע פירור דחוס.","name":"Carrot Cake with Cream Cheese Frosting","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":25,"cookTimeMin":35,"difficulty":"medium","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1/2 cup / 115 g","item":"butter, melted"},{"amount":"2/3 cup / 130 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products"},{"amount":"3 large","item":"eggs"},{"amount":"2 tsp","item":"ground cinnamon"},{"amount":"1 1/2 tsp","item":"baking powder"},{"amount":"1/4 tsp","item":"salt"},{"amount":"1 1/2 cups / 150 g","item":"finely grated carrots, loosely packed"},{"amount":"1/2 cup / 55 g","item":"chopped walnuts or pecans"},{"amount":"200 g","item":"cream cheese, softened (for frosting)","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"3 tbsp / 45 g","item":"butter, softened (for frosting)"},{"amount":"1/2 cup / 60 g","item":"powdered erythritol sweetener plus 1 tsp vanilla (for frosting)","israelNote":"grind granulated erythritol blend in a spice grinder if powdered is unavailable"}],"instructions":["Heat the oven to 175C (350F). Grease a 23 cm (9 inch) round pan and line the bottom with parchment.","Whisk the melted butter, sweetener, and eggs until smooth.","Stir in the almond flour, cinnamon, baking powder, and salt.","Fold in the grated carrots and nuts; the batter will be thick.","Spread in the pan and bake 30-38 minutes, until golden and a toothpick comes out clean. Cool completely.","For the frosting, beat the cream cheese, butter, powdered sweetener, and vanilla until fluffy.","Spread the frosting over the fully cooled cake and cut into 12 slices. Store in the fridge."],"nutrition":{"calories":315,"fatG":29.0,"satFatG":11.0,"proteinG":7.0,"carbsG":8.0,"fiberG":3.0,"netCarbsG":5.0,"sugarG":3.0,"sodiumMg":220},"ketoVariant":"Skip the frosting and dust with cinnamon-spiked powdered sweetener to cut about 90 calories and make the cake base pareve (swap butter for coconut oil in the batter).","tips":"Grate the carrots finely on the small holes - big shreds sink and make wet pockets. Carrots are fine on keto in this quantity.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/low-carb-keto-sugar-free-carrot-cake-recipe/"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/healthy-flourless-carrot-breakfast-cake/"},{"creator":"Joy Filled Eats","url":"https://joyfilledeats.com/almond-flour-carrot-cake/"}],"comparedVersions":"Compared Wholesome Yum\u0027s two-layer cake, The Big Man\u0027s World\u0027s one-layer cake, and Joy Filled Eats. Scaled Wholesome Yum\u0027s well-tested ratios down to a single layer for simplicity; The Big Man\u0027s World\u0027s testing confirmed almond-flour-only (no coconut flour) avoids a dense crumb."},{"id":"keto-creme-brulee","name":"Crème Brûlée","nameHe":"קרם ברולה","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":40,"difficulty":"medium","ingredients":[{"amount":"4","item":"large egg yolks"},{"amount":"3 tbsp / 25 g","item":"powdered erythritol-monk fruit sweetener"},{"amount":"1 cup / 240 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1 tsp / 5 ml","item":"vanilla extract, or seeds of 1/2 vanilla pod"},{"amount":"1 pinch","item":"fine salt"},{"amount":"4 tsp / 16 g","item":"granulated allulose or erythritol, for the topping","israelNote":"allulose caramelizes best but is hard to find in Israel; erythritol melts under the torch and hardens into a crackable crust"}],"ingredientsHe":[{"amount":"4","item":"חלמונים מביצים גדולות"},{"amount":"3 כפות / 25 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון"},{"amount":"1 כוס / 240 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1 כפית / 5 מ\"ל","item":"תמצית וניל, או גרגירים מ-1/2 מקל וניל"},{"amount":"קורט","item":"מלח דק"},{"amount":"4 כפיות / 16 גרם","item":"אלולוז או אריתריטול גרגירי, לציפוי","israelNote":"אלולוז מתקרמל הכי טוב אבל קשה להשגה בישראל; אריתריטול נמס תחת הברנר ומתקשה לקרום פריך"}],"instructions":["Heat the oven to 150°C / 300°F and put the kettle on for the water bath.","Whisk the yolks with the powdered sweetener and salt until pale.","Warm the cream until steaming (not boiling) and pour it into the yolks in a thin stream, whisking constantly. Stir in the vanilla.","Divide between 4 shallow ramekins set in a baking dish. Pour hot water into the dish to reach halfway up the ramekins.","Bake 35–40 minutes, until the custards are set at the edges but still tremble slightly in the center.","Cool to room temperature, then chill at least 3 hours or overnight.","Just before serving, sprinkle each custard with 1 tsp granulated sweetener and caramelize with a kitchen torch until deep golden (or 1–2 minutes under a very hot broiler, watching closely). Let the crust harden 1 minute, then serve."],"instructionsHe":["מחממים תנור ל-150 מעלות ומרתיחים מים בקומקום לאמבט המים.","טורפים את החלמונים עם הממתיק הטחון והמלח עד שהתערובת מחווירה.","מחממים את השמנת עד שעולים אדים (לא מרתיחים) ויוצקים אותה לחלמונים בזרם דק תוך טריפה מתמדת. מערבבים פנימה את הווניל.","מחלקים בין 4 רמקינים שטוחים המונחים בתבנית אפייה. יוצקים מים חמים לתבנית עד מחצית גובה הרמקינים.","אופים 35–40 דקות, עד שהקרם יציב בשוליים אך עדיין רוטט מעט במרכז.","מצננים לטמפרטורת החדר, ואז מקררים לפחות 3 שעות או לילה שלם.","ממש לפני ההגשה מפזרים על כל קרם כפית ממתיק גרגירי ומקרמלים בברנר מטבח עד לזהוב עמוק (או 1–2 דקות מתחת לגריל לוהט בתנור, בהשגחה צמודה). נותנים לקרום להתקשות דקה אחת, ומגישים."],"nutrition":{"calories":260,"fatG":26.5,"satFatG":15,"proteinG":3.2,"carbsG":2.2,"fiberG":0,"netCarbsG":2.2,"sugarG":1.9,"sodiumMg":45},"tips":"The water bath is not optional — it is what keeps the custard silky instead of scrambled. Torch the top only right before serving; a sweetener crust softens in the fridge.","tipsHe":"אמבט המים אינו אופציונלי — הוא מה ששומר על קרם משיי במקום ביצים מקושקשות. מקרמלים את הציפוי רק ממש לפני ההגשה; קרום ממתיק מתרכך במקרר.","sources":[{"creator":"Joy Filled Eats","url":"https://joyfilledeats.com/keto-creme-brulee/"},{"creator":"Stem and Spoon","url":"https://stemandspoon.com/keto-creme-brulee/"},{"creator":"My Sweet Keto","url":"https://www.mysweetketo.com/ultimate-keto-creme-brulee/"}],"comparedVersions":"Compared Joy Filled Eats, Stem and Spoon and My Sweet Keto — the yolk-to-cream ratio (1 yolk per 1/4 cup cream) and 300°F water bath were consistent across all three, so I scaled that to 4 servings. Joy Filled Eats\u0027 finding that allulose browns best informed the topping note, with erythritol as the practical Israeli fallback.","comparedVersionsHe":"השוויתי בין Joy Filled Eats, Stem and Spoon ו-My Sweet Keto — יחס החלמונים לשמנת (חלמון לכל 1/4 כוס שמנת) ואמבט המים ב-150 מעלות היו עקביים בשלושתם, אז התאמתי את זה ל-4 מנות. הממצא של Joy Filled Eats שאלולוז משחים הכי טוב עיצב את הערת הציפוי, עם אריתריטול כחלופה המעשית בישראל."},{"id":"vanilla-panna-cotta-agar","name":"Vanilla Panna Cotta (Agar-Agar)","nameHe":"פנקוטה וניל (על בסיס אגר-אגר)","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":10,"difficulty":"easy","ingredients":[{"amount":"1 cup / 240 ml","item":"unsweetened almond milk"},{"amount":"1 tsp / 2 g","item":"agar-agar powder","israelNote":"agar-agar: health-food stores"},{"amount":"1 1/2 cups / 360 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1/3 cup / 43 g","item":"powdered erythritol-monk fruit sweetener"},{"amount":"2 tsp / 10 ml","item":"vanilla extract, or seeds of 1/2 vanilla pod"}],"ingredientsHe":[{"amount":"1 כוס / 240 מ\"ל","item":"משקה שקדים ללא סוכר"},{"amount":"1 כפית / 2 גרם","item":"אבקת אגר-אגר","israelNote":"אגר-אגר: חנויות טבע"},{"amount":"1 1/2 כוסות / 360 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1/3 כוס / 43 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון"},{"amount":"2 כפיות / 10 מ\"ל","item":"תמצית וניל, או גרגירים מ-1/2 מקל וניל"}],"instructions":["Whisk the agar powder into the cold almond milk in a saucepan and let it sit 5 minutes.","Bring to a boil, then simmer 2–3 minutes, whisking constantly — unlike gelatin, agar must actually boil to activate, or the panna cotta will not set.","Lower the heat, whisk in the cream and sweetener, and warm gently 1–2 minutes until the sweetener dissolves. Do not boil the cream.","Off the heat, stir in the vanilla.","Pour into 4 ramekins or glasses, cool 15 minutes on the counter, then refrigerate at least 2 hours — agar sets faster and firmer than gelatin.","Serve in the glass, or dip ramekins briefly in hot water and invert onto plates."],"instructionsHe":["מערבבים בעזרת מטרפה את אבקת האגר לתוך משקה השקדים הקר בסיר ומניחים ל-5 דקות.","מביאים לרתיחה, ואז מבשלים ברתיחה עדינה 2–3 דקות תוך טריפה מתמדת — בניגוד לג\u0027לטין, אגר חייב ממש לרתוח כדי להיות פעיל, אחרת הפנקוטה לא תתייצב.","מנמיכים את האש, טורפים פנימה את השמנת והממתיק, ומחממים בעדינות 1–2 דקות עד שהממתיק נמס. לא מרתיחים את השמנת.","מחוץ לאש מערבבים פנימה את הווניל.","יוצקים ל-4 רמקינים או כוסות, מצננים 15 דקות על השיש ואז מקררים לפחות שעתיים — אגר מתייצב מהר ומוצק יותר מג\u0027לטין.","מגישים בכוס, או טובלים את הרמקינים לרגע במים חמים והופכים על צלחות."],"nutrition":{"calories":320,"fatG":33.7,"satFatG":21,"proteinG":2.6,"carbsG":2.7,"fiberG":0.2,"netCarbsG":2.5,"sugarG":2.4,"sodiumMg":75},"tips":"Agar gives a slightly firmer set than gelatin; if you prefer a softer wobble, use a scant 3/4 tsp. Kosher gelatin (fish or bovine with hechsher) can replace it: use 2 tsp, bloomed in the cold almond milk and dissolved with gentle heat only.","tipsHe":"אגר נותן מרקם מעט מוצק יותר מג\u0027לטין; אם מעדיפים ריטוט רך יותר, משתמשים ב-3/4 כפית גדושה פחות. אפשר להחליף בג\u0027לטין כשר (מדגים או בקר עם הכשר): 2 כפיות, מושרות במשקה השקדים הקר וממיסים בחימום עדין בלבד.","lowCarbVariant":"Top with 2 tbsp warmed raspberries lightly mashed with sweetener as a quick coulis (about +2 g net carbs).","lowCarbVariantHe":"מעטרים ב-2 כפות פטל מחומם ומעוך קלות עם ממתיק כקולי מהיר (תוספת של כ-2 גרם פחמימות נטו).","sources":[{"creator":"Diet Doctor","url":"https://www.dietdoctor.com/recipes/keto-vanilla-pannacotta"},{"creator":"Sugar-Free Mom (Brenda Bennett)","url":"https://www.sugarfreemom.com/recipes/keto-panna-cotta/"},{"creator":"My Keto Kitchen","url":"https://www.myketokitchen.com/keto-recipes/keto-vanilla-panna-cotta/"}],"comparedVersions":"Compared Diet Doctor, Sugar-Free Mom and My Keto Kitchen — all gelatin-based with a cream + almond-milk base to keep carbs down. I kept that base and their cream-to-milk ratio but converted the set to agar-agar for kosher preference, using the standard 1 tsp agar per ~600 ml liquid with a true boil to activate.","comparedVersionsHe":"השוויתי בין Diet Doctor, Sugar-Free Mom ו-My Keto Kitchen — כולם על בסיס ג\u0027לטין עם שמנת ומשקה שקדים לצמצום הפחמימות. שמרתי על הבסיס ועל יחס השמנת-חלב שלהם, אבל המרתי את ההקרשה לאגר-אגר מטעמי כשרות, לפי היחס המקובל של כפית אגר לכ-600 מ\"ל נוזל, עם רתיחה אמיתית להפעלה."},{"id":"no-churn-chocolate-ice-cream","name":"Chocolate Ice Cream (No-Churn)","nameHe":"גלידת שוקולד ללא מכונת גלידה","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":8,"prepTimeMin":20,"cookTimeMin":5,"difficulty":"easy","ingredients":[{"amount":"1 cup / 240 ml","item":"unsweetened almond milk"},{"amount":"1/2 cup / 43 g","item":"unsweetened cocoa powder"},{"amount":"60 g / 2 oz","item":"dark chocolate 85%, chopped","israelNote":"dairy or pareve dark chocolate both fine in this dairy dessert"},{"amount":"2/3 cup / 85 g","item":"powdered erythritol-monk fruit sweetener (blitz granular in a blender)"},{"amount":"2 cups / 480 ml","item":"cold heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1 tsp / 5 ml","item":"vanilla extract"},{"amount":"1/4 tsp","item":"fine salt"},{"amount":"1 tbsp / 15 ml","item":"vodka (optional, keeps it scoopable)"}],"ingredientsHe":[{"amount":"1 כוס / 240 מ\"ל","item":"משקה שקדים ללא סוכר"},{"amount":"1/2 כוס / 43 גרם","item":"אבקת קקאו ללא סוכר"},{"amount":"60 גרם","item":"שוקולד מריר 85%, קצוץ","israelNote":"שוקולד מריר חלבי או פרווה — שניהם מתאימים בקינוח חלבי זה"},{"amount":"2/3 כוס / 85 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון (טוחנים גרגירי בבלנדר)"},{"amount":"2 כוסות / 480 מ\"ל","item":"שמנת מתוקה 38% קרה"},{"amount":"1 כפית / 5 מ\"ל","item":"תמצית וניל"},{"amount":"1/4 כפית","item":"מלח דק"},{"amount":"1 כף / 15 מ\"ל","item":"וודקה (לא חובה, שומרת על מרקם רך)"}],"instructions":["Warm the almond milk in a small saucepan until steaming, then whisk in the cocoa, chopped chocolate, sweetener and salt until glossy and completely smooth. Cool to room temperature and stir in the vanilla and vodka if using.","Whip the cold cream to soft peaks — soft, not stiff, so it folds without turning grainy.","Fold a third of the whipped cream into the chocolate mixture to loosen it, then fold that back into the remaining cream until no streaks remain.","Scrape into a loaf pan, press baking paper onto the surface, and freeze 4–6 hours.","For the smoothest texture, stir once or twice during the first 2 hours of freezing. Soften 10 minutes before scooping if frozen overnight."],"instructionsHe":["מחממים את משקה השקדים בסיר קטן עד שעולים אדים, ואז טורפים פנימה את הקקאו, השוקולד הקצוץ, הממתיק והמלח עד לתערובת מבריקה וחלקה לגמרי. מצננים לטמפרטורת החדר ומערבבים פנימה את הווניל והוודקה אם משתמשים.","מקציפים את השמנת הקרה לקצפת רכה — רכה, לא יציבה, כדי שתתקפל בלי להפוך לגרגירית.","מקפלים שליש מהקצפת לתוך תערובת השוקולד כדי לרכך אותה, ואז מקפלים את התערובת חזרה לתוך שארית הקצפת עד שלא נותרים פסים.","מעבירים לתבנית אינגליש קייק, מצמידים נייר אפייה לפני השטח ומקפיאים 4–6 שעות.","למרקם הכי חלק, מערבבים פעם או פעמיים בשעתיים הראשונות של ההקפאה. אם הגלידה קפאה לילה שלם, מרככים 10 דקות לפני הגריפה."],"nutrition":{"calories":267,"fatG":26.6,"satFatG":16.5,"proteinG":2.5,"carbsG":5.3,"fiberG":2.7,"netCarbsG":2.6,"sugarG":1.9,"sodiumMg":90},"tips":"Real melted chocolate plus cocoa gives a deeper flavor than cocoa alone and improves the texture — the cocoa butter keeps it from freezing rock hard.","tipsHe":"שוקולד מומס אמיתי בנוסף לקקאו נותן טעם עמוק יותר מקקאו לבדו ומשפר את המרקם — חמאת הקקאו מונעת מהגלידה לקפוא לאבן.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/low-carb-keto-chocolate-ice-cream/"},{"creator":"I Breathe I\u0027m Hungry (Mellissa Sevigny)","url":"https://www.ibreatheimhungry.com/no-churn-keto-chocolate-ice-cream/"},{"creator":"gnom-gnom (Paola van der Hulst)","url":"https://www.gnom-gnom.com/no-churn-keto-chocolate-ice-cream/"}],"comparedVersions":"Compared IBIH\u0027s egg-white mousse method, gnom-gnom\u0027s cooked custard and Sugar Free Londoner\u0027s cream-based version. Chose an egg-free fold of chocolate paste into softly whipped cream: nearly as airy as the mousse method but with no raw eggs and half the steps, keeping IBIH\u0027s chocolate-plus-cocoa-butter idea via 85% chocolate.","comparedVersionsHe":"השוויתי בין שיטת מוס חלבוני הביצה של IBIH, הקסטרד המבושל של gnom-gnom והגרסה על בסיס שמנת של Sugar Free Londoner. בחרתי בקיפול ללא ביצים של משחת שוקולד לתוך קצפת רכה: אוורירי כמעט כמו שיטת המוס אבל בלי ביצים חיות ובחצי מהשלבים, תוך שמירה על רעיון השוקולד-וחמאת-הקקאו של IBIH באמצעות שוקולד 85%."},{"id":"keto-malabi","name":"Keto Malabi (Rose Water Milk Pudding)","nameHe":"מלבי קיטו (עם מי ורדים)","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":10,"difficulty":"easy","ingredients":[{"amount":"1 cup / 240 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"2 cups / 480 ml","item":"unsweetened almond milk"},{"amount":"3 tbsp / 25 g","item":"powdered erythritol-monk fruit sweetener"},{"amount":"1 1/2 tsp / 4.5 g","item":"glucomannan (konjac) powder","israelNote":"avkat konjac/glucomannan: health-food stores or iHerb; agar-agar works too (see tips)"},{"amount":"1 1/2 tbsp / 22 ml","item":"rose water","israelNote":"mei vradim"},{"amount":"2 tbsp / 16 g","item":"chopped pistachios, for topping"},{"amount":"1/4 cup / 30 g","item":"raspberries, lightly mashed with 1 tsp sweetener, for topping (optional)"}],"ingredientsHe":[{"amount":"1 כוס / 240 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"2 כוסות / 480 מ\"ל","item":"משקה שקדים ללא סוכר"},{"amount":"3 כפות / 25 גרם","item":"ממתיק אריתריטול-פרי הנזירים טחון"},{"amount":"1 1/2 כפיות / 4.5 גרם","item":"אבקת גלוקומנן (קונג\u0027אק)","israelNote":"אבקת קונג\u0027אק/גלוקומנן: חנויות טבע או iHerb; גם אגר-אגר עובד (ראו טיפים)"},{"amount":"1 1/2 כפות / 22 מ\"ל","item":"מי ורדים"},{"amount":"2 כפות / 16 גרם","item":"פיסטוקים קצוצים, לקישוט"},{"amount":"1/4 כוס / 30 גרם","item":"פטל, מעוך קלות עם כפית ממתיק, לקישוט (לא חובה)"}],"instructions":["Whisk the glucomannan thoroughly into the powdered sweetener in a small bowl — pre-mixing prevents lumps, since glucomannan clumps instantly in liquid.","Heat the cream, almond milk and rose water in a saucepan over medium heat until steaming.","Rain in the sweetener mixture while whisking constantly, and keep whisking at a bare simmer 3–5 minutes until the mixture is glossy and coats a spoon.","Pour into 4 small bowls or glasses and chill at least 2 hours — it sets to the soft, wobbly texture between pudding and jelly that malabi is known for.","Top with chopped pistachios, and the mashed sweetened raspberries standing in for the traditional red syrup."],"instructionsHe":["מערבבים היטב את הגלוקומנן לתוך הממתיק הטחון בקערה קטנה — הערבוב המוקדם מונע גושים, כי גלוקומנן מתגבש מיד בנוזל.","מחממים את השמנת, משקה השקדים ומי הוורדים בסיר על אש בינונית עד שעולים אדים.","מוסיפים את תערובת הממתיק בזרם דק תוך טריפה מתמדת, וממשיכים לטרוף ברתיחה עדינה מאוד 3–5 דקות עד שהתערובת מבריקה ומצפה כף.","יוצקים ל-4 קעריות או כוסות קטנות ומקררים לפחות שעתיים — המלבי מתייצב למרקם הרך והרוטט שבין פודינג לג\u0027לי, שמאפיין אותו.","מעטרים בפיסטוקים קצוצים ובפטל המעוך והממותק, שמחליף את הסירופ האדום המסורתי."],"nutrition":{"calories":250,"fatG":25.3,"satFatG":14,"proteinG":2.5,"carbsG":4.5,"fiberG":1.8,"netCarbsG":2.7,"sugarG":1.6,"sodiumMg":80},"lowCarbVariant":"Use 1 cup whole milk in place of 1 cup of the almond milk for a more traditional milky flavor (about +3 g net carbs per serving).","lowCarbVariantHe":"מחליפים כוס אחת ממשקה השקדים בכוס חלב מלא לטעם חלבי מסורתי יותר (תוספת של כ-3 גרם פחמימות נטו למנה).","tips":"No glucomannan? Use 3/4 tsp agar-agar powder instead: boil it 2 minutes in the almond milk before adding cream — the set will be firmer, closer to panna cotta. Add rose water off the heat if you want a stronger floral note.","tipsHe":"אין גלוקומנן? משתמשים במקום ב-3/4 כפית אבקת אגר-אגר: מרתיחים אותה 2 דקות במשקה השקדים לפני הוספת השמנת — ההקרשה תהיה מוצקה יותר, קרובה לפנקוטה. מוסיפים את מי הוורדים מחוץ לאש אם רוצים ניחוח פרחוני חזק יותר.","sources":[{"creator":"Tonya Cooks","url":"https://tonyacooks.com/low-carb-malabi/"},{"creator":"May I Have That Recipe","url":"https://mayihavethatrecipe.com/malabi-recipe/"},{"creator":"Queen Keto","url":"https://queenketo.com/sugar-free-rosewater-vanilla-panna-cotta/"}],"comparedVersions":"Compared Tonya Cooks\u0027 konjac-thickened low-carb malabi, a traditional cornstarch version (May I Have That Recipe) for reference texture, and Queen Keto\u0027s rosewater panna cotta. Kept Tonya\u0027s konjac technique but swapped her all-whole-milk base (about 6 g carbs per serving from lactose) for cream + almond milk, and added the classic pistachio-and-red-fruit topping.","comparedVersionsHe":"השוויתי בין המלבי דל הפחמימות מסמיך הקונג\u0027אק של Tonya Cooks, גרסה מסורתית עם קורנפלור (May I Have That Recipe) כייחוס למרקם, ופנקוטת מי הוורדים של Queen Keto. שמרתי על טכניקת הקונג\u0027אק של טוניה אבל החלפתי את בסיס החלב המלא שלה (כ-6 גרם פחמימות למנה מלקטוז) בשמנת + משקה שקדים, והוספתי את הציפוי הקלאסי של פיסטוקים ופרי אדום."},{"id":"keto-cheesecake-brownies","name":"Cheesecake Brownies","nameHe":"בראוניז עוגת גבינה","category":"desserts-dairy","kosherType":"dairy","dietTags":"keto","servings":16,"prepTimeMin":15,"cookTimeMin":30,"difficulty":"medium","ingredients":[{"amount":"1/2 cup / 113 g","item":"butter"},{"amount":"3 oz / 85 g","item":"sug
