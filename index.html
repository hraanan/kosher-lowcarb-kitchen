ad.","tips":"Do not discard the leftover oil - it becomes za\u0027atar-infused and is excellent over salads or eggs.","sources":[{"creator":"At the Immigrant\u0027s Table","url":"https://immigrantstable.com/homemade-labaneh-balls/"},{"creator":"Simply Lebanese","url":"https://www.simplyleb.com/recipe/labneh-balls/"},{"creator":"May I Have That Recipe","url":"https://mayihavethatrecipe.com/labneh-balls-recipe/"}],"comparedVersions":"Compared from-scratch versions (straining yogurt 24-48 hours) with coating options of herbs, sumac, pistachios and za\u0027atar. For Israel the winning simplification is starting from store-bought labaneh - identical result, zero waiting - with the za\u0027atar coating that all three creators feature.","nameHe":"כדורי לאבנה בשמן זית וזעתר","ingredientsHe":[{"amount":"500 גרם","item":"לאבנה סמיכה (או מסננים 1 ק\"ג יוגורט שמן עם כפית מלח במשך 24-48 שעות)","israelNote":"זמינה מוכנה בכל סופר; קונים את הסמיכה ביותר"},{"amount":"2 כפות / 15 גרם","item":"זעתר"},{"amount":"כ-1 כוס / 240 מ\"ל","item":"שמן זית כתית מעולה (לכיסוי)"},{"amount":"1/4 כפית","item":"פתיתי צ\u0027ילי (לא חובה)"},{"amount":"1 כפית","item":"סומק (לא חובה)"}],"instructionsHe":["אם הלאבנה רכה, מסננים אותה כמה שעות במקרר במסננת מרופדת בבד גבינה עד שהיא שומרת על צורתה; לאבנה קנויה וסמיכה אפשר לקחת כמו שהיא.","בידיים משומנות קלות, מגלגלים מהלאבנה 12 כדורים בגודל אגוז מלך ומניחים על צלחת מרופדת בנייר אפייה.","מצננים את הכדורים 30 דקות במקרר כדי שיתייצבו.","מפזרים את הזעתר על צלחת קטנה ומגלגלים בו כל כדור לציפוי.","מניחים את הכדורים בצנצנת נקייה, מוסיפים את פתיתי הצ\u0027ילי והסומק אם רוצים, ומוזגים שמן זית עד כיסוי מלא.","ממתינים לפחות כמה שעות לפני ההגשה. נשמר כחודש במקרר; מוציאים לטמפרטורת החדר לפני ההגשה כדי שהשמן יחזור לנוזלי."],"ketoVariantHe":"כבר קיטו; מגישים עם רצועות מלפפון במקום לחם.","tipsHe":"לא לזרוק את השמן שנשאר - הוא הופך לשמן זעתר משובח, מצוין לסלטים או לביצים.","comparedVersionsHe":"השווינו הכנה ביתית מאפס (סינון יוגורט 24-48 שעות) עם אפשרויות ציפוי של עשבי תיבול, סומק, פיסטוקים וזעתר. בישראל הפישוט המנצח הוא להתחיל מלאבנה קנויה - תוצאה זהה, אפס המתנה - עם ציפוי הזעתר שמופיע אצל כל שלושת היוצרים."},{"id":"baked-zucchini-chips","name":"Crispy Parmesan Zucchini Chips","nameHe":"צ\u0027יפס קישואים פריך עם פרמזן","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":2,"prepTimeMin":25,"cookTimeMin":30,"difficulty":"medium","ingredients":[{"amount":"2 medium / 350 g","item":"zucchini, firm","israelNote":"kishu\u0027im — the light-green Israeli variety works well"},{"amount":"1 tsp / 5 ml","item":"olive oil, or olive oil spray"},{"amount":"1/2 tsp","item":"fine salt"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/4 tsp","item":"black pepper"},{"amount":"1/4 cup / 25 g","item":"finely grated parmesan","israelNote":"parmesan or kashkaval"}],"ingredientsHe":[{"amount":"2 בינוניים / 350 גרם","item":"קישואים מוצקים","israelNote":"הזן הישראלי הבהיר עובד מצוין"},{"amount":"1 כפית / 5 מ\"ל","item":"שמן זית, או ספריי שמן זית"},{"amount":"1/2 כפית","item":"מלח דק"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/4 כפית","item":"פלפל שחור"},{"amount":"1/4 כוס / 25 גרם","item":"פרמזן מגורר דק","israelNote":"אפשר גם קשקבל"}],"instructions":["Slice the zucchini into thin, even rounds about 3 mm thick — a mandoline gives the most even chips.","Lay the slices on paper towels, sprinkle lightly with half the salt, and let sit 20 minutes; blot the released moisture very well.","Heat the oven to 220°C / 425°F and line two trays with baking paper.","Toss the dried slices with the oil, remaining salt, garlic powder, and pepper, and arrange in a single layer without overlapping.","Bake 15 minutes, then sprinkle the parmesan over the slices.","Bake another 12–18 minutes until deeply golden and crisp at the edges, removing thinner chips as they finish.","Cool 5 minutes on the tray to crisp up further and serve the same day."],"instructionsHe":["פורסים את הקישואים לעיגולים דקים ואחידים בעובי כ-3 מ\"מ — מנדולינה נותנת את הצ\u0027יפסים הכי אחידים.","מסדרים את הפרוסות על נייר סופג, מפזרים מעט מחצי כמות המלח ומניחים 20 דקות; מנגבים היטב את הנוזלים שיצאו.","מחממים תנור ל-220 מעלות ומרפדים שתי תבניות בנייר אפייה.","מערבבים את הפרוסות המיובשות עם השמן, שארית המלח, אבקת השום והפלפל, ומסדרים בשכבה אחת ללא חפיפה.","אופים 15 דקות, ואז מפזרים את הפרמזן על הפרוסות.","אופים עוד 12–18 דקות עד שהצ\u0027יפסים זהובים עמוק ופריכים בקצוות, ומוציאים את הדקים יותר כשהם מוכנים.","מצננים 5 דקות על התבנית לפריכות נוספת ומגישים באותו יום."],"nutrition":{"calories":140,"fatG":9.5,"satFatG":3,"proteinG":7,"carbsG":6.5,"fiberG":2,"netCarbsG":4.5,"sugarG":4,"sodiumMg":500},"ketoVariant":"Skip the parmesan and dust with smoked paprika for a pareve, dairy-free chip (nutrition drops by roughly 40 calories and 4 g protein per serving).","ketoVariantHe":"מוותרים על הפרמזן ומפזרים פפריקה מעושנת לצ\u0027יפס פרווה ללא חלב (הערכים יורדים בכ-40 קלוריות ו-4 גרם חלבון למנה).","tips":"Zucchini is 95% water — the salting-and-blotting step is what separates crisp chips from limp ones. Do not stack chips when storing; they soften overnight.","tipsHe":"קישוא הוא 95% מים — שלב ההמלחה והניגוב הוא מה שמבדיל בין צ\u0027יפס פריך לרך. לא מערימים צ\u0027יפסים באחסון; הם מתרככים במהלך הלילה.","sources":[{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/zucchini-chips/"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-zucchini-chips/"},{"creator":"Low Carb No Carb","url":"https://www.lowcarb-nocarb.com/baked-zucchini-chips/"}],"comparedVersions":"Compared a slow 110°C dehydrating bake against a hot 220°C bake; the hot method from Healthy Recipes Blog won for finishing in half an hour with better browning, and its mid-bake parmesan addition keeps the cheese golden rather than burnt. Adopted the pre-salting step that the breading-free versions all use to pull moisture.","comparedVersionsHe":"השווינו אפיית ייבוש איטית ב-110 מעלות מול אפייה חמה ב-220 מעלות; השיטה החמה של Healthy Recipes Blog ניצחה כי היא מסתיימת בחצי שעה עם השחמה טובה יותר, והוספת הפרמזן באמצע האפייה שומרת על הגבינה זהובה ולא שרופה. אימצנו את שלב ההמלחה המקדימה שכל הגרסאות ללא ציפוי משתמשות בו להוצאת הנוזלים."},{"id":"everything-bagel-pepper-poppers","name":"Everything-Bagel Cream Cheese Pepper Poppers","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"8 / 240 g","item":"mini sweet peppers","israelNote":"pilpelonim metukim (sold in bags)"},{"amount":"150 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1/2 cup / 50 g","item":"shredded yellow cheese","israelNote":"gvina tzehuba megureded (Emek/cheddar style)"},{"amount":"2 tsp","item":"everything-bagel seasoning","israelNote":"make your own: equal parts sesame, black sesame, dried garlic granules, dried onion granules + coarse salt"},{"amount":"1 tbsp (optional)","item":"chopped chives or green onion"}],"instructions":["Halve the mini peppers lengthwise through the stem and scrape out the seeds and membranes.","In a bowl, mix the softened cream cheese with the shredded cheese, half the everything seasoning and the chives.","Spoon or pipe the filling into the pepper halves, smoothing the tops.","Sprinkle the remaining seasoning generously over the filling.","Serve chilled, or refrigerate in an airtight container up to 4 days."],"nutrition":{"calories":205,"fatG":17.6,"satFatG":10.0,"proteinG":5.7,"carbsG":6.2,"fiberG":1.4,"netCarbsG":4.8,"sugarG":4.2,"sodiumMg":330},"ketoVariant":"Already keto.","lowCarbVariant":"For a warm version, bake the filled peppers 8-10 minutes at 190°C until the cheese melts (counts as cookTime).","tips":"Soften the cream cheese fully before mixing or the filling will be lumpy; a small spoon or a zip bag with a corner cut makes filling fast.","sources":[{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/cream-cheese-stuffed-mini-peppers/"},{"creator":"Keto Cooking Christian","url":"https://ketocookingchristian.com/everything-bagel-stuffed-mini-peppers/"},{"creator":"Wellness by Kay","url":"https://wellnessbykay.com/cream-cheese-stuffed-peppers/"}],"comparedVersions":"Compared cold no-bake versions with baked ones and fillings with and without shredded cheese. The no-bake build with a little shredded yellow cheese won for texture and zero cooking; since packaged everything-bagel seasoning is hard to find in Israel, the recipe includes a 30-second DIY blend.","nameHe":"פלפלונים ממולאים בגבינת שמנת בתיבול אבריתינג בייגל","ingredientsHe":[{"amount":"8 / 240 גרם","item":"פלפלונים מתוקים","israelNote":"נמכרים בשקיות"},{"amount":"150 גרם","item":"גבינת שמנת מרוככת","israelNote":"נפוליאון / סקי"},{"amount":"1/2 כוס / 50 גרם","item":"גבינה צהובה מגוררת","israelNote":"עמק / בסגנון צ\u0027דר"},{"amount":"2 כפיות","item":"תערובת תיבול אבריתינג בייגל","israelNote":"מכינים לבד: חלקים שווים שומשום, שומשום שחור, גרגירי שום מיובש וגרגירי בצל מיובש + מלח גס"},{"amount":"1 כף (לא חובה)","item":"עירית או בצל ירוק קצוצים"}],"instructionsHe":["חוצים את הפלפלונים לאורכם דרך הגבעול ומגרדים החוצה את הגרעינים והקרומים.","בקערה, מערבבים את גבינת השמנת המרוככת עם הגבינה המגוררת, מחצית מתערובת התיבול והעירית.","ממלאים את חצאי הפלפלונים בכף או בשקית זילוף ומחליקים את פני המילוי.","מפזרים בנדיבות את שאר התיבול על המילוי.","מגישים צונן, או שומרים במקרר בכלי אטום עד 4 ימים."],"ketoVariantHe":"כבר קיטו.","lowCarbVariantHe":"לגרסה חמה אופים את הפלפלונים הממולאים 8-10 דקות ב-190 מעלות עד שהגבינה נמסה.","tipsHe":"מרככים את גבינת השמנת לגמרי לפני הערבוב, אחרת המילוי יצא גושי; כפית קטנה או שקית עם פינה גזורה הופכות את המילוי למהיר.","comparedVersionsHe":"השווינו גרסאות קרות ללא אפייה מול אפויות, ומילויים עם ובלי גבינה מגוררת. הגרסה ללא אפייה עם מעט גבינה צהובה מגוררת ניצחה במרקם ובאפס בישול; מכיוון שתערובת אבריתינג בייגל קנויה קשה להשגה בישראל, המתכון כולל תערובת ביתית של 30 שניות."},{"id":"guacamole-veggie-sticks","name":"Guacamole with Vegetable Sticks","nameHe":"גוואקמולי עם מקלות ירקות","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"3 ripe / 450 g","item":"avocados","israelNote":"Hass avocados, in season roughly October–May in Israel; Ettinger/Fuerte also work"},{"amount":"1/2 small / 40 g","item":"onion, finely diced","israelNote":"white or purple onion"},{"amount":"1 medium / 80 g","item":"tomato, deseeded and diced"},{"amount":"2 tbsp","item":"chopped fresh cilantro","israelNote":"kusbara"},{"amount":"1","item":"small hot green pepper, deseeded and minced (optional)","israelNote":"pilpel harif yarok; jalapeño if available"},{"amount":"1 clove","item":"garlic, minced"},{"amount":"1 / 2 tbsp juice","item":"lime, juiced","israelNote":"lime or fresh lemon"},{"amount":"1/2 tsp","item":"fine salt"},{"amount":"2 cucumbers + 1 red bell pepper","item":"cut into sticks, for dipping","israelNote":"melafefonim and gamba"}],"ingredientsHe":[{"amount":"3 בשלים / 450 גרם","item":"אבוקדו","israelNote":"זן האס, בעונה בישראל בערך מאוקטובר עד מאי; אטינגר/פוארטה עובדים גם"},{"amount":"1/2 קטן / 40 גרם","item":"בצל, קצוץ דק","israelNote":"בצל לבן או סגול"},{"amount":"1 בינונית / 80 גרם","item":"עגבנייה, מרוקנת מגרעינים וקצוצה"},{"amount":"2 כפות","item":"כוסברה טרייה קצוצה"},{"amount":"1","item":"פלפל חריף ירוק קטן, מנוקה מגרעינים וקצוץ דק (לא חובה)","israelNote":"או חלפיניו אם משיגים"},{"amount":"1 שן","item":"שום, קצוצה"},{"amount":"1 / 2 כפות מיץ","item":"ליים, סחוט","israelNote":"ליים או לימון טרי"},{"amount":"1/2 כפית","item":"מלח דק"},{"amount":"2 מלפפונים + 1 פלפל אדום (גמבה)","item":"חתוכים למקלות, לטבילה"}],"instructions":["Halve the avocados, remove the pits, and scoop the flesh into a bowl.","Add the lime juice and salt and mash with a fork, leaving the texture slightly chunky.","Fold in the onion, tomato, cilantro, hot pepper, and garlic.","Taste and adjust the salt and lime.","Cut the cucumbers and bell pepper into sticks and serve alongside for dipping.","If making ahead, press plastic wrap directly onto the surface to slow browning; best within a few hours."],"instructionsHe":["חוצים את האבוקדו, מוציאים את הגלעינים ומגרדים את הבשר לקערה.","מוסיפים את מיץ הליים והמלח ומועכים במזלג, משאירים מרקם מעט גס.","מקפלים פנימה את הבצל, העגבנייה, הכוסברה, הפלפל החריף והשום.","טועמים ומתקנים מלח וליים.","חותכים את המלפפונים והגמבה למקלות ומגישים לצד הגוואקמולי לטבילה.","אם מכינים מראש, מצמידים ניילון נצמד ישירות לפני השטח כדי להאט השחמה; הכי טוב תוך כמה שעות."],"nutrition":{"calories":200,"fatG":15.9,"satFatG":2.3,"proteinG":3,"carbsG":15.5,"fiberG":8.6,"netCarbsG":6.9,"sugarG":3.5,"sodiumMg":310},"ketoVariant":"Dip with cucumber only and skip the tomato to shave about 2 g net carbs per serving.","ketoVariantHe":"טובלים רק מלפפון ומוותרים על העגבנייה כדי לחסוך כ-2 גרם פחמימות נטו למנה.","tips":"Use avocados that yield slightly to gentle pressure. Bottled lemon/lime juice flattens the flavor — fresh makes the dish.","tipsHe":"בוחרים אבוקדו שנכנע מעט ללחיצה עדינה. מיץ לימון/ליים מבקבוק משטח את הטעם — סחוט טרי עושה את המנה.","sources":[{"creator":"Downshiftology","url":"https://downshiftology.com/recipes/best-ever-guacamole/"},{"creator":"Love and Lemons","url":"https://www.loveandlemons.com/guacamole-recipe/"},{"creator":"Isabel Eats","url":"https://www.isabeleats.com/simple-guacamole-recipe/"}],"comparedVersions":"Compared classic 7-ingredient formulas; all agree on avocado-lime-salt as the base with no dairy fillers. Used Downshiftology\u0027s proportions (3 avocados, half an onion, 1 lime) as the most balanced, mashing lime and salt in first per Love and Lemons so the seasoning distributes evenly, and swapped tortilla chips for vegetable sticks to keep it keto.","comparedVersionsHe":"השווינו נוסחאות קלאסיות של 7 מרכיבים; כולן מסכימות על בסיס של אבוקדו-ליים-מלח בלי תוספות חלביות. השתמשנו בפרופורציות של Downshiftology (3 אבוקדו, חצי בצל, ליים אחד) כמאוזנות ביותר, מועכים קודם עם הליים והמלח לפי Love and Lemons כדי שהתיבול יתפזר אחיד, והחלפנו את צ\u0027יפס הטורטייה במקלות ירקות כדי להישאר בקיטו."},{"id":"cottage-cheese-power-bowl","name":"Savory Cottage Cheese Power Bowl","category":"snacks","kosherType":"dairy","dietTags":"lowcarb","servings":1,"prepTimeMin":8,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 cup / 225 g","item":"cottage cheese 5%","israelNote":"gvinat cottage 5% (Tnuva/Tara)"},{"amount":"1/2 cup / 75 g","item":"cherry tomatoes, halved"},{"amount":"1 small / 100 g","item":"cucumber, diced","israelNote":"melafefon (Israeli cucumber)"},{"amount":"1 tbsp / 15 ml","item":"extra-virgin olive oil"},{"amount":"1 tbsp / 8 g","item":"roasted pumpkin seeds","israelNote":"garinei dla\u0027at"},{"amount":"1 tsp","item":"za\u0027atar or everything-bagel seasoning","israelNote":"za\u0027atar blend"},{"amount":"1 tsp / 5 ml","item":"fresh lemon juice"},{"amount":"to taste","item":"salt and black pepper"}],"instructions":["Spoon the cottage cheese into a shallow bowl and spread it out slightly with the back of the spoon.","Toss the cherry tomatoes and cucumber with the lemon juice, a pinch of salt and pepper.","Pile the vegetables over the cottage cheese.","Drizzle the olive oil over everything, then scatter the pumpkin seeds and za\u0027atar on top. Eat right away while the seeds are crunchy."],"nutrition":{"calories":410,"fatG":29.5,"satFatG":9.0,"proteinG":28.0,"carbsG":13.4,"fiberG":1.9,"netCarbsG":11.5,"sugarG":9.7,"sodiumMg":720},"ketoVariant":"Skip the tomatoes and use 3/4 cup cottage cheese to bring net carbs to about 7 g.","tips":"Works as a light lunch too; add olives or a chopped hard-boiled egg for more staying power.","sources":[{"creator":"Stephanie Kay Nutrition","url":"https://kaynutrition.com/savory-cottage-cheese-bowl/"},{"creator":"Eat the Gains","url":"https://eatthegains.com/cottage-cheese-bowl/"},{"creator":"Skinnytaste","url":"https://www.skinnytaste.com/greek-cottage-cheese-bowl/"}],"comparedVersions":"Compared Greek-style (olives, oregano, vinegar) against simpler tomato-cucumber bowls. Chose the simpler build with olive oil, seeds and za\u0027atar: fewer ingredients, more crunch, and it maps perfectly onto standard Israeli supermarket items.","nameHe":"קערת קוטג\u0027 מלוחה ומזינה","ingredientsHe":[{"amount":"1 כוס / 225 גרם","item":"קוטג\u0027 5%","israelNote":"תנובה / טרה"},{"amount":"1/2 כוס / 75 גרם","item":"עגבניות שרי חצויות"},{"amount":"1 קטן / 100 גרם","item":"מלפפון חתוך לקוביות"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית כתית מעולה"},{"amount":"1 כף / 8 גרם","item":"גרעיני דלעת קלויים"},{"amount":"1 כפית","item":"זעתר או תערובת תיבול אבריתינג בייגל"},{"amount":"1 כפית / 5 מ\"ל","item":"מיץ לימון טרי"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"}],"instructionsHe":["מעבירים את הקוטג\u0027 לקערה רדודה ומשטחים מעט בגב הכף.","מערבבים את עגבניות השרי והמלפפון עם מיץ הלימון, קורט מלח ופלפל.","מניחים את הירקות מעל הקוטג\u0027.","מזלפים את שמן הזית מעל הכול, מפזרים את גרעיני הדלעת והזעתר ואוכלים מיד כשהגרעינים עוד פריכים."],"ketoVariantHe":"מוותרים על העגבניות ומשתמשים ב-3/4 כוס קוטג\u0027 כדי לרדת לכ-7 גרם פחמימות נטו.","tipsHe":"עובד מצוין גם כארוחת צהריים קלה; מוסיפים זיתים או ביצה קשה קצוצה לתחושת שובע ממושכת.","comparedVersionsHe":"השווינו גרסה יוונית (זיתים, אורגנו, חומץ) מול קערות פשוטות של עגבניות ומלפפון. בחרנו בגרסה הפשוטה עם שמן זית, גרעינים וזעתר: פחות מרכיבים, יותר קראנץ\u0027, והכול זמין בכל סופר ישראלי."},{"id":"flaxseed-crackers","name":"Flaxseed Crackers","nameHe":"קרקרים מזרעי פשתן","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":8,"prepTimeMin":10,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"1 cup / 120 g","item":"ground flaxseed (flax meal)","israelNote":"pishtan tachun - supermarket health aisle or health-food stores; grind whole seeds fresh if possible"},{"amount":"0.33 cup / 80 ml","item":"water"},{"amount":"1 tsp","item":"olive oil"},{"amount":"0.75 tsp","item":"salt"},{"amount":"0.5 tsp","item":"black pepper, za\u0027atar, or garlic powder"}],"ingredientsHe":[{"amount":"1 כוס / 120 גרם","item":"פשתן טחון","israelNote":"מדף הבריאות בסופר או חנויות טבע; עדיף לטחון זרעים שלמים טרי"},{"amount":"שליש כוס / 80 מ\"ל","item":"מים"},{"amount":"1 כפית","item":"שמן זית"},{"amount":"3/4 כפית","item":"מלח"},{"amount":"חצי כפית","item":"פלפל שחור, זעתר או אבקת שום"}],"instructions":["Heat the oven to 350°F / 180°C.","Mix everything to a paste, wait 2 minutes for the flax to bind, then gather into a ball.","Roll between two sheets of baking paper into a thin rectangle, about 3 mm - the thinner, the crispier.","Peel off the top paper and pre-cut into ~32 squares (4-5 cm) with a pizza cutter.","Bake 22-25 minutes until the edges brown; watch the last minutes, flax burns fast.","Cool completely on the tray - they crisp as they cool - then snap apart. Serving = 4 crackers."],"instructionsHe":["מחממים תנור ל-180 מעלות.","מערבבים הכול למשחה, ממתינים 2 דקות עד שהפשתן נקשר, ואז מגבשים לכדור.","מרדדים בין שני ניירות אפייה למלבן דק, כ-3 מ\"מ – ככל שדק יותר, פריך יותר.","מסירים את הנייר העליון וחורצים מראש בגלגלת פיצה לכ-32 ריבועים (4-5 ס\"מ).","אופים 22-25 דקות עד שהשוליים משחימים; משגיחים בדקות האחרונות – פשתן נשרף מהר.","מצננים לגמרי על התבנית – הם נעשים פריכים תוך כדי הצינון – ואז שוברים לריבועים. מנה = 4 קרקרים."],"nutrition":{"calories":86,"fatG":6.9,"satFatG":0.6,"proteinG":2.8,"carbsG":4.5,"fiberG":4.2,"netCarbsG":0.3,"sugarG":0.2,"sodiumMg":290},"lowCarbVariant":"Knead in 2 tbsp grated parmesan for cheese crackers (makes them dairy).","lowCarbVariantHe":"לושים פנימה 2 כפות פרמזן מגורר לקרקרים גבינתיים (הופך אותם לחלביים).","tips":"Practically zero net carbs - the most keto-friendly cracker there is. Store airtight up to 2 weeks.","tipsHe":"כמעט אפס פחמימות נטו – הקרקר הכי ידידותי לקיטו שיש. נשמרים בכלי אטום עד שבועיים.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-flaxseed-crackers/"},{"creator":"KetoConnect","url":"https://www.ketoconnect.net/flax-seed-crackers-recipe/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s 30-minute ground-flax method with KetoConnect\u0027s whole-seed version that needs a 12-18 hour soak and a slow 275°F bake. Ground flax won decisively: same crunch, no overnight wait, and it rolls into an even sheet that snaps into clean squares.","comparedVersionsHe":"השווינו את שיטת הפשתן הטחון של Sugar Free Londoner (30 דקות) עם גרסת הזרעים השלמים של KetoConnect שדורשת השריה של 12-18 שעות ואפייה איטית ב-135 מעלות. הפשתן הטחון ניצח בגדול: אותה פריכות, בלי המתנה של לילה, והוא מתרדד ליריעה אחידה שנשברת לריבועים נקיים."},{"id":"cloud-bread","name":"Cloud Bread (Oopsie Rolls)","nameHe":"לחם ענן (לחמניות אופסי)","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":28,"difficulty":"medium","ingredients":[{"amount":"3","item":"large eggs, room temperature, separated"},{"amount":"3 oz / 85 g","item":"cream cheese, softened","israelNote":"gevina levana 30% or Napoleon/Philadelphia-style spread"},{"amount":"0.25 tsp","item":"cream of tartar","israelNote":"baking aisle or health-food stores; 0.5 tsp lemon juice works instead"},{"amount":"0.25 tsp","item":"salt"},{"amount":"0.25 tsp","item":"garlic powder or za\u0027atar (optional)"}],"ingredientsHe":[{"amount":"3","item":"ביצים גדולות, בטמפרטורת החדר, מופרדות"},{"amount":"85 גרם","item":"גבינת שמנת, רכה","israelNote":"גבינה לבנה 30% או ממרח בסגנון נפוליאון/פילדלפיה"},{"amount":"רבע כפית","item":"קרם טרטר (אבקת טרטר)","israelNote":"מדף האפייה או חנויות טבע; חצי כפית מיץ לימון מחליפה יפה"},{"amount":"רבע כפית","item":"מלח"},{"amount":"רבע כפית","item":"אבקת שום או זעתר (לא חובה)"}],"instructions":["Heat the oven to 300°F / 150°C and line a baking sheet with baking paper.","Whip the egg whites with the cream of tartar to stiff peaks - the bowl must be grease-free or they will not whip.","In another bowl beat the softened cream cheese, yolks, salt and seasoning until completely smooth.","Fold the whites into the yolk mixture in two additions, gently, keeping as much air as possible.","Spoon 8 rounds (about 10 cm each) onto the sheet, spacing them apart.","Bake 25-30 minutes until golden and set; cool a few minutes before lifting off the paper. Serving = 2 rounds."],"instructionsHe":["מחממים תנור ל-150 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מקציפים את החלבונים עם קרם הטרטר לקצף יציב – הקערה חייבת להיות נקייה משומן, אחרת הקצף לא יתפוס.","בקערה אחרת מערבבים את גבינת השמנת הרכה, החלמונים, המלח והתיבול עד לתערובת חלקה לגמרי.","מקפלים את הקצף לתערובת החלמונים בשתי פעמים, בעדינות, תוך שמירה על כמה שיותר אוויר.","יוצרים בכף 8 עיגולים (כ-10 ס\"מ כל אחד) על התבנית, במרווחים.","אופים 25-30 דקות עד שהעיגולים זהובים ויציבים; מצננים כמה דקות לפני שמרימים מהנייר. מנה = 2 עיגולים."],"nutrition":{"calories":128,"fatG":11.0,"satFatG":5.5,"proteinG":6.1,"carbsG":1.5,"fiberG":0,"netCarbsG":1.5,"sugarG":1.0,"sodiumMg":263},"tips":"Best the day they are baked - they soften overnight. Use two rounds as burger-style buns or as a base for open sandwiches.","tipsHe":"הכי טובים ביום האפייה – הם מתרככים במהלך הלילה. שני עיגולים משמשים כלחמניית המבורגר או כבסיס לכריכים פתוחים.","sources":[{"creator":"MyKetoPlate","url":"https://myketoplate.com/cloud-bread/"},{"creator":"WonkyWonderful (Nicole Harris)","url":"https://wonkywonderful.com/cloud-bread-recipe/"},{"creator":"Sweet As Honey (Carine Claudepierre)","url":"https://www.sweetashoney.co/cloud-bread/"}],"comparedVersions":"Compared three near-identical 3-ingredient versions (MyKetoPlate, WonkyWonderful, Sweet As Honey). All agree on 3 eggs to ~85-115 g cream cheese at 300°F; this version takes the middle cream-cheese amount for stability, WonkyWonderful\u0027s two-stage folding for maximum loft, and cream of tartar (with a lemon-juice fallback) as the whip stabilizer.","comparedVersionsHe":"השווינו שלוש גרסאות כמעט זהות מ-3 מרכיבים (MyKetoPlate, WonkyWonderful, Sweet As Honey). כולן מסכימות על 3 ביצים לכ-85-115 גרם גבינת שמנת ב-150 מעלות; הגרסה הזו לוקחת את כמות הגבינה האמצעית ליציבות, את הקיפול הדו-שלבי של WonkyWonderful לנפח מרבי, ואת קרם הטרטר (עם מיץ לימון כגיבוי) כמייצב הקצפה."},{"id":"coconut-flour-tortillas","name":"Coconut Flour Tortillas","nameHe":"טורטיות מקמח קוקוס","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":15,"cookTimeMin":15,"difficulty":"medium","ingredients":[{"amount":"0.5 cup / 60 g","item":"coconut flour, sifted","israelNote":"kemach kokos"},{"amount":"2 tbsp / 10 g","item":"whole psyllium husks (or 1 tbsp powder)","israelNote":"psyllium (pharma/health stores, e.g. iHerb/SuperPharm)"},{"amount":"0.5 tsp","item":"baking powder","israelNote":"check kosher-for-passover if relevant"},{"amount":"0.25 tsp each","item":"salt, garlic powder, cumin (optional spices)"},{"amount":"1","item":"large egg (or 1 egg white for a paler tortilla)"},{"amount":"1 tbsp","item":"olive oil, plus more for the pan"},{"amount":"0.67 cup / 160 ml","item":"warm water"}],"ingredientsHe":[{"amount":"חצי כוס / 60 גרם","item":"קמח קוקוס, מנופה"},{"amount":"2 כפות / 10 גרם","item":"פסיליום שלם (או 1 כף אבקה)","israelNote":"סופר-פארם / חנויות טבע / iHerb"},{"amount":"חצי כפית","item":"אבקת אפייה","israelNote":"אם רלוונטי – לוודא כשרות לפסח"},{"amount":"רבע כפית מכל אחד","item":"מלח, אבקת שום, כמון (תבלינים – לא חובה)"},{"amount":"1","item":"ביצה גדולה (או חלבון אחד לטורטייה בהירה יותר)"},{"amount":"1 כף","item":"שמן זית, ועוד קצת למחבת"},{"amount":"2/3 כוס / 160 מ\"ל","item":"מים חמימים"}],"instructions":["Stir the coconut flour, psyllium, baking powder, salt and spices together.","Add the egg, olive oil and warm water and mix with a fork, then knead about 2 minutes until a soft, pliable dough forms; rest 10 minutes so the fibers hydrate.","Divide into 6 balls. Flatten each between two sheets of baking paper and roll thin; trim to a neat 15 cm circle using a pot lid as a guide.","Heat a lightly oiled skillet over medium heat.","Cook each tortilla about 45-60 seconds per side until golden-spotted and flexible.","Stack under a towel to keep soft; they roll without cracking while warm."],"instructionsHe":["מערבבים את קמח הקוקוס, הפסיליום, אבקת האפייה, המלח והתבלינים.","מוסיפים את הביצה, שמן הזית והמים החמימים ומערבבים במזלג, ואז לשים כ-2 דקות עד לקבלת בצק רך וגמיש; מניחים למנוחה 10 דקות כדי שהסיבים יספגו את הנוזלים.","מחלקים ל-6 כדורים. משטחים כל אחד בין שני ניירות אפייה ומרדדים דק; חותכים לעיגול מסודר של 15 ס\"מ בעזרת מכסה סיר כשבלונה.","מחממים מחבת משומנת קלות על אש בינונית.","מטגנים כל טורטייה כ-45-60 שניות מכל צד עד שמופיעים כתמים זהובים והיא נשארת גמישה.","עורמים מתחת למגבת כדי לשמור על רכות; כשהן חמות הן נגללות בלי להיסדק."],"nutrition":{"calories":72,"fatG":4.6,"satFatG":2.0,"proteinG":2.9,"carbsG":4.3,"fiberG":2.8,"netCarbsG":1.5,"sugarG":0.7,"sodiumMg":150},"tips":"The rest step is essential - coconut flour and psyllium need 10 minutes to absorb the water or the dough will crack when rolled.","tipsHe":"שלב המנוחה הכרחי – קמח קוקוס ופסיליום צריכים 10 דקות לספוג את המים, אחרת הבצק ייסדק ברידוד.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/coconut-flour-tortillas/"},{"creator":"My PCOS Kitchen (Mira)","url":"https://www.mypcoskitchen.com/coconut-flour-tortillas-recipe/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s small-batch tortillas (60 g coconut flour, 1 egg, warm water) with My PCOS Kitchen\u0027s larger 4-egg boiling-water batch. The Londoner ratio won for a home batch: fewer eggs means a less eggy taste, the warm-water knead is simpler, and per-tortilla macros are lighter (1.5 g net). Fully pareve - fried in olive oil.","comparedVersionsHe":"השווינו את הטורטיות של Sugar Free Londoner בכמות קטנה (60 גרם קמח קוקוס, ביצה אחת, מים חמימים) עם הגרסה הגדולה של My PCOS Kitchen עם 4 ביצים ומים רותחים. היחס של Sugar Free Londoner ניצח למנה ביתית: פחות ביצים – פחות טעם ביצתי, הלישה במים חמימים פשוטה יותר, והערכים לטורטייה קלים יותר (1.5 גרם פחמימות נטו). פרווה לחלוטין – מטוגנות בשמן זית."},{"id":"cauliflower-breadsticks","name":"Cheesy Cauliflower Breadsticks","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":25,"cookTimeMin":45,"difficulty":"medium","ingredients":[{"amount":"1 medium head / ~5 cups riced (500 g)","item":"cauliflower (or 500 g frozen cauliflower rice)","israelNote":"orez kruvit kafu (Sunfrost) saves the ricing step"},{"amount":"2 large","item":"eggs"},{"amount":"1 cup / 113 g, divided","item":"shredded mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"1/4 cup / 25 g","item":"grated parmesan","israelNote":"parmesan megurad"},{"amount":"1 tsp","item":"dried Italian herb mix"},{"amount":"1/2 tsp each","item":"garlic powder and salt"},{"amount":"1/4 tsp","item":"black pepper"}],"instructions":["Preheat the oven to 190°C / 375°F. Pulse cauliflower florets in a food processor to couscous-size grains (skip if using frozen rice).","Spread the riced cauliflower on a lined baking sheet and bake 15-20 minutes to dry it out; cool until handleable.","Wrap the cauliflower in a clean towel and squeeze hard — expect nearly a cup of liquid. Raise the oven to 230°C / 450°F.","Mix the cauliflower with the eggs, half the mozzarella, the parmesan, herbs, garlic powder, salt, and pepper until it holds together when squeezed.","Press the mixture onto parchment into a rectangle about 23x18 cm and 0.5 cm thick.","Bake 15-18 minutes until set and golden at the edges.","Scatter the remaining mozzarella on top and bake (or briefly broil) 3-5 minutes until bubbling and spotted brown.","Cool 5-10 minutes, then cut into 12 sticks and serve with warm marinara."],"nutrition":{"calories":59,"fatG":3.5,"satFatG":1.8,"proteinG":4.7,"carbsG":2.3,"fiberG":0.8,"netCarbsG":1.5,"sugarG":0.7,"sodiumMg":204},"lowCarbVariant":"Swap the topping mozzarella for cheddar and add chili flakes for \u0027pizza fries\u0027.","tips":"The pre-bake-then-squeeze step is the difference between breadsticks you pick up and a cheesy mash you eat with a fork.","sources":[{"creator":"Food Network Kitchen","url":"https://www.foodnetwork.com/recipes/food-network-kitchen/low-carb-cheesy-cauliflower-breadsticks-3881833"},{"creator":"Olena Osipov, iFoodReal","url":"https://ifoodreal.com/cauliflower-breadsticks/"},{"creator":"Lisa MarcAurele, Low Carb Yum","url":"https://lowcarbyum.com/cheesy-cauliflower-breadsticks/"}],"comparedVersions":"Compared Food Network\u0027s cheddar-parmesan version, iFoodReal\u0027s lighter mozzarella version, and Low Carb Yum\u0027s. Took iFoodReal\u0027s pre-bake-and-squeeze moisture technique (crispest base, lowest calories) with Food Network\u0027s parmesan-in-the-dough for flavor, and mozzarella on top for the classic cheese pull.","nameHe":"מקלות כרובית עם גבינה","ingredientsHe":[{"amount":"ראש בינוני / כ-5 כוסות מגורר (500 גרם)","item":"כרובית (או 500 גרם אורז כרובית קפוא)","israelNote":"אורז כרובית קפוא (סאנפרוסט) חוסך את שלב הגירור"},{"amount":"2 גדולות","item":"ביצים"},{"amount":"1 כוס / 113 גרם, מחולק","item":"מוצרלה מגוררת","israelNote":"טרה / גד"},{"amount":"1/4 כוס / 25 גרם","item":"פרמזן מגורר"},{"amount":"1 כפית","item":"תערובת עשבי תיבול איטלקית יבשה"},{"amount":"1/2 כפית מכל אחד","item":"אבקת שום ומלח"},{"amount":"1/4 כפית","item":"פלפל שחור"}],"instructionsHe":["מחממים תנור ל-190 מעלות. טוחנים פרחי כרובית במעבד מזון לגרגירים בגודל קוסקוס (מדלגים אם משתמשים באורז כרובית קפוא).","מפזרים את הכרובית המגוררת על תבנית מרופדת ואופים 15-20 דקות לייבוש; מצננים עד שאפשר לגעת.","עוטפים את הכרובית במגבת נקייה וסוחטים חזק - צפו כמעט לכוס שלמה של נוזלים. מעלים את חום התנור ל-230 מעלות.","מערבבים את הכרובית עם הביצים, מחצית מהמוצרלה, הפרמזן, עשבי התיבול, אבקת השום, המלח והפלפל עד שהתערובת מתגבשת בלחיצה.","מהדקים את התערובת על נייר אפייה למלבן של כ-23x18 ס\"מ בעובי 0.5 ס\"מ.","אופים 15-18 דקות עד שהבסיס מתייצב ומזהיב בשוליים.","מפזרים מעל את שאר המוצרלה ואופים (או צולים קצרות בגריל התנור) 3-5 דקות עד שהגבינה מבעבעת ומזהיבה בכתמים.","מצננים 5-10 דקות, חותכים ל-12 מקלות ומגישים עם רוטב מרינרה חם."],"lowCarbVariantHe":"מחליפים את המוצרלה שמעל בצ\u0027דר ומוסיפים פתיתי צ\u0027ילי ל\u0027צ\u0027יפס פיצה\u0027.","tipsHe":"שלב האפייה המקדימה והסחיטה הוא ההבדל בין מקלות שמרימים ביד לבין מחית גבינתית שאוכלים במזלג.","comparedVersionsHe":"השווינו את גרסת הצ\u0027דר-פרמזן של Food Network, את הגרסה הקלה יותר עם מוצרלה של iFoodReal ואת זו של Low Carb Yum. לקחנו את טכניקת הייבוש-והסחיטה של iFoodReal (הבסיס הפריך ביותר והכי פחות קלוריות) עם הפרמזן בתוך הבצק של Food Network לטעם, ומוצרלה מעל למשיכת הגבינה הקלאסית."},{"id":"fathead-pizza-dough","name":"Fathead Pizza Dough Base","nameHe":"בסיס בצק פיצה פאטהד","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":8,"prepTimeMin":10,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"1.5 cups / 170 g","item":"shredded low-moisture mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"2 tbsp / 28 g","item":"cream cheese"},{"amount":"0.75 cup / 75 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1","item":"large egg, beaten"},{"amount":"0.25 tsp","item":"salt"},{"amount":"0.5 tsp","item":"dried oregano or Italian herbs (optional)"}],"ingredientsHe":[{"amount":"1.5 כוסות / 170 גרם","item":"מוצרלה מגוררת (דלת לחות)","israelNote":"מוצרלה מגוררת של טרה/גד"},{"amount":"2 כפות / 28 גרם","item":"גבינת שמנת"},{"amount":"3/4 כוס / 75 גרם","item":"קמח שקדים מולבן"},{"amount":"1","item":"ביצה גדולה, טרופה"},{"amount":"רבע כפית","item":"מלח"},{"amount":"חצי כפית","item":"אורגנו מיובש או תערובת עשבי תיבול איטלקית (לא חובה)"}],"instructions":["Heat the oven to 425°F / 220°C with a baking sheet inside.","Melt the mozzarella and cream cheese together (microwave ~90 seconds in bursts, stirring), until fully smooth.","Working while the cheese is warm, mix in the almond flour, egg, salt and herbs until an even dough forms - knead briefly with oiled hands.","Roll the dough between two sheets of baking paper into a 25-30 cm circle, about 0.5 cm thick.","Prick all over with a fork, slide onto the hot sheet, and pre-bake 6-8 minutes until golden; pop any bubbles.","Add sauce and toppings and return to the oven 5-8 minutes. Cut into 8 slices."],"instructionsHe":["מחממים תנור ל-220 מעלות עם תבנית אפייה בפנים.","ממיסים יחד את המוצרלה וגבינת השמנת (במיקרוגל כ-90 שניות בפולסים, תוך ערבוב) עד שהתערובת חלקה לגמרי.","בעוד הגבינה חמה, מערבבים פנימה את קמח השקדים, הביצה, המלח ועשבי התיבול עד לקבלת בצק אחיד – לשים קצרות בידיים משומנות.","מרדדים את הבצק בין שני ניירות אפייה לעיגול של 25-30 ס\"מ, בעובי כחצי ס\"מ.","מנקבים בכל השטח במזלג, מחליקים על התבנית החמה ואופים אפייה מקדימה 6-8 דקות עד להזהבה; מפוצצים בועות אם נוצרות.","מוסיפים רוטב ותוספות ומחזירים לתנור ל-5-8 דקות. חותכים ל-8 משולשים."],"nutrition":{"calories":140,"fatG":11.0,"satFatG":3.8,"proteinG":8.3,"carbsG":2.7,"fiberG":1.0,"netCarbsG":1.7,"sugarG":0.5,"sodiumMg":220},"tips":"The pre-bake plus fork-pricking is what keeps the crust crisp instead of soggy - do not skip either. Dough freezes well after the pre-bake.","tipsHe":"האפייה המקדימה והניקוב במזלג הם ששומרים על בסיס פריך במקום ספוגי – לא מדלגים על אף אחד מהם. הבצק מוקפא היטב אחרי האפייה המקדימה.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/fathead-pizza-crust-low-carb-keto-gluten-free-nut-free/"},{"creator":"The Big Man\u0027s World (Arman Liew)","url":"https://thebigmansworld.com/keto-fathead-pizza-dough/"}],"comparedVersions":"Compared Wholesome Yum\u0027s classic cream-cheese fathead crust (425°F, double-bake, fork-pricked) with The Big Man\u0027s World\u0027s Greek-yogurt shortcut at 350°F. Both use the identical 1.5 cups mozzarella to 3/4 cup almond flour ratio; Wholesome Yum\u0027s hotter oven and pre-bake produced the crispier base, so that technique won.","comparedVersionsHe":"השווינו את בסיס הפאטהד הקלאסי עם גבינת שמנת של Wholesome Yum (220 מעלות, אפייה כפולה, ניקוב במזלג) עם קיצור הדרך של The Big Man\u0027s World עם יוגורט יווני ב-180 מעלות. שניהם משתמשים ביחס זהה של 1.5 כוסות מוצרלה ל-3/4 כוס קמח שקדים; התנור החם יותר והאפייה המקדימה של Wholesome Yum נתנו את הבסיס הפריך יותר, ולכן הטכניקה הזו ניצחה."},{"id":"almond-flour-sandwich-bread","name":"Almond Flour Sandwich Bread","nameHe":"לחם כריכים מקמח שקדים","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":10,"cookTimeMin":45,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"4 tbsp / 20 g","item":"whole psyllium husks (or 2 tbsp psyllium husk powder)","israelNote":"psyllium (pharma/health stores, e.g. iHerb/SuperPharm)"},{"amount":"1.5 tsp","item":"baking powder","israelNote":"check kosher-for-passover if relevant"},{"amount":"0.5 tsp","item":"xanthan gum (optional, for a springier crumb)","israelNote":"health-food stores"},{"amount":"0.25 tsp","item":"fine salt"},{"amount":"2","item":"large eggs, room temperature"},{"amount":"2","item":"large egg whites, room temperature"},{"amount":"2 tbsp / 30 g","item":"olive oil (keeps it pareve; butter works for a dairy meal)"},{"amount":"0.5 cup / 120 ml","item":"warm water"}],"ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים מולבן"},{"amount":"4 כפות / 20 גרם","item":"פסיליום שלם (או 2 כפות אבקת פסיליום)","israelNote":"סופר-פארם / חנויות טבע / iHerb"},{"amount":"1.5 כפית","item":"אבקת אפייה","israelNote":"אם רלוונטי – לוודא כשרות לפסח"},{"amount":"חצי כפית","item":"קסנטן גאם (לא חובה, לפריכות גמישה יותר)","israelNote":"חנויות טבע"},{"amount":"רבע כפית","item":"מלח דק"},{"amount":"2","item":"ביצים גדולות, בטמפרטורת החדר"},{"amount":"2","item":"חלבוני ביצה גדולים, בטמפרטורת החדר"},{"amount":"2 כפות / 30 גרם","item":"שמן זית (שומר על הלחם פרווה; חמאה מתאימה לארוחה חלבית)"},{"amount":"חצי כוס / 120 מ\"ל","item":"מים חמימים"}],"instructions":["Heat the oven to 350°F / 180°C and line a small loaf pan (about 20x10 cm) with baking paper.","Beat the eggs and egg whites with an electric mixer for about 2 minutes until pale and frothy - this air is what lifts the loaf.","In a second bowl stir together the almond flour, psyllium, baking powder, xanthan gum and salt.","Beat the olive oil and warm water into the eggs, then mix in the dry ingredients until you have a smooth, thick batter.","Scrape the batter into the pan, smooth the top, and bake 40-45 minutes until the top is browned and a skewer comes out clean.","Cool completely in the pan before slicing into 12 slices - warm psyllium bread gums up if cut early."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית אינגליש קייק קטנה (כ-20x10 ס\"מ) בנייר אפייה.","מקציפים את הביצים והחלבונים במיקסר חשמלי כ-2 דקות עד שהם בהירים ואווריריים – האוויר הזה הוא שמתפיח את הלחם.","בקערה שנייה מערבבים את קמח השקדים, הפסיליום, אבקת האפייה, הקסנטן גאם והמלח.","מוסיפים לביצים את שמן הזית והמים החמימים תוך הקצפה, ואז מערבבים פנימה את היבשים עד לקבלת בלילה חלקה וסמיכה.","מעבירים את הבלילה לתבנית, מיישרים את החלק העליון ואופים 40-45 דקות עד שהלחם משחים למעלה וקיסם יוצא נקי.","מצננים לגמרי בתוך התבנית לפני שפורסים ל-12 פרוסות – לחם פסיליום חם נעשה דביק אם פורסים מוקדם מדי."],"nutrition":{"calories":148,"fatG":12.4,"satFatG":1.4,"proteinG":5.2,"carbsG":4.7,"fiberG":3.0,"netCarbsG":1.7,"sugarG":0.9,"sodiumMg":180},"tips":"Slices toast beautifully and freeze well; freeze pre-sliced with baking paper between slices.","tipsHe":"הפרוסות מצוינות בטוסטר ומוקפאות היטב; מקפיאים פרוס מראש עם נייר אפייה בין הפרוסות.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/almond-flour-bread-keto-bread-recipe/"},{"creator":"Healthy Recipes Blog (Vered DeLeeuw)","url":"https://healthyrecipesblogs.com/gluten-free-bread/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s psyllium-and-egg-white loaf (200 g almond flour, 12 slices, 1.4 g net) with Healthy Recipes Blog\u0027s simpler 5-egg butter loaf. The psyllium version won: it slices thinner, holds sandwich fillings without crumbling, and swaps butter for olive oil so it stays pareve for meat meals.","comparedVersionsHe":"השווינו את הלחם של Sugar Free Londoner על בסיס פסיליום וחלבוני ביצה (200 גרם קמח שקדים, 12 פרוסות, 1.4 גרם פחמימות נטו) עם גרסת החמאה הפשוטה יותר של Healthy Recipes Blog עם 5 ביצים. גרסת הפסיליום ניצחה: היא נפרסת דק יותר, מחזיקה מילויי כריך בלי להתפורר, ובזכות החלפת החמאה בשמן זית היא נשארת פרווה ומתאימה לארוחות בשריות."},{"id":"caraway-rye-style-keto-bread","name":"Caraway Rye-Style Keto Bread (Pareve)","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":16,"prepTimeMin":20,"cookTimeMin":60,"difficulty":"medium","ingredients":[{"amount":"2 packed cups / 300 g","item":"flaxseed meal (golden preferred)","israelNote":"pishtan tachun — grind whole flax seeds fresh if possible"},{"amount":"1 cup / 120 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tbsp","item":"caraway seeds","israelNote":"kimel (zirei kimel) — spice shops"},{"amount":"1 tbsp + 1 tsp","item":"baking powder"},{"amount":"1 tsp each","item":"salt and xanthan gum (or 1/4 cup ground chia)","israelNote":"xanthan gum — health-food stores"},{"amount":"8 large","item":"eggs, separated"},{"amount":"1/2 cup / 110 g","item":"extra virgin olive oil (keeps it pareve — original allows ghee/butter)"},{"amount":"2 tbsp","item":"toasted sesame oil (deepens the \u0027rye\u0027 flavor)"},{"amount":"1/3 cup / 80 ml","item":"apple cider vinegar"},{"amount":"1 cup / 240 ml","item":"warm water"}],"instructions":["Preheat the oven to 190°C / 375°F and grease or line a large loaf pan.","Whisk the flax meal, coconut flour, caraway, baking powder, salt, and xanthan gum thoroughly.","Beat the egg yolks with the olive oil and sesame oil until smooth.","In a clean bowl, whisk the egg whites to soft peaks.","Stir the yolk mixture, vinegar, and warm water into the dry ingredients until evenly combined — the batter will be thick.","Fold in the beaten whites in two additions, keeping as much air as possible.","Scrape into the pan, smooth the top, and bake 50-60 minutes until a skewer comes out clean; tent with foil if the top darkens early.","Cool completely on a rack before slicing — flax bread firms up substantially as it cools."],"nutrition":{"calories":250,"fatG":21.0,"satFatG":3.5,"proteinG":8.4,"carbsG":9.3,"fiberG":7.5,"netCarbsG":1.8,"sugarG":0.9,"sodiumMg":515},"lowCarbVariant":"Add 1 tsp cocoa powder and 1 tsp instant coffee to the dry mix for a darker pumpernickel look and taste.","tips":"The vinegar plus caraway is what reads as \u0027rye\u0027 on the palate. Excellent toasted with pastrami — it is fully pareve.","sources":[{"creator":"Ben Blau via Martina Slajerova, KetoDiet Blog","url":"https://ketodietapp.com/Blog/lchf/Bens-Low-Carb-Rye-Bread"},{"creator":"Resolution Eats","url":"https://www.resolutioneats.com/blog/real-low-carb-rye-bread/"},{"creator":"Low Carb Inspirations","url":"https://lowcarbinspirations.com/keto-rye-bread-recipe/"}],"comparedVersions":"Compared KetoDiet\u0027s flax-and-coconut loaf, Resolution Eats\u0027 yeast version, and a vital-wheat-gluten stand-mixer recipe. The KetoDiet ratio won: no yeast or gluten needed, dense chewy \u0027deli rye\u0027 crumb from flax, and only 1.8 g net carbs; chose the olive-oil option over ghee to keep it pareve for meat sandwiches.","nameHe":"לחם קיטו בסגנון שיפון עם קימל (פרווה)","ingredientsHe":[{"amount":"2 כוסות דחוסות / 300 גרם","item":"פשתן טחון (מוזהב עדיף)","israelNote":"עדיף לטחון זרעי פשתן שלמים טריים"},{"amount":"1 כוס / 120 גרם","item":"קמח קוקוס"},{"amount":"2 כפות","item":"זרעי קימל","israelNote":"חנויות תבלינים"},{"amount":"1 כף + 1 כפית","item":"אבקת אפייה"},{"amount":"1 כפית מכל אחד","item":"מלח וקסנטן גאם (או 1/4 כוס צ\u0027יה טחונה)","israelNote":"קסנטן גאם - חנויות טבע"},{"amount":"8 גדולות","item":"ביצים, מופרדות"},{"amount":"1/2 כוס / 110 גרם","item":"שמן זית כתית מעולה (שומר על פרווה - במקור מותר גם גהי/חמאה)"},{"amount":"2 כפות","item":"שמן שומשום קלוי (מעמיק את טעם ה\u0027שיפון\u0027)"},{"amount":"1/3 כוס / 80 מ\"ל","item":"חומץ תפוחים"},{"amount":"1 כוס / 240 מ\"ל","item":"מים חמימים"}],"instructionsHe":["מחממים תנור ל-190 מעלות ומשמנים או מרפדים תבנית אינגליש קייק גדולה.","טורפים היטב את הפשתן הטחון, קמח הקוקוס, הקימל, אבקת האפייה, המלח והקסנטן גאם.","טורפים את החלמונים עם שמן הזית ושמן השומשום עד לתערובת חלקה.","בקערה נקייה, מקציפים את החלבונים לקצף רך.","מערבבים את תערובת החלמונים, החומץ והמים החמימים לתוך היבשים עד לאיחוד - הבלילה תהיה סמיכה.","מקפלים פנימה את החלבונים המוקצפים בשתי פעמים, תוך שמירה על כמה שיותר אוויר.","מעבירים לתבנית, מחליקים את פני הבלילה ואופים 50-60 דקות עד שקיסם יוצא נקי; מכסים ברדיד אלומיניום אם הלחם מכהה מוקדם.","מצננים לגמרי על רשת לפני הפריסה - לחם פשתן מתייצב משמעותית תוך כדי הצינון."],"lowCarbVariantHe":"מוסיפים כפית קקאו וכפית קפה נמס ליבשים למראה וטעם של פומפרניקל כהה.","tipsHe":"החומץ יחד עם הקימל הם מה שנותן תחושת \u0027שיפון\u0027 בפה. מעולה קלוי עם פסטרמה - הלחם פרווה לגמרי.","comparedVersionsHe":"השווינו את כיכר הפשתן-קוקוס של KetoDiet, גרסת שמרים של Resolution Eats ומתכון עם גלוטן חיטה במיקסר. היחס של KetoDiet ניצח: בלי שמרים ובלי גלוטן, פרוסה דחוסה ולעיסה בסגנון \u0027שיפון מעדנייה\u0027 מהפשתן, ורק 1.8 גרם פחמימות נטו; בחרנו באפשרות שמן הזית במקום גהי כדי לשמור על פרווה לכריכים בשריים."},{"id":"cheese-herb-muffins","name":"Cheese \u0026 Herb Muffins","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":8,"prepTimeMin":10,"cookTimeMin":22,"difficulty":"easy","ingredients":[{"amount":"6 tbsp / 85 g","item":"butter, melted"},{"amount":"1 cup / 100 g","item":"almond flour (superfine)","israelNote":"kemach shkedim"},{"amount":"3 tbsp / 22 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tsp","item":"baking powder"},{"amount":"3/4 tsp + 1/4 tsp","item":"salt and garlic powder"},{"amount":"1/4 tsp","item":"xanthan gum (optional, for a springier crumb)","israelNote":"health-food stores"},{"amount":"2 large","item":"eggs"},{"amount":"1/2 tsp fresh (or 1/4 tsp dried)","item":"thyme leaves (or chives/za\u0027atar)"},{"amount":"1/3 cup / 80 ml","item":"unsweetened almond milk","israelNote":"mishkei shkedim lo mamutak"},{"amount":"1/2 cup / 55 g","item":"shredded sharp cheddar","israelNote":"gvina tzehuba megureret (Tara/Gad); Emmental works"}],"instructions":["Preheat the oven to 190°C / 375°F and line or grease 8 muffin cups.","Whisk the melted butter with the eggs and almond milk.","Add the almond flour, coconut flour, baking powder, salt, garlic powder, and xanthan gum and stir until smooth.","Fold in the thyme and most of the cheddar, keeping a little cheese back for the tops.","Divide the batter among the cups (about 2/3 full) and top with the reserved cheese.","Bake 20-22 minutes until golden and a toothpick comes out clean.","Cool 5 minutes in the pan — they are best warm."],"nutrition":{"calories":216,"fatG":20.0,"satFatG":9.0,"proteinG":7.0,"carbsG":5.0,"fiberG":3.0,"netCarbsG":2.0,"sugarG":0.6,"sodiumMg":350},"lowCarbVariant":"Stir in 1/2 cup finely chopped steamed broccoli for a light-lunch muffin (+0.5 g net carbs each).","tips":"Serve alongside dairy soups or shakshuka. For a pareve-ish swap there is no good substitute — the butter and cheddar are the muffin.","sources":[{"creator":"Mellissa Sevigny, I Breathe I\u0027m Hungry","url":"https://www.ibreatheimhungry.com/keto-cheesy-herb-muffins-low-carb/"},{"creator":"Vered DeLeeuw, Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/cheese-muffins/"},{"creator":"Katrin Nürnberger, Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-broccoli-cheese-muffins-recipe/"}],"comparedVersions":"Compared Sevigny\u0027s butter-rich herb muffin, Healthy Recipes Blog\u0027s minimalist egg-and-cheddar version, and SFL\u0027s broccoli-cheese muffin. Sevigny\u0027s ratio (almond + a little coconut flour + almond milk) gave the most bakery-like domed crumb; the others were flatter and eggier. Kept her formula, made the xanthan optional, and folded the broccoli idea in as a variant.","nameHe":"מאפינס גבינה ועשבי תיבול","ingredientsHe":[{"amount":"6 כפות / 85 גרם","item":"חמאה מומסת"},{"amount":"1 כוס / 100 גרם","item":"קמח שקדים (טחון דק)"},{"amount":"3 כפות / 22 גרם","item":"קמח קוקוס"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"3/4 כפית + 1/4 כפית","item":"מלח ואבקת שום"},{"amount":"1/4 כפית","item":"קסנטן גאם (לא חובה, למרקם קפיצי יותר)","israelNote":"חנויות טבע"},{"amount":"2 גדולות","item":"ביצים"},{"amount":"1/2 כפית טרי (או 1/4 כפית יבש)","item":"עלי טימין (או עירית/זעתר)"},{"amount":"1/3 כוס / 80 מ\"ל","item":"חלב שקדים לא ממותק"},{"amount":"1/2 כוס / 55 גרם","item":"צ\u0027דר חריף מגורר","israelNote":"גבינה צהובה מגוררת (טרה/גד); גם אמנטל עובד"}],"instructionsHe":["מחממים תנור ל-190 מעלות ומרפדים או משמנים 8 שקעים בתבנית מאפינס.","טורפים את החמאה המומסת עם הביצים וחלב השקדים.","מוסיפים את קמח השקדים, קמח הקוקוס, אבקת האפייה, המלח, אבקת השום והקסנטן גאם ומערבבים עד לבלילה חלקה.","מקפלים פנימה את הטימין ואת רוב הצ\u0027דר, ושומרים מעט גבינה לפיזור מעל.","מחלקים את הבלילה בין השקעים (כ-2/3 גובה) ומפזרים מעל את הגבינה ששמרנו.","אופים 20-22 דקות עד שהמאפינס זהובים וקיסם יוצא נקי.","מצננים 5 דקות בתבנית - הם הכי טעימים חמים."],"lowCarbVariantHe":"מערבבים פנימה 1/2 כוס ברוקולי מאודה קצוץ דק למאפין של ארוחת צהריים קלה (+0.5 גרם פחמימות נטו ליחידה).","tipsHe":"מגישים לצד מרקים חלביים או שקשוקה. אין תחליף טוב לגרסת פרווה - החמאה והצ\u0027דר הם המאפין.","comparedVersionsHe":"השווינו את מאפין עשבי התיבול עתיר החמאה של Sevigny, את הגרסה המינימליסטית של ביצים וצ\u0027דר מ-Healthy Recipes Blog ואת מאפין הברוקולי-גבינה של SFL. היחס של Sevigny (שקדים + מעט קמח קוקוס + חלב שקדים) נתן את המרקם הכי דומה למאפייה עם כיפה יפה; האחרים יצאו שטוחים וביציים יותר. שמרנו על הנוסחה שלה, הפכנו את הקסנטן לרשות ושילבנו את רעיון הברוקולי כווריאציה."},{"id":"olive-rosemary-bread-pareve","name":"Olive \u0026 Rosemary Bread (Pareve)","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":10,"prepTimeMin":15,"cookTimeMin":35,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 60 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tbsp / 16 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"1 tbsp","item":"baking powder"},{"amount":"1/2 tsp","item":"salt"},{"amount":"1 1/2 tbsp","item":"chopped rosemary (fresh or dried)"},{"amount":"4 medium","item":"eggs"},{"amount":"4 tbsp / 60 ml","item":"olive oil"},{"amount":"1 tbsp","item":"apple cider vinegar"},{"amount":"75 g / about 20","item":"pitted olives (black or green), roughly chopped","israelNote":"zeitim — Kalamata give the strongest flavor"},{"amount":"1/2 cup / 120 ml","item":"boiling water"}],"instructions":["Preheat the oven to 180°C / 350°F and line a baking sheet with parchment.","Whisk the coconut flour, psyllium, baking powder, salt, and rosemary together.","Beat in the eggs and olive oil until evenly mixed, then stir in the vinegar and chopped olives.","Pour in the boiling water while stirring; let the dough sit 2-3 minutes to thicken into a shapeable mass.","Form a round, slightly domed loaf on the parchment and score a cross-hatch pattern on top.","Bake about 35 minutes until golden and hollow-sounding when tapped underneath.","Cool at least 20 minutes before slicing into 10 wedges."],"nutrition":{"calories":123,"fatG":9.0,"satFatG":1.8,"proteinG":3.0,"carbsG":6.0,"fiberG":4.0,"netCarbsG":2.0,"sugarG":0.5,"sodiumMg":330},"ketoVariant":"Brush the hot loaf with olive oil and flaky salt for a focaccia-like crust at no carb cost.","tips":"Fully pareve — a natural partner for meat mains or salatim. Pat the olives dry before folding in so the crumb stays airy.","sources":[{"creator":"Angela Coleby, Divalicious Recipes","url":"https://divaliciousrecipes.com/rosemary-olive-low-carb-bread/"},{"creator":"Kalyn Denny, Kalyn\u0027s Kitchen","url":"https://kalynskitchen.com/olive-bread/"},{"creator":"Katrin Nürnberger, Sugar Free Londoner","url":"https://sugarfreelondoner.com/almond-flour-bread-keto-bread-recipe/"}],"comparedVersions":"Compared Coleby\u0027s coconut-flour free-form loaf, Kalyn\u0027s almond-flour olive quick bread, and an almond-psyllium loaf with olives folded in. Coleby\u0027s won: it is naturally dairy-free, cheapest per loaf (coconut flour goes far), and the free-form boule with scored top looks like artisan bread on a table. Note: this is the one candidate where coconut flour beat almond flour, so \u0027almond flour\u0027 in the brief was set aside deliberately.","nameHe":"לחם זיתים ורוזמרין (פרווה)","ingredientsHe":[{"amount":"1/2 כוס / 60 גרם","item":"קמח קוקוס"},{"amount":"2 כפות / 16 גרם","item":"אבקת פסיליום","israelNote":"סופר-פארם / חנויות טבע"},{"amount":"1 כף","item":"אבקת אפייה"},{"amount":"1/2 כפית","item":"מלח"},{"amount":"1 1/2 כפות","item":"רוזמרין קצוץ (טרי או יבש)"},{"amount":"4 בינוניות","item":"ביצים"},{"amount":"4 כפות / 60 מ\"ל","item":"שמן זית"},{"amount":"1 כף","item":"חומץ תפוחים"},{"amount":"75 גרם / כ-20 יחידות","item":"זיתים מגולענים (שחורים או ירוקים) קצוצים גס","israelNote":"זיתי קלמטה נותנים את הטעם החזק ביותר"},{"amount":"1/2 כוס / 120 מ\"ל","item":"מים רותחים"}],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית בנייר אפייה.","טורפים יחד את קמח הקוקוס, הפסיליום, אבקת האפייה, המלח והרוזמרין.","טורפים פנימה את הביצים ושמן הזית עד לערבוב אחיד, ואז מוסיפים את החומץ והזיתים הקצוצים.","מוזגים את המים הרותחים תוך ערבוב; ממתינים 2-3 דקות עד שהבצק מתעבה למסה נוחה לעיצוב.","מעצבים על הנייר כיכר עגולה ומעט כיפתית וחורצים מעל דוגמת שתי-וערב.","אופים כ-35 דקות עד שהלחם זהוב ומשמיע צליל חלול בהקשה מלמטה.","מצננים לפחות 20 דקות לפני חיתוך ל-10 פלחים."],"ketoVariantHe":"מברישים את הכיכר החמה בשמן זית ומלח בפתיתים לקרום בסגנון פוקאצ\u0027ה בלי תוספת פחמימות.","tipsHe":"פרווה לגמרי - שותף טבעי למנות בשריות או לסלטים. מייבשים את הזיתים לפני הקיפול פנימה כדי שהלחם יישאר אוורירי.","comparedVersionsHe":"השווינו את כיכר קמח הקוקוס החופשית של Coleby, לחם זיתים מהיר מקמח שקדים של Kalyn וכיכר שקדים-פסיליום עם זיתים מקופלים פנימה. הגרסה של Coleby ניצחה: היא נטולת חלב באופן טבעי, הזולה ביותר לכיכר (קמח קוקוס מספיק להרבה), והכיכר החופשית עם החריצה נראית כמו לחם ארטיזנלי על השולחן. הערה: זה המקרה היחיד שבו קמח קוקוס ניצח קמח שקדים, ולכן \u0027קמח שקדים\u0027 מהבריף נזנח כאן במכוון."},{"id":"sesame-crackers-pareve","name":"Toasted Sesame Crackers (Pareve)","category":"baking-savory","dietTags":"keto","kosherType":"pareve","servings":8,"prepTimeMin":15,"cookTimeMin":35,"difficulty":"easy","ingredients":[{"amount":"1 cup / 100 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/3 cup / 50 g","item":"sesame seeds, lightly toasted","israelNote":"shumshum — toast in a dry pan 2-3 min"},{"amount":"1/2 tsp","item":"baking powder"},{"amount":"1/2 tsp","item":"salt"},{"amount":"1 large","item":"egg"},{"amount":"1 tbsp","item":"toasted sesame oil (or olive oil)","israelNote":"shemen shumshum kalui"},{"amount":"1 tbsp","item":"water"}],"instructions":["Preheat the oven to 150°C / 300°F.","Whisk the almond flour, toasted sesame seeds, baking powder, and salt together.","Add the egg, sesame oil, and water and knead briefly until a cohesive dough forms.","Roll the dough between two sheets of parchment into a large square about 2-3 mm thick — even thickness matters more than shape.","Remove the top parchment and score the dough into ~5 cm squares with a knife or pizza cutter.","Slide the parchment onto a baking sheet and bake 30-40 minutes until golden and firm; watch the edges from 25 minutes.","Cool completely on the pan — they crisp as they cool — then snap apart along the score lines."],"nutrition":{"calories":132,"fatG":11.7,"satFatG":1.5,"proteinG":4.5,"carbsG":4.2,"fiberG":2.1,"netCarbsG":2.1,"sugarG":0.4,"sodiumMg":180},"ketoVariant":"Swap 2 tbsp of the sesame seeds for nigella (ketzach) for a Jerusalem-bagel flavor.","tips":"If outer crackers brown before the center is done, break off the finished ones and return the rest to the oven.","sources":[{"creator":"Carolyn Ketchum, All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/keto-sesame-crackers/"},{"creator":"Zuzana Paar, Low Carb No Carb","url":"https://www.lowcarb-nocarb.com/sesame-keto-crackers-recipe/"},{"creator":"SeriousKeto","url":"https://www.seriousketo.com/archives/6026"}],"comparedVersions":"Compared Ketchum\u0027s sesame-flour version, SeriousKeto\u0027s sesame-flax crackers, and Low Carb No Carb\u0027s basic sesame cracker. Kept Ketchum\u0027s low-and-slow bake (crispest result) but replaced hard-to-find sesame flour with extra toasted whole seeds, matching the simpler ingredient lists of the other two without losing crunch.","nameHe":"קרקרים בשומשום קלוי (פרווה)","ingredientsHe":[{"amount":"1 כוס / 100 גרם","item":"קמח שקדים"},{"amount":"1/3 כוס / 50 גרם","item":"שומשום קלוי קלות","israelNote":"קולים במחבת יבשה 2-3 דקות"},{"amount":"1/2 כפית","item":"אבקת אפייה"},{"amount":"1/2 כפית","item":"מלח"},{"amount":"1 גדולה","item":"ביצה"},{"amount":"1 כף","item":"שמן שומשום קלוי (או שמן זית)"},{"amount":"1 כף","item":"מים"}],"instructionsHe":["מחממים תנור ל-150 מעלות.","טורפים יחד את קמח השקדים, השומשום הקלוי, אבקת האפייה והמלח.","מוסיפים את הביצה, שמן השומשום והמים ולשים קצרות עד לקבלת בצק אחיד.","מרדדים את הבצק בין שני ניירות אפייה לריבוע גדול בעובי 2-3 מ\"מ - עובי אחיד חשוב יותר מהצורה.","מסירים את הנייר העליון ומסמנים בסכין או בגלגלת פיצה ריבועים של כ-5 ס\"מ.","מחליקים את הנייר לתבנית ואופים 30-40 דקות עד שהקרקרים זהובים ויציבים; משגיחים על השוליים מהדקה ה-25.","מצננים לגמרי על התבנית - הם נעשים פריכים תוך כדי הצינון - ואז שוברים לאורך הסימונים."],"ketoVariantHe":"מחליפים 2 כפות מהשומשום בקצח לטעם של בייגלה ירושלמי.","tipsHe":"אם הקרקרים החיצוניים משחימים לפני שהמרכז מוכן, שוברים החוצה את המוכנים ומחזירים את השאר לתנור.","comparedVersionsHe":"השווינו את גרסת קמח השומשום של Ketchum, קרקרים משומשום ופשתן של SeriousKeto וקרקר שומשום בסיסי של Low Carb No Carb. שמרנו על האפייה הארוכה בחום נמוך של Ketchum (התוצאה הפריכה ביותר) אך החלפנו את קמח השומשום הקשה להשגה בשומשום שלם קלוי נוסף, ברוח רשימות המרכיבים הפשוטות של השתיים האחרות - בלי לאבד קראנץ\u0027."},{"id":"cheddar-cheese-biscuits","name":"Cheddar Cheese Biscuits","nameHe":"ביסקוויטים (סקונס) עם גבינת צ\u0027דר","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":10,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"2 tsp","item":"baking powder","israelNote":"check kosher-for-passover if relevant"},{"amount":"2 tsp","item":"garlic powder (divided: 1.5 tsp dough, 0.5 tsp topping)"},{"amount":"0.5 tsp","item":"salt"},{"amount":"1","item":"large egg, whisked"},{"amount":"0.33 cup / 80 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"0.33 cup + 3 tbsp / 115 g","item":"butter, melted (divided: 75 g dough, 40 g topping)"},{"amount":"1.5 cups / 170 g","item":"shredded cheddar","israelNote":"cheddar (Tara/imported); Emek works in a pinch"},{"amount":"1 tbsp","item":"chopped parsley (for the topping)"}],"ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים מולבן"},{"amount":"2 כפיות","item":"אבקת אפייה","israelNote":"אם רלוונטי – לוודא כשרות לפסח"},{"amount":"2 כפיות","item":"אבקת שום (מחולק: 1.5 כפית לבצק, חצי כפית לציפוי)"},{"amount":"חצי כפית","item":"מלח"},{"amount":"1","item":"ביצה גדולה, טרופה"},{"amount":"שליש כוס / 80 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"שליש כוס + 3 כפות / 115 גרם","item":"חמאה מומסת (מחולק: 75 גרם לבצק, 40 גרם לציפוי)"},{"amount":"1.5 כוסות / 170 גרם","item":"צ\u0027דר מגורר","israelNote":"צ\u0027דר של טרה או מיובא; עמק עובד בלית ברירה"},{"amount":"1 כף","item":"פטרוזיליה קצוצה (לציפוי)"}],"instructions":["Heat the oven to 350°F / 180°C and line a baking sheet with baking paper.","Whisk the almond flour, baking powder, 1.5 tsp garlic powder and salt.","Stir in the egg, cream and 75 g melted butter until evenly combined, then fold in the cheddar.","Scoop 12 mounds onto the sheet with an ice-cream scoop, spacing them 5 cm apart; round the tops lightly.","Bake 12-16 minutes until golden and just firm.","Mix the remaining 40 g melted butter with 0.5 tsp garlic powder and the parsley; brush over the hot biscuits.","Cool 10 minutes on the tray before moving - they set as they cool."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מערבבים את קמח השקדים, אבקת האפייה, 1.5 כפית אבקת שום והמלח.","מוסיפים את הביצה, השמנת ו-75 גרם חמאה מומסת ומערבבים לתערובת אחידה, ואז מקפלים פנימה את הצ\u0027דר.","יוצרים 12 תלוליות על התבנית בעזרת כף גלידה, במרווחים של 5 ס\"מ; מעגלים קלות את החלק העליון.","אופים 12-16 דקות עד שהביסקוויטים זהובים ורק מתייצבים.","מערבבים את 40 גרם החמאה המומסת הנותרת עם חצי כפית אבקת שום והפטרוזיליה; מברישים על הביסקוויטים החמים.","מצננים 10 דקות על התבנית לפני שמזיזים – הם מתייצבים תוך כדי הצינון."],"nutrition":{"calories":258,"fatG":24.4,"satFatG":8.7,"proteinG":7.5,"carbsG":4.2,"fiberG":1.8,"netCarbsG":2.4,"sugarG":0.6,"sodiumMg":275},"tips":"The garlic-butter brush at the end is what gives the Red Lobster character - do not skip it.","tipsHe":"ההברשה בחמאת השום בסוף היא שנותנת את האופי של רד לובסטר – לא מדלגים עליה.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/keto-cheddar-bay-biscuits-recipe/"},{"creator":"Maebells (Annie Holmes)","url":"https://www.maebells.com/keto-cheddar-garlic-biscuits-low-carb-red-lobster-biscuit-copycat/"}],"comparedVersions":"Compared Wholesome Yum\u0027s drop-biscuit method (butter + cream + 1 egg, 12 biscuits) with Maebells\u0027 cream-cheese-based dough (2 eggs, chill step). Wholesome Yum\u0027s ratio won - no chilling needed, a taller fluffier biscuit, and one bowl - while Maebells confirmed the 350°F bake and garlic-butter finish.","comparedVersionsHe":"השווינו את שיטת ה-drop biscuits של Wholesome Yum (חמאה + שמנת + ביצה אחת, 12 ביסקוויטים) עם הבצק על בסיס גבינת שמנת של Maebells (2 ביצים, שלב צינון). היחס של Wholesome Yum ניצח – בלי צורך בצינון, ביסקוויט גבוה ואוורירי יותר, והכול בקערה אחת – בעוד Maebells אישרה את האפייה ב-180 מעלות ואת סיומת חמאת השום."},{"id":"rosemary-focaccia-almond","name":"Rosemary Focaccia (Almond Flour, Pareve)","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":15,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"1 cup / 105 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/3 cup / 40 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"1/3 cup / 36 g","item":"egg white protein powder (keeps it pareve; whey works but makes it dairy)","israelNote":"avkat chelbon (egg white protein) — health-food stores"},{"amount":"2 tbsp chopped + extra leaves","item":"fresh rosemary"},{"amount":"1 tbsp","item":"baking powder"},{"amount":"3/4 tsp + coarse salt for top","item":"salt"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/2 cup / 110 ml","item":"extra virgin olive oil"},{"amount":"2 large + 2 whites","item":"eggs"},{"amount":"1/4-1/2 cup / 60-120 ml","item":"water"}],"instructions":["Preheat the oven to 160°C / 325°F and line a baking sheet with lightly oiled parchment.","Whisk the almond flour, coconut flour, protein powder, chopped rosemary, baking powder, salt, and garlic powder together.","Stir in the olive oil, eggs, and egg whites, then add water a little at a time until you have a thick, sticky, spreadable dough.","With wet hands, pat the dough into a rectangle about 23x30 cm and 1.5 cm thick.","Press deep dimples all over with your fingertips, scatter rosemary leaves into them, and sprinkle with coarse salt.","Bake 20-25 minutes until golden and just firm to the touch.","Cool 10 minutes, drizzle with a little more olive oil, and cut into 12 squares."],"nutrition":{"calories":174,"fatG":14.8,"satFatG":2.0,"proteinG":6.0,"carbsG":5.0,"fiberG":2.5,"netCarbsG":2.5,"sugarG":0.8,"sodiumMg":300},"lowCarbVariant":"Fold in 40 g chopped sun-dried tomatoes for a richer version (+1 g net carbs per square).","tips":"The protein powder mimics gluten\u0027s structure — don\u0027t skip it, or the crumb turns dense and cakey.","sources":[{"creator":"Carolyn Ketchum, All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/keto-focaccia-bread/"},{"creator":"gnom-gnom","url":"https://www.gnom-gnom.com/paleo-keto-focaccia-bread/"},{"creator":"The Kellie Kitchen","url":"https://thekelliekitchen.com/rosemary-focaccia-bread/"}],"comparedVersions":"Compared Carolyn Ketchum\u0027s no-yeast almond+coconut focaccia, gnom-gnom\u0027s yeast-risen version, and a mozzarella-based one. Ketchum\u0027s won on simplicity (no proofing, one bowl) and an airy crumb from extra egg whites; her own dairy-free swap (egg white protein for whey) makes it pareve without changing the ratios.","nameHe":"פוקאצ\u0027ת רוזמרין מקמח שקדים (פרווה)","ingredientsHe":[{"amount":"1 כוס / 105 גרם","item":"קמח שקדים"},{"amount":"1/3 כוס / 40 גרם","item":"קמח קוקוס"},{"amount":"1/3 כוס / 36 גרם","item":"אבקת חלבון ביצה (שומרת על פרווה; אבקת חלבון מי-גבינה עובדת אך הופכת את המתכון לחלבי)","israelNote":"חנויות טבע / חנויות תוספי תזונה"},{"amount":"2 כפות קצוץ + עלים לפיזור","item":"רוזמרין טרי"},{"amount":"1 כף","item":"אבקת אפייה"},{"amount":"3/4 כפית + מלח גס לפיזור","item":"מלח"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/2 כוס / 110 מ\"ל","item":"שמן זית כתית מעולה"},{"amount":"2 ביצים + 2 חלבונים","item":"ביצים"},{"amount":"1/4-1/2 כוס / 60-120 מ\"ל","item":"מים"}],"instructionsHe":["מחממים תנור ל-160 מעלות ומרפדים תבנית בנייר אפייה משומן קלות.","טורפים יחד את קמח השקדים, קמח הקוקוס, אבקת החלבון, הרוזמרין הקצוץ, אבקת האפייה, המלח ואבקת השום.","מערבבים פנימה את שמן הזית, הביצים והחלבונים, ומוסיפים מים מעט-מעט עד לקבלת בצק סמיך, דביק וניתן למריחה.","בידיים רטובות משטחים את הבצק למלבן של כ-23x30 ס\"מ בעובי 1.5 ס\"מ.","מטביעים גומות עמוקות בכל השטח עם קצות האצבעות, מפזרים בהן עלי רוזמרין ומעל מלח גס.","אופים 20-25 דקות עד שהפוקאצ\u0027ה זהובה ויציבה קלות למגע.","מצננים 10 דקות, מזלפים עוד מעט שמן זית וחותכים ל-12 ריבועים."],"lowCarbVariantHe":"מקפלים פנימה 40 גרם עגבניות מיובשות קצוצות לגרסה עשירה יותר (+1 גרם פחמימות נטו לריבוע).","tipsHe":"אבקת החלבון מחקה את המבנה שנותן הגלוטן - לא לוותר עליה, אחרת המרקם יוצא דחוס ועוגתי.","comparedVersionsHe":"השווינו את פוקאצ\u0027ת השקדים-קוקוס ללא שמרים של Carolyn Ketchum, גרסת שמרים של gnom-gnom וגרסה על בסיס מוצרלה. הגרסה של Ketchum ניצחה בפשטות (בלי התפחה, קערה אחת) ובמרקם אוורירי מחלבוני ביצה נוספים; ההחלפה נטולת החלב שהיא עצמה מציעה (חלבון ביצה במקום מי-גבינה) הופכת את המתכון לפרווה בלי לשנות את היחסים."},{"id":"pareve-keto-challah","name":"Braided Keto Challah (Pareve)","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":12,"prepTimeMin":25,"cookTimeMin":40,"difficulty":"medium","ingredients":[{"amount":"2 cups / 200 g","item":"almond flour (superfine, blanched)","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 30 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tbsp / 16 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores) — grind whole husks if needed"},{"amount":"2 tsp","item":"instant dry yeast (for flavor and aroma)"},{"amount":"1 tbsp","item":"erythritol or other keto sweetener","israelNote":"erythritol/stevia blend (Sukrazit Zero, health stores)"},{"amount":"2 tsp","item":"baking powder"},{"amount":"3/4 tsp","item":"salt"},{"amount":"2 large + 2 whites","item":"eggs (reserve 1 yolk from the whites for the glaze)"},{"amount":"3 tbsp / 45 ml","item":"olive oil (keeps it pareve — do not use butter)"},{"amount":"1/2 cup / 120 ml + 1 tbsp","item":"warm water, plus sesame seeds for topping"}],"instructions":["Stir the yeast and sweetener into the warm water (about 40°C) and let it sit 10 minutes until foamy — the yeast is mainly for authentic challah flavor, since the dough rises from baking powder.","Whisk almond flour, coconut flour, psyllium powder, baking powder, and salt in a large bowl.","Beat 2 eggs and 2 egg whites (set 1 yolk aside for the glaze) with the olive oil, then mix into the dry ingredients together with the yeast water until a workable dough forms. Let it rest 10 minutes — the psyllium and coconut flour will firm it up.","Preheat the oven to 175°C / 350°F and line a baking sheet with parchment.","With lightly oiled hands, divide the dough into 3 equal pieces and roll each into a rope about 30 cm long. Dust with a little almond flour if sticky.","Braid the three ropes, pinching and tucking the ends under, and place on the baking sheet.","Whisk the reserved yolk with 1 tsp water, brush over the braid, and sprinkle with sesame seeds.","Bake 35-40 minutes until deep golden and firm; tent with foil after 25 minutes if browning too fast. Cool at least 15 minutes before slicing."],"nutrition":{"calories":164,"fatG":13.7,"satFatG":1.4,"proteinG":5.7,"carbsG":6.5,"fiberG":4.0,"netCarbsG":2.5,"sugarG":0.5,"sodiumMg":230},"lowCarbVariant":"For a slightly sweeter, softer Shabbat loaf add 1 extra tbsp sweetener and 1 tsp vanilla — carbs barely change.","tips":"Because there is no gluten, keep the ropes thick and the braid loose — a tight braid can crack while baking.","sources":[{"creator":"Caroline\u0027s Keto Kitchen","url":"https://www.carolinesketokitchen.com/2017/09/low-carb-challah.html"},{"creator":"Lindsay, Starfish in the Kitchen","url":"https://starfishinthekitchen.com/keto-beautiful-braided-challah-bread/"},{"creator":"Martina Slajerova, KetoDiet Blog","url":"https://ketodietapp.com/Blog/lchf/keto-challah-bread"},{"creator":"Katrin Nürnberger, Sugar Free Londoner","url":"https://sugarfreelondoner.com/almond-flour-bread-keto-bread-recipe/"}],"comparedVersions":"Compared a fathead-cheese challah (KetoDiet — dairy, so unusable for meat meals), a whey-protein yeast loaf (Caroline\u0027s) and a vital-wheat-gluten braid (Starfish — butter, dairy). Synthesized a fully pareve braid: Sugar Free Londoner\u0027s braidable almond-psyllium dough structure plus Caroline\u0027s bloomed-yeast-for-flavor trick and classic yolk glaze, so it works alongside a meat Shabbat meal.","nameHe":"חלה קלועה קיטו (פרווה)","ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים (טחון דק, מקולף)"},{"amount":"1/4 כוס / 30 גרם","item":"קמח קוקוס"},{"amount":"2 כפות / 16 גרם","item":"אבקת פסיליום","israelNote":"סופר-פארם / חנויות טבע - אפשר לטחון קליפות שלמות במטחנה"},{"amount":"2 כפיות","item":"שמרים יבשים אינסטנט (לטעם ולניחוח)"},{"amount":"1 כף","item":"אריתריטול או ממתיק קיטו אחר","israelNote":"תערובת אריתריטול/סטיביה (סוכרזית Zero, חנויות טבע)"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"3/4 כפית","item":"מלח"},{"amount":"2 ביצים + 2 חלבונים","item":"ביצים (שומרים חלמון אחד מהחלבונים לזיגוג)"},{"amount":"3 כפות / 45 מ\"ל","item":"שמן זית (שומר על המתכון פרווה - לא להשתמש בחמאה)"},{"amount":"1/2 כוס / 120 מ\"ל + 1 כף","item":"מים חמימים, ושומשום לפיזור מעל"}],"instructionsHe":["מערבבים את השמרים והממתיק במים החמימים (כ-40 מעלות) וממתינים 10 דקות עד להיווצרות קצף - השמרים כאן בעיקר לטעם חלה אותנטי, כי הבצק תופח מאבקת האפייה.","טורפים בקערה גדולה את קמח השקדים, קמח הקוקוס, אבקת הפסיליום, אבקת האפייה והמלח.","טורפים 2 ביצים ו-2 חלבונים (שומרים חלמון אחד בצד לזיגוג) עם שמן הזית, ומערבבים לתוך היבשים יחד עם מי השמרים עד לקבלת בצק נוח לעבודה. נותנים לו לנוח 10 דקות - הפסיליום וקמח הקוקוס ייצבו אותו.","מחממים תנור ל-175 מעלות ומרפדים תבנית בנייר אפייה.","בידיים משומנות קלות, מחלקים את הבצק ל-3 חלקים שווים ומגלגלים כל אחד לנחש באורך כ-30 ס\"מ. אם דביק, מאבקים מעט בקמח שקדים.","קולעים את שלושת הנחשים, צובטים ומקפלים את הקצוות מתחת, ומניחים על התבנית.","טורפים את החלמון ששמרנו עם כפית מים, מברישים את הקליעה ומפזרים שומשום.","אופים 35-40 דקות עד שהחלה זהובה כהה ויציבה; מכסים ברדיד אלומיניום אחרי 25 דקות אם היא משחימה מהר מדי. מצננים לפחות 15 דקות לפני הפריסה."],"lowCarbVariantHe":"לחלה מתוקה ורכה יותר לשבת מוסיפים כף ממתיק נוספת וכפית וניל - הפחמימות כמעט לא משתנות.","tipsHe":"מכיוון שאין גלוטן, שומרים על נחשים עבים וקליעה רפויה - קליעה הדוקה עלולה להיסדק באפייה.","comparedVersionsHe":"השווינו חלת גבינה בשיטת פאטהד (KetoDiet - חלבית, ולכן לא מתאימה לארוחות בשריות), כיכר שמרים עם אבקת חלבון מי-גבינה (Caroline\u0027s) וקליעה עם גלוטן חיטה (Starfish - עם חמאה, חלבית). הרכבנו קליעה פרווה לגמרי: מבנה בצק השקדים-פסיליום הניתן לקליעה של Sugar Free Londoner, עם טריק השמרים המושרים לטעם של Caroline\u0027s וזיגוג החלמון הקלאסי - כך שהחלה משתלבת בארוחת שבת בשרית."},{"id":"pareve-keto-burger-buns","name":"Keto Burger Buns (Pareve)","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":50,"difficulty":"easy","ingredients":[{"amount":"1 1/4 cups / 125 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"5 tbsp / 40 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"2 tsp","item":"baking powder"},{"amount":"1 tsp","item":"salt"},{"amount":"3","item":"egg whites"},{"amount":"2 tsp","item":"apple cider vinegar","israelNote":"chometz tapuchim"},{"amount":"1 cup / 240 ml","item":"boiling water"},{"amount":"1 tbsp","item":"olive oil, for brushing"},{"amount":"1 tbsp","item":"sesame seeds"}],"instructions":["Preheat the oven to 175°C / 350°F and line a baking sheet with parchment.","Whisk almond flour, psyllium powder, baking powder, and salt in a bowl.","Add the egg whites and vinegar and stir, then pour in the boiling water while mixing vigorously — the dough thickens within about 30 seconds into a moldable ball.","With wet hands, shape 6 equal balls and place them on the sheet with room to expand; they roughly double in size.","Brush with olive oil and sprinkle with sesame seeds.","Bake 45-55 minutes on a lower rack until the crust is firm and a bun sounds hollow when tapped underneath.","Cool on a rack, then split with a serrated knife. If the inside seems moist, toast the cut faces briefly."],"nutrition":{"calories":171,"fatG":13.5,"satFatG":1.1,"proteinG":6.5,"carbsG":10.5,"fiberG":8.0,"netCarbsG":2.5,"sugarG":0.7,"sodiumMg":560},"ketoVariant":"For an even lighter bun, replace 25 g of the almond flour with 2 tbsp coconut flour and add one extra egg white.","tips":"Entirely pareve — the go-to bun for meat burgers. Gray-tinted crumb is normal with some psyllium brands and harmless.","sources":[{"creator":"Ioana, Low Carb Spark","url":"https://www.lowcarbspark.com/keto-bread-buns/"},{"creator":"Katrin Nürnberger, Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-buns/"},{"creator":"Cast Iron Keto","url":"https://www.castironketo.net/blog/keto-buns/"}],"comparedVersions":"Compared Low Carb Spark\u0027s almond-psyllium boiling-water buns (2 g net) with Sugar Free Londoner\u0027s smaller almond+coconut version (3.3 g net). Chose the psyllium-heavy ratio for a genuinely burger-sized, springy bun that holds a wet patty without crumbling, with SFL\u0027s wet-hands shaping and scoring technique.","nameHe":"לחמניות המבורגר קיטו (פרווה)","ingredientsHe":[{"amount":"1 1/4 כוסות / 125 גרם","item":"קמח שקדים"},{"amount":"5 כפות / 40 גרם","item":"אבקת פסיליום","israelNote":"סופר-פארם / חנויות טבע"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"1 כפית","item":"מלח"},{"amount":"3","item":"חלבוני ביצה"},{"amount":"2 כפיות","item":"חומץ תפוחים"},{"amount":"1 כוס / 240 מ\"ל","item":"מים רותחים"},{"amount":"1 כף","item":"שמן זית להברשה"},{"amount":"1 כף","item":"שומשום"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית בנייר אפייה.","טורפים בקערה את קמח השקדים, אבקת הפסיליום, אבקת האפייה והמלח.","מוסיפים את החלבונים והחומץ ומערבבים, ואז מוזגים את המים הרותחים תוך ערבוב נמרץ - הבצק מתעבה תוך כ-30 שניות לכדור נוח לעיצוב.","בידיים רטובות מעצבים 6 כדורים שווים ומניחים על התבנית עם רווח להתרחבות; הם כמעט מכפילים את נפחם.","מברישים בשמן זית ומפזרים שומשום.","אופים 45-55 דקות במדף תחתון עד שהקרום יציב והלחמנייה משמיעה צליל חלול בהקשה מלמטה.","מצננים על רשת ופורסים בסכין משוננת. אם הפנים לח מדי, קולים קלות את צדי החיתוך."],"ketoVariantHe":"ללחמנייה אוורירית עוד יותר מחליפים 25 גרם מקמח השקדים ב-2 כפות קמח קוקוס ומוסיפים חלבון ביצה נוסף.","tipsHe":"פרווה לחלוטין - הלחמנייה המושלמת להמבורגר בשרי. גוון אפרפר בפנים הלחמנייה תקין בחלק ממותגי הפסיליום ואינו מזיק.","comparedVersionsHe":"השווינו את לחמניות המים הרותחים מקמח שקדים ופסיליום של Low Carb Spark (2 גרם נטו) עם הגרסה הקטנה יותר מקמח שקדים וקוקוס של Sugar Free Londoner (3.3 גרם נטו). בחרנו ביחס עתיר הפסיליום ללחמנייה קפיצית בגודל אמיתי של המבורגר, שמחזיקה קציצה עסיסית בלי להתפורר, עם טכניקת העיצוב בידיים רטובות והחריצה של SFL."},{"id":"psyllium-husk-sandwich-bread","name":"Psyllium-Husk Sandwich Bread","nameHe":"לחם כריכים מפסיליום","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":16,"prepTimeMin":10,"cookTimeMin":45,"difficulty":"medium","ingredients":[{"amount":"2.5 cups / 250 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"0.5 cup / 56 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"0.5 cup / 44 g","item":"psyllium husk powder","israelNote":"psyllium (pharma/health stores, e.g. iHerb/SuperPharm); halve amount if substituting whole husks is reversed - powder is double-strength"},{"amount":"3 tsp","item":"baking powder","israelNote":"check kosher-for-passover if relevant"},{"amount":"0.5 tsp","item":"salt"},{"amount":"6","item":"egg whites (about 200 g)"},{"amount":"4 tbsp / 60 ml","item":"apple cider vinegar","israelNote":"chometz tapuchim"},{"amount":"1 cup / 240 ml","item":"warm water"}],"ingredientsHe":[{"amount":"2.5 כוסות / 250 גרם","item":"קמח שקדים מולבן"},{"amount":"חצי כוס / 56 גרם","item":"קמח קוקוס"},{"amount":"חצי כוס / 44 גרם","item":"אבקת פסיליום","israelNote":"סופר-פארם / חנויות טבע / iHerb; אם מחליפים בפסיליום שלם – מכפילים את הכמות (האבקה חזקה פי שניים)"},{"amount":"3 כפיות","item":"אבקת אפייה","israelNote":"אם רלוונטי – לוודא כשרות לפסח"},{"amount":"חצי כפית","item":"מלח"},{"amount":"6","item":"חלבוני ביצה (כ-200 גרם)"},{"amount":"4 כפות / 60 מ\"ל","item":"חומץ תפוחים"},{"amount":"1 כוס / 240 מ\"ל","item":"מים חמימים"}],"instructions":["Heat the oven to 350°F / 180°C and line a loaf pan with baking paper.","Whip the egg whites with the vinegar briefly until foamy.","In a separate bowl whisk the almond flour, coconut flour, psyllium powder, baking powder and salt.","Fold the dry mix into the whites with a spatula, add the warm water, and stir gently just until a thick, elastic dough forms - do not overmix.","Transfer to the pan, shape a rounded top with wet hands, and bake 40-45 minutes until deep golden and firm.","Cool completely before slicing into 16 slices; psyllium bread firms up as it cools."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית אינגליש קייק בנייר אפייה.","מקציפים קצרות את החלבונים עם החומץ עד שהם קצפיים.","בקערה נפרדת מערבבים את קמח השקדים, קמח הקוקוס, אבקת הפסיליום, אבקת האפייה והמלח.","מקפלים את התערובת היבשה לחלבונים בעזרת מרית, מוסיפים את המים החמימים ומערבבים בעדינות רק עד לקבלת בצק סמיך וגמיש – לא מערבבים יותר מדי.","מעבירים לתבנית, מעצבים חלק עליון מעוגל בידיים רטובות ואופים 40-45 דקות עד שהלחם זהוב עמוק ויציב.","מצננים לגמרי לפני שפורסים ל-16 פרוסות; לחם פסיליום מתייצב תוך כדי הצינון."],"nutrition":{"calories":122,"fatG":8.9,"satFatG":1.1,"proteinG":5.4,"carbsG":7.6,"fiberG":5.0,"netCarbsG":2.6,"sugarG":0.9,"sodiumMg":148},"tips":"Fully pareve - the go-to sandwich loaf for meat meals. If the crumb ever looks purple-grey, it is a harmless quirk of some psyllium brands; blonde psyllium avoids it.","tipsHe":"פרווה לחלוטין – לחם הכריכים המושלם לארוחות בשריות. אם הפנים נראה סגלגל-אפור, זו תופעה לא מזיקה של חלק ממותגי הפסיליום; פסיליום בהיר (blonde) מונע אותה.","sources":[{"creator":"Healthy Life Trainer","url":"https://www.healthylifetrainer.com/psyllium-husk-keto-bread-recipe/"},{"creator":"My PCOS Kitchen (Mira)","url":"https://www.mypcoskitchen.com/keto-psyllium-buns-2/"
