/* ---------- community: shared ratings & family recipes ---------- */
let artifactCap = null, capResolved = false;
async function getCap(){
  if(capResolved) return artifactCap;
  capResolved = true;
  try{
    if(window.claude && window.claude.use){
      artifactCap = (await window.claude.use("artifact")) || (await window.claude.use("self"));
    }
  }catch(e){ artifactCap = null; }
  return artifactCap;
}
getCap().then(c=>{ if(c){ document.body.classList.add("can-community"); $("addBtn").hidden = false; $("reqBtn").hidden = false; route(); } });

function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._h);
  el._h = setTimeout(()=>el.classList.remove("show"), 3500);
}

async function publishCommunity(){
  const cap = await getCap();
  if(!cap){ toast(t("readOnlyNote")); return false; }
  const json = JSON.stringify(COMMUNITY).replace(/</g, "\\u003c");
  const html = PAGE_SNAPSHOT.replace(
    /(<script[^>]*id="communityData"[^>]*>)[\s\S]*?(<\/script>)/,
    (m, a, b) => a + json + b
  );
  try{
    await cap.publish(html);
    return true;
  }catch(e){
    const code = String((e && (e.code || e.message)) || e);
    if(/conflict/i.test(code)) toast(t("conflictNote"));
    else if(/not_granted|not_writer/i.test(code)) toast(t("readOnlyNote"));
    else toast("Error: " + code.slice(0,90));
    return false;
  }
}

function myRating(id){ try{ return (JSON.parse(localStorage.getItem("klk-rated")||"{}"))[id] || 0; }catch(e){ return 0; } }
function setMyRating(id, s){ try{ const m = JSON.parse(localStorage.getItem("klk-rated")||"{}"); m[id]=s; localStorage.setItem("klk-rated", JSON.stringify(m)); }catch(e){} }
function avgOf(id){ const e = COMMUNITY.ratings[id]; return (e && e.count) ? {avg:(e.sum/e.count), count:e.count} : null; }

function rateBoxHTML(id){
  const a = avgOf(id);
  const avgTxt = a ? `★ ${a.avg.toFixed(1)} · ${a.count} ${t("votes")}` : "";
  if(!document.body.classList.contains("can-community"))
    return a ? `<div class="rate-box"><span class="avg-note">${avgTxt}</span></div>` : "";
  const mine = myRating(id);
  let stars = "";
  for(let s=1; s<=5; s++) stars += `<button data-rs="${s}" data-rid="${esc(id)}" class="${s<=mine?"on":""}" aria-label="${s}★">★</button>`;
  return `<div class="rate-box" id="rateBox"><span class="lbl">${t("rate")}</span><span class="stars">${stars}</span><span class="avg-note">${avgTxt}</span></div>`;
}

async function rate(id, stars){
  const prev = myRating(id);
  const e = COMMUNITY.ratings[id] || (COMMUNITY.ratings[id] = {sum:0, count:0});
  if(prev) e.sum += stars - prev; else { e.sum += stars; e.count++; }
  setMyRating(id, stars);
  const box = $("rateBox");
  if(box) box.outerHTML = rateBoxHTML(id);
  const ok = await publishCommunity();
  if(!ok){
    if(prev) e.sum -= stars - prev;
    else { e.sum -= stars; e.count--; }
    setMyRating(id, prev);
    const b2 = $("rateBox");
    if(b2) b2.outerHTML = rateBoxHTML(id);
  }
}

 ["sec_choc", /chocolate|cocoa butter/],

 ["sec_dairy", /cheese|cream|butter|milk|yogurt|labneh|labaneh|egg|mascarpone|ricotta|mozzarella|parmesan|feta|halloumi|cottage|kashkaval|gvina/],
 ["sec_spice", /salt|black pepper|white pepper|cayenne|chili flakes|cinnamon|paprika|cumin|oregano|za'?atar|caraway|cardamom|nutmeg|ginger|turmeric|onion powder|garlic powder|everything|seasoning|spice|rose water|coffee|espresso|bay leaf|dill seed/],
 ["sec_produce", /zucchini|cauliflower|broccoli|spinach|kale|pepper|tomato|onion|garlic|cucumber|celery|lettuce|cabbage|mushroom|portobello|eggplant|avocado|berr|lemon|lime|orange|apple|basil|parsley|cilantro|dill|rosemary|thyme|mint|chive|scallion|leek|radish|kohlrabi|pumpkin|olive|carrot|herb|tofu|salmon|tuna/],
 ["sec_oils", /oil|vinegar|mayonnaise|mustard|soy sauce|tamari|aminos|tomato paste|broth|stock|wine|pickle|caper|water/]
];
function pantrySection(key){
  for(const [sec,re] of PANTRY_RULES){ if(re.test(key)) return sec; }
  return "sec_other";
}
function pantryHTML(){
  const map = new Map();
  for(const r of RECIPES){
    const en = r.ingredients||[], he = r.ingredientsHe||[];
    const seen = new Set();
    en.forEach((ing,i)=>{
      const key = shortItem(ing.item).toLowerCase();
      if(!key || seen.has(key)) return;
      seen.add(key);
      const disp = (lang==="he" && he[i] && he[i].item) ? shortItem(he[i].item) : shortItem(ing.item);
      const e = map.get(key) || {key, display:disp, count:0};
      e.count++;
      if(lang==="he" && /[א-ת]/.test(disp)) e.display = disp;
      map.set(key, e);
    });
  }
  const bySec = {};
  for(const e of map.values()){
    const sec = pantrySection(e.key);
    (bySec[sec] = bySec[sec] || []).push(e);
  }
  const order = ["sec_produce","sec_dairy","sec_nuts","sec_flour","sec_sweet","sec_choc","sec_oils","sec_spice","sec_other"];
  let html = `<div class="back-row no-print"><button class="ghost-btn" id="pantryBackBtn">${t("back")}</button></div>
    <div class="pantry-head"><h2>${t("pantryTitle")}</h2><p class="pantry-sub">${t("pantrySub")}</p></div>`;
  for(const sec of order){
    const list = bySec[sec];
    if(!list || !list.length) continue;
    list.sort((a,b)=> b.count-a.count || a.display.localeCompare(b.display, lang==="he"?"he":"en"));
    html += `<div class="section-head"><h2>${t(sec)}</h2><span class="n">${list.length}</span></div><div class="ing-cloud">`;
    html += list.map(e=>`<button class="ing-chip" data-q="${esc(e.display)}">${esc(e.display)}<span class="n">×${e.count}</span></button>`).join("");
    html += `</div>`;
  }
  return html;
}

  $("listView").hidden = true;
  $("recipeView").hidden = true;
  $("controls").hidden = true;
  const v = $("pantryView");
  v.hidden = false;
