<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosher Low-Carb Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F7F8F3;
  --panel:#FFFFFF;
  --panel-2:#EFF2E8;
  --ink:#232819;
  --ink-soft:#5A614C;
  --line:#DDE2D0;
  --accent:#55742F;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4EBD6;
  --dairy:#3E6B8C;
  --dairy-bg:#E3EDF5;
  --pareve:#4A7A52;
  --pareve-bg:#E2F0E4;
  --keto:#8C5A2E;
  --keto-bg:#F3E9DC;
  --shadow:0 1px 3px rgba(35,40,25,.08),0 6px 18px rgba(35,40,25,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15170F;
    --panel:#1E2216;
    --panel-2:#262B1D;
    --ink:#E7EADC;
    --ink-soft:#A8AF97;
    --line:#363D2A;
    --accent:#9DBB68;
    --accent-ink:#1A2010;
    --accent-soft:#2E3620;
    --dairy:#8FB8D6;
    --dairy-bg:#22303B;
    --pareve:#8FC69A;
    --pareve-bg:#213526;
    --keto:#D6A972;
    --keto-bg:#382C1D;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#15170F;
  --panel:#1E2216;
  --panel-2:#262B1D;
  --ink:#E7EADC;
  --ink-soft:#A8AF97;
  --line:#363D2A;
  --accent:#9DBB68;
  --accent-ink:#1A2010;
  --accent-soft:#2E3620;
  --dairy:#8FB8D6;
  --dairy-bg:#22303B;
  --pareve:#8FC69A;
  --pareve-bg:#213526;
  --keto:#D6A972;
  --keto-bg:#382C1D;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'Karla','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.55;
}
[dir="rtl"] body, body[dir="rtl"]{font-family:'Heebo','Karla',system-ui,sans-serif}
h1,h2,h3{font-family:'Fraunces','Heebo',Georgia,serif;line-height:1.15;text-wrap:balance;margin:0}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:'Heebo',Georgia,serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}

.wrap{max-width:1060px;margin-inline:auto;padding-inline:20px}

/* ---------- header ---------- */
header.site{
  padding-block:26px 14px;
  border-block-end:1px solid var(--line);
  background:var(--panel);
}
.site-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.site h1{font-size:clamp(26px,4.5vw,38px);font-weight:700}
.site h1 .leaf{color:var(--accent)}
.tagline{color:var(--ink-soft);margin-block:4px 0;font-size:14.5px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost-btn{
  background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 13px;font-weight:500;font-size:14px;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent)}
.solid-btn{
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px;
}

/* ---------- controls ---------- */
.controls{padding-block:16px;display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-row input[type=search]{
  flex:1;min-width:220px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:10px 14px;font:inherit;
}
.search-row input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin-inline-end:2px}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;
}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cat-row{display:flex;gap:8px;flex-wrap:wrap}
.count-note{color:var(--ink-soft);font-size:13.5px}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.03em}
.badge.dairy{background:var(--dairy-bg);color:var(--dairy)}
.badge.pareve{background:var(--pareve-bg);color:var(--pareve)}
.badge.keto{background:var(--keto-bg);color:var(--keto)}
.badge.lowcarb{background:var(--accent-soft);color:var(--accent)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- illustrations ---------- */
.illus{display:flex;justify-content:center;align-items:center;background:var(--panel-2);border-radius:9px}
.card .illus{padding:4px 0;margin-block-end:2px}
.card .illus svg{height:72px}
.recipe .illus{padding:10px 0;margin-block:4px 16px;border-radius:12px}
.recipe .illus svg{height:112px}
.illus .st{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.illus .sf{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.illus .f0{fill:var(--panel)}
.illus .f1{fill:var(--accent-soft)}
.illus .f2{fill:var(--keto-bg)}
.illus .f3{fill:var(--pareve-bg)}
.illus .f4{fill:var(--dairy-bg)}
.illus .a{fill:var(--accent)}
.illus .k{fill:var(--keto)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-block:6px 40px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;
  text-align:start;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .12s ease,border-color .12s ease;
}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h3{font-size:19px;font-weight:600}
.card-ings{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .badges{display:flex;gap:6px;flex-wrap:wrap}
.card .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-block-start:auto;padding-block-start:6px;border-block-start:1px dashed var(--line)}
.card .carbs{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.card .carbs small{font-family:'Karla','Heebo',sans-serif;font-size:11px;font-weight:500;color:var(--ink-soft);display:block;letter-spacing:.05em;text-transform:uppercase}
.card .time{color:var(--ink-soft);font-size:13px;text-align:end}
.section-head{display:flex;align-items:baseline;gap:10px;margin-block:18px 10px}
.section-head h2{font-size:22px}
.section-head .n{color:var(--ink-soft);font-size:14px}
.empty{color:var(--ink-soft);padding-block:40px;text-align:center}

/* ---------- recipe view ---------- */
.recipe-view{padding-block:18px 60px}
.back-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-block-end:14px}
article.recipe{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:clamp(18px,4vw,34px);box-shadow:var(--shadow);
}
.recipe .badges{display:flex;gap:7px;flex-wrap:wrap;margin-block-end:10px}
.recipe h2{font-size:clamp(24px,4vw,32px);font-weight:700}
.meta-row{
  display:flex;gap:0;flex-wrap:wrap;margin-block:16px 20px;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2);
}
.meta-cell{padding:9px 16px;border-inline-end:1px solid var(--line);font-size:13.5px}
.meta-cell:last-child{border-inline-end:none}
.meta-cell b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.recipe-cols{display:grid;grid-template-columns:290px 1fr;gap:28px}
@media (max-width:720px){.recipe-cols{grid-template-columns:1fr}}
.recipe h4{
  font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  margin:0 0 8px;font-weight:700;font-family:'Karla','Heebo',sans-serif;
}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{padding-block:7px;border-block-end:1px dashed var(--line);font-size:15px}
.ing-list li b{font-weight:700}
.ing-list .il-note{display:block;font-size:12.5px;color:var(--ink-soft)}
.ing-list .il-note::before{content:"🇮🇱 "}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.steps li::marker{color:var(--accent);font-weight:700}
.variant-box{
  margin-block-start:18px;background:var(--accent-soft);border-radius:10px;padding:13px 16px;font-size:14.5px;
}
.variant-box b{color:var(--accent)}
.tip-box{margin-block-start:12px;border-inline-start:3px solid var(--keto);padding:4px 14px;color:var(--ink-soft);font-size:14.5px}

/* nutrition label */
.nutri{
  margin-block-start:20px;border:2px solid var(--ink);border-radius:8px;padding:12px 14px;max-width:290px;
  font-variant-numeric:tabular-nums;background:var(--panel);
}
.nutri h5{margin:0;font-family:'Fraunces',Georgia,serif;font-size:17px;border-block-end:4px solid var(--ink);padding-block-end:6px}
.nutri .per{font-size:12px;color:var(--ink-soft);padding-block:4px;border-block-end:1px solid var(--line)}
.nutri table{width:100%;border-collapse:collapse;font-size:13.5px}
.nutri td{padding-block:4px;border-block-end:1px solid var(--line)}
.nutri td:last-child{text-align:end;font-weight:700}
.nutri tr.big td{font-weight:700;font-size:14.5px}
.nutri tr.net td{color:var(--accent);font-weight:700}
.nutri tr:last-child td{border-block-end:none}
.nutri .sub td:first-child{padding-inline-start:16px;font-weight:400}

.src-row{margin-block-start:22px;padding-block-start:12px;border-block-start:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
.src-row a{color:var(--ink-soft);text-decoration:underline}
.src-row a:hover{color:var(--accent)}
.why{font-style:italic;margin-block-start:6px}

/* ---------- pantry ---------- */
.pantry{padding-block:18px 60px}
.pantry-head{margin-block-end:6px}
.pantry-head h2{font-size:clamp(22px,4vw,30px)}
.pantry-sub{color:var(--ink-soft);font-size:14.5px;margin-block:6px 18px}
.ing-cloud{display:flex;flex-wrap:wrap;gap:8px;padding-block:2px 20px}
.ing-chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:baseline;gap:6px}
.ing-chip:hover{border-color:var(--accent);color:var(--accent)}
.ing-chip .n{color:var(--ink-soft);font-size:11.5px;font-variant-numeric:tabular-nums}

/* ---------- community: ratings & submissions ---------- */
.rate-box{margin-block-start:18px;padding:12px 16px;background:var(--panel-2);border-radius:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rate-box .lbl{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.stars{display:inline-flex}
.stars button{background:none;border:none;padding:0 3px;font-size:24px;line-height:1;color:var(--line);cursor:pointer}
.stars button.on{color:var(--keto)}
.stars button:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.avg-note{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.star-badge{color:var(--keto);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.form-grid{display:grid;gap:14px;max-width:560px;margin-block-start:14px}
.form-grid label{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;display:block;margin-block-end:4px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;color:var(--ink)}
.form-grid textarea{min-height:110px;resize:vertical}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.form-actions{display:flex;gap:10px}
.fam-by{font-size:12.5px;color:var(--ink-soft)}
.req-list{display:flex;flex-direction:column;gap:8px;padding-block:2px 30px}
.req-item{display:flex;gap:10px;align-items:baseline;padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.req-item b{font-size:15px}
.req-by{font-size:12.5px;color:var(--ink-soft)}
.req-status{font-size:12px;font-weight:700;color:var(--keto);margin-inline-start:auto}
.req-status.added{color:var(--pareve)}
.toast{position:fixed;inset-block-end:18px;inset-inline-start:0;inset-inline-end:0;margin-inline:auto;width:fit-content;max-width:85vw;background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}

/* ---------- print root ---------- */
#printRoot{display:none}

@media print{
  body{background:#fff;color:#000}
  #app,header.site{display:none !important}
  #printRoot{display:block;font-size:12pt}
  #printRoot .print-recipe{break-before:page;padding-block-start:0}
  #printRoot .print-recipe:first-of-type,#printRoot .toc + .print-recipe{break-before:auto}
  #printRoot h2{font-size:20pt;margin:0 0 4pt}
  #printRoot h3{font-size:15pt;margin:14pt 0 6pt}
  #printRoot .pbadges{font-size:9.5pt;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-block-end:6pt}
  #printRoot .pmeta{font-size:10pt;margin-block-end:10pt;color:#333}
  #printRoot ul,#printRoot ol{margin:4pt 0 10pt;padding-inline-start:18pt}
  #printRoot li{margin-block-end:3pt}
  #printRoot .pnote{font-size:9.5pt;color:#444}
  #printRoot .pnutri{font-size:9.5pt;border:1pt solid #000;padding:6pt 8pt;margin-block-start:8pt;display:inline-block}
  #printRoot .psrc{font-size:8.5pt;color:#555;margin-block-start:8pt}
  #printRoot .toc{break-after:page}
  #printRoot .toc li{margin-block-end:2pt}
  #printRoot .book-title{font-size:28pt;text-align:center;margin-block:60pt 8pt}
  #printRoot .book-sub{text-align:center;font-size:12pt;color:#444;margin-block-end:40pt}
  .no-print{display:none !important}
}

/* footer */
footer.site{border-block-start:1px solid var(--line);padding-block:20px 34px;color:var(--ink-soft);font-size:13px}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>

const RECIPES = [{"id":"spinach-feta-frittata","name":"Spinach \u0026 Feta Frittata","nameHe":"פריטטת תרד ובולגרית","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":20,"difficulty":"easy","ingredients":[{"amount":"8 large","item":"eggs"},{"amount":"1/4 cup / 60 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"3","item":"scallions (or 1/2 small onion), sliced"},{"amount":"5 cups fresh / 150 g","item":"spinach (or 200 g frozen, thawed and squeezed dry)","israelNote":"tered; frozen spinach cubes work well"},{"amount":"3/4 cup / 100 g","item":"crumbled feta","israelNote":"gvinat tzfatit/Bulgarit"},{"amount":"1/4 tsp each","item":"salt and black pepper"},{"amount":"pinch","item":"grated nutmeg (optional)"}],"ingredientsHe":[{"amount":"8 גדולות","item":"ביצים"},{"amount":"1/4 כוס / 60 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"3","item":"בצל ירוק (או 1/2 בצל קטן), פרוס"},{"amount":"5 כוסות טרי / 150 גרם","item":"תרד (או 200 גרם קפוא, מופשר וסחוט היטב)","israelNote":"קוביות תרד קפוא עובדות מצוין"},{"amount":"3/4 כוס / 100 גרם","item":"גבינה צפתית או בולגרית, מפוררת"},{"amount":"1/4 כפית מכל אחד","item":"מלח ופלפל שחור"},{"amount":"קורט","item":"אגוז מוסקט מגורר (לא חובה)"}],"instructions":["Preheat the oven to 200C (400F). Whisk the eggs with the cream, salt, pepper, and nutmeg.","Heat the olive oil in a 23-25 cm ovenproof skillet over medium heat and soften the scallions for 2 minutes.","Add the spinach and cook until wilted and any liquid has evaporated, 2-3 minutes.","Pour in the egg mixture, scatter the feta over the top, and cook undisturbed 3-4 minutes until the edges begin to set.","Transfer the skillet to the oven and bake 10-12 minutes, until the center is just set and puffed.","Cool a few minutes, then cut into wedges. Good warm or at room temperature."],"instructionsHe":["מחממים תנור ל-200 מעלות. טורפים את הביצים עם השמנת, המלח, הפלפל והמוסקט.","מחממים את שמן הזית במחבת בקוטר 23-25 ס\"מ שמתאימה לתנור על אש בינונית ומרככים את הבצל הירוק 2 דקות.","מוסיפים את התרד ומבשלים עד שהוא קמל וכל הנוזלים התאדו, 2-3 דקות.","יוצקים את תערובת הביצים, מפזרים מעל את הגבינה ומבשלים בלי לערבב 3-4 דקות עד שהשוליים מתחילים להתייצב.","מעבירים את המחבת לתנור ואופים 10-12 דקות, עד שהמרכז בדיוק מתייצב ותופח.","מצננים כמה דקות וחותכים למשולשים. טעים חם וגם בטמפרטורת החדר."],"nutrition":{"calories":303,"fatG":23.8,"satFatG":10.7,"proteinG":17.0,"carbsG":4.3,"fiberG":0.9,"netCarbsG":3.4,"sugarG":1.5,"sodiumMg":490},"tips":"Pull it from the oven while the center still has a slight wobble - carryover heat finishes it without drying the eggs.","tipsHe":"מוציאים מהתנור כשהמרכז עוד רועד מעט - החום האצור משלים את הבישול בלי לייבש את הביצים.","sources":[{"creator":"Skinnytaste (Gina Homolka)","url":"https://www.skinnytaste.com/lighter-spinach-frittata-235-pts/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/keto-frittata-recipe/"},{"creator":"The Daring Gourmet","url":"https://www.daringgourmet.com/spinach-and-feta-frittata/"}],"comparedVersions":"Compared stovetop-to-oven versions against long-baked casserole versions; the skillet start (Skinnytaste, Daring Gourmet) wins on time and gives a better browned base. A modest amount of cream (Sweet As Honey) makes it noticeably more tender than milk or none.","comparedVersionsHe":"השווינו גרסאות שמתחילות על הכיריים ועוברות לתנור מול גרסאות פשטידה באפייה ארוכה; ההתחלה במחבת (Skinnytaste, Daring Gourmet) חוסכת זמן ונותנת תחתית מושחמת יותר. מעט שמנת (כמו אצל Sweet As Honey) הופכת את הפריטטה לרכה בהרבה לעומת חלב או בלי כלום."},{"id":"cauliflower-gratin","name":"Cauliflower Gratin","nameHe":"גרטן כרובית","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":45,"difficulty":"easy","ingredients":[{"amount":"1 large head / 700 g","item":"cauliflower, cut into florets"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1 tsp","item":"garlic powder"},{"amount":"1/2 tsp each","item":"salt and black pepper"},{"amount":"3/4 cup / 180 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"2 tbsp / 30 g","item":"butter, cubed"},{"amount":"1 tsp","item":"Dijon mustard"},{"amount":"2 cups / 200 g","item":"shredded yellow cheese (cheddar, Gruyere, or a mix)","israelNote":"Emmental or kashkaval work well"},{"amount":"1/3 cup / 30 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"}],"ingredientsHe":[{"amount":"1 ראש גדול / 700 גרם","item":"כרובית, מפורקת לפרחים"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1 כפית","item":"אבקת שום"},{"amount":"1/2 כפית מכל אחד","item":"מלח ופלפל שחור"},{"amount":"3/4 כוס / 180 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"2 כפות / 30 גרם","item":"חמאה, חתוכה לקוביות"},{"amount":"1 כפית","item":"חרדל דיז\u0027ון"},{"amount":"2 כוסות / 200 גרם","item":"גבינה צהובה מגוררת (צ\u0027דר, גרוייר או תערובת)","israelNote":"אמנטל או קשקבל מתאימים מצוין"},{"amount":"1/3 כוס / 30 גרם","item":"פרמזן מגורר","israelNote":"אפשר גם קשקבל"}],"instructions":["Heat the oven to 200C / 400F. Toss the florets with the olive oil, garlic powder, salt, and pepper on a baking sheet.","Roast 20 minutes until the edges start to brown — roasting instead of boiling keeps the gratin from turning watery.","Whisk the cream with the Dijon mustard.","Layer half the cauliflower in a greased baking dish, pour over half the cream, and scatter half the cheese and butter cubes; repeat with the rest.","Top with the parmesan.","Bake 20-25 minutes until golden, bubbling, and the cauliflower is fully tender.","Rest 5 minutes before serving so the sauce thickens."],"instructionsHe":["מחממים תנור ל-200 מעלות. מערבבים את פרחי הכרובית עם שמן הזית, אבקת השום, המלח והפלפל על תבנית אפייה.","צולים 20 דקות עד שהקצוות מתחילים להשחים — צלייה במקום בישול במים שומרת על הגרטן מלצאת מימי.","טורפים את השמנת עם חרדל הדיז\u0027ון.","מסדרים חצי מהכרובית בתבנית משומנת, יוצקים חצי מהשמנת ומפזרים חצי מהגבינה ומקוביות החמאה; חוזרים על הפעולה עם השאר.","מפזרים את הפרמזן מעל.","אופים 20–25 דקות עד שהגרטן מוזהב ומבעבע והכרובית רכה לגמרי.","נותנים לנוח 5 דקות לפני ההגשה כדי שהרוטב יסמיך."],"nutrition":{"calories":340,"fatG":30,"satFatG":18,"proteinG":13,"carbsG":7.5,"fiberG":2.3,"netCarbsG":5.2,"sugarG":2.5,"sodiumMg":520},"tips":"For a crunchy top, mix the parmesan with 2 tbsp almond flour (kemach shkedim) before sprinkling.","tipsHe":"לציפוי פריך, מערבבים את הפרמזן עם 2 כפות קמח שקדים לפני הפיזור.","sources":[{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/cauliflower-au-gratin/"},{"creator":"Peace Love and Low Carb","url":"https://peaceloveandlowcarb.com/keto-cauliflower-au-gratin/"},{"creator":"Joy Filled Eats","url":"https://joyfilledeats.com/keto-cauliflower-au-gratin/"}],"comparedVersions":"Compared That Low Carb Life\u0027s roast-and-layer method (no sauce-making) with versions built on a cooked cheese sauce. The layered method won for simplicity — no roux or sauce pan — and roasting the cauliflower first, which every top version stressed, prevents a watery gratin. Bacon was dropped to keep it vegetarian and kosher-dairy.","comparedVersionsHe":"השווינו את שיטת הצלייה והשכבות של That Low Carb Life (בלי הכנת רוטב) מול גרסאות שבנויות על רוטב גבינה מבושל. השיטה בשכבות ניצחה בזכות הפשטות — בלי רביכה ובלי סיר רוטב — וצליית הכרובית מראש, שכל הגרסאות המובילות הדגישו, מונעת גרטן מימי. ויתרנו על הבייקון כדי לשמור על מנה צמחונית וכשרה-חלבית."},{"id":"tofu-vegetable-stir-fry","name":"Crispy Tofu \u0026 Vegetable Stir-Fry","nameHe":"מוקפץ טופו פריך וירקות","category":"dairy-vegetarian-mains","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":20,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"450 g","item":"extra-firm tofu, pressed and cubed","israelNote":"tofu mutzak/kashe (e.g., Wyler Farm, Tivol)"},{"amount":"2 tbsp / 30 ml","item":"avocado or olive oil"},{"amount":"1 small head / 300 g","item":"broccoli, cut into small florets"},{"amount":"1","item":"red bell pepper, sliced"},{"amount":"150 g","item":"mushrooms, sliced"},{"amount":"3 cloves","item":"garlic, minced"},{"amount":"1 tbsp / 10 g","item":"fresh ginger, grated"},{"amount":"3 tbsp / 45 ml","item":"soy sauce","israelNote":"regular or gluten-free/tamari; check hechsher"},{"amount":"1 tbsp / 15 ml","item":"toasted sesame oil"},{"amount":"1 tbsp","item":"sesame seeds, plus 1 tbsp rice vinegar (optional)"}],"ingredientsHe":[{"amount":"450 גרם","item":"טופו מוצק, סחוט וחתוך לקוביות","israelNote":"למשל וילר פארם או טבעול"},{"amount":"2 כפות / 30 מ\"ל","item":"שמן אבוקדו או שמן זית"},{"amount":"1 ראש קטן / 300 גרם","item":"ברוקולי, מפורק לפרחים קטנים"},{"amount":"1","item":"פלפל אדום, פרוס"},{"amount":"150 גרם","item":"פטריות, פרוסות"},{"amount":"3 שיניים","item":"שום, קצוץ"},{"amount":"1 כף / 10 גרם","item":"ג\u0027ינג\u0027ר טרי, מגורר"},{"amount":"3 כפות / 45 מ\"ל","item":"רוטב סויה","israelNote":"רגיל או ללא גלוטן/טמרי; בודקים הכשר"},{"amount":"1 כף / 15 מ\"ל","item":"שמן שומשום קלוי"},{"amount":"1 כף","item":"שומשום, ועוד 1 כף חומץ אורז (לא חובה)"}],"instructions":["Press the tofu between paper towels under a weight for 10-15 minutes, then cut into 2 cm cubes and pat dry — dry tofu is what crisps.","Heat 1 tbsp oil in a large skillet or wok over medium-high heat. Fry the tofu without moving it for 2-3 minutes per side until golden all over; set aside.","Add the remaining oil and stir-fry the broccoli 3 minutes, then add the pepper and mushrooms and stir-fry 3 minutes more, until crisp-tender.","Add the garlic and ginger and stir 30 seconds until fragrant.","Return the tofu to the pan, pour in the soy sauce, sesame oil, and vinegar, and toss 1-2 minutes so everything is glazed.","Sprinkle with sesame seeds and serve as is or over cauliflower rice."],"instructionsHe":["סוחטים את הטופו בין מגבות נייר מתחת למשקולת 10–15 דקות, חותכים לקוביות של 2 ס\"מ ומייבשים היטב — רק טופו יבש נהיה פריך.","מחממים כף שמן במחבת גדולה או ווק על אש בינונית-גבוהה. מטגנים את הטופו בלי להזיז 2–3 דקות מכל צד עד שהוא זהוב מכל הכיוונים; מוציאים ושומרים בצד.","מוסיפים את שארית השמן ומקפיצים את הברוקולי 3 דקות, ואז מוסיפים את הפלפל והפטריות ומקפיצים עוד 3 דקות, עד שהירקות רכים-פריכים.","מוסיפים את השום והג\u0027ינג\u0027ר ומערבבים 30 שניות עד שעולה הריח.","מחזירים את הטופו למחבת, יוצקים את רוטב הסויה, שמן השומשום והחומץ ומערבבים 1–2 דקות עד שהכול מצופה ומבריק.","מפזרים שומשום ומגישים כמו שזה או על אורז כרובית."],"nutrition":{"calories":270,"fatG":19,"satFatG":2.5,"proteinG":16,"carbsG":10,"fiberG":3.5,"netCarbsG":6.5,"sugarG":3,"sodiumMg":750},"lowCarbVariant":"Add 1 tsp sweetener (erythritol) and 1/2 tsp chili flakes to the sauce for a takeout-style sweet-spicy glaze.","lowCarbVariantHe":"מוסיפים לרוטב כפית ממתיק (אריתריטול) וחצי כפית פתיתי צ\u0027ילי לציפוי מתוק-חריף בסגנון טייק-אוויי.","tips":"An air fryer (10 min at 200C, tossing once) makes the tofu even crispier with less oil.","tipsHe":"מטגן אוויר (10 דקות ב-200 מעלות, ניעור פעם אחת באמצע) עושה את הטופו פריך אפילו יותר, עם פחות שמן.","sources":[{"creator":"Savory Tooth","url":"https://www.savorytooth.com/how-to-cook-tofu/"},{"creator":"Keto Vegetarian Recipes","url":"https://ketovegetarianrecipes.com/keto-tofu-stir-fry-broccoli/"},{"creator":"Fresh N Lean","url":"https://www.freshnlean.com/recipes/keto-tofu-stir-fry/"}],"comparedVersions":"Compared a broccoli-only keto stir-fry, a tahini-sauce version (over 590 kcal and 12+ net carbs per serving), and mixed-vegetable versions. Chose the sear-tofu-first technique every source agreed on, a three-vegetable mix for color, and a minimal soy-ginger-sesame sauce — lighter and simpler than the tahini sauce with fewer carbs.","comparedVersionsHe":"השווינו מוקפץ קיטו עם ברוקולי בלבד, גרסה עם רוטב טחינה (מעל 590 קלוריות ו-12+ גרם פחמימות נטו למנה) וגרסאות עם מגוון ירקות. בחרנו בטכניקת השחמת-הטופו-קודם שכל המקורות הסכימו עליה, שילוב של שלושה ירקות לצבע, ורוטב סויה-ג\u0027ינג\u0027ר-שומשום מינימלי — קל ופשוט יותר מרוטב הטחינה, עם פחות פחמימות."},{"id":"zucchini-fritters-feta","name":"Zucchini Fritters with Feta (Low-Carb Kishuim Latkes)","nameHe":"לביבות קישואים עם גבינה בולגרית (דל-פחמימות)","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":20,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"4 medium / 1 kg","item":"zucchini, coarsely grated","israelNote":"kishuim"},{"amount":"1 tsp","item":"salt"},{"amount":"2 large","item":"eggs"},{"amount":"1/2 cup / 50 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"100 g","item":"crumbled feta","israelNote":"gvinat tzfatit/Bulgarit"},{"amount":"2","item":"scallions, thinly sliced"},{"amount":"1 clove","item":"garlic, minced"},{"amount":"1/4 tsp","item":"black pepper"},{"amount":"3 tbsp / 45 ml","item":"olive or avocado oil, for frying"}],"ingredientsHe":[{"amount":"4 בינוניים / 1 ק\"ג","item":"קישואים, מגוררים גס"},{"amount":"1 כפית","item":"מלח"},{"amount":"2 גדולות","item":"ביצים"},{"amount":"1/2 כוס / 50 גרם","item":"קמח שקדים"},{"amount":"100 גרם","item":"גבינה צפתית או בולגרית, מפוררת"},{"amount":"2","item":"בצלים ירוקים, פרוסים דק"},{"amount":"1 שן","item":"שום, קצוצה"},{"amount":"1/4 כפית","item":"פלפל שחור"},{"amount":"3 כפות / 45 מ\"ל","item":"שמן זית או שמן אבוקדו, לטיגון"}],"instructions":["Toss the grated zucchini with the salt and let it sit 10-15 minutes, then squeeze it very hard in a clean towel — you should get out at least half a cup of liquid.","Whisk the eggs in a bowl, then stir in the squeezed zucchini, feta, scallions, garlic, and pepper.","Stir in the almond flour until the batter holds together.","Heat a thin layer of oil in a large skillet over medium heat.","Drop heaped tablespoons of batter into the pan and flatten slightly; fry 3-4 minutes per side until deep golden and crisp.","Drain on paper towels and repeat with the remaining batter, adding oil as needed.","Serve hot, with sour cream (shamenet chamutza) or yogurt-dill sauce."],"instructionsHe":["מערבבים את הקישואים המגוררים עם המלח ומניחים 10–15 דקות, ואז סוחטים חזק במגבת נקייה — אמורה לצאת לפחות חצי כוס נוזלים.","טורפים את הביצים בקערה, ומוסיפים את הקישואים הסחוטים, הגבינה, הבצל הירוק, השום והפלפל.","מוסיפים את קמח השקדים ומערבבים עד שהבלילה מתאחדת.","מחממים שכבה דקה של שמן במחבת גדולה על אש בינונית.","מניחים במחבת כפות גדושות של בלילה ומשטחים מעט; מטגנים 3–4 דקות מכל צד עד שהלביבות זהובות עמוק ופריכות.","מעבירים לנייר סופג וממשיכים עם שארית הבלילה, מוסיפים שמן לפי הצורך.","מגישים חם, עם שמנת חמוצה או רוטב יוגורט-שמיר."],"nutrition":{"calories":310,"fatG":25,"satFatG":6,"proteinG":13,"carbsG":11,"fiberG":4,"netCarbsG":6.5,"sugarG":4.5,"sodiumMg":620},"tips":"Squeezing the zucchini dry is the whole game — skip it and the fritters fall apart. Makes about 12 fritters (3 per serving).","tipsHe":"סחיטת הקישואים היא כל הסוד — בלעדיה הלביבות מתפרקות. יוצאות כ-12 לביבות (3 למנה).","sources":[{"creator":"Gimme Delicious","url":"https://gimmedelicious.com/low-carb-zucchini-fritters/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/keto-zucchini-fritters/"},{"creator":"Downshiftology","url":"https://downshiftology.com/recipes/goat-cheese-zucchini-fritters/"}],"comparedVersions":"Compared almond-flour-plus-feta (Gimme Delicious), parmesan-based, and goat-cheese (Downshiftology) versions. The feta version won: feta is cheap and everywhere in Israel (tzfatit), adds salt and tang, and the egg-plus-almond-flour binder held together best at about 2 g net carbs per fritter.","comparedVersionsHe":"השווינו גרסת קמח שקדים עם פטה (Gimme Delicious), גרסה על בסיס פרמזן וגרסת גבינת עיזים (Downshiftology). גרסת הפטה ניצחה: גבינה צפתית זולה וזמינה בכל מקום בארץ, מוסיפה מליחות וחמצמצות, והקישור של ביצה עם קמח שקדים החזיק הכי טוב — כ-2 גרם פחמימות נטו ללביבה."},{"id":"creamed-spinach-baked-eggs","name":"Baked Eggs in Creamed Spinach (Eggs Florentine Style)","nameHe":"ביצים אפויות על תרד בשמנת (בסגנון פלורנטין)","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":2,"prepTimeMin":10,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"500 g","item":"frozen chopped spinach, thawed and squeezed dry (or 600 g fresh, wilted)"},{"amount":"2 tbsp / 30 g","item":"butter"},{"amount":"1 small","item":"onion or 2 shallots, finely chopped"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"1/2 cup / 120 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1/3 cup / 35 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"},{"amount":"1/4 tsp","item":"ground nutmeg"},{"amount":"4 large","item":"eggs"},{"amount":"1/2 cup / 60 g","item":"shredded mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"}],"ingredientsHe":[{"amount":"500 גרם","item":"תרד קצוץ קפוא, מופשר וסחוט היטב (או 600 גרם טרי, מוקפץ)"},{"amount":"2 כפות / 30 גרם","item":"חמאה"},{"amount":"1 קטן","item":"בצל או 2 בצלי שאלוט, קצוצים דק"},{"amount":"2 שיניים","item":"שום, קצוץ"},{"amount":"1/2 כוס / 120 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1/3 כוס / 35 גרם","item":"פרמזן מגורר","israelNote":"אפשר גם קשקבל"},{"amount":"1/4 כפית","item":"אגוז מוסקט טחון"},{"amount":"4 גדולות","item":"ביצים"},{"amount":"1/2 כוס / 60 גרם","item":"מוצרלה מגוררת","israelNote":"מוצרלה מגוררת (תרה/גד)"}],"instructions":["Heat the oven to 190C / 375F.","Melt the butter in an ovenproof skillet and cook the onion 4-5 minutes until soft; add the garlic for the last minute.","Stir in the cream, parmesan, nutmeg, salt, and pepper and simmer 2-3 minutes until slightly thickened.","Fold in the squeezed spinach and heat through; taste and adjust seasoning.","Make 4 wells in the spinach and crack an egg into each. Sprinkle the mozzarella around (not on) the yolks.","Bake 12-16 minutes, until the whites are set but the yolks are still soft.","Serve straight from the pan."],"instructionsHe":["מחממים תנור ל-190 מעלות.","ממיסים את החמאה במחבת שנכנסת לתנור ומטגנים את הבצל 4–5 דקות עד שהוא מתרכך; מוסיפים את השום בדקה האחרונה.","מוסיפים את השמנת, הפרמזן, אגוז המוסקט, מלח ופלפל ומבשלים על אש נמוכה 2–3 דקות עד שהרוטב מסמיך מעט.","מקפלים פנימה את התרד הסחוט ומחממים היטב; טועמים ומתקנים תיבול.","יוצרים 4 גומות בתרד ושוברים ביצה לתוך כל אחת. מפזרים את המוצרלה מסביב לחלמונים (לא עליהם).","אופים 12–16 דקות, עד שהחלבונים מתייצבים והחלמונים עדיין רכים.","מגישים ישר מהמחבת."],"nutrition":{"calories":640,"fatG":54,"satFatG":29,"proteinG":31,"carbsG":13,"fiberG":6,"netCarbsG":7,"sugarG":4,"sodiumMg":780},"lowCarbVariant":"Serve 3-4 as a lighter meal with a fried halloumi slice each.","lowCarbVariantHe":"מגישים ל-3–4 סועדים כארוחה קלה יותר, עם פרוסת חלומי מטוגנת לכל אחד.","tips":"Squeeze the spinach hard — a watery base is the most common failure. Individual ramekins work too: divide the spinach, one egg each, bake 15 minutes.","tipsHe":"סוחטים את התרד חזק — בסיס מימי הוא הכישלון הנפוץ ביותר. עובד מצוין גם ברמקינים אישיים: מחלקים את התרד, ביצה בכל אחד, ואופים 15 דקות.","sources":[{"creator":"Food Network Kitchen","url":"https://www.foodnetwork.com/recipes/food-network-kitchen/keto-baked-eggs-florentine-5463137"},{"creator":"Step Away From The Carbs","url":"https://stepawayfromthecarbs.com/low-carb-eggs-florentine/"},{"creator":"Keto Cooking Wins","url":"https://www.ketocookingwins.com/baked-eggs-florentine-with-ham/"}],"comparedVersions":"Compared Food Network\u0027s ramekin version (ham omitted for a vegetarian dish), a stovetop skillet version, and a layered ramekin version. Chose one ovenproof skillet — the parmesan-cream-nutmeg sauce from Food Network gave the best flavor, while the single-pan bake is simpler than dividing into ramekins.","comparedVersionsHe":"השווינו את גרסת הרמקינים של Food Network (בלי הנקניק, לגרסה צמחונית), גרסת מחבת על הכיריים וגרסת רמקינים בשכבות. בחרנו במחבת אחת שנכנסת לתנור — רוטב הפרמזן-שמנת-מוסקט של Food Network נתן את הטעם הטוב ביותר, ואפייה במחבת אחת פשוטה יותר מחלוקה לרמקינים."},{"id":"baked-feta-roasted-vegetables","name":"Greek Baked Feta with Roasted Vegetables","nameHe":"גבינה בולגרית אפויה עם ירקות צלויים בסגנון יווני","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":30,"difficulty":"easy","ingredients":[{"amount":"2 medium / 400 g","item":"zucchini, sliced into half-moons","israelNote":"kishuim"},{"amount":"1 large","item":"red bell pepper, cut into strips"},{"amount":"250 g","item":"cherry tomatoes"},{"amount":"1/2","item":"red onion, sliced"},{"amount":"1/3 cup / 50 g","item":"pitted kalamata or black olives"},{"amount":"3 tbsp / 45 ml","item":"olive oil"},{"amount":"1 tsp","item":"dried oregano"},{"amount":"1/2 tsp each","item":"salt (scant) and black pepper"},{"amount":"1 block / 200 g","item":"feta cheese","israelNote":"gvinat Bulgarit 5% block (tzfatit is milder and works too)"}],"ingredientsHe":[{"amount":"2 בינוניים / 400 גרם","item":"קישואים, פרוסים לחצאי סהר"},{"amount":"1 גדול","item":"פלפל אדום, חתוך לרצועות"},{"amount":"250 גרם","item":"עגבניות שרי"},{"amount":"1/2","item":"בצל סגול, פרוס"},{"amount":"1/3 כוס / 50 גרם","item":"זיתי קלמטה או זיתים שחורים מגולענים"},{"amount":"3 כפות / 45 מ\"ל","item":"שמן זית"},{"amount":"1 כפית","item":"אורגנו מיובש"},{"amount":"1/2 כפית מכל אחד","item":"מלח (ביד קלה) ופלפל שחור"},{"amount":"1 קובייה / 200 גרם","item":"גבינה בולגרית 5%","israelNote":"צפתית עדינה יותר ועובדת גם"}],"instructions":["Heat the oven to 200C / 400F.","Toss the zucchini, pepper, tomatoes, onion, and olives on a large baking dish or sheet pan with most of the oil, the oregano, salt, and pepper.","Clear a space in the center, set the whole feta block there, and drizzle it with the remaining oil.","Roast 25-30 minutes until the vegetables are soft with charred edges and the feta is creamy and lightly golden.","Stir gently so the softened feta coats the vegetables like a sauce.","Serve warm, topped with fresh basil or parsley — with fried eggs or over cauliflower rice to make it a fuller meal."],"instructionsHe":["מחממים תנור ל-200 מעלות.","מערבבים את הקישואים, הפלפל, העגבניות, הבצל והזיתים בתבנית גדולה עם רוב השמן, האורגנו, המלח והפלפל.","מפנים מקום במרכז, מניחים שם את קוביית הגבינה השלמה ומזליפים עליה את שארית השמן.","צולים 25–30 דקות עד שהירקות רכים עם קצוות חרוכים והגבינה קרמית ומוזהבת קלות.","מערבבים בעדינות כך שהגבינה הרכה עוטפת את הירקות כמו רוטב.","מגישים חמים, עם בזיליקום או פטרוזיליה טריים מעל — עם ביצי עין או על אורז כרובית לארוחה מלאה יותר."],"nutrition":{"calories":300,"fatG":24,"satFatG":9,"proteinG":9,"carbsG":10,"fiberG":2.5,"netCarbsG":7.5,"sugarG":5,"sodiumMg":900},"tips":"Bulgarit holds its shape and chars nicely; go easy on added salt — the feta and olives carry plenty.","tipsHe":"בולגרית שומרת על צורתה ונחרכת יפה; ממעיטים במלח — הגבינה והזיתים מלוחים מספיק בעצמם.","sources":[{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/baked-feta-vegetables/"},{"creator":"KetoDiet Blog (Martina Slajerova)","url":"https://ketodietapp.com/Blog/lchf/easy-low-carb-feta-tray-bake"},{"creator":"Cotter Crunch","url":"https://www.cottercrunch.com/keto-meal-prep-greek-vegetables/"}],"comparedVersions":"Compared the viral one-pan baked-feta approach (That Low Carb Life) with KetoDiet Blog\u0027s Greek tray bake with olives and a garlic-lemon dressing, and a marinated meal-prep version. Merged them: one pan and one step from the first, plus the olives and oregano that give the KetoDiet version its Greek character, skipping the separate dressing.","comparedVersionsHe":"השווינו את שיטת הפטה האפויה הוויראלית בתבנית אחת (That Low Carb Life) מול מאפה המגש היווני של KetoDiet Blog עם זיתים ורוטב שום-לימון, וגרסת הכנה-מראש במרינדה. מיזגנו ביניהן: תבנית אחת ושלב אחד מהראשונה, בתוספת הזיתים והאורגנו שנותנים לגרסת KetoDiet את האופי היווני, בלי הרוטב הנפרד."},{"id":"cheese-zucchini-lasagna","name":"Cheese Zucchini Lasagna","nameHe":"לזניית קישואים גבינתית","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":30,"cookTimeMin":50,"difficulty":"medium","ingredients":[{"amount":"3 medium / 700 g","item":"zucchini, sliced lengthwise into 5 mm strips","israelNote":"kishuim"},{"amount":"1 cup / 250 g","item":"ricotta","israelNote":"gvina levana 5% or ricotta"},{"amount":"1 large","item":"egg"},{"amount":"1/4 cup / 30 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"},{"amount":"2 cups / 500 g","item":"thick marinara sauce (no added sugar)","israelNote":"rotev agvaniyot without added sugar, simmered until thick"},{"amount":"2.5 cups / 250 g","item":"shredded mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"1 tsp","item":"dried oregano or basil"},{"amount":"1/2 tsp each","item":"salt and black pepper"}],"ingredientsHe":[{"amount":"3 בינוניים / 700 גרם","item":"קישואים, פרוסים לאורך לרצועות בעובי 5 מ\"מ"},{"amount":"1 כוס / 250 גרם","item":"גבינת ריקוטה","israelNote":"אפשר להחליף בגבינה לבנה 5%"},{"amount":"1 גדולה","item":"ביצה"},{"amount":"1/4 כוס / 30 גרם","item":"גבינת פרמז\u0027ן מגוררת","israelNote":"אפשר להחליף בקשקבל"},{"amount":"2 כוסות / 500 גרם","item":"רוטב עגבניות סמיך ללא סוכר מוסף","israelNote":"מצמצמים מראש על אש קטנה עד שהרוטב סמיך היטב"},{"amount":"2.5 כוסות / 250 גרם","item":"גבינת מוצרלה מגוררת","israelNote":"למשל של טרה או גד"},{"amount":"1 כפית","item":"אורגנו או בזיליקום מיובש"},{"amount":"1/2 כפית מכל אחד","item":"מלח ופלפל שחור"}],"instructions":["Salt the zucchini strips and lay them on paper towels for 15 minutes, then blot dry. Preheat the oven to 200C (400F).","Roast the strips on lined baking sheets for 10 minutes to drive off moisture, then blot again. This is the key step against a watery lasagna.","Stir together the ricotta, egg, parmesan, oregano, salt, and pepper.","In a baking dish, layer: a little sauce, a third of the zucchini, half the ricotta mixture, a third of the mozzarella. Repeat, then finish with zucchini, sauce, and the last of the mozzarella.","Bake uncovered at 190C (375F) for 35-40 minutes until bubbling and golden.","Rest at least 10 minutes before cutting so the slices hold their shape."],"instructionsHe":["ממליחים את רצועות הקישוא ומניחים על נייר סופג 15 דקות, ואז מייבשים היטב. מחממים תנור ל-200 מעלות.","צולים את הרצועות על תבניות מרופדות 10 דקות כדי להוציא נוזלים, ומייבשים שוב. זה השלב הקריטי נגד לזניה מימית.","מערבבים את הריקוטה, הביצה, הפרמז\u0027ן, האורגנו, המלח והפלפל.","מרכיבים בתבנית אפייה: מעט רוטב, שליש מהקישואים, חצי מתערובת הריקוטה, שליש מהמוצרלה. חוזרים על הסדר, ומסיימים בקישואים, רוטב ושארית המוצרלה.","אופים ללא כיסוי ב-190 מעלות 35-40 דקות עד שהלזניה מבעבעת ומזהיבה.","ממתינים לפחות 10 דקות לפני החיתוך כדי שהפרוסות ישמרו על צורתן."],"nutrition":{"calories":283,"fatG":17.0,"satFatG":9.5,"proteinG":18.5,"carbsG":10.1,"fiberG":2.3,"netCarbsG":7.8,"sugarG":5.3,"sodiumMg":700},"tips":"If any liquid pools after baking, spoon it off before resting; it will not reabsorb.","tipsHe":"אם מצטברים נוזלים אחרי האפייה, מוציאים אותם בכף לפני ההמתנה - הם לא ייספגו בחזרה.","sources":[{"creator":"Downshiftology (Lisa Bryan)","url":"https://downshiftology.com/recipes/zucchini-lasagna/"},{"creator":"A Simple Palate","url":"https://asimplepalate.com/blog/easy-zucchini-lasagna/"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-zucchini-lasagna/"}],"comparedVersions":"Compared three \u0027not watery\u0027 methods: salting only, sauteing, and salt-plus-pre-roast. Downshiftology\u0027s salt + pre-bake combination won as the most reliable with the least hands-on work. Source recipes use meat sauce; this version is all-cheese to fit the vegetarian category, borrowing the ricotta-egg-parmesan filling common to all three.","comparedVersionsHe":"השווינו שלוש שיטות נגד לזניה מימית: המלחה בלבד, הקפצה במחבת, והמלחה בתוספת צלייה מקדימה. השילוב של Downshiftology - מלח ואפייה מקדימה - ניצח כאמין ביותר עם הכי פחות עבודה. מתכוני המקור משתמשים ברוטב בשר; הגרסה הזו כולה גבינות כדי להתאים לקטגוריה הצמחונית-חלבית, עם מלית הריקוטה-ביצה-פרמז\u0027ן המשותפת לשלושתם."},{"id":"cauliflower-mac-and-cheese","name":"Cauliflower Mac \u0026 Cheese","nameHe":"מק אנד צ\u0027יז כרובית","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":20,"difficulty":"easy","ingredients":[{"amount":"1 large head / 800 g","item":"cauliflower, cut into small florets","israelNote":"kruvit"},{"amount":"1/2 cup / 120 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1/4 cup / 60 g","item":"cream cheese","israelNote":"gvinat shamenet (e.g. Napoleon/Ski)"},{"amount":"2 cups / 200 g","item":"shredded sharp cheddar","israelNote":"cheddar or Emek/kashkaval"},{"amount":"1/2 tsp","item":"mustard powder (or 1 tsp Dijon)"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/4 tsp each","item":"salt and black pepper"},{"amount":"pinch","item":"paprika, for the top (optional)"}],"ingredientsHe":[{"amount":"1 ראש גדול / 800 גרם","item":"כרובית, מחולקת לפרחים קטנים"},{"amount":"1/2 כוס / 120 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1/4 כוס / 60 גרם","item":"גבינת שמנת","israelNote":"למשל נפוליאון או סקי"},{"amount":"2 כוסות / 200 גרם","item":"גבינת צ\u0027דר חריפה מגוררת","israelNote":"אפשר להחליף בגבינת עמק או קשקבל"},{"amount":"1/2 כפית","item":"אבקת חרדל (או 1 כפית חרדל דיז\u0027ון)"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/4 כפית מכל אחד","item":"מלח ופלפל שחור"},{"amount":"קורט","item":"פפריקה, לפיזור מעל (לא חובה)"}],"instructions":["Steam or microwave the cauliflower florets until just tender, 5-6 minutes. They should still hold their shape.","Drain very well and pat dry - wet cauliflower thins the sauce.","In a saucepan over medium-low heat, warm the cream with the cream cheese, whisking until smooth.","Off the heat, whisk in the cheddar a handful at a time until the sauce is glossy, then season with mustard powder, garlic powder, salt, and pepper.","Fold in the cauliflower until every floret is coated.","Serve as is, or spread into a baking dish, dust with paprika, and grill (broil) 3-4 minutes for a browned top."],"instructionsHe":["מאדים או מחממים במיקרוגל את פרחי הכרובית עד שהם רק מתרככים, 5-6 דקות. הם צריכים עדיין לשמור על צורתם.","מסננים היטב ומייבשים - כרובית רטובה מדללת את הרוטב.","בקלחת על אש בינונית-נמוכה מחממים את השמנת עם גבינת השמנת, בטריפה, עד שהתערובת חלקה.","מחוץ לאש טורפים פנימה את הצ\u0027דר בהדרגה, חופן בכל פעם, עד שהרוטב מבריק; מתבלים באבקת חרדל, אבקת שום, מלח ופלפל.","מקפלים פנימה את הכרובית עד שכל פרח מצופה ברוטב.","מגישים כמו שזה, או מעבירים לתבנית, מאבקים בפפריקה וצולים בגריל התנור 3-4 דקות לציפוי מושחם."],"nutrition":{"calories":405,"fatG":32.8,"satFatG":20.8,"proteinG":16.8,"carbsG":12.1,"fiberG":4.0,"netCarbsG":8.1,"sugarG":4.3,"sodiumMg":525},"tips":"Add the cheddar off the heat - boiling a cheese sauce makes it grainy.","tipsHe":"מוסיפים את הצ\u0027דר מחוץ לאש - הרתחת רוטב גבינה הופכת אותו לגרגירי.","sources":[{"creator":"Low Carb with Jennifer (Jennifer Banz)","url":"https://jenniferbanz.com/ultimate-cheesy-cauliflower"},{"creator":"KetoConnect","url":"https://www.ketoconnect.net/cauliflower-mac-cheese/"},{"creator":"Kicking Carbs","url":"https://kicking-carbs.com/keto-cauliflower-mac-and-cheese/"}],"comparedVersions":"Compared Jennifer Banz\u0027s stovetop cream-cheese sauce, KetoConnect\u0027s pan-roasted version (uses bacon - dropped for this vegetarian/kosher-dairy category), and Kicking Carbs\u0027 multi-cheese bake. The stovetop method won for speed and a reliably smooth sauce; the optional broiled finish recovers the baked-casserole appeal.","comparedVersionsHe":"השווינו את רוטב גבינת השמנת של ג\u0027ניפר בנז על הכיריים, את הגרסה הצלויה של KetoConnect (עם בייקון - ירד בגלל הקטגוריה הצמחונית-חלבית), ואת מאפה הגבינות של Kicking Carbs. השיטה על הכיריים ניצחה במהירות וברוטב חלק ואמין; הסיום האופציונלי בגריל התנור מחזיר את הקסם של מאפה אפוי."},{"id":"cauliflower-crust-pizza","name":"Cauliflower-Crust Pizza","nameHe":"פיצה על בסיס כרובית","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":3,"prepTimeMin":20,"cookTimeMin":30,"difficulty":"medium","ingredients":[{"amount":"1 medium head / 500 g riced","item":"cauliflower, riced in a food processor (or frozen cauliflower rice, thawed)","israelNote":"kruvit; frozen orez kruvit works well"},{"amount":"2 large","item":"eggs"},{"amount":"1 cup / 100 g","item":"shredded mozzarella, for the crust","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"1/4 cup / 30 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"},{"amount":"1 tsp","item":"dried oregano"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/2 cup / 125 g","item":"marinara or pizza sauce (no added sugar)","israelNote":"rotev pizza without added sugar"},{"amount":"1 cup / 100 g","item":"shredded mozzarella, for topping"}],"ingredientsHe":[{"amount":"1 ראש בינוני / 500 גרם מגורר","item":"כרובית, מגוררת במעבד מזון (או אורז כרובית קפוא, מופשר)","israelNote":"אורז כרובית קפוא מהסופר עובד מצוין"},{"amount":"2 גדולות","item":"ביצים"},{"amount":"1 כוס / 100 גרם","item":"גבינת מוצרלה מגוררת, לבסיס","israelNote":"למשל של טרה או גד"},{"amount":"1/4 כוס / 30 גרם","item":"גבינת פרמז\u0027ן מגוררת","israelNote":"אפשר להחליף בקשקבל"},{"amount":"1 כפית","item":"אורגנו מיובש"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/2 כוס / 125 גרם","item":"רוטב פיצה או עגבניות ללא סוכר מוסף"},{"amount":"1 כוס / 100 גרם","item":"גבינת מוצרלה מגוררת, לציפוי"}],"instructions":["Preheat the oven to 220C (425F). Microwave the riced cauliflower 4-5 minutes (or steam), then cool slightly.","Wrap the cauliflower in a clean kitchen towel and squeeze hard, in batches, until no more liquid comes out. Aim to remove at least half a cup of water.","Mix the dry cauliflower with the eggs, 100 g mozzarella, parmesan, oregano, garlic powder, and a pinch of salt.","Press into a 25-28 cm circle about 1 cm thick on parchment paper. Bake 15-20 minutes until golden and set.","Spread the sauce over the crust, top with the remaining mozzarella, and bake another 8-10 minutes until the cheese bubbles.","Cool 2-3 minutes before slicing; the crust firms as it stands."],"instructionsHe":["מחממים תנור ל-220 מעלות. מחממים את הכרובית המגוררת במיקרוגל 4-5 דקות (או מאדים), ומצננים מעט.","עוטפים את הכרובית במגבת מטבח נקייה וסוחטים חזק, במנות, עד שלא יוצאים עוד נוזלים. המטרה: להוציא לפחות חצי כוס מים.","מערבבים את הכרובית היבשה עם הביצים, 100 גרם מוצרלה, הפרמז\u0027ן, האורגנו, אבקת השום וקורט מלח.","משטחים לעיגול בקוטר 25-28 ס\"מ בעובי כ-1 ס\"מ על נייר אפייה. אופים 15-20 דקות עד שהבסיס זהוב ויציב.","מורחים את הרוטב על הבסיס, מפזרים את שארית המוצרלה ואופים עוד 8-10 דקות עד שהגבינה מבעבעת.","מצננים 2-3 דקות לפני החיתוך; הבסיס מתייצב תוך כדי עמידה."],"nutrition":{"calories":346,"fatG":20.7,"satFatG":11.3,"proteinG":26.0,"carbsG":12.2,"fiberG":3.8,"netCarbsG":8.4,"sugarG":5.1,"sodiumMg":730},"tips":"The crust is only as sturdy as the cauliflower is dry - squeeze until your hands ache, then squeeze once more.","tipsHe":"הבסיס יציב בדיוק כמו שהכרובית יבשה - סוחטים עד שהידיים כואבות, ואז סוחטים עוד פעם אחת.","sources":[{"creator":"Downshiftology (Lisa Bryan)","url":"https://downshiftology.com/recipes/cauliflower-pizza-crust/"},{"creator":"Low Carb Maven","url":"https://www.lowcarbmaven.com/cauliflower-pizza-crust-keto/"},{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/keto-cauliflower-pizza-crust/"}],"comparedVersions":"Compared crust binders: Downshiftology\u0027s minimal cauliflower-egg-cheese base, Low Carb Maven\u0027s cream-cheese version, and That Low Carb Life\u0027s coconut-flour version. The minimal base won for simplicity and common ingredients; adding parmesan (all three use hard cheese) gives the crispness the extra flours were there for.","comparedVersionsHe":"השווינו מקשרים לבסיס: הבסיס המינימלי של Downshiftology מכרובית-ביצה-גבינה, גרסת גבינת השמנת של Low Carb Maven, וגרסת קמח הקוקוס של That Low Carb Life. הבסיס המינימלי ניצח בזכות פשטות ומצרכים זמינים; תוספת הפרמז\u0027ן (שלושתם משתמשים בגבינה קשה) נותנת את הפריכות שהקמחים הנוספים נועדו לספק."},{"id":"broccoli-cheese-casserole","name":"Broccoli-Cheese Casserole","nameHe":"מאפה ברוקולי גבינתי","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"1 large head / 600 g","item":"broccoli, cut into bite-size florets"},{"amount":"1/2 cup / 120 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (e.g. Napoleon/Ski)"},{"amount":"1/2 cup / 120 g","item":"sour cream","israelNote":"shamenet chamutza 15-27%"},{"amount":"2 cups / 200 g","item":"shredded cheddar, divided","israelNote":"cheddar or Emek/kashkaval"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/2 tsp","item":"onion powder"},{"amount":"1/4 tsp each","item":"salt and black pepper"}],"ingredientsHe":[{"amount":"1 ראש גדול / 600 גרם","item":"ברוקולי, מחולק לפרחים בגודל ביס"},{"amount":"1/2 כוס / 120 גרם","item":"גבינת שמנת, רכה","israelNote":"למשל נפוליאון או סקי"},{"amount":"1/2 כוס / 120 גרם","item":"שמנת חמוצה 15%-27%"},{"amount":"2 כוסות / 200 גרם","item":"גבינת צ\u0027דר מגוררת, מחולקת","israelNote":"אפשר להחליף בגבינת עמק או קשקבל"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/2 כפית","item":"אבקת בצל"},{"amount":"1/4 כפית מכל אחד","item":"מלח ופלפל שחור"}],"instructions":["Preheat the oven to 190C (375F). Steam or microwave the broccoli 3-4 minutes until bright green and barely tender, then drain and pat dry.","Stir together the cream cheese, sour cream, half the cheddar, garlic powder, onion powder, salt, and pepper in a large bowl.","Fold in the broccoli until well coated and spread into a greased baking dish.","Top with the remaining cheddar.","Bake 20-25 minutes until bubbling at the edges and golden on top.","Rest 5 minutes before serving."],"instructionsHe":["מחממים תנור ל-190 מעלות. מאדים או מחממים את הברוקולי במיקרוגל 3-4 דקות עד שהוא ירוק בוהק ורק מתחיל להתרכך, ואז מסננים ומייבשים.","מערבבים בקערה גדולה את גבינת השמנת, השמנת החמוצה, חצי מהצ\u0027דר, אבקת השום, אבקת הבצל, המלח והפלפל.","מקפלים פנימה את הברוקולי עד שהוא מצופה היטב ומשטחים בתבנית משומנת.","מפזרים מעל את שארית הצ\u0027דר.","אופים 20-25 דקות עד שהשוליים מבעבעים והציפוי מזהיב.","ממתינים 5 דקות לפני ההגשה."],"nutrition":{"calories":416,"fatG":33.0,"satFatG":20.0,"proteinG":18.3,"carbsG":12.9,"fiberG":3.9,"netCarbsG":9.0,"sugarG":3.0,"sodiumMg":610},"tips":"Undercook the broccoli at the steaming stage - it finishes softening in the oven and keeps a little bite.","tipsHe":"משאירים את הברוקולי חצי-נא בשלב האידוי - הוא משלים את הריכוך בתנור ושומר על מעט נגיסה.","sources":[{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/broccoli-cheese-casserole/"},{"creator":"Joy Filled Eats","url":"https://joyfilledeats.com/keto-broccoli-casserole/"},{"creator":"My Keto Kitchen","url":"https://www.myketokitchen.com/keto-recipes/keto-broccoli-cheese/"}],"comparedVersions":"Compared binders: cream-cheese + sour-cream (That Low Carb Life), mayonnaise-based (Joy Filled Eats), and a cooked cream sauce (My Keto Kitchen). The no-cook cream-cheese/sour-cream mix won - fewest steps, no roux-like fussing, and a tangier result; bacon toppings in the sources were dropped for this vegetarian category.","comparedVersionsHe":"השווינו מקשרים: גבינת שמנת ושמנת חמוצה (That Low Carb Life), בסיס מיונז (Joy Filled Eats), ורוטב שמנת מבושל (My Keto Kitchen). תערובת גבינת השמנת והשמנת החמוצה ללא בישול ניצחה - הכי מעט שלבים, בלי התעסקות ברביכה, ותוצאה חמצמצה יותר; תוספות הבייקון שבמקורות ירדו בגלל הקטגוריה הצמחונית."},{"id":"halloumi-vegetable-stir-fry","name":"Halloumi \u0026 Vegetable Stir-Fry","nameHe":"מוקפץ חלומי וירקות","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":3,"prepTimeMin":15,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"1 block / 250 g","item":"halloumi, sliced 1 cm thick","israelNote":"halloumi (widely sold in Israeli supermarkets)"},{"amount":"2 tbsp / 30 ml","item":"olive oil, divided"},{"amount":"1 small head / 200 g","item":"broccoli, in small florets"},{"amount":"1 medium / 200 g","item":"zucchini, in half-moons","israelNote":"kishuim"},{"amount":"1 medium / 150 g","item":"red bell pepper, in strips"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"1.5 tbsp / 22 ml","item":"soy sauce (reduced-sodium if possible)"},{"amount":"1 tbsp / 15 ml","item":"lemon juice"},{"amount":"1/4 tsp","item":"chili flakes (optional)"}],"ingredientsHe":[{"amount":"1 חבילה / 250 גרם","item":"גבינת חלומי, פרוסה בעובי 1 ס\"מ","israelNote":"נמכרת ברוב רשתות השיווק בישראל"},{"amount":"2 כפות / 30 מ\"ל","item":"שמן זית, מחולק"},{"amount":"1 ראש קטן / 200 גרם","item":"ברוקולי, בפרחים קטנים"},{"amount":"1 בינוני / 200 גרם","item":"קישוא, בחצאי סהר"},{"amount":"1 בינוני / 150 גרם","item":"פלפל אדום, ברצועות"},{"amount":"2 שיניים","item":"שום, קצוץ"},{"amount":"1.5 כפות / 22 מ\"ל","item":"רוטב סויה (עדיף מופחת נתרן)"},{"amount":"1 כף / 15 מ\"ל","item":"מיץ לימון"},{"amount":"1/4 כפית","item":"פתיתי צ\u0027ילי (לא חובה)"}],"instructions":["Heat 1 tablespoon of the oil in a large skillet or wok over medium-high heat. Fry the halloumi slices 2 minutes per side until golden, then set aside.","Add the remaining oil and stir-fry the broccoli for 3 minutes.","Add the zucchini and pepper and stir-fry another 3-4 minutes, until the vegetables are crisp-tender.","Stir in the garlic and chili flakes for 30 seconds.","Return the halloumi to the pan, add the soy sauce and lemon juice, and toss for a minute until everything is glossed and hot.","Serve immediately, on its own or over cauliflower rice."],"instructionsHe":["מחממים כף אחת מהשמן במחבת גדולה או ווק על אש בינונית-גבוהה. מטגנים את פרוסות החלומי 2 דקות מכל צד עד הזהבה ומעבירים לצלחת.","מוסיפים את שארית השמן ומקפיצים את הברוקולי 3 דקות.","מוסיפים את הקישוא והפלפל ומקפיצים עוד 3-4 דקות, עד שהירקות פריכים-רכים.","מוסיפים את השום ופתיתי הצ\u0027ילי ומערבבים 30 שניות.","מחזירים את החלומי למחבת, מוסיפים את רוטב הסויה ומיץ הלימון ומערבבים כדקה עד שהכול מבריק וחם.","מגישים מיד, לבד או על אורז כרובית."],"nutrition":{"calories":400,"fatG":31.0,"satFatG":15.3,"proteinG":21.0,"carbsG":12.5,"fiberG":3.4,"netCarbsG":9.1,"sugarG":4.7,"sodiumMg":1250},"tips":"Halloumi is very salty, so taste before adding any salt - the soy sauce is usually all the seasoning it needs. Fry the cheese first and it stays squeaky-crisp instead of melting.","tipsHe":"חלומי מלוח מאוד, אז טועמים לפני שמוסיפים מלח - רוטב הסויה הוא בדרך כלל כל התיבול הדרוש. מטגנים את הגבינה קודם והיא נשארת פריכה במקום להימס.","sources":[{"creator":"Hint of Healthy","url":"https://www.hintofhealthy.com/halloumi-stir-fry/"},{"creator":"Donna Dundas","url":"https://donnadundas.co.uk/halloumi-stir-fry/"},{"creator":"Ciara Ryan Nutrition","url":"https://www.ciararyannutrition.com/post/halloumi-courgette-stir-fry"}],"comparedVersions":"Compared a Mediterranean courgette version, a soy-based version, and a miso version. The soy-lemon profile won as the best balance of pantry simplicity and flavor (miso is harder to find in Israel); the fry-the-halloumi-first, hard-veg-before-soft-veg sequencing is common to all three.","comparedVersionsHe":"השווינו גרסה ים-תיכונית עם קישואים, גרסה על בסיס סויה וגרסת מיסו. פרופיל הסויה-לימון ניצח כאיזון הטוב ביותר בין מצרכים פשוטים לטעם (מיסו קשה יותר להשיג בישראל); הרצף של טיגון החלומי קודם וירקות קשים לפני רכים משותף לשלושת המקורות."},{"id":"cheese-stuffed-zucchini-boats","name":"Three-Cheese Stuffed Zucchini Boats","nameHe":"סירות קישואים במילוי שלוש גבינות","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":30,"difficulty":"easy","ingredients":[{"amount":"4 medium / 800 g","item":"zucchini","israelNote":"kishuim — choose straight, evenly sized ones"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1 cup / 250 g","item":"ricotta cheese","israelNote":"gvina levana 5% or ricotta"},{"amount":"1 large","item":"egg"},{"amount":"3/4 cup / 90 g","item":"shredded mozzarella, divided","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"1/3 cup / 35 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"},{"amount":"1 clove","item":"garlic, minced, plus a handful of chopped basil"},{"amount":"1/2 cup / 120 g","item":"marinara sauce, no added sugar","israelNote":"rotev agvaniyot without added sugar"},{"amount":"1/4 tsp each","item":"salt and black pepper"}],"ingredientsHe":[{"amount":"4 בינוניים / 800 גרם","item":"קישואים","israelNote":"בוחרים קישואים ישרים ואחידים בגודלם"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1 כוס / 250 גרם","item":"גבינת ריקוטה","israelNote":"אפשר להחליף בגבינה לבנה 5%"},{"amount":"1 גדולה","item":"ביצה"},{"amount":"3/4 כוס / 90 גרם","item":"מוצרלה מגוררת, מחולקת לשניים","israelNote":"מוצרלה מגוררת (תרה/גד)"},{"amount":"1/3 כוס / 35 גרם","item":"פרמזן מגורר","israelNote":"אפשר גם קשקבל"},{"amount":"1 שן","item":"שום, קצוצה, ועוד חופן עלי בזיליקום קצוצים"},{"amount":"1/2 כוס / 120 גרם","item":"רוטב עגבניות ללא סוכר מוסף"},{"amount":"1/4 כפית מכל אחד","item":"מלח ופלפל שחור"}],"instructions":["Heat the oven to 200C / 400F. Halve the zucchini lengthwise and scoop out the centers with a spoon, leaving 1 cm walls.","Brush the boats with olive oil, season lightly, and bake cut-side up for 10 minutes to start them softening.","Mix the ricotta, egg, half the mozzarella, the parmesan, garlic, basil, salt, and pepper.","Spoon a little marinara into each boat, then fill generously with the cheese mixture.","Top with the remaining marinara and mozzarella.","Bake 18-20 minutes until the filling is set and golden and the zucchini is tender.","Rest 5 minutes; serve 2 halves per person."],"instructionsHe":["מחממים תנור ל-200 מעלות. חוצים את הקישואים לאורכם ומרוקנים את המרכז בעזרת כפית, משאירים דפנות בעובי 1 ס\"מ.","מברישים את הסירות בשמן זית, מתבלים קלות ואופים עם הצד החתוך כלפי מעלה 10 דקות, שיתחילו להתרכך.","מערבבים את הריקוטה, הביצה, חצי מהמוצרלה, הפרמזן, השום, הבזיליקום, המלח והפלפל.","מניחים מעט רוטב עגבניות בכל סירה, וממלאים בנדיבות בתערובת הגבינות.","מכסים בשארית הרוטב והמוצרלה.","אופים 18–20 דקות עד שהמילוי יציב ומוזהב והקישוא רך.","נותנים לנוח 5 דקות; מגישים 2 חצאים לסועד."],"nutrition":{"calories":310,"fatG":21,"satFatG":10,"proteinG":21,"carbsG":12,"fiberG":2.7,"netCarbsG":9.3,"sugarG":6,"sodiumMg":700},"tips":"Chop the scooped-out zucchini flesh, squeeze it dry, and stir it into the filling so nothing is wasted — or save it for fritters.","tipsHe":"קוצצים את תוכן הקישוא שרוקנתם, סוחטים היטב ומערבבים לתוך המילוי כדי ששום דבר לא ילך לאיבוד — או שומרים ללביבות.","sources":[{"creator":"Queen Keto","url":"https://queenketo.com/low-carb-ricotta-stuffed-zucchini-boats/"},{"creator":"From Scratch Fast","url":"https://fromscratchfast.com/vegetarian-stuffed-zucchini-boats-recipe/"},{"creator":"Feasting At Home","url":"https://www.feastingathome.com/stuffed-zucchini-boats/"}],"comparedVersions":"Compared a plain ricotta filling (Queen Keto), a ricotta-comte-herb filling bound with egg (From Scratch Fast), and grain-stuffed versions (rejected — too many carbs). The egg-bound three-cheese filling won: it sets like a light lasagna filling instead of leaking, and pre-baking the boats keeps them from being watery.","comparedVersionsHe":"השווינו מילוי ריקוטה פשוט (Queen Keto), מילוי ריקוטה-קומטה-עשבי תיבול מקושר בביצה (From Scratch Fast) וגרסאות ממולאות בדגנים (נפסלו — יותר מדי פחמימות). מילוי שלוש הגבינות עם ביצה ניצח: הוא מתייצב כמו מילוי לזניה קליל במקום לנזול, והאפייה המקדימה של הסירות מונעת מהן לצאת מימיות."},{"id":"vegetarian-keto-moussaka","name":"Vegetarian Keto Moussaka","nameHe":"מוסקה צמחונית קיטו","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":25,"cookTimeMin":70,"difficulty":"medium","ingredients":[{"amount":"1 large / 500 g","item":"eggplant, sliced into 5 mm rounds"},{"amount":"2 medium / 400 g","item":"zucchini, sliced lengthwise","israelNote":"kishuim"},{"amount":"250 g","item":"mushrooms, chopped small (the \u0027meaty\u0027 layer)"},{"amount":"1 small","item":"onion, chopped, plus 2 cloves garlic, minced"},{"amount":"4 tbsp / 60 ml","item":"olive oil"},{"amount":"200 g","item":"crushed tomatoes","israelNote":"rosek agvaniyot"},{"amount":"1 tsp oregano + 1/2 tsp cinnamon","item":"dried oregano and ground cinnamon"},{"amount":"1 cup / 250 g","item":"Greek yogurt 5%","israelNote":"yogurt Yevani 5%"},{"amount":"2 large","item":"eggs"},{"amount":"100 g feta + 50 g shredded cheddar","item":"feta and yellow cheese for the topping","israelNote":"gvinat Bulgarit + Emmental/kashkaval"}],"ingredientsHe":[{"amount":"1 גדול / 500 גרם","item":"חציל, פרוס לעיגולים בעובי 5 מ\"מ"},{"amount":"2 בינוניים / 400 גרם","item":"קישואים, פרוסים לאורך"},{"amount":"250 גרם","item":"פטריות, קצוצות דק (השכבה ה\u0027בשרית\u0027)"},{"amount":"1 קטן","item":"בצל, קצוץ, ועוד 2 שיני שום קצוצות"},{"amount":"4 כפות / 60 מ\"ל","item":"שמן זית"},{"amount":"200 גרם","item":"עגבניות מרוסקות (רסק עגבניות גס)"},{"amount":"1 כפית אורגנו + 1/2 כפית קינמון","item":"אורגנו מיובש וקינמון טחון"},{"amount":"1 כוס / 250 גרם","item":"יוגורט יווני 5%"},{"amount":"2 גדולות","item":"ביצים"},{"amount":"100 גרם בולגרית + 50 גרם גבינה צהובה מגוררת","item":"גבינה בולגרית וגבינה צהובה לציפוי","israelNote":"בולגרית עם אמנטל או קשקבל"}],"instructions":["Salt the eggplant slices 20 minutes, rinse, and pat dry. Heat the oven to 200C / 400F.","Brush the eggplant and zucchini with most of the oil and roast on baking sheets 20-25 minutes until golden and tender.","Meanwhile, cook the onion in the remaining oil 4 minutes; add the mushrooms and garlic and cook 6-8 minutes until dry and browned.","Stir the crushed tomatoes, oregano, cinnamon, salt, and pepper into the mushrooms and simmer 5 minutes into a thick sauce.","In a baking dish, layer half the eggplant, the mushroom-tomato sauce, the zucchini, then the remaining eggplant.","Whisk the yogurt with the eggs and crumbled feta and spread it over the top; scatter the cheddar over the surface.","Turn the oven down to 180C / 350F and bake 30-35 minutes until the topping is set and golden.","Rest 10-15 minutes before cutting — moussaka slices much better warm than hot."],"instructionsHe":["ממליחים את פרוסות החציל ל-20 דקות, שוטפים ומייבשים היטב. מחממים תנור ל-200 מעלות.","מברישים את החציל והקישואים ברוב השמן וצולים על תבניות 20–25 דקות עד הזהבה וריכוך.","בינתיים מטגנים את הבצל בשארית השמן 4 דקות; מוסיפים את הפטריות והשום ומטגנים 6–8 דקות עד שהנוזלים מתאדים והפטריות משחימות.","מוסיפים לפטריות את העגבניות המרוסקות, האורגנו, הקינמון, מלח ופלפל ומבשלים 5 דקות לרוטב סמיך.","בתבנית אפייה מסדרים שכבות: חצי מהחציל, רוטב הפטריות-עגבניות, הקישואים, ומעל שארית החציל.","טורפים את היוגורט עם הביצים והבולגרית המפוררת ומורחים מעל; מפזרים את הגבינה הצהובה על פני השטח.","מנמיכים את התנור ל-180 מעלות ואופים 30–35 דקות עד שהציפוי יציב ומוזהב.","נותנים לנוח 10–15 דקות לפני החיתוך — מוסקה נחתכת הרבה יותר יפה כשהיא חמימה ולא רותחת."],"nutrition":{"calories":290,"fatG":21,"satFatG":7,"proteinG":14,"carbsG":13.6,"fiberG":4.2,"netCarbsG":9.4,"sugarG":7,"sodiumMg":550},"tips":"The cinnamon is not optional — it is what makes it taste like moussaka rather than a vegetable bake.","tipsHe":"הקינמון הוא לא המלצה — הוא מה שגורם לזה להיות מוסקה ולא סתם פשטידת ירקות.","sources":[{"creator":"Keto Vegetarian Recipes","url":"https://ketovegetarianrecipes.com/low-carb-vegetarian-moussaka/"},{"creator":"Divalicious Recipes","url":"https://divaliciousrecipes.com/roasted-vegetable-moussaka/"},{"creator":"Cooking LSL","url":"https://cookinglsl.com/low-carb-keto-eggplant-moussaka-recipe/"}],"comparedVersions":"Compared meat-based keto moussakas (adapted by swapping in a mushroom layer), Divalicious\u0027s roasted-vegetable version with an egg-yogurt-feta topping, and bechamel-topped versions. The yogurt-egg-feta topping won over bechamel — no roux, fewer steps, fewer carbs — and finely chopped browned mushrooms with cinnamon-tomato sauce best replicate the traditional meat layer.","comparedVersionsHe":"השווינו מוסקות קיטו בשריות (שהותאמו בהחלפת הבשר בשכבת פטריות), את גרסת הירקות הצלויים של Divalicious עם ציפוי ביצים-יוגורט-פטה, וגרסאות עם בשמל. ציפוי היוגורט-ביצים-בולגרית ניצח את הבשמל — בלי רביכה, פחות שלבים, פחות פחמימות — ופטריות קצוצות דק ומושחמות ברוטב עגבניות-קינמון משחזרות הכי טוב את שכבת הבשר המסורתית."},{"id":"keto-eggplant-parmesan","name":"Baked Keto Eggplant Parmesan","nameHe":"פרמז\u0027ן חצילים קיטו בתנור","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":25,"cookTimeMin":45,"difficulty":"medium","ingredients":[{"amount":"2 medium / 900 g","item":"eggplants, sliced into 1 cm rounds","israelNote":"chatzilim"},{"amount":"1 cup / 96 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"3/4 cup / 80 g","item":"grated parmesan, divided","israelNote":"parmesan or kashkaval"},{"amount":"1 tsp","item":"Italian herb seasoning (or dried oregano + basil)"},{"amount":"2 large","item":"eggs, beaten"},{"amount":"2 tbsp / 30 ml","item":"olive oil, for brushing"},{"amount":"1.5 cups / 375 g","item":"marinara or thick tomato sauce (no added sugar)","israelNote":"rotev agvaniyot without added sugar"},{"amount":"2 cups / 200 g","item":"shredded mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"}],"ingredientsHe":[{"amount":"2 בינוניים / 900 גרם","item":"חצילים, פרוסים לעיגולים בעובי 1 ס\"מ"},{"amount":"1 כוס / 96 גרם","item":"קמח שקדים"},{"amount":"3/4 כוס / 80 גרם","item":"גבינת פרמז\u0027ן מגוררת, מחולקת","israelNote":"אפשר להחליף בקשקבל"},{"amount":"1 כפית","item":"תערובת תבלינים איטלקית (או אורגנו ובזיליקום מיובשים)"},{"amount":"2 גדולות","item":"ביצים, טרופות"},{"amount":"2 כפות / 30 מ\"ל","item":"שמן זית, להברשה"},{"amount":"1.5 כוסות / 375 גרם","item":"רוטב עגבניות סמיך ללא סוכר מוסף"},{"amount":"2 כוסות / 200 גרם","item":"גבינת מוצרלה מגוררת","israelNote":"למשל של טרה או גד"}],"instructions":["Salt the eggplant rounds and let them sit in a colander for 15 minutes, then pat dry. Preheat the oven to 200C (400F).","Mix the almond flour, 50 g of the parmesan, Italian seasoning, and a pinch of salt and pepper in a shallow bowl.","Dip each eggplant slice in beaten egg, then press both sides into the almond flour mixture.","Arrange on a parchment-lined baking sheet, brush lightly with olive oil, and bake 20 minutes, flipping halfway, until golden.","Spread a thin layer of sauce in a baking dish. Add half the eggplant, half the remaining sauce, and half the mozzarella; repeat the layers.","Sprinkle the remaining parmesan on top and bake 20-25 minutes until bubbling and browned.","Rest 10 minutes before serving so the layers hold together."],"instructionsHe":["ממליחים את פרוסות החציל ומניחים במסננת 15 דקות, ואז מייבשים היטב. מחממים תנור ל-200 מעלות.","מערבבים בקערה שטוחה את קמח השקדים, 50 גרם מהפרמז\u0027ן, התבלינים האיטלקיים וקורט מלח ופלפל.","טובלים כל פרוסת חציל בביצה הטרופה ומצפים היטב משני הצדדים בתערובת קמח השקדים.","מסדרים על תבנית מרופדת בנייר אפייה, מברישים קלות בשמן זית ואופים 20 דקות, בהפיכה באמצע, עד להזהבה.","מורחים שכבה דקה של רוטב בתבנית אפייה. מסדרים חצי מהחצילים, חצי מהרוטב הנותר וחצי מהמוצרלה; חוזרים על השכבות.","מפזרים מעל את שארית הפרמז\u0027ן ואופים 20-25 דקות עד שהמאפה מבעבע ומזהיב.","ממתינים 10 דקות לפני ההגשה כדי שהשכבות יתייצבו."],"nutrition":{"calories":386,"fatG":27.3,"satFatG":8.3,"proteinG":20.0,"carbsG":16.4,"fiberG":7.0,"netCarbsG":9.4,"sugarG":6.7,"sodiumMg":780},"tips":"Baking the breaded slices until fully golden before layering is what keeps the dish from turning soggy.","tipsHe":"אפיית פרוסות החציל המצופות עד הזהבה מלאה לפני הרכבת השכבות היא שמונעת מהמנה להפוך לספוגית ורטובה.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/eggplant-parmesan-recipe/"},{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/eggplant-parmesan/"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-eggplant-parmesan/"}],"comparedVersions":"Compared breading approaches: pork rinds are out (not kosher), so the almond flour + parmesan coating used by Wholesome Yum and Healthy Recipes Blog won on both kashrut and simplicity. Baking instead of frying (all three sources agree) saves work and oil without hurting the crust.","comparedVersionsHe":"השווינו שיטות ציפוי: ציפוי על בסיס חזיר ירד מהפרק (לא כשר), ולכן ציפוי קמח השקדים והפרמז\u0027ן של Wholesome Yum ו-Healthy Recipes Blog ניצח גם בכשרות וגם בפשטות. אפייה במקום טיגון (כל שלושת המקורות מסכימים) חוסכת עבודה ושמן בלי לפגוע בפריכות."},{"id":"low-carb-shakshuka-feta","name":"Low-Carb Shakshuka with Feta","nameHe":"שקשוקה דלת-פחמימות עם גבינה בולגרית","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":3,"prepTimeMin":10,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"2 tbsp / 30 ml","item":"olive oil"},{"amount":"1 medium","item":"red bell pepper, diced"},{"amount":"3 cloves","item":"garlic, minced"},{"amount":"1 tsp","item":"sweet paprika"},{"amount":"1 tsp","item":"ground cumin"},{"amount":"1/4 tsp","item":"chili flakes (optional)"},{"amount":"1 can / 400 g","item":"crushed tomatoes","israelNote":"agvaniyot mepuletzet (canned crushed tomatoes)"},{"amount":"6 large","item":"eggs"},{"amount":"1/2 cup / 75 g","item":"crumbled feta","israelNote":"gvinat tzfatit/Bulgarit"},{"amount":"2 tbsp","item":"chopped fresh parsley or cilantro"}],"ingredientsHe":[{"amount":"2 כפות / 30 מ\"ל","item":"שמן זית"},{"amount":"1 בינוני","item":"פלפל אדום, חתוך לקוביות"},{"amount":"3 שיניים","item":"שום, קצוץ"},{"amount":"1 כפית","item":"פפריקה מתוקה"},{"amount":"1 כפית","item":"כמון טחון"},{"amount":"1/4 כפית","item":"פתיתי צ\u0027ילי (לא חובה)"},{"amount":"1 קופסה / 400 גרם","item":"עגבניות מרוסקות","israelNote":"עגבניות מרוסקות משומרות, בלי סוכר מוסף"},{"amount":"6 גדולות","item":"ביצים"},{"amount":"1/2 כוס / 75 גרם","item":"גבינה צפתית או בולגרית, מפוררת"},{"amount":"2 כפות","item":"פטרוזיליה או כוסברה טרייה, קצוצה"}],"instructions":["Heat the olive oil in a wide deep skillet over medium heat. Saute the diced pepper for 4-5 minutes until it softens.","Add the garlic, paprika, cumin, and chili flakes and stir for about 30 seconds until fragrant.","Pour in the crushed tomatoes, season with salt and pepper, and simmer uncovered for 10 minutes until the sauce thickens noticeably.","Make 6 small wells in the sauce with a spoon and crack an egg into each one.","Cover and cook 5-8 minutes, until the whites are set but the yolks are still soft.","Scatter the feta and herbs on top and serve straight from the pan."],"instructionsHe":["מחממים את שמן הזית במחבת רחבה ועמוקה על אש בינונית ומטגנים את קוביות הפלפל 4-5 דקות עד שהן מתרככות.","מוסיפים את השום, הפפריקה, הכמון ופתיתי הצ\u0027ילי ומערבבים כ-30 שניות עד שעולה הריח.","יוצקים את העגבניות המרוסקות, מתבלים במלח ופלפל ומבשלים ללא מכסה 10 דקות, עד שהרוטב מסמיך היטב.","יוצרים בעזרת כף 6 גומות ברוטב ושוברים ביצה לתוך כל אחת.","מכסים ומבשלים 5-8 דקות, עד שהחלבון מתייצב והחלמון עדיין רך.","מפזרים מעל את הגבינה ואת עשבי התיבול ומגישים ישר מהמחבת."],"nutrition":{"calories":346,"fatG":24.7,"satFatG":8.3,"proteinG":17.0,"carbsG":12.6,"fiberG":3.1,"netCarbsG":9.5,"sugarG":6.8,"sodiumMg":550},"tips":"Skipping the onion used in classic shakshuka is what keeps this keto; the bell pepper carries the sweetness instead.","tipsHe":"הוויתור על הבצל של השקשוקה הקלאסית הוא ששומר על המתכון קיטו; הפלפל האדום מספק את המתיקות במקומו.","sources":[{"creator":"Low Carb with Jennifer (Jennifer Banz)","url":"https://jenniferbanz.com/keto-shakshuka"},{"creator":"KETohh","url":"https://ketohh.com/low-carb-shakshuka/"},{"creator":"Hungry For Inspiration","url":"https://hungryforinspiration.com/keto-shakshuka/"}],"comparedVersions":"Compared three keto shakshukas: all cut the onion and rely on pepper plus canned tomatoes, differing mainly in spice load and whether feta is added. This version uses Jennifer Banz\u0027s simple one-pan method with KETohh\u0027s feta finish, which adds protein and fat for a true main dish at under 10 g net carbs.","comparedVersionsHe":"השווינו שלוש שקשוקות קיטו: כולן מוותרות על הבצל ונשענות על פלפל ועגבניות משומרות, וההבדל העיקרי הוא בכמות התבלינים ובתוספת הגבינה. הגרסה הזו משלבת את שיטת המחבת האחת הפשוטה של ג\u0027ניפר בנז עם סיום הגבינה של KETohh, שמוסיף חלבון ושומן והופך את המנה לעיקרית אמיתית עם פחות מ-10 גרם פחמימות נטו."},{"id":"caprese-stuffed-portobellos","name":"Caprese Stuffed Portobello Mushrooms","nameHe":"פטריות פורטובלו ממולאות בסגנון קפרזה","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":2,"prepTimeMin":10,"cookTimeMin":18,"difficulty":"easy","ingredients":[{"amount":"4 large / 320 g","item":"portobello mushroom caps, stems removed","israelNote":"pitriyot portobello"},{"amount":"2 tbsp / 30 ml","item":"olive oil"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"150 g","item":"fresh mozzarella, sliced (or shredded mozzarella)","israelNote":"mozzarella tarya (fresh ball) or shredded Tara/Gad"},{"amount":"1 cup / 150 g","item":"cherry tomatoes, halved"},{"amount":"8-10 leaves","item":"fresh basil, torn"},{"amount":"2 tsp / 10 ml","item":"balsamic vinegar"},{"amount":"1/4 tsp each","item":"salt and black pepper"}],"ingredientsHe":[{"amount":"4 גדולות / 320 גרם","item":"כיפות פטריות פורטובלו, ללא הרגליות"},{"amount":"2 כפות / 30 מ\"ל","item":"שמן זית"},{"amount":"2 שיניים","item":"שום, קצוץ"},{"amount":"150 גרם","item":"מוצרלה טרייה, פרוסה (או מוצרלה מגוררת)","israelNote":"כדור מוצרלה טרי, או מגוררת של טרה/גד"},{"amount":"1 כוס / 150 גרם","item":"עגבניות שרי, חצויות"},{"amount":"8-10 עלים","item":"בזיליקום טרי, קרוע"},{"amount":"2 כפיות / 10 מ\"ל","item":"חומץ בלסמי"},{"amount":"1/4 כפית מכל אחד","item":"מלח ופלפל שחור"}],"instructions":["Preheat the oven to 200C (400F). Wipe the mushroom caps clean with a paper towel (do not rinse) and scrape out the dark gills with a spoon.","Mix the olive oil with the garlic, salt, and pepper and brush it over both sides of the caps.","Place the caps hollow-side up on a lined baking sheet and roast 8 minutes to draw out their moisture; pour off any liquid.","Fill each cap with mozzarella and top with the halved cherry tomatoes.","Bake 8-10 minutes until the cheese is melted and blistered; broil 1-2 minutes at the end for color if you like.","Scatter the basil over the top and finish each mushroom with a few drops of balsamic vinegar."],"instructionsHe":["מחממים תנור ל-200 מעלות. מנגבים את כיפות הפטריות במגבת נייר (לא שוטפים) ומגרדים החוצה את הזימים הכהים בעזרת כף.","מערבבים את שמן הזית עם השום, המלח והפלפל ומברישים משני צידי הכיפות.","מניחים את הכיפות עם הצד החלול כלפי מעלה על תבנית מרופדת וצולים 8 דקות להוצאת הנוזלים; שופכים את הנוזלים שהצטברו.","ממלאים כל כיפה במוצרלה ומניחים מעל את חצאי עגבניות השרי.","אופים 8-10 דקות עד שהגבינה נמסה ומקבלת שלפוחיות; מי שרוצה צבע מסיים ב-1-2 דקות בגריל התנור.","מפזרים מעל את הבזיליקום ומטפטפים על כל פטרייה כמה טיפות חומץ בלסמי."],"nutrition":{"calories":410,"fatG":31.0,"satFatG":12.0,"proteinG":20.0,"carbsG":12.4,"fiberG":2.9,"netCarbsG":9.5,"sugarG":5.2,"sodiumMg":500},"tips":"Pre-roasting the empty caps and draining them keeps the caprese filling from swimming; commercial balsamic glaze often has added sugar, so a few drops of plain balsamic do the job.","tipsHe":"צלייה מקדימה של הכיפות הריקות וניקוזן מונעת ממלית הקפרזה לשחות בנוזלים; גלייז בלסמי קנוי מכיל לרוב סוכר מוסף, ולכן כמה טיפות חומץ בלסמי רגיל עושות את העבודה.","sources":[{"creator":"Cafe Delites (Karina Carrel)","url":"https://cafedelites.com/caprese-stuffed-garlic-butter-portobellos/"},{"creator":"Dizzy Busy and Hungry","url":"https://dizzybusyandhungry.com/mozzarella-portabellas/"},{"creator":"Our Zesty Life","url":"https://ourzestylife.com/caprese-stuffed-portobello-mushrooms/"}],"comparedVersions":"Compared garlic-butter (Ca
