fe Delites), pesto-lined (Our Zesty Life), and minimal (Dizzy Busy and Hungry) versions. Garlic oil plus a pre-roast/drain step won: pesto adds an ingredient without changing the character, and undrained caps were the common complaint. Plain balsamic replaces sugary glaze to keep it keto.","comparedVersionsHe":"השווינו גרסת חמאת שום (Cafe Delites), גרסה עם שכבת פסטו (Our Zesty Life) וגרסה מינימלית (Dizzy Busy and Hungry). שמן שום עם שלב צלייה וניקוז מקדים ניצח: הפסטו מוסיף מצרך בלי לשנות את האופי, וכיפות לא מנוקזות היו התלונה הנפוצה. חומץ בלסמי רגיל מחליף גלייז ממותק כדי להישאר קיטו."},{"id":"zucchini-noodles-alfredo","name":"Zucchini Noodles Alfredo","nameHe":"אטריות קישואים ברוטב אלפרדו","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":2,"prepTimeMin":15,"cookTimeMin":10,"difficulty":"easy","ingredients":[{"amount":"2 large / 500 g","item":"zucchini, spiralized into noodles","israelNote":"kishuim; a julienne peeler works if you have no spiralizer"},{"amount":"1/2 tsp","item":"salt, for sweating the noodles"},{"amount":"2 tbsp / 28 g","item":"butter"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"3/4 cup / 180 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1/2 cup / 50 g","item":"finely grated parmesan, plus extra to serve","israelNote":"parmesan or kashkaval"},{"amount":"1/4 tsp","item":"black pepper"},{"amount":"pinch","item":"grated nutmeg (optional)"}],"ingredientsHe":[{"amount":"2 גדולים / 500 גרם","item":"קישואים, מגולגלים לאטריות בספירלייזר","israelNote":"אם אין ספירלייזר, קולפן ז\u0027וליין עובד יפה"},{"amount":"1/2 כפית","item":"מלח, להזעת האטריות"},{"amount":"2 כפות / 28 גרם","item":"חמאה"},{"amount":"2 שיניים","item":"שום, קצוץ"},{"amount":"3/4 כוס / 180 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1/2 כוס / 50 גרם","item":"גבינת פרמז\u0027ן מגוררת דק, ועוד קצת להגשה","israelNote":"אפשר להחליף בקשקבל"},{"amount":"1/4 כפית","item":"פלפל שחור"},{"amount":"קורט","item":"אגוז מוסקט מגורר (לא חובה)"}],"instructions":["Toss the zucchini noodles with the salt in a colander and let them drain 15-20 minutes, then squeeze gently and pat very dry.","Melt the butter in a large skillet over medium heat and cook the garlic 30 seconds until fragrant.","Pour in the cream and simmer 3-4 minutes until it thickens slightly and coats a spoon.","Off the heat, whisk in the parmesan, pepper, and nutmeg until the sauce is smooth.","Return the pan to medium heat, add the zoodles, and toss just 1-2 minutes to heat through - no longer, or they weep water.","Serve immediately with extra parmesan."],"instructionsHe":["מערבבים את אטריות הקישוא עם המלח במסננת ומניחים לנקז 15-20 דקות, ואז סוחטים בעדינות ומייבשים היטב.","ממיסים את החמאה במחבת גדולה על אש בינונית ומבשלים את השום 30 שניות עד שעולה הריח.","יוצקים את השמנת ומבשלים 3-4 דקות עד שהיא מסמיכה מעט ומצפה גב של כף.","מחוץ לאש טורפים פנימה את הפרמז\u0027ן, הפלפל והמוסקט עד שהרוטב חלק.","מחזירים את המחבת לאש בינונית, מוסיפים את האטריות ומערבבים רק 1-2 דקות לחימום - לא יותר, אחרת הן מפרישות מים.","מגישים מיד עם עוד פרמז\u0027ן."],"nutrition":{"calories":540,"fatG":49.0,"satFatG":29.0,"proteinG":13.6,"carbsG":12.3,"fiberG":2.6,"netCarbsG":9.7,"sugarG":7.0,"sodiumMg":600},"tips":"Eat this one fresh - zoodles in sauce do not keep. If cooking for one, sauce half and store the rest of the sauce and raw zoodles separately.","tipsHe":"את המנה הזו אוכלים טרייה - אטריות קישוא ברוטב לא נשמרות. אם מבשלים לסועד אחד, מצפים ברוטב רק חצי ושומרים את שאר הרוטב והאטריות הלא מבושלות בנפרד.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/recipes/zucchini-noodles-alfredo/"},{"creator":"KetoDiet Blog","url":"https://ketodietapp.com/Blog/lchf/keto-zucchini-noodle-alfredo"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-alfredo-creamy-zucchini-noodles/"}],"comparedVersions":"Compared sauces (cream-only vs cream-cheese-thickened) and zoodle handling. The classic butter-cream-parmesan sauce won on ingredient count; the salt-and-drain step plus a very brief toss - the consistent advice across all three sources - matters more than any sauce tweak for avoiding watery alfredo.","comparedVersionsHe":"השווינו רטבים (שמנת בלבד מול הסמכה בגבינת שמנת) ושיטות טיפול באטריות הקישוא. רוטב החמאה-שמנת-פרמז\u0027ן הקלאסי ניצח במספר המצרכים; שלב ההמלחה והניקוז יחד עם ערבוב קצרצר במחבת - העצה העקבית בשלושת המקורות - חשוב יותר מכל שדרוג רוטב למניעת אלפרדו מימי."},{"id":"roasted-cabbage-steaks-cheese","name":"Roasted Cabbage Steaks with Melted Cheese","nameHe":"סטייקים של כרוב צלוי עם גבינה מותכת","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":35,"difficulty":"easy","ingredients":[{"amount":"1 medium head / 1 kg","item":"green cabbage"},{"amount":"3 tbsp / 45 ml","item":"olive oil"},{"amount":"2 cloves","item":"garlic, crushed or grated"},{"amount":"1 tsp","item":"sweet paprika"},{"amount":"1/2 tsp each","item":"salt and black pepper"},{"amount":"1/2 tsp","item":"dried thyme or oregano"},{"amount":"1 1/3 cups / 160 g","item":"shredded mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"1/3 cup / 30 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"}],"ingredientsHe":[{"amount":"1 ראש בינוני / 1 ק\"ג","item":"כרוב ירוק"},{"amount":"3 כפות / 45 מ\"ל","item":"שמן זית"},{"amount":"2 שיניים","item":"שום, כתוש או מגורר"},{"amount":"1 כפית","item":"פפריקה מתוקה"},{"amount":"1/2 כפית מכל אחד","item":"מלח ופלפל שחור"},{"amount":"1/2 כפית","item":"טימין או אורגנו מיובש"},{"amount":"1 1/3 כוסות / 160 גרם","item":"מוצרלה מגוררת","israelNote":"מוצרלה מגוררת (תרה/גד)"},{"amount":"1/3 כוס / 30 גרם","item":"פרמזן מגורר","israelNote":"אפשר גם קשקבל"}],"instructions":["Heat the oven to 200C / 400F and line a baking sheet with parchment.","Keeping the core intact so the slices hold together, cut the cabbage through the core into 4 thick \u0027steaks\u0027 (about 2.5 cm / 1 inch).","Stir the oil with the garlic, paprika, salt, pepper, and herbs; brush it over both sides of each steak.","Roast 25-30 minutes, flipping once, until the edges are browned and the center is tender when pierced.","Top each steak with mozzarella and parmesan.","Return to the oven 5 minutes (or broil 2-3 minutes) until the cheese is melted and spotted golden.","Serve hot, with a fried egg on top for extra protein if you like."],"instructionsHe":["מחממים תנור ל-200 מעלות ומרפדים תבנית בנייר אפייה.","חותכים את הכרוב דרך הליבה ל-4 \u0027סטייקים\u0027 עבים (כ-2.5 ס\"מ), ומשאירים את הליבה שלמה כדי שהפרוסות יחזיקו מעמד.","מערבבים את השמן עם השום, הפפריקה, המלח, הפלפל ועשבי התיבול; מברישים משני הצדדים של כל סטייק.","צולים 25–30 דקות, הופכים פעם אחת, עד שהקצוות משחימים והמרכז רך בנעיצת סכין.","מפזרים על כל סטייק מוצרלה ופרמזן.","מחזירים לתנור ל-5 דקות (או במצב גריל 2–3 דקות) עד שהגבינה נמסה ומזהיבה בכתמים.","מגישים חם, ומי שרוצה תוספת חלבון — עם ביצת עין מעל."],"nutrition":{"calories":330,"fatG":23,"satFatG":8,"proteinG":15,"carbsG":16,"fiberG":6.2,"netCarbsG":9.8,"sugarG":8,"sodiumMg":650},"lowCarbVariant":"Add a drizzle of tahini and chopped parsley after baking for a heartier plate (adds ~2 g net carbs).","lowCarbVariantHe":"מזליפים טחינה גולמית ומפזרים פטרוזיליה קצוצה אחרי האפייה למנה משביעה יותר (מוסיף כ-2 גרם פחמימות נטו).","tips":"Do not core the cabbage before slicing — the core is what keeps each steak in one piece.","tipsHe":"לא מסירים את הליבה לפני הפריסה — הליבה היא מה שמחזיק כל סטייק בחתיכה אחת.","sources":[{"creator":"Eatwell101","url":"https://www.eatwell101.com/cheesy-baked-cabbage-steaks-recipe"},{"creator":"I\u0027d Rather Be A Chef","url":"https://www.idratherbeachef.com/cabbage-steaks/"},{"creator":"Home. Made. Interest.","url":"https://www.homemadeinterest.com/oven-roasted-cabbage-steaks/"}],"comparedVersions":"Compared parmesan-only versions with mozzarella-topped and blue-cheese versions. Chose a seasoned-oil brush plus a mozzarella-parmesan finish: parmesan alone browned but did not read as a main dish, while the mozzarella layer melts into the crevices and makes it substantial enough for dinner.","comparedVersionsHe":"השווינו גרסאות עם פרמזן בלבד מול גרסאות עם מוצרלה וגבינה כחולה. בחרנו בהברשה בשמן מתובל וסיום של מוצרלה ופרמזן: פרמזן לבדו השחים יפה אבל לא הרגיש כמו מנה עיקרית, ואילו שכבת המוצרלה נמסה לתוך החריצים והופכת את המנה למשביעה מספיק לארוחת ערב."},{"id":"mushroom-stroganoff-zoodles","name":"Mushroom Stroganoff over Zucchini Noodles","nameHe":"סטרוגנוף פטריות על אטריות קישואים","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"lowcarb","servings":4,"prepTimeMin":15,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"600 g","item":"mushrooms (button, cremini, or a mix), thickly sliced"},{"amount":"2 tbsp / 30 g","item":"butter"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1 small","item":"onion, finely chopped"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"2 tsp","item":"sweet paprika"},{"amount":"1/2 cup / 120 ml","item":"vegetable broth"},{"amount":"3/4 cup / 180 ml","item":"heavy cream","israelNote":"shamenet metuka 38%"},{"amount":"1/4 cup / 60 g","item":"sour cream, plus 1 tsp Dijon mustard","israelNote":"shamenet chamutza 15%"},{"amount":"4 medium / 800 g","item":"zucchini, spiralized into noodles","israelNote":"kishuim; a julienne peeler works if you have no spiralizer"}],"ingredientsHe":[{"amount":"600 גרם","item":"פטריות (שמפיניון, פטריות חומות או תערובת), פרוסות עבה"},{"amount":"2 כפות / 30 גרם","item":"חמאה"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1 קטן","item":"בצל, קצוץ דק"},{"amount":"2 שיניים","item":"שום, קצוץ"},{"amount":"2 כפיות","item":"פפריקה מתוקה"},{"amount":"1/2 כוס / 120 מ\"ל","item":"ציר ירקות"},{"amount":"3/4 כוס / 180 מ\"ל","item":"שמנת מתוקה 38%"},{"amount":"1/4 כוס / 60 גרם","item":"שמנת חמוצה 15%, ועוד 1 כפית חרדל דיז\u0027ון"},{"amount":"4 בינוניים / 800 גרם","item":"קישואים, מגולגלים לאטריות (זודלס)","israelNote":"אם אין ספירלייזר, קולפן ז\u0027וליין עובד מצוין"}],"instructions":["Heat the butter and oil in a large deep skillet over medium-high heat. Cook the mushrooms in one layer (in batches if needed) 6-8 minutes until browned and their liquid has evaporated.","Lower the heat, add the onion, and cook 4-5 minutes until soft; stir in the garlic and paprika for 30 seconds.","Pour in the broth, scraping the pan, and simmer 2 minutes to reduce by half.","Stir in the heavy cream and Dijon and simmer gently 3-4 minutes until the sauce coats a spoon. Off the heat, stir in the sour cream; season with salt and pepper.","Meanwhile, in a second skillet, saute the zucchini noodles in a little oil over high heat for 2-3 minutes only — just heated through, still with bite.","Serve the stroganoff over the drained zoodles with chopped parsley."],"instructionsHe":["מחממים את החמאה והשמן במחבת גדולה ועמוקה על אש בינונית-גבוהה. מטגנים את הפטריות בשכבה אחת (במנות אם צריך) 6–8 דקות עד שהן משחימות והנוזלים שלהן מתאדים.","מנמיכים את האש, מוסיפים את הבצל ומטגנים 4–5 דקות עד שהוא מתרכך; מוסיפים את השום והפפריקה ומערבבים 30 שניות.","יוצקים את הציר תוך גירוד תחתית המחבת ומבשלים 2 דקות עד שהוא מצטמצם בחצי.","מוסיפים את השמנת המתוקה והדיז\u0027ון ומבשלים בעדינות 3–4 דקות עד שהרוטב מצפה כף. מורידים מהאש ומערבבים פנימה את השמנת החמוצה; מתבלים במלח ופלפל.","בינתיים, במחבת שנייה, מקפיצים את אטריות הקישואים במעט שמן על אש גבוהה 2–3 דקות בלבד — רק שיתחממו ויישארו נגיסים.","מגישים את הסטרוגנוף על הזודלס המסוננים, עם פטרוזיליה קצוצה מעל."],"nutrition":{"calories":350,"fatG":29,"satFatG":16,"proteinG":9,"carbsG":16,"fiberG":4,"netCarbsG":12,"sugarG":6.5,"sodiumMg":600},"ketoVariant":"Halve the onion and serve over 500 g zoodles instead of 800 g — about 9 g net carbs.","ketoVariantHe":"מפחיתים את הבצל לחצי ומגישים על 500 גרם זודלס במקום 800 גרם — כ-9 גרם פחמימות נטו.","tips":"Never boil after adding sour cream or it will split. Salt the zoodles only on the plate — salting in the pan makes them weep water into the sauce. A handful of grated parmesan boosts the protein.","tipsHe":"אחרי הוספת השמנת החמוצה לא מרתיחים — הרוטב יישבר. ממליחים את הזודלס רק בצלחת — המלחה במחבת גורמת להם להזיל נוזלים לתוך הרוטב. חופן פרמזן מגורר מוסיף חלבון.","sources":[{"creator":"Easy and Delish","url":"https://www.easyanddelish.com/vegan-mushroom-stroganoff/"},{"creator":"Keto Vegetarian Recipes","url":"https://ketovegetarianrecipes.com/one-pot-vegan-mushroom-stroganoff-low-carb/"},{"creator":"Veggie Desserts","url":"https://veggiedesserts.com/mushroom-stroganoff/"}],"comparedVersions":"Compared vegan versions built on coconut milk and nutritional yeast with dairy versions using cream and sour cream. Since this is a dairy category, cream plus a sour-cream finish won on flavor (real stroganoff tang); the brown-mushrooms-first, deglaze, then cream sequence was the common technique across all versions.","comparedVersionsHe":"השווינו גרסאות טבעוניות על בסיס חלב קוקוס ושמרי בירה תזונתיים מול גרסאות חלביות עם שמנת ושמנת חמוצה. מכיוון שזו קטגוריה חלבית, שמנת עם סיום של שמנת חמוצה ניצחה בטעם (החמצמצות האמיתית של סטרוגנוף); רצף ההשחמת-פטריות-קודם, דגלוז ואז שמנת היה הטכניקה המשותפת לכל הגרסאות."},{"id":"eggplant-rollatini-ricotta-spinach","name":"Eggplant Rollatini with Ricotta \u0026 Spinach","nameHe":"רולדות חצילים במילוי ריקוטה ותרד","category":"dairy-vegetarian-mains","kosherType":"dairy","dietTags":"lowcarb","servings":4,"prepTimeMin":30,"cookTimeMin":60,"difficulty":"medium","ingredients":[{"amount":"2 medium / 900 g","item":"eggplants, sliced lengthwise into 1/4-inch (6 mm) slices"},{"amount":"1 tsp","item":"salt, for drawing out moisture"},{"amount":"1 cup / 250 g","item":"ricotta cheese","israelNote":"gvina levana 5% or ricotta"},{"amount":"1 large","item":"egg"},{"amount":"1/2 cup / 50 g","item":"grated parmesan","israelNote":"parmesan or kashkaval"},{"amount":"200 g","item":"frozen chopped spinach, thawed and squeezed very dry"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"1 cup / 240 g","item":"marinara sauce, no added sugar","israelNote":"rotev agvaniyot without added sugar, or passata seasoned with garlic and oregano"},{"amount":"1 cup / 120 g","item":"shredded mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"}],"ingredientsHe":[{"amount":"2 בינוניים / 900 גרם","item":"חצילים, פרוסים לאורך לפרוסות בעובי 6 מ\"מ"},{"amount":"1 כפית","item":"מלח, להוצאת הנוזלים"},{"amount":"1 כוס / 250 גרם","item":"גבינת ריקוטה","israelNote":"אפשר להחליף בגבינה לבנה 5%"},{"amount":"1 גדולה","item":"ביצה"},{"amount":"1/2 כוס / 50 גרם","item":"פרמזן מגורר","israelNote":"אפשר גם קשקבל"},{"amount":"200 גרם","item":"תרד קצוץ קפוא, מופשר וסחוט היטב"},{"amount":"2 שיניים","item":"שום, קצוץ"},{"amount":"1 כוס / 240 גרם","item":"רוטב עגבניות ללא סוכר מוסף","israelNote":"בודקים שאין סוכר ברשימת הרכיבים; אפשר גם פסטת עגבניות מתובלת בשום ואורגנו"},{"amount":"1 כוס / 120 גרם","item":"מוצרלה מגוררת","israelNote":"מוצרלה מגוררת (תרה/גד)"}],"instructions":["Salt the eggplant slices and let them sit in a colander for 20-30 minutes, then pat dry. This removes bitterness and excess water.","Heat the oven to 200C / 400F. Lay the slices on lined baking sheets and bake 8-10 minutes, just until soft and pliable (not browned).","Mix the ricotta, egg, parmesan, squeezed spinach, garlic, and a pinch of pepper into a thick filling.","Spread a thin layer of marinara over the bottom of a baking dish.","Put a heaped tablespoon of filling on the wide end of each eggplant slice, roll it up, and set it seam-side down in the dish.","Spoon the remaining marinara over the rolls and scatter the mozzarella on top.","Cover with foil and bake 40 minutes, then uncover and bake 15-20 minutes more until the eggplant is completely tender and the cheese is golden.","Rest 5 minutes before serving."],"instructionsHe":["ממליחים את פרוסות החצילים ומניחים במסננת ל-20–30 דקות, ואז מייבשים היטב במגבת נייר. כך יוצאות המרירות ועודפי הנוזלים.","מחממים תנור ל-200 מעלות. מסדרים את הפרוסות על תבניות מרופדות בנייר אפייה ואופים 8–10 דקות, רק עד שהן רכות וגמישות (בלי להשחים).","מערבבים את הריקוטה, הביצה, הפרמזן, התרד הסחוט, השום וקורט פלפל למילוי סמיך.","מורחים שכבה דקה של רוטב עגבניות בתחתית תבנית אפייה.","מניחים כף גדושה מהמילוי בקצה הרחב של כל פרוסת חציל, מגלגלים ומניחים בתבנית עם התפר כלפי מטה.","יוצקים את שארית הרוטב על הרולדות ומפזרים את המוצרלה מעל.","מכסים בנייר אלומיניום ואופים 40 דקות, ואז מסירים את הכיסוי ואופים עוד 15–20 דקות עד שהחציל רך לגמרי והגבינה מוזהבת.","נותנים לנוח 5 דקות לפני ההגשה."],"nutrition":{"calories":395,"fatG":23,"satFatG":11,"proteinG":21,"carbsG":21,"fiberG":8,"netCarbsG":13,"sugarG":10,"sodiumMg":850},"ketoVariant":"Use only 1/2 cup marinara (brush a thin film on each roll) and divide into 5 servings — about 9 g net carbs.","ketoVariantHe":"משתמשים רק ב-1/2 כוס רוטב עגבניות (מברישים שכבה דקה על כל רולדה) ומחלקים ל-5 מנות — כ-9 גרם פחמימות נטו.","tips":"Slice the eggplant with a mandoline or long sharp knife for even slices; slices that are too thick will crack when rolled.","tipsHe":"פורסים את החציל במנדולינה או בסכין ארוכה וחדה כדי לקבל פרוסות אחידות; פרוסות עבות מדי נסדקות בגלגול.","sources":[{"creator":"Skinnytaste (Gina Homolka)","url":"https://www.skinnytaste.com/best-skinny-eggplant-rollatini-with/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/eggplant-rollatini-recipe/"},{"creator":"Keto Vegetarian Recipes","url":"https://ketovegetarianrecipes.com/keto-eggplant-rollatini/"}],"comparedVersions":"Compared Skinnytaste\u0027s naked-roll method with keto versions that bread the eggplant in almond flour and egg. Chose the Skinnytaste approach (pre-bake, fill, roll) for fewer ingredients and less frying, keeping the ricotta-spinach-parmesan filling ratio that all versions agree on, with unsweetened marinara to cut carbs.","comparedVersionsHe":"השווינו את שיטת הגלגול ללא ציפוי של Skinnytaste מול גרסאות קיטו שמצפות את החציל בקמח שקדים וביצה. בחרנו בגישת Skinnytaste (אפייה מקדימה, מילוי, גלגול) — פחות מרכיבים ופחות טיגון — עם יחס מילוי הריקוטה-תרד-פרמזן שכל הגרסאות מסכימות עליו, ורוטב עגבניות ללא סוכר להפחתת הפחמימות."},{"id":"black-soybean-hummus","name":"Black Soybean \"Hummus\"","nameHe":"\"חומוס\" מפולי סויה שחורים","category":"legumes-grains","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 can (425 g) / 255 g drained","item":"black soybeans, drained and rinsed","israelNote":"פולי סויה שחורים — iHerb/חנויות טבע; אפשר להמיר לאדממה מבושלת"},{"amount":"3 tbsp / 45 g","item":"raw tahini","israelNote":"טחינה גולמית (הר ברכה/אחוה)"},{"amount":"3 tbsp / 45 ml","item":"fresh lemon juice"},{"amount":"2 cloves","item":"garlic"},{"amount":"1/2 tsp","item":"ground cumin"},{"amount":"2 tbsp","item":"olive oil, plus more for serving"},{"amount":"1/4 tsp","item":"salt"},{"amount":"2-4 tbsp","item":"ice water"},{"amount":"for serving","item":"sweet paprika"}],"ingredientsHe":[{"amount":"1 קופסה (425 גרם) / 255 גרם מסונן","item":"פולי סויה שחורים, מסוננים ושטופים","israelNote":"פולי סויה שחורים — iHerb/חנויות טבע; אפשר להמיר לאדממה מבושלת"},{"amount":"3 כפות / 45 גרם","item":"טחינה גולמית","israelNote":"טחינה גולמית (הר ברכה/אחוה)"},{"amount":"3 כפות / 45 מ\"ל","item":"מיץ לימון טרי"},{"amount":"2 שיני","item":"שום"},{"amount":"1/2 כפית","item":"כמון טחון"},{"amount":"2 כפות","item":"שמן זית, ועוד להגשה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"2-4 כפות","item":"מי קרח"},{"amount":"להגשה","item":"פפריקה מתוקה"}],"instructions":["Put the drained soybeans, tahini, lemon juice, garlic, cumin, and salt in a food processor and blend 1 minute.","Scrape down the sides and run again, streaming in ice water a tablespoon at a time until the texture is light and creamy — 2-3 minutes total.","With the machine running, stream in the olive oil.","Taste and adjust lemon and salt (soybeans are milder than chickpeas, so be generous with lemon).","Spread in a bowl, swirl the top, and finish with olive oil and paprika.","Serve with vegetable sticks. Keeps 5 days refrigerated."],"instructionsHe":["שמים במעבד מזון את פולי הסויה המסוננים, הטחינה, מיץ הלימון, השום, הכמון והמלח וטוחנים דקה.","מנקים את הדפנות וטוחנים שוב, תוך הזלפת מי קרח כף אחר כף עד למרקם אוורירי וקרמי — 2-3 דקות בסך הכול.","כשהמכונה עובדת מזליפים פנימה את שמן הזית.","טועמים ומתקנים לימון ומלח (פולי סויה עדינים מגרגירי חומוס, אז נדיבים עם הלימון).","מורחים בקערה, מסלסלים את פני השטח ומסיימים בשמן זית ופפריקה.","מגישים עם מקלות ירקות. נשמר 5 ימים במקרר."],"nutrition":{"calories":130,"fatG":10,"satFatG":1.5,"proteinG":5,"carbsG":5,"fiberG":3,"netCarbsG":2,"sugarG":0.5,"sodiumMg":220},"tips":"About 2 g net carbs per generous 1/4-cup serving — black soybeans are almost all fiber and protein, making this the lowest-carb \u0027hummus\u0027 possible. If black soybeans are unavailable, blend cooked shelled edamame instead (about 4 g net per serving).","tipsHe":"כ-2 גרם פחמימות נטו למנה נדיבה של 1/4 כוס — פולי סויה שחורים הם כמעט רק סיבים וחלבון, מה שהופך את זה ל\u0027חומוס\u0027 עם הכי מעט פחמימות שאפשר. אם אין פולי סויה שחורים, טוחנים במקום אדממה מבושלת ומקולפת (כ-4 גרם נטו למנה).","sources":[{"creator":"Feed n Flow","url":"https://feednflow.com/blog/post/black-soy-bean-hummus-keto-low-carb-vegan"},{"creator":"Food.com","url":"https://www.food.com/recipe/black-soybean-hummus-27783"},{"creator":"Cooking Is Like Love","url":"https://cookingislikelove.com/wp/black-soybean-hummus/"}],"comparedVersions":"Compared three versions: Feed n Flow\u0027s keto-focused tahini-lemon blend, Food.com\u0027s version with sour cream, minced onion, and cayenne, and Cooking Is Like Love\u0027s classic-hummus treatment. Kept the classic hummus method (tahini, lemon, garlic, cumin) and stayed pareve by skipping the sour cream; borrowed the ice-water whipping trick from traditional hummus making for a creamy texture.","comparedVersionsHe":"השווינו שלוש גרסאות: הבלנד הקטוגני של פיד אן פלואו עם טחינה ולימון, גרסת פוד.קום עם שמנת חמוצה, בצל קצוץ וקאיין, והטיפול הקלאסי של קוקינג איז לייק לאב. שמרנו על שיטת החומוס הקלאסית (טחינה, לימון, שום, כמון) ונשארנו פרווה בלי השמנת החמוצה; שאלנו את טריק ההקצפה עם מי קרח מהכנת חומוס מסורתית למרקם קרמי."},{"id":"snow-pea-sesame-saute","name":"Snow Pea and Sesame Quick Sauté","nameHe":"הקפצה מהירה של אפונת שלג ושומשום","category":"legumes-grains","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":8,"cookTimeMin":5,"difficulty":"easy","ingredients":[{"amount":"400 g","item":"snow peas, strings removed","israelNote":"אפונת שלג (סנאו פיז) — במעדניות ירקות ובסופרים גדולים, טרייה או קפואה"},{"amount":"1 tbsp","item":"light olive oil or avocado oil"},{"amount":"1 tbsp","item":"toasted sesame oil"},{"amount":"2 cloves","item":"garlic, thinly sliced"},{"amount":"1 tsp","item":"grated fresh ginger"},{"amount":"1 tbsp","item":"soy sauce","israelNote":"check for kosher certification"},{"amount":"1 tbsp","item":"toasted sesame seeds"},{"amount":"pinch","item":"chili flakes (optional)"}],"ingredientsHe":[{"amount":"400 גרם","item":"אפונת שלג נקייה מסיבים","israelNote":"אפונת שלג (סנאו פיז) — במעדניות ירקות ובסופרים גדולים, טרייה או קפואה"},{"amount":"1 כף","item":"שמן זית עדין או שמן אבוקדו"},{"amount":"1 כף","item":"שמן שומשום קלוי"},{"amount":"2 שיני","item":"שום פרוס דק"},{"amount":"1 כפית","item":"ג\u0027ינג\u0027ר טרי מגורר"},{"amount":"1 כף","item":"רוטב סויה","israelNote":"בודקים הכשר"},{"amount":"1 כף","item":"שומשום קלוי"},{"amount":"קורט","item":"פתיתי צ\u0027ילי (לא חובה)"}],"instructions":["Pull the string off each snow pea and pat them dry.","Heat a wide pan or wok over high heat until very hot, then add the olive oil.","Add the snow peas, toss once, then leave them undisturbed 1 minute so they blister.","Add the garlic and ginger and stir-fry 30 seconds until fragrant.","Add the soy sauce and sesame oil and toss 1 minute more — the peas should be bright green and tender-crisp.","Off the heat, sprinkle with sesame seeds and chili flakes and serve immediately."],"instructionsHe":["מסירים את הסיב מכל תרמיל ומייבשים היטב.","מחממים מחבת רחבה או ווק על אש גבוהה עד שהם לוהטים, ומוסיפים את שמן הזית.","מוסיפים את אפונת השלג, מקפיצים פעם אחת ומשאירים ללא הפרעה דקה אחת כדי שתשתלפח.","מוסיפים את השום והג\u0027ינג\u0027ר ומקפיצים 30 שניות עד לניחוח.","מוסיפים את הסויה ושמן השומשום ומקפיצים עוד דקה — האפונה צריכה להיות ירוקה בוהקת ופריכה-רכה.","מחוץ לאש מפזרים שומשום ופתיתי צ\u0027ילי ומגישים מיד."],"nutrition":{"calories":115,"fatG":8,"satFatG":1.2,"proteinG":3.5,"carbsG":9.5,"fiberG":3,"netCarbsG":6.5,"sugarG":4,"sodiumMg":350},"tips":"100 g snow peas per serving. The whole dish lives or dies on heat: a screaming-hot pan and under 4 minutes total keeps the peas crisp; a medium pan steams them limp.","tipsHe":"100 גרם אפונת שלג למנה. כל המנה תלויה בחום: מחבת לוהטת ופחות מ-4 דקות בסך הכול שומרות על האפונה פריכה; מחבת בינונית מאדה אותה לרכות.","sources":[{"creator":"The Kitchn","url":"https://www.thekitchn.com/recipe-quick-sesame-snow-peas-side-dish-recipes-from-the-kitchn-21362"},{"creator":"Slender Kitchen","url":"https://www.slenderkitchen.com/recipe/sauteed-snow-peas"},{"creator":"Garlic \u0026 Zest","url":"https://www.garlicandzest.com/snow-peas-recipe/"}],"comparedVersions":"Compared three versions: The Kitchn\u0027s three-ingredient sesame-oil-and-lemon take, Slender Kitchen\u0027s garlicky 15-minute saute, and Garlic \u0026 Zest\u0027s garlic-ginger-soy version. Merged them: the blister-then-leave-alone technique and sesame finish from The Kitchn, the garlic-ginger-soy flavor base from Garlic \u0026 Zest, all inside a 5-minute cook.","comparedVersionsHe":"השווינו שלוש גרסאות: גרסת שלושת המרכיבים של דה קיטשן עם שמן שומשום ולימון, ההקפצה השומית של סלנדר קיטשן ב-15 דקות, וגרסת השום-ג\u0027ינג\u0027ר-סויה של גרליק אנד זסט. מיזגנו: טכניקת ההשחמה-בלי-לגעת וסיום השומשום מדה קיטשן, בסיס הטעם של שום-ג\u0027ינג\u0027ר-סויה מגרליק אנד זסט, והכול בבישול של 5 דקות."},{"id":"marinated-lupini-turmus","name":"Marinated Lupini Beans (Turmus, Israeli Style)","nameHe":"תורמוס מתובל בסגנון ישראלי","category":"legumes-grains","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"3 cups / 500 g","item":"jarred prepared lupini beans, drained and rinsed","israelNote":"תורמוס (מוכן בצנצנת או יבש) — jarred saves a week of de-bittering"},{"amount":"3 tbsp","item":"fresh lemon juice"},{"amount":"2 tbsp","item":"olive oil"},{"amount":"1 tsp","item":"ground cumin"},{"amount":"1/2 tsp","item":"sweet paprika"},{"amount":"1 clove","item":"garlic, crushed"},{"amount":"3 tbsp","item":"chopped fresh parsley"},{"amount":"pinch","item":"chili flakes (optional)"},{"amount":"to taste","item":"salt (the beans are already salty)"}],"ingredientsHe":[{"amount":"3 כוסות / 500 גרם","item":"תורמוס מוכן מצנצנת, מסונן ושטוף","israelNote":"תורמוס (מוכן בצנצנת או יבש) — מוכן מהצנצנת חוסך שבוע של הוצאת מרירות"},{"amount":"3 כפות","item":"מיץ לימון טרי"},{"amount":"2 כפות","item":"שמן זית"},{"amount":"1 כפית","item":"כמון טחון"},{"amount":"1/2 כפית","item":"פפריקה מתוקה"},{"amount":"1 שן","item":"שום כתוש"},{"amount":"3 כפות","item":"פטרוזיליה טרייה קצוצה"},{"amount":"קורט","item":"פתיתי צ\u0027ילי (לא חובה)"},{"amount":"לפי הטעם","item":"מלח (התורמוס כבר מלוח)"}],"instructions":["Drain the lupini beans and rinse them well under cold water to remove excess brine.","Whisk the lemon juice, olive oil, cumin, paprika, garlic, and chili flakes in a bowl.","Toss the beans with the marinade until coated.","Cover and marinate at least 30 minutes in the fridge — overnight is even better.","Fold in the parsley, taste before adding any salt, and serve cold as a snack or meze.","Keeps 4 days refrigerated; the flavor improves each day."],"instructionsHe":["מסננים את התורמוס ושוטפים היטב במים קרים להסרת עודפי המי-מלח.","טורפים בקערה את מיץ הלימון, שמן הזית, הכמון, הפפריקה, השום ופתיתי הצ\u0027ילי.","מערבבים את התורמוס עם התיבול עד לציפוי אחיד.","מכסים ומשרים במקרר לפחות 30 דקות — לילה שלם אפילו עדיף.","מקפלים פנימה את הפטרוזיליה, טועמים לפני שמוסיפים מלח ומגישים קר כחטיף או מזטים.","נשמר 4 ימים במקרר; הטעם משתבח מיום ליום."],"nutrition":{"calories":140,"fatG":7,"satFatG":1,"proteinG":13,"carbsG":9,"fiberG":2.5,"netCarbsG":6.5,"sugarG":0.5,"sodiumMg":450},"tips":"Each serving is 1/2 cup lupini — the lowest-carb, highest-protein legume in this book. Eat street-style: nick the skin with your teeth and pop out the bean. If starting from dried bitter lupini, soak overnight, boil 1 hour, then soak in salted water 5-7 days with daily water changes.","tipsHe":"כל מנה היא 1/2 כוס תורמוס — הקטנייה עם הכי מעט פחמימות והכי הרבה חלבון בספר הזה. אוכלים כמו ברחוב: פותחים את הקליפה בשיניים ומקפיצים את הגרגיר החוצה. אם מתחילים מתורמוס יבש ומר, משרים לילה, מבשלים שעה, ואז משרים במי מלח 5-7 ימים עם החלפת מים יומית.","sources":[{"creator":"Little Sunny Kitchen (Diana)","url":"https://littlesunnykitchen.com/lupini-beans/"},{"creator":"Palestine In A Dish","url":"https://palestineinadish.com/recipes/how-to-make-lupini-beans-turmus/"},{"creator":"Jamie Geller","url":"https://jamiegeller.com/recipes/marinated-lupini-bean-snack/"},{"creator":"Plant Based Folk","url":"https://plantbasedfolk.com/lupini-beans/"}],"comparedVersions":"Compared four versions: Little Sunny Kitchen and Palestine In A Dish cook dried beans from scratch and season with lemon, cumin, and salt; Jamie Geller marinates prepared beans with lemon, olive oil, cumin, and paprika; Plant Based Folk covers the Lebanese termos street style. Chose Jamie Geller\u0027s shortcut of jarred beans with the classic Middle Eastern lemon-cumin seasoning, adding garlic and a marinating rest.","comparedVersionsHe":"השווינו ארבע גרסאות: ליטל סאני קיטשן ופלסטיין אין א דיש מבשלות תורמוס יבש מאפס ומתבלות בלימון, כמון ומלח; ג\u0027יימי גלר משרה תורמוס מוכן בלימון, שמן זית, כמון ופפריקה; פלנט בייסד פולק מציגה את סגנון הרחוב הלבנוני. בחרנו בקיצור הדרך של ג\u0027יימי גלר עם תורמוס מצנצנת ובתיבול המזרח-תיכוני הקלאסי של לימון-כמון, בתוספת שום ומנוחת השריה."},{"id":"edamame-sesame-salad","name":"Edamame Salad with Sesame-Lemon Dressing","nameHe":"סלט אדממה ברוטב שומשום-לימון","category":"legumes-grains","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":5,"difficulty":"easy","ingredients":[{"amount":"3 cups / 450 g","item":"frozen shelled edamame","israelNote":"אדממה קפואה — buy shelled (מקולפת), not in pods"},{"amount":"1 small / 120 g","item":"cucumber, diced"},{"amount":"2","item":"green onions, thinly sliced"},{"amount":"1 tbsp","item":"toasted sesame oil"},{"amount":"1 tbsp","item":"soy sauce","israelNote":"check for kosher certification"},{"amount":"2 tbsp","item":"fresh lemon juice"},{"amount":"1 tsp","item":"grated fresh ginger"},{"amount":"1 clove","item":"garlic, grated"},{"amount":"1 tbsp","item":"toasted sesame seeds"},{"amount":"pinch","item":"chili flakes (optional)"}],"ingredientsHe":[{"amount":"3 כוסות / 450 גרם","item":"אדממה קפואה מקולפת","israelNote":"אדממה קפואה — קונים מקולפת, לא בתרמילים"},{"amount":"1 קטן / 120 גרם","item":"מלפפון חתוך לקוביות"},{"amount":"2","item":"בצל ירוק פרוס דק"},{"amount":"1 כף","item":"שמן שומשום קלוי"},{"amount":"1 כף","item":"רוטב סויה","israelNote":"בודקים הכשר"},{"amount":"2 כפות","item":"מיץ לימון טרי"},{"amount":"1 כפית","item":"ג\u0027ינג\u0027ר טרי מגורר"},{"amount":"1 שן","item":"שום מגורר"},{"amount":"1 כף","item":"שומשום קלוי"},{"amount":"קורט","item":"פתיתי צ\u0027ילי (לא חובה)"}],"instructions":["Boil the edamame in salted water 4-5 minutes until just tender, then drain and rinse briefly under cold water.","Whisk the sesame oil, soy sauce, lemon juice, ginger, and garlic in a large bowl.","Add the edamame, cucumber, and green onions and toss to coat.","Sprinkle with sesame seeds and chili flakes.","Serve right away, or chill 10 minutes — the salad is even better slightly cold. Keeps 3 days refrigerated."],"instructionsHe":["מבשלים את האדממה במים רותחים ומומלחים 4-5 דקות עד שהיא רכה אך מוצקה, מסננים ושוטפים קצרות במים קרים.","טורפים בקערה גדולה את שמן השומשום, הסויה, מיץ הלימון, הג\u0027ינג\u0027ר והשום.","מוסיפים את האדממה, המלפפון והבצל הירוק ומערבבים לציפוי אחיד.","מפזרים שומשום ופתיתי צ\u0027ילי.","מגישים מיד, או מצננים 10 דקות — הסלט אפילו טוב יותר קר קלות. נשמר 3 ימים במקרר."],"nutrition":{"calories":190,"fatG":10,"satFatG":1.5,"proteinG":14,"carbsG":14,"fiberG":6.5,"netCarbsG":7.5,"sugarG":3,"sodiumMg":420},"tips":"Each serving is 3/4 cup shelled edamame — one of the few legumes that is naturally keto thanks to high fiber and protein. This makes a real protein-rich side for a pareve or meat meal.","tipsHe":"כל מנה היא 3/4 כוס אדממה מקולפת — אחת הקטניות היחידות שהיא קטוגנית באופן טבעי בזכות סיבים וחלבון גבוהים. זו תוספת עשירת חלבון אמיתית לארוחה פרווה או בשרית.","sources":[{"creator":"Rainbow Plant Life (Nisha Vora)","url":"https://rainbowplantlife.com/edamame-salad/"},{"creator":"Cooking With Ayeh","url":"https://cookingwithayeh.com/edamame-salad/"},{"creator":"Dishing Out Health","url":"https://dishingouthealth.com/edamame-salad/"}],"comparedVersions":"Compared three versions: Rainbow Plant Life builds a rich tahini-agave-lime dressing with toasted peanuts and coconut, Cooking With Ayeh keeps it minimal with a simple sesame dressing, and Dishing Out Health pairs edamame with cucumber and sesame-ginger. Chose the minimal route: cucumber for crunch, and a sweetener-free sesame-soy-lemon dressing with fresh ginger and garlic from the richer versions.","comparedVersionsHe":"השווינו שלוש גרסאות: ריינבו פלנט לייף בונה רוטב עשיר של טחינה-אגבה-ליים עם בוטנים וקוקוס קלויים, קוקינג ווית\u0027 איה שומרת על מינימליזם עם רוטב שומשום פשוט, ודישינג אאוט הלת\u0027 מצרפת מלפפון ורוטב שומשום-ג\u0027ינג\u0027ר. בחרנו בדרך המינימלית: מלפפון לפריכות ורוטב שומשום-סויה-לימון ללא ממתיק, עם ג\u0027ינג\u0027ר ושום טריים מהגרסאות העשירות."},{"id":"green-bean-fries","name":"Roasted Green Bean \"Fries\" with Garlic","nameHe":"\"צ\u0027יפס\" שעועית ירוקה בתנור עם שום","category":"legumes-grains","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":18,"difficulty":"easy","ingredients":[{"amount":"700 g","item":"green beans, trimmed","israelNote":"שעועית ירוקה — fresh gives the crispest result; frozen works if patted very dry"},{"amount":"2 tbsp","item":"olive oil"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/2 tsp","item":"sweet paprika"},{"amount":"1/2 tsp","item":"salt"},{"amount":"to taste","item":"black pepper"},{"amount":"2 tbsp","item":"almond flour (optional, for a crisp coating)","israelNote":"קמח שקדים"},{"amount":"3 cloves","item":"garlic, minced"},{"amount":"1 tsp","item":"lemon zest"}],"ingredientsHe":[{"amount":"700 גרם","item":"שעועית ירוקה נקייה מקצוות","israelNote":"שעועית ירוקה — טרייה נותנת את התוצאה הכי פריכה; קפואה עובדת אם מייבשים היטב"},{"amount":"2 כפות","item":"שמן זית"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/2 כפית","item":"פפריקה מתוקה"},{"amount":"1/2 כפית","item":"מלח"},{"amount":"לפי הטעם","item":"פלפל שחור"},{"amount":"2 כפות","item":"קמח שקדים (לא חובה, לציפוי פריך)","israelNote":"קמח שקדים"},{"amount":"3 שיני","item":"שום קצוץ דק"},{"amount":"1 כפית","item":"גרידת לימון"}],"instructions":["Heat the oven to 220°C and line a large baking tray with baking paper.","Pat the green beans completely dry — moisture is the enemy of crispness.","Toss the beans with the olive oil, garlic powder, paprika, salt, pepper, and almond flour if using.","Spread in a single layer without crowding (use two trays if needed).","Roast 15-18 minutes, shaking the tray halfway, until blistered and browned at the tips.","Toss the hot beans with the minced fresh garlic and lemon zest — the residual heat mellows the garlic.","Serve immediately, like fries, with tahini for dipping."],"instructionsHe":["מחממים תנור ל-220 מעלות ומרפדים תבנית גדולה בנייר אפייה.","מייבשים את השעועית לגמרי — לחות היא האויב של הפריכות.","מערבבים את השעועית עם שמן הזית, אבקת השום, הפפריקה, המלח, הפלפל וקמח השקדים למי שרוצה.","מפזרים בשכבה אחת בלי צפיפות (שתי תבניות אם צריך).","צולים 15-18 דקות, מנערים את התבנית באמצע, עד שהשעועית משלפוחיתת והקצוות משחימים.","מערבבים את השעועית החמה עם השום הקצוץ וגרידת הלימון — החום השיורי מעדן את השום.","מגישים מיד, כמו צ\u0027יפס, עם טחינה לטבילה."],"nutrition":{"calories":120,"fatG":7,"satFatG":1,"proteinG":3.5,"carbsG":13,"fiberG":4.5,"netCarbsG":8.5,"sugarG":5.5,"sodiumMg":320},"tips":"175 g green beans per serving — a generous pile for very few net carbs. High heat and a dry, uncrowded tray are what turn these from steamed beans into \u0027fries\u0027.","tipsHe":"175 גרם שעועית ירוקה למנה — ערימה נדיבה עם מעט מאוד פחמימות נטו. חום גבוה ותבנית יבשה ולא צפופה הם שהופכים אותן משעועית מאודה ל\u0027צ\u0027יפס\u0027.","lowCarbVariant":"Dairy option (makes the dish dairy): sprinkle 3 tbsp grated parmesan over the beans for the last 5 minutes of roasting.","lowCarbVariantHe":"אפשרות חלבית (הופכת את המנה לחלבית): מפזרים 3 כפות פרמזן מגורר על השעועית ב-5 הדקות האחרונות של הצלייה.","sources":[{"creator":"Sugar-Free Mom (Brenda Bennett)","url":"https://www.sugarfreemom.com/recipes/oven-fried-garlic-parmesan-green-beans/"},{"creator":"The Girl on Bloor","url":"https://thegirlonbloor.com/green-bean-fries/"},{"creator":"Laura Fuentes","url":"https://www.laurafuentes.com/parmesan-green-bean-fries/"}],"comparedVersions":"Compared three versions: Sugar-Free Mom uses a low-carb parmesan coating, The Girl on Bloor breads with panko and egg, and Laura Fuentes roasts with a simple parmesan-garlic toss. Dropped the breading entirely to stay keto and pareve, kept the hot 220°C roast and single-layer rule, and moved the cheese to an optional dairy note with fresh garlic and lemon zest as the finish instead.","comparedVersionsHe":"השווינו שלוש גרסאות: שוגר-פרי מאם משתמשת בציפוי פרמזן דל-פחמימות, דה גירל און בלור מצפה בפנקו וביצה, ולורה פואנטס צולה עם ערבוב פשוט של פרמזן ושום. ויתרנו לגמרי על הציפוי כדי להישאר קטו ופרווה, שמרנו על צלייה חמה ב-220 מעלות ועל כלל השכבה האחת, והעברנו את הגבינה להערה חלבית אופציונלית עם שום טרי וגרידת לימון כסיום במקום."},{"id":"cauliflower-chickpea-hummus","name":"Cauliflower-Chickpea Hummus (Half and Half)","nameHe":"חומוס כרובית-חומוס (חצי-חצי)","category":"legumes-grains","kosherType":"pareve","dietTags":"keto","servings":8,"prepTimeMin":10,"cookTimeMin":30,"difficulty":"easy","ingredients":[{"amount":"1/2 head / 400 g","item":"cauliflower, cut into small florets","israelNote":"כרובית טרייה או קפואה"},{"amount":"1 can (400 g) / 240 g drained","item":"chickpeas, drained and rinsed","israelNote":"גרגירי חומוס משומרים"},{"amount":"1/4 cup / 60 g","item":"raw tahini","israelNote":"טחינה גולמית (הר ברכה/אחוה)"},{"amount":"1/4 cup / 60 ml","item":"fresh lemon juice"},{"amount":"2 cloves","item":"garlic, unpeeled"},{"amount":"3/4 tsp","item":"ground cumin"},{"amount":"3 tbsp","item":"olive oil, divided"},{"amount":"1/2 tsp","item":"salt"},{"amount":"2-4 tbsp","item":"ice water"}],"ingredientsHe":[{"amount":"1/2 ראש / 400 גרם","item":"כרובית מחולקת לפרחים קטנים","israelNote":"כרובית טרייה או קפואה"},{"amount":"1 קופסה (400 גרם) / 240 גרם מסונן","item":"גרגירי חומוס מסוננים ושטופים","israelNote":"גרגירי חומוס משומרים"},{"amount":"1/4 כוס / 60 גרם","item":"טחינה גולמית","israelNote":"טחינה גולמית (הר ברכה/אחוה)"},{"amount":"1/4 כוס / 60 מ\"ל","item":"מיץ לימון טרי"},{"amount":"2 שיני","item":"שום לא קלוף"},{"amount":"3/4 כפית","item":"כמון טחון"},{"amount":"3 כפות","item":"שמן זית, בחלוקה"},{"amount":"1/2 כפית","item":"מלח"},{"amount":"2-4 כפות","item":"מי קרח"}],"instructions":["Heat the oven to 220°C. Toss the cauliflower florets and unpeeled garlic cloves with 1 tablespoon olive oil and a pinch of salt.","Roast 25 minutes until deeply golden — the browning replaces the flavor lost by cutting the chickpeas in half.","Squeeze the garlic out of its skins into a food processor and add the hot cauliflower, chickpeas, tahini, lemon juice, cumin, and salt.","Blend 2-3 minutes, streaming in ice water a tablespoon at a time, until completely smooth and fluffy.","With the machine running, stream in the remaining 2 tablespoons olive oil.","Taste and adjust lemon and salt. Serve with olive oil and za\u0027atar or paprika on top.","Keeps 5 days refrigerated."],"instructionsHe":["מחממים תנור ל-220 מעלות. מערבבים את פרחי הכרובית ושיני השום הלא קלופות עם כף שמן זית וקורט מלח.","צולים 25 דקות עד להזהבה עמוקה — ההשחמה מפצה על הטעם שאבד מחיתוך כמות החומוס בחצי.","סוחטים את השום מהקליפות למעבד מזון ומוסיפים את הכרובית החמה, גרגירי החומוס, הטחינה, מיץ הלימון, הכמון והמלח.","טוחנים 2-3 דקות תוך הזלפת מי קרח כף אחר כף, עד למרקם חלק ואוורירי לגמרי.","כשהמכונה עובדת מזליפים פנימה את 2 כפות שמן הזית הנותרות.","טועמים ומתקנים לימון ומלח. מגישים עם שמן זית וזעתר או פפריקה מעל.","נשמר 5 ימים במקרר."],"nutrition":{"calories":150,"fatG":10,"satFatG":1.4,"proteinG":5,"carbsG":13,"fiberG":4,"netCarbsG":9,"sugarG":2,"sodiumMg":300},"tips":"Each serving (about 1/3 cup) contains only 30 g chickpeas — swapping half the chickpeas for roasted cauliflower cuts net carbs roughly in half versus regular hummus while keeping the real hummus taste. Blending the cauliflower while hot gives the smoothest texture.","tipsHe":"כל מנה (כ-1/3 כוס) מכילה רק 30 גרם גרגירי חומוס — החלפת מחצית מהגרגירים בכרובית קלויה חותכת את הפחמימות נטו בערך בחצי לעומת חומוס רגיל, תוך שמירה על טעם חומוס אמיתי. טחינת הכרובית כשהיא חמה נותנת את המרקם הכי חלק.","ketoVariant":"For an even lower count, use all cauliflower and no chickpeas — about 4 g net carbs per serving.","ketoVariantHe":"לספירה נמוכה עוד יותר, משתמשים רק בכרובית בלי גרגירי חומוס — כ-4 גרם פחמימות נטו למנה.","sources":[{"creator":"Easy Cheesy Vegetarian (Becca Heyes)","url":"https://www.easycheesyvegetarian.com/low-carb-cauliflower-hummus/"},{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/roasted-cauliflower-hummus-recipe/"},{"creator":"Kidney Nutrition Institute","url":"https://kidneynutritioninstitute.org/recipes/roasted-cauliflower-chickpea-hummus/"}],"comparedVersions":"Compared three versions: Easy Cheesy Vegetarian and Wholesome Yum go 100% cauliflower (lowest carb but noticeably not hummus), while the Kidney Nutrition Institute combines roasted cauliflower with chickpeas. Chose the half-and-half route for genuine hummus flavor at under half the carbs, and added the deep-roast and roasted-garlic techniques from Wholesome Yum.","comparedVersionsHe":"השווינו שלוש גרסאות: איזי צ\u0027יזי וג\u0027טריאן והולסאם יאם הולכות על 100% כרובית (הכי דל פחמימות אבל מורגש שזה לא חומוס), ומכון התזונה לכליות משלב כרובית קלויה עם גרגירי חומוס. בחרנו בדרך החצי-חצי לטעם חומוס אמיתי בפחות מחצי מהפחמימות, והוספנו את הצלייה העמוקה ואת השום הקלוי מהולסאם יאם."},{"id":"green-bean-tomato-braise-loubia","name":"Green Bean and Tomato Braise (Loubia / Fasolakia Style)","nameHe":"לוביא - תבשיל שעועית ירוקה ברוטב עגבניות","category":"legumes-grains","kosherType":"pareve","dietTags":["keto"],"servings":4,"prepTimeMin":15,"cookTimeMin":40,"difficulty":"easy","ingredients":[{"amount":"4 tbsp","item":"olive oil"},{"amount":"1 medium","item":"onion, chopped"},{"amount":"4 cloves","item":"garlic, sliced"},{"amount":"500 g","item":"green beans, trimmed (fresh or frozen)","israelNote":"שעועית ירוקה - גם קפואה מצוינת"},{"amount":"3 ripe (about 250 g)","item":"tomatoes, grated"},{"amount":"1 tbsp","item":"tomato paste"},{"amount":"1 tsp","item":"sweet paprika"},{"amount":"1/2 tsp","item":"ground cumin"},{"amount":"to taste","item":"salt, black pepper, chopped parsley, lemon wedge"}],"ingredientsHe":["4 כפות שמן זית","בצל בינוני קצוץ","4 שיני שום פרוסות","500 גרם שעועית ירוקה נקייה (טרייה או קפואה)","3 עגבניות בשלות (כ־250 גרם) מגוררות","כף רסק עגבניות","כפית פפריקה מתוקה","חצי כפית כמון טחון","מלח, פלפל שחור, פטרוזיליה קצוצה ופלח לימון - לפי הטעם"],"instructions":["Heat the olive oil in a wide pot over medium heat. Cook the onion 8-10 minutes until soft and golden, then add the garlic for 30 seconds.","Stir in the tomato paste, paprika and cumin and fry 1 minute to deepen the flavor.","Add the green beans, grated tomatoes, salt, pepper and about 1/2 cup water - just enough to almost cover.","Bring to a boil, then reduce the heat, cover and braise gently 30-35 minutes until the beans are silky and completely tender, not squeaky.","Uncover for the last 5 minutes to reduce the sauce until it coats the beans.","Serve warm or at room temperature with parsley and a squeeze of lemon."],"instructionsHe":["חממו את שמן הזית בסיר רחב על אש בינונית. בשלו את הבצל 8-10 דקות עד שהוא רך וזהוב, ואז הוסיפו את השום ל־30 שניות.","הוסיפו את רסק העגבניות, הפפריקה והכמון וטגנו דקה להעמקת הטעם.","הוסיפו את השעועית, העגבניות המגוררות, מלח, פלפל וכחצי כוס מים - רק כדי כמעט לכסות.","הביאו לרתיחה, הנמיכו את האש, כסו ובשלו בעדינות 30-35 דקות עד שהשעועית משיית ורכה לגמרי, לא חורקת בשיניים.","הסירו את המכסה ב־5 הדקות האחרונות לצמצום הרוטב עד שהוא עוטף את השעועית.","הגישו חם או בטמפרטורת החדר עם פטרוזיליה וסחיטת לימון."],"nutrition":{"calories":190,"fatG":14,"satFatG":2,"proteinG":3,"carbsG":15,"fiberG":6,"netCarbsG":9,"sugarG":7,"sodiumMg":480},"tips":"This is the naturally lowest-carb dish in the category - green beans are a pod, not a mature legume seed. The generous olive oil is authentic (Greek lathera style) and is what makes the beans velvety; do not skimp.","tipsHe":"זהו התבשיל דל הפחמימות באופן טבעי בקטגוריה - שעועית ירוקה היא תרמיל, לא זרע קטנייה בשל. שמן הזית הנדיב הוא אותנטי (סגנון לאדרה יווני) והוא שהופך את השעועית לקטיפתית; אל תקמצו.","sources":[{"creator":"The Mediterranean Dish","url":"https://www.themediterraneandish.com/greek-green-beans-fasolakia/"},{"creator":"Olive Tomato","url":"https://www.olivetomato.com/greek-style-green-beans-fasolakia-lathera/"},{"creator":"Dimitras Dishes","url":"https://www.dimitrasdishes.com/fasolakia-braised-green-beans/"}],"comparedVersions":"Compared The Mediterranean Dish, Olive Tomato and Dimitras Dishes: all braise the beans in tomato and plenty of olive oil until fully tender; this version drops their potatoes, uses grated fresh tomatoes, and adds the paprika-cumin seasoning of Middle Eastern loubia.","comparedVersionsHe":"הושוו The Mediterranean Dish,‏ Olive Tomato ו־Dimitras Dishes: כולם מבשלים את השעועית בעגבניות והרבה שמן זית עד רכות מלאה; הגרסה הזו מוותרת על תפוחי האדמה שלהם, משתמשת בעגבניות טריות מגוררות ומוסיפה את תיבול הפפריקה-כמון של לוביא מזרח־תיכונית."},{"id":"edamame-tofu-sesame-bowl","name":"Edamame and Tofu Power Bowl with Sesame Dressing","nameHe":"קערת אדממה וטופו עם רוטב שומשום","category":"legumes-grains","kosherType":"pareve","dietTags":["keto"],"servings":2,"prepTimeMin":15,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"300 g","item":"firm tofu, pressed and cubed","israelNote":"טופו קשה"},{"amount":"1 cup / 150 g","item":"frozen shelled edamame (75 g per serving)","israelNote":"אדממה קפואה מקולפת"},{"amount":"1 tbsp","item":"oil, for frying the tofu"},{"amount":"2 cups","item":"shredded cabbage or crisp lettuce"},{"amount":"1","item":"cucumber, sliced"},{"amount":"2","item":"scallions, sliced, plus 1 tsp toasted sesame seeds"},{"amount":"2 tbsp","item":"raw tahini","israelNote":"טחינה גולמית"},{"amount":"2 tbsp","item":"soy sauce"},{"amount":"1 tbsp","item":"rice vinegar or lemon juice"},{"amount":"1 tsp each","item":"toasted sesame oil and grated fresh ginger"}],"ingredientsHe":["300 גרם טופו קשה, סחוט וחתוך לקוביות","כוס / 150 גרם אדממה קפואה מקולפת (75 גרם למנה)","כף שמן לטיגון הטופו","2 כוסות כרוב מגורר או חסה פריכה","מלפפון פרוס","2 בצלים ירוקים פרוסים + כפית שומשום קלוי","2 כפות טחינה גולמית","2 כפות רוטב סויה","כף חומץ אורז או מיץ לימון","כפית שמן שומשום כהה וכפית ג\u0027ינג\u0027ר טרי מגורר"],"instructions":["Boil the edamame in salted water 4-5 minutes, drain and set aside.","Pat the tofu cubes very dry. Heat the oil in a nonstick pan over medium-high heat and fry the tofu 8-10 minutes, turning, until golden on several sides.","Whisk the tahini, soy sauce, vinegar, sesame oil and ginger with 2-3 tbsp cold water until smooth and pourable.","Arrange the cabbage or lettuce and cucumber in two bowls.","Top with the warm tofu and edamame, pour the sesame dressing over, and finish with scallions and sesame seeds."],"instructionsHe":["בשלו את האדממה במים רותחים עם מלח 4-5 דקות, סננו והניחו בצד.","ייבשו היטב את קוביות הטופו. חממו את השמן במחבת שאינה נדבקת על אש בינונית-גבוהה וטגנו את הטופו 8-10 דקות תוך היפוך, עד שהוא זהוב מכמה צדדים.","ערבבו בהקצפה את הטחינה, הסויה, החומץ, שמן השומשום והג\u0027ינג\u0027ר עם 2-3 כפות מים קרים עד לרוטב חלק ונוזלי.","סדרו את הכרוב או החסה והמלפפון בשתי קערות.","הניחו מעל את הטופו החם והאדממה, מזגו את רוטב השומשום, וסיימו בבצל ירוק ושומשום."],"nutrition":{"calories":390,"fatG":25,"satFatG":3.5,"proteinG":28,"carbsG":15,"fiberG":6,"netCarbsG":9,"sugarG":4,"sodiumMg":950},"tips":"Edamame is the lowest-net-carb legume there is (about 3.7 g net per 100 g), so this bowl is genuinely keto and still delivers 28 g protein. Press the tofu well - dry tofu browns, wet tofu steams.","tipsHe":"אדממה היא הקטנייה עם הפחמימות נטו הנמוכות ביותר (כ־3.7 גרם נטו ל־100 גרם), כך שהקערה הזו קטוגנית באמת ועדיין מספקת 28 גרם חלבון. סחטו את הטופו היטב - טופו יבש משחים, טופו רטוב מתאדה.","sources":[{"creator":"Slender Kitchen","url":"https://www.slenderkitchen.com/recipe/pan-fried-tofu-with-edamame"},{"creator":"Moon and Spoon and Yum","url":"https://moonandspoonandyum.com/tofu-edamame-salad/"},{"creator":"Diet Doctor","url":"https://www.dietdoctor.com/recipes/low-carb-garlic-and-sesame-tofu-bowl"}],"comparedVersions":"Compared Slender Kitchen, Moon and Spoon and Yum and Diet Doctor: took the pan-fried sesame tofu technique, the ginger-sesame dressing, and Diet Doctor\u0027s no-rice low-carb base, using a measured 75 g edamame portion instead of grains.","comparedVersionsHe":"הושוו Slender Kitchen,‏ Moon and Spoon and Yum ו־Diet Doctor: נלקחו טכניקת טיגון הטופו בשומשום, רוטב הג\u0027ינג\u0027ר-שומשום והבסיס דל הפחמימות ללא אורז של Diet Doctor, עם מנת אדממה מדודה של 75 גרם במקום דגנים."},{"id":"quinoa-cauliflower-couscous","name":"Quinoa \"Couscous\" with Cauliflower, Israeli Style","nameHe":"\"קוסקוס\" קינואה עם כרובית בסגנון ישראלי","category":"legumes-grains","kosherType":"pareve","dietTags":"lowcarb","servings":6,"prepTimeMin":15,"cookTimeMin":20,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 90 g","item":"quinoa, rinsed well","israelNote":"קינואה"},{"amount":"3 cups / 300 g","item":"cauliflower rice, fresh or frozen","israelNote":"אורז כרובית קפוא, או כרובית טרייה מגוררת בפומפייה"},{"amount":"1 small / 80 g","item":"onion, finely chopped"},{"amount":"2 tbsp","item":"olive oil"},{"amount":"1/2 tsp","item":"ground cumin"},{"amount":"1/4 tsp","item":"ground turmeric"},{"amount":"1/2 cup / 30 g","item":"chopped fresh parsley"},{"amount":"1/4 cup / 12 g","item":"chopped fresh mint"},{"amount":"3 tbsp","item":"fresh lemon juice"},{"amount":"to taste","item":"salt and black pepper"}],"ingredientsHe":[{"amount":"1/2 כוס / 90 גרם","item":"קינואה שטופה היטב","israelNote":"קינואה"},{"amount":"3 כוסות / 300 גרם","item":"אורז כרובית, טרי או קפוא","israelNote":"אורז כרובית קפוא, או כרובית טרייה מגוררת בפומפייה"},{"amount":"1 קטן / 80 גרם","item":"בצל קצוץ דק"},{"amount":"2 כפות","item":"שמן זית"},{"amount":"1/2 כפית","item":"כמון טחון"},{"amount":"1/4 כפית","item":"כורכום טחון"},{"amount":"1/2 כוס / 30 גרם","item":"פטרוזיליה טרייה קצוצה"},{"amount":"1/4 כוס / 12 גרם","item":"נענע טרייה קצוצה"},{"amount":"3 כפות","item":"מיץ לימון טרי"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"}],"instructions":["Cook the quinoa in 1 cup / 240 ml salted water: bring to a boil, cover, and simmer on low 13-15 minutes. Turn off the heat, rest 5 minutes, and fluff.","Meanwhile, heat the olive oil in a wide pan and saute the onion 5-6 minutes until golden.","Add the cumin and turmeric and stir 30 seconds until fragrant.","Add the cauliflower rice, raise the heat, and cook 3-4 minutes, stirring, until just tender — not mushy.","Fold the quinoa into the pan and heat 1 minute, mixing until the two \u0027grains\u0027 are indistinguishable.","Off the heat, stir in the parsley, mint, lemon juice, salt, and pepper.","Serve warm alongside any main. Keeps 3 days refrigerated."],"instructionsHe":["מבשלים את הקינואה בכוס / 240 מ\"ל מים ממולחים: מביאים לרתיחה, מכסים ומבשלים על אש נמוכה 13-15 דקות. מכבים, מניחים 5 דקות ומפרידים במזלג.","בינתיים מחממים את שמן הזית במחבת רחבה ומטגנים את הבצל 5-6 דקות עד הזהבה.","מוסיפים את הכמון והכורכום ומערבבים 30 שניות עד לניחוח.","מוסיפים את אורז הכרובית, מגבירים את האש ומבשלים 3-4 דקות תוך ערבוב, עד שהוא רך אך לא דייסתי.","מקפלים את הקינואה למחבת ומחממים דקה, מערבבים עד ששני ה\u0027גרגירים\u0027 לא ניתנים להבחנה.","מחוץ לאש מערבבים פנימה את הפטרוזיליה, הנענע, מיץ הלימון, המלח והפלפל.","מגישים חם לצד כל מנה עיקרית. נשמר 3 ימים במקרר."],"nutrition":{"calories":115,"fatG":5.5,"satFatG":0.8,"proteinG":3.5,"carbsG":15,"fiberG":3,"netCarbsG":12,"sugarG":2.5,"sodiumMg":250},"tips":"Each serving contains only about 1/4 cup cooked quinoa — the cauliflower rice stretches it into a full couscous-style side at a third of the carbs. Matching the cauliflower grain size to the quinoa (pulse briefly in a processor) makes the illusion complete.","tipsHe":"כל מנה מכילה רק כ-1/4 כוס קינואה מבושלת — אורז הכרובית מותח אותה לתוספת מלאה בסגנון קוסקוס בשליש מהפחמימות. התאמת גודל גרגירי הכרובית לקינואה (כמה פולסים במעבד מזון) משלימה את האשליה.","ketoVariant":"Skip the quinoa and use 5 cups / 500 g cauliflower rice — about 5 g net carbs per serving.","ketoVariantHe":"מוותרים על הקינואה ומשתמשים ב-5 כוסות / 500 גרם אורז כרובית — כ-5 גרם פחמימות נטו למנה.","sources":[{"creator":"KACHEN Magazine","url":"https://kachen.online/en/quinoa-cauliflower-couscous/"},{"creator":"Feasting At Home (Sylvia Fountaine)","url":"https://www.feastingathome.com/moroccan-cauliflower-rice/"},{"creator":"The Mediterranean Dish (Suzy Karadsheh)","url":"https://www.themediterraneandish.com/herbed-couscous-recipe-with-roasted-cauliflower/"}],"comparedVersions":"Compared three versions: KACHEN combines red quinoa with chopped cauliflower, caramelized onion, and herbs; Feasting At Home makes an all-cauliflower Moroccan \u0027couscous\u0027 with warm spices; The Mediterranean Dish flavors real couscous with green onion, parsley, and lemon. Took the half-quinoa half-cauliflower structure from KACHEN, the cumin-turmeric spicing from Feasting At Home, and the herb-lemon finish from The Mediterranean Dish, and dropped the dried fruit and nuts to control carbs.","comparedVersionsHe":"השווינו שלוש גרסאות: קאכן משלב קינואה אדומה עם כרובית קצוצה, בצל מקורמל ועשבים; פיסטינג אט הום מכינה \u0027קוסקוס\u0027 מרוקאי כולו מכרובית עם תבלינים חמים; דה מדיטרניאן דיש מתבלת קוסקוס אמיתי בבצל ירוק, פטרוזיליה ולימון. לקחנו את מבנה החצי-קינואה חצי-כרובית מקאכן, את תיבול הכמון-כורכום מפיסטינג אט הום ואת סיום העשבים והלימון מדה מדיטרניאן דיש, וויתרנו על הפירות היבשים והאגוזים לשליטה בפחמימות."},{"id":"quinoa-tabbouleh","name":"Quinoa Tabbouleh (Parsley-Heavy)","nameHe":"טאבולה קינואה (עתיר פטרוזיליה)","category":"legumes-grains","kosherType":"pareve","dietTags":"lowcarb","servings":6,"prepTimeMin":25,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 90 g","item":"quinoa, rinsed well","israelNote":"קינואה — sold in every supermarket"},{"amount":"1 cup / 240 ml","item":"water"},{"amount":"3 bunches / 180 g","item":"fresh parsley, finely chopped"},{"amount":"1/2 cup / 25 g","item":"fresh mint leaves, chopped"},{"amount":"4","item":"green onions, thinly sliced"},{"amount":"2 medium / 200 g","item":"firm tomatoes, finely diced"},{"amount":"1 small / 120 g","item":"cucumber, finely diced"},{"amount":"1/4 cup / 60 ml","item":"fresh lemon juice"},{"amount":"1/4 cup / 60 ml","item":"olive oil"},{"amount":"to taste","item":"salt and black pepper"}],"ingredientsHe":[{"amount":"1/2 כוס / 90 גרם","item":"קינואה שטופה היטב","israelNote":"קינואה — נמכרת בכל סופר"},{"amount":"1 כוס / 240 מ\"ל","item":"מים"},{"amount":"3 צרורות / 180 גרם","item":"פטרוזיליה טרייה קצוצה דק"},{"amount":"1/2 כוס / 25 גרם","item":"עלי נענע טריים קצוצים"},{"amount":"4","item":"בצל ירוק פרוס דק"},{"amount":"2 בינוניות / 200 גרם","item":"עגבניות מוצקות חתוכות לקוביות קטנות"},{"amount":"1 קטן / 120 גרם","item":"מלפפון חתוך לקוביות קטנות"},{"amount":"1/4 כוס / 60 מ\"ל","item":"מיץ לימון טרי"},{"amount":"1/4 כוס / 60 מ\"ל","item":"שמן זית"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"}],"instructions":["Bring the water to a boil with a pinch of salt, add the rinsed quinoa, cover, and simmer on low 13-15 minutes until the water is absorbed. Turn off the heat, let stand covered 5 minutes, then fluff and spread on a plate to cool.","Toss the diced tomato and cucumber with a pinch of salt in a colander and let them drain 10 minutes — this keeps the salad from turning watery.","Dry the parsley and mint well, then chop them finely (a few pulses in a food processor works, but do not puree).","Whisk the lemon juice, olive oil, salt, and pepper in a small bowl.","In a large bowl combine the herbs, drained vegetables, green onions, and cooled quinoa.","Pour the dressing over and toss well. Let the salad rest 15 minutes so the flavors meld.","Taste, adjust lemon and salt, and serve. Keeps 2 days refrigerated."],"instructionsHe":["מרתיחים את המים עם קורט מלח, מוסיפים את הקינואה השטופה, מכסים ומבשלים על אש נמוכה 13-15 דקות עד שהמים נספגים. מכבים את האש, משאירים מכוסה 5 דקות, מפרידים במזלג ומשטחים על צלחת לצינון.","מערבבים את קוביות העגבנייה והמלפפון עם קורט מלח במסננת ומניחים לנקז 10 דקות — כך הסלט לא נהיה מימי.","מייבשים היטב את הפטרוזיליה והנענע וקוצצים דק (אפשר בכמה פולסים במעבד מזון, בלי לרסק).","טורפים בקערית את מיץ הלימון, שמן הזית, המלח והפלפל.","מאחדים בקערה גדולה את העשבים, הירקות המסוננים, הבצל הירוק והקינואה שהצטננה.","יוצקים את הרוטב ומערבבים היטב. משאירים לסלט לנוח 15 דקות כדי שהטעמים יתאחדו.","טועמים, מתקנים לימון ומלח ומגישים. נשמר יומיים במקרר."],"nutrition":{"calories":150,"fatG":10,"satFatG":1.4,"proteinG":3.5,"carbsG":15,"fiberG":3,"netCarbsG":12,"sugarG":2.5,"sodiumMg":340},"tips":"Portion control is the point: each serving contains only about 1/4 cup cooked quinoa — the salad is mostly herbs, exactly like traditional tabbouleh where bulgur is a minor player. Use flat-leaf parsley and chop by hand for the best texture.","tipsHe":"שליטה במנות היא כל הרעיון: כל מנה מכילה רק כ-1/4 כוס קינואה מבושלת — הסלט הוא בעיקר עשבי תיבול, בדיוק כמו טאבולה מסורתי שבו הבורגול הוא שחקן משנה. עדיף פטרוזיליה חלקה וקיצוץ ידני למרקם הטוב ביותר.","ketoVariant":"Replace the quinoa with 1.5 cups / 150 g cauliflower rice, sauteed dry 3 minutes and cooled — about 5 g net carbs per serving.","ketoVariantHe":"מחליפים את הקינואה ב-1.5 כוסות / 150 גרם אורז כרובית, מוקפץ יבש 3 דקות ומצונן — כ-5 גרם פחמימות נטו למנה.","sources":[{"creator":"Cookie and Kate (Kathryne Taylor)","url":"https://cookieandkate.com/quinoa-tabbouleh/"},{"creator":"Cooking With Ayeh","url":"https://cookingwithayeh.com/quinoa-tabbouleh/"},{"creator":"Foolproof Living","url":"https://foolproofliving.com/quinoa-tabbouleh/"}],"comparedVersions":"Compared three versions: Cookie and Kate uses a true parsley-forward ratio (3 bunches parsley to 1/2 cup quinoa) plus a salt-and-drain step for the tomato and cucumber; Cooking With Ayeh and Foolproof Living use more quinoa and less herbs. Kept the herb-heavy ratio for lowest carbs per serving, the draining trick, and a slightly reduced oil amount.","comparedVersionsHe":"השווינו שלוש גרסאות: קוקי אנד קייט משתמשת ביחס אמיתי של טאבולה (3 צרורות פטרוזיליה על 1/2 כוס קינואה) ובשלב המלחה וניקוז לעגבנייה ולמלפפון; קוקינג ווית\u0027 איה ופולפרוף ליבינג משתמשות ביותר קינואה ופחות עשבים. בחרנו ביחס עתיר העשבים לפחות פחמימות למנה, בטריק הניקוז ובמעט פחות שמן."},{"id":"majadra-lowcarb-cauliflower","name":"Low-Carb Majadra: Lentils, Cauliflower Rice and Crispy Onions","nameHe":"מג\u0027דרה דלת פחמימות: עדשים, אורז כרובית ובצל מטוגן פריך","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":15,"cookTimeMin":40,"difficulty":"medium","ingredients":[{"amount":"1/2 cup / 100 g","item":"dry brown or green lentils, rinsed (25 g per serving)","israelNote":"עדשים ירוקות או חומות"},{"amount":"3 tbsp","item":"olive oil, divided"},{"amount":"2 large","item":"onions, halved and thinly sliced"},{"amount":"1 medium head (about 500 g)","item":"cauliflower, grated into rice, or frozen cauliflower rice","israelNote":"אורז כרובית קפוא זמין בכל סופר"},{"amount":"1 1/2 tsp","item":"ground cumin"},{"amount":"1/2 tsp","item":"ground allspice"},{"amount":"to taste","item":"salt and black pepper"}],"ingredientsHe":["חצי כוס / 100 גרם עדשים ירוקות או חומות שטופות (25 גרם למנה)","3 כפות שמן זית, בחלוקה","2 בצלים גדולים חצויים ופרוסים דק","ראש כרובית בינוני (כ־500 גרם) מגורר לאורז, או אורז כרובית קפוא","כפית וחצי כמון טחון","חצי כפית פלפל אנגלי טחון","מלח ופלפל שחור לפי הטעם"],"instructions":["Cover the lentils with plenty of water, bring to a boil and simmer 18-20 minutes until tender but not mushy. Drain.","Meanwhile, heat 2 tbsp of the oil in a wide pan over medium-high heat. Fry the onion slices, stirring occasionally, 15-20 minutes until deeply browned and crisp at the edges. Remove half for topping.","Push the remaining onions to the side, add the last tbsp of oil and the cauliflower rice, and saute 5-6 minutes until just tender, not soggy.","Stir in the drained lentils, cumin, allspice, salt and pepper. Cook 2-3 minutes so the flavors meld.","Taste and adjust seasoning - majadra should be well salted and peppery.","Serve topped with the reserved crispy onions."],"instructionsHe":["כסו את העדשים בהרבה מים, הביאו לרתיחה ובשלו 18-20 דקות עד שהן רכות אך לא מתפרקות. סננו.","בינתיים חממו 2 כפות שמן במחבת רחבה על אש בינונית-גבוהה. טגנו את פרוסות הבצל תוך ערבוב מדי פעם 15-20 דקות עד שהן חומות עמוק ופריכות בקצוות. הוציאו חצי בצד לתוספת מעל.","הזיזו את הבצל שנשאר לצד המחבת, הוסיפו את כף השמן הנותרת ואת אורז הכרובית, וטגנו 5-6 דקות עד שהוא רך אך לא דייסתי.","הוסיפו את העדשים המסוננות, הכמון, הפלפל האנגלי, מלח ופלפל. בשלו 2-3 דקות לאיחוד הטעמים.","טעמו ותקנו תיבול - מג\u0027דרה צריכה להיות מתובלת היטב במלח ופלפל.","הגישו עם הבצל הפריך ששמרתם מעל."],"nutrition":{"calories":235,"fatG":11,"satFatG":1.5,"proteinG":8,"carbsG":23,"fiberG":9,"netCarbsG":14,"sugarG":5,"sodiumMg":490},"ketoVariant":"Halve the lentils to 1/4 cup / 50 g and use one whole large cauliflower - about 9 g net carbs per serving.","ketoVariantHe":"הפחיתו את העדשים לרבע כוס / 50 גרם והשתמשו בכרובית גדולה שלמה - כ־9 גרם פחמימות נטו למנה.","tips":"Traditional majadra uses a full cup each of rice and lentils; swapping the rice for cauliflower and capping lentils at 25 g dry per serving roughly halves the carbs while keeping the cumin-and-burnt-onion character.","tipsHe":"מג\u0027דרה מסורתית מכילה כוס שלמה של אורז וכוס עדשים; החלפת האורז בכרובית והגבלת העדשים ל־25 גרם יבשות למנה חוצות בערך את הפחמימות ושומרות על אופי הכמון והבצל המושחם.","sources":[{"creator":"Eating Bird Food","url":"https://www.eatingbirdfood.com/mujadara/"},{"creator":"The Mediterranean Dish","url":"https://www.themediterraneandish.com/mujadara-lentils-and-rice-with-crispy-onions/"},{"creator":"Minimalist Baker","url":"https://minimalistbaker.com/curried-cauliflower-rice-with-lentils-crispy-shallot-mujadara-inspired/"}],"comparedVersions":"Compared Eating Bird Food\u0027s cauliflower-rice mujadara, The Mediterranean Dish\u0027s classic and Minimalist Baker\u0027s mujadara-inspired skillet: kept the classic deep-browned onions from The Mediterranean Dish, the cauliflower swap from Eating Bird Food, and a smaller lentil portion than all three.","comparedVersionsHe":"הושוו מג\u0027דרת אורז הכרובית של Eating Bird Food, הקלאסיקה של The Mediterranean Dish והמחבת בהשראת מג\u0027דרה של Minimalist Baker: נשמר הבצל המושחם העמוק מהקלאסיקה, החלפת הכרובית מ־Eating Bird Food, ומנת עדשים קטנה משלושתן."},{"id":"red-lentil-soup-cumin-lemon","name":"Middle Eastern Red Lentil Soup with Cumin and Lemon","nameHe":"מרק עדשים אדומות מזרח־תיכוני עם כמון ולימון","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":10,"cookTimeMin":30,"difficulty":"easy","ingredients":[{"amount":"1 tbsp","item":"olive oil"},{"amount":"1 medium","item":"onion, finely chopped"},{"amount":"1 medium","item":"carrot, diced small"},{"amount":"3 cloves","item":"garlic, minced"},{"amount":"1 1/2 tsp","item":"ground cumin"},{"amount":"1/2 tsp","item":"turmeric"},{"amount":"1/2 cup / 100 g","item":"dry red lentils, rinsed (25 g per serving - the portion cap that keeps this low carb)","israelNote":"עדשים אדומות"},{"amount":"1 tbsp","item":"tomato paste"},{"amount":"5 cups / 1.2 L","item":"water or vegetable stock"},{"amount":"to taste","item":"salt, black pepper, juice of 1 lemon, chopped parsley"}],"ingredientsHe":["כף שמן זית","בצל בינוני קצוץ דק","גזר בינוני חתוך לקוביות קטנות","3 שיני שום כתושות","כפית וחצי כמון טחון","חצי כפית כורכום","חצי כוס / 100 גרם עדשים אדומות שטופות (25 גרם למנה - זו מגבלת הכמות ששומרת על המרק דל־פחמימות)","כף רסק עגבניות","5 כוסות / 1.2 ליטר מים או ציר ירקות","מלח, פלפל שחור, מיץ מלימון שלם ופטרוזיליה קצוצה - לפי הטעם"],"instructions":["Heat the olive oil in a soup pot over medium heat. Saute the onion and carrot for about 5 minutes, until softened.","Add the garlic, cumin and turmeric and stir for 1 minute until fragrant.","Stir in the lentils, tomato paste and water or stock. Bring to a boil.","Reduce the heat, cover partially and simmer 20-25 minutes, until the lentils have completely collapsed and thickened the soup.","Blend briefly with an immersion blender for a creamier texture, or leave rustic. Season with salt and pepper.","Off the heat, stir in the lemon juice. Serve topped with parsley and extra lemon wedges."],"instructionsHe":["חממו את שמן הזית בסיר מרק על אש בינונית. טגנו את הבצל והגזר כ־5 דקות עד שהם מתרככים.","הוסיפו את השום, הכמון והכורכום וערבבו דקה אחת עד שעולה ריח.","הוסיפו את העדשים, רסק העגבניות והמים או הציר. הביאו לרתיחה.","הנמיכו את האש, כסו חלקית ובשלו 20-25 דקות, עד שהעדשים מתפרקות לגמרי והמרק מסמיך.","טחנו קצרות עם בלנדר מוט למרקם קטיפתי, או השאירו כפרי. תבלו במלח ופלפל.","מחוץ לאש הוסיפו את מיץ הלימון. הגישו עם פטרוזיליה ופלחי לימון."],"nutrition":{"calories":175,"fatG":8,"satFatG":1.1,"proteinG":7,"carbsG":19,"fiberG":4,"netCarbsG":15,"sugarG":3,"sodiumMg":620},"ketoVariant":"Use only 1/4 cup / 50 g lentils and add 1 diced zucchini for body - about 9 g net carbs per serving.","ketoVariantHe":"השתמשו רק ברבע כוס / 50 גרם עדשים והוסיפו קישוא קצוץ לנפח - כ־9 גרם פחמימות נטו למנה.","tips":"Classic recipes use double the lentils; here the whole pot gets just 1/2 cup so each bowl carries only about 25 g dry lentils. The cumin-lemon finish keeps it tasting rich anyway.","tipsHe":"במתכונים קלאסיים יש כמות כפולה של עדשים; כאן כל הסיר מקבל רק חצי כוס, כך שכל קערה מכילה רק כ־25 גרם עדשים יבשות. הכמון והלימון שומרים על טעם עשיר בכל מקרה.","sources":[{"creator":"Healthy Fitness Meals","url":"https://healthyfitnessmeals.com/red-lentil-soup/"},{"creator":"Cooking LSL","url":"https://cookinglsl.com/middle-eastern-lentil-soup-recipe/"},{"creator":"Love and Lemons","url":"https://www.loveandlemons.com/red-lentil-soup/"}],"comparedVersions":"Compared Healthy Fitness Meals, Cooking LSL and Love and Lemons: all agree on the cumin-turmeric-lemon backbone; this version halves the usual lentil quantity and thickens by full collapse plus a quick blend instead of more legumes.","comparedVersionsHe":"הושוו הגרסאות של Healthy Fitness Meals, Cooking LSL ו־Love and Lemons: כולן מסכימות על בסיס הכמון-כורכום-לימון; הגרסה הזו מקטינה את כמות העדשים בחצי ומסמיכה על ידי בישול ממושך וטחינה קצרה במקום עוד קטניות."},{"id":"warm-lentil-salad","name":"Warm Lentil Salad with Roasted Vegetables and Lemon Dressing","nameHe":"סלט עדשים חם עם ירקות צלויים ורוטב לימון","category":"legumes-grains","kosherType":"pareve","dietTags":"lowcarb","servings":4,"prepTimeMin":15,"cookTimeMin":30,"difficulty":"easy","ingredients":[{"amount":"3/4 cup / 145 g","item":"dry green or brown lentils","israelNote":"עדשים ירוקות או שחורות — עדשים אדומות מתרככות מדי לסלט"},{"amount":"1 medium / 200 g","item":"zucchini, cut into cubes"},{"amount":"1 / 150 g","item":"red bell pepper, cut into cubes"},{"amount":"1/2 / 60 g","item":"red onion, cut into wedges"},{"amount":"3 tbsp","item":"olive oil, divided"},{"amount":"3 tbsp","item":"fresh lemon juice"},{"amount":"1 tsp","item":"Dijon mustard"},{"amount":"1 clove","item":"garlic, crushed"},{"amount":"1/2 tsp","item":"ground cumin"},{"amount":"1/4 cup","item":"chopped parsley, plus salt and pepper"}],"ingredientsHe":[{"amount":"3/4 כוס / 145 גרם","item":"עדשים ירוקות או חומות יבשות","israelNote":"עדשים ירוקות או שחורות — עדשים אדומות מתרככות מדי לסלט"},{"amount":"1 בינוני / 200 גרם","item":"קישוא חתוך לקוביות"},{"amount":"1 / 150 גרם","item":"פלפל אדום חתוך לקוביות"},{"amount":"1/2 / 60 גרם","item":"בצל סגול חתוך לפלחים"},{"amount":"3 כפות","item":"שמן זית, בחלוקה"},{"amount":"3 כפות","item":"מיץ לימון טרי"},{"amount":"1 כפית","item":"חרדל דיז\u0027ון"},{"amount":"1 שן","item":"שום כתוש"},{"amount":"1/2 כפית","item":"כמון טחון"},{"amount":"1/4 כוס","item":"פטרוזיליה קצוצה, ומלח ופלפל"}],"instructions":["Heat the oven to 220°C. Toss the zucchini, pepper, and onion with 1.5 tablespoons olive oil, salt, and pepper on a lined tray.","Roast the vegetables 20-25 minutes, turning once, until browned at the edges.","Meanwhile, rinse the lentils and simmer them in plenty of unsalted water 20-25 minutes, until tender but still holding their shape. Drain and season with salt.","Whisk the remaining 1.5 tablespoons olive oil with the lemon juice, mustard, garlic, cumin, salt, and pepper.","Toss the warm drained lentils with the dressing — warm lentils absorb it much better.","Fold in the roasted vegetables and parsley.","Serve warm or at room temperature. Keeps 4 days refrigerated."],"instructionsHe":["מחממים תנור ל-220 מעלות. מערבבים את הקישוא, הפלפל והבצל עם 1.5 כפות שמן זית, מלח ופלפל על תבנית מרופדת.","צולים את הירקות 20-25 דקות, הופכים פעם אחת, עד שהשוליים משחימים.","בינתיים שוטפים את העדשים ומבשלים בהרבה מים לא ממולחים 20-25 דקות, עד שהן רכות אך שומרות על צורתן. מסננים ומתבלים במלח.","טורפים את 1.5 כפות שמן הזית הנותרות עם מיץ הלימון, החרדל, השום, הכמון, מלח ופלפל.","מערבבים את העדשים החמות והמסוננות עם הרוטב — עדשים חמות סופגות אותו הרבה יותר טוב.","מקפלים פנימה את הירקות הצלויים והפטרוזיליה.","מגישים חם או בטמפרטורת החדר. נשמר 4 ימים במקרר."],"nutrition":{"calories":230,"fatG":11,"satFatG":1.5,"proteinG":9,"carbsG":24,"fiberG":8.5,"netCarbsG":15.5,"sugarG":5,"sodiumMg":320},"tips":"Each serving contains 1/2 cup cooked lentils — lentils are the highest-fiber legume here, so total carbs look high but net carbs stay moderate. Do not salt the cooking water; salt after draining so the lentils stay tender.","tipsHe":"כל מנה מכילה 1/2 כוס עדשים מבושלות — לעדשים הכי הרבה סיבים מבין הקטניות כאן, כך שהפחמימות הכוללות נראות גבוהות אבל הנטו נשאר מתון. לא ממליחים את מי הבישול; ממליחים אחרי הסינון כדי שהעדשים יישארו רכות.","ketoVariant":"Use half the lentils (make it 1/4 cup cooked per serving) and double the zucchini — about 9 g net carbs per serving.","ketoVariantHe":"משתמשים בחצי מכמות העדשים (1/4 כוס מבושלות למנה) ומכפילים את הקישוא — כ-9 גרם פחמימות נטו למנה.","sources":[{"creator":"From My Bowl (Caitlin Shoemaker)","url":"https://frommybowl.com/warm-lentil-salad-roasted-vegetables/"},{"creator":"Two Peas and Their Pod","url":"https://www.twopeasandtheirpod.com/roasted-vegetable-lentil-salad/"},{"creator":"Food with Feeling","url":"https://foodwithfeeling.com/lentil-salad-with-warm-vegetables/"}],"comparedVersions":"Compared three versions: From My Bowl dresses the lentils while warm, Two Peas and Their Pod uses a lemon-Dijon-maple dressing with feta, and Food with Feeling roasts root vegetables with maple syrup. Kept the warm-dressing trick and lemon-Dijon base, dropped the maple syrup and swapped high-carb root vegetables for zucchini and pepper to lower net carbs; feta became an optional note.","comparedVersionsHe":"השווינו שלוש גרסאות: פרום מיי בול מתבלת את העדשים כשהן חמות, טו פיז אנד דר פוד משתמשות ברוטב לימון-דיז\u0027ון-מייפל עם פטה, ופוד ווית\u0027 פילינג צולה ירקות שורש עם מייפל. שמרנו על טריק התיבול החם ועל בסיס הלימון-דיז\u0027ון, ויתרנו על המייפל והחלפנו ירקות שורש עתירי פחמימות בקישוא ופלפל להורדת הנטו; הפטה הפכה להערה אופציונלית.","lowCarbVariant":"Dairy option (makes the dish dairy): crumble 50 g feta or Bulgarian cheese over the finished salad.","lowCarbVariantHe":"אפשרות חלבית (הופכת את המנה לחלבית): מפוררים מעל הסלט המוכן 50 גרם פטה או גבינה בולגרית."},{"id":"quinoa-breakfast-porridge","name":"Warm Quinoa Breakfast Porridge with Cinnamon, Nuts and Berries","nameHe":"דייסת קינואה חמה עם קינמון, אגוזים ופירות יער","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":2,"prepTimeMin":5,"cookTimeMin":20,"difficulty":"easy","ingredients":[{"amount":"1/4 cup / 45 g","item":"dry quinoa, rinsed well (22 g per serving)","israelNote":"קינואה"},{"amount":"1 1/2 cups / 360 ml","item":"unsweetened almond milk, plus more for serving","israelNote":"משקה שקדים ללא סוכר"},{"amount":"1/2 tsp","item":"ground cinnamon"},{"amount":"1/2 tsp","item":"vanilla extract"},{"amount":"1 pinch","item":"salt"},{"amount":"2 tbsp","item":"chopped walnuts or almonds, toasted"},{"amount":"1/2 cup / 70 g","item":"fresh raspberries or sliced strawberries","israelNote":"פטל או תות שדה - גם קפואים"},{"amount":"optional","item":"stevia or erythritol to sweeten"}],"ingredientsHe":["רבע כוס / 45 גרם קינואה שטופה היטב (22 גרם למנה)","כוס וחצי / 360 מ\"ל משקה שקדים ללא סוכר, ועוד להגשה","חצי כפית קינמון טחון","חצי כפית תמצית וניל","קורט מלח","2 כפות אגוזי מלך או שקדים קצוצים וקלויים","חצי כוס / 70 גרם פטל טרי או תותים פרוסים - גם קפואים","אופציונלי: סטיביה או אריתריטול להמתקה"],"instructions":["Combine the quinoa, almond milk, cinnamon, vanilla and salt in a small saucepan and bring to a gentle boil.","Reduce the heat to low, cover and simmer 15-18 minutes, stirring once or twice, until the quinoa is tender and the porridge is creamy.","Meanwhile, toast the nuts in a dry pan 2-3 minutes until fragrant.","Let the porridge rest 3 minutes off the heat - it thickens as it sits. Sweeten to taste if you like.","Divide between bowls, splash with a little warm almond milk, and top with the berries and toasted nuts."],"instructionsHe":["שימו את הקינואה, משקה השקדים, הקינמון, הווניל והמלח בסיר קטן והביאו לרתיחה עדינה.","הנמיכו לאש נמוכה, כסו ובשלו 15-18 דקות, תוך ערבוב פעם או פעמיים, עד שהקינואה רכה והדייסה קרמית.","בינתיים קלו את האגוזים במחבת יבשה 2-3 דקות עד שעולה ריח.","השאירו את הדייסה 3 דקות מחוץ לאש - היא מסמיכה בעמידה. המתיקו לפי הטעם אם תרצו.","חלקו לקערות, מזגו מעט משקה שקדים חם מעל, ופזרו את פירות היער והאגוזים הקלויים."],"nutrition":{"calories":195,"fatG":8,"satFatG":0.8,"proteinG":6,"carbsG":21,"fiberG":5,"netCarbsG":16,"sugarG":3,"sodiumMg":200},"ketoVariant":"Swap half the quinoa for 2 tbsp chia seeds stirred in at the end - about 10 g net carbs and even creamier.","ketoVariantHe":"החליפו חצי מהקינואה ב־2 כפות זרעי צ\u0027יה שמערבבים בסוף - כ־10 גרם פחמימות נטו ואף קרמי יותר.","tips":"Rinsing the quinoa removes its bitter saponin coating. Berries are the lowest-carb fruit choice; a chopped date would double the sugar.","tipsHe":"שטיפת הקינואה מסירה את ציפוי הסאפונין המריר. פירות יער הם בחירת הפרי דלת הפחמימות ביותר; תמר קצוץ היה מכפיל את הסוכר.","sources":[{"creator":"Love and Lemons","url":"https://www.loveandlemons.com/cinnamon-quinoa-breakfast-bowl/"},{"creator":"101 Cookbooks","url":"https://www.101cookbooks.com/archives/warm-and-nutty-cinnamon-quinoa-recipe.html"},{"creator":"Detoxinista","url":"https://detoxinista.com/quinoa-breakfast-porridge/"}],"comparedVersions":"Compared Love and Lemons, 101 Cookbooks and Detoxinista: all simmer quinoa in milk with cinnamon and top with nuts and fruit; this version cuts the grain to 22 g dry per bowl, uses unsweetened almond milk, and skips the maple syrup in favor of optional zero-carb sweetener.","comparedVersionsHe":"הושוו Love and Lemons,‏ 101 Cookbooks ו־Detoxinista: כולם מבשלים קינואה בחלב עם קינמון ומעטרים באגוזים ופרי; הגרסה הזו מצמצמת את הדגן ל־22 גרם יבש לקערה, משתמשת במשקה שקדים לא ממותק ומוותרת על מייפל לטובת ממתיק ללא פחמימות."},{"id":"baked-lentil-cauliflower-falafel","name":"Baked Lentil-Cauliflower Falafel with Tahini Drizzle","nameHe":"פלאפל עדשים וכרובית אפוי עם זילוף טחינה","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":20,"cookTimeMin":35,"difficulty":"medium","ingredients":[{"amount":"1/2 cup / 100 g","item":"dry red lentils (25 g per serving; makes 4 falafel per person)","israelNote":"עדשים אדומות"},{"amount":"200 g","item":"cauliflower florets, grated or pulsed into rice"},{"amount":"1/2 small","item":"onion, roughly chopped"},{"amount":"3 cloves","item":"garlic"},{"amount":"1 cup packed","item":"parsley and cilantro leaves"},{"amount":"1","item":"egg (or 1 flax egg for vegan)"},{"amount":"2 tbsp","item":"coconut flour","israelNote":"קמח קוקוס - בחנויות טבע ורשתות"},{"amount":"1 tsp each","item":"ground cumin and coriander, plus salt and pepper"},{"amount":"3 tbsp","item":"raw tahini + juice of 1/2 lemon + cold water, for the drizzle","israelNote":"טחינה גולמית"}],"ingredientsHe":["חצי כוס / 100 גרם עדשים אדומות (25 גרם למנה; יוצא 4 כדורים לאדם)","200 גרם פרחי כרובית מגוררים או קצוצים במעבד לאורז","חצי בצל קטן קצוץ גס","3 שיני שום","כוס דחוסה של עלי פטרוזיליה וכוסברה","ביצה (או ביצת פשתן לטבעונים)","2 כפות קמח קוקוס","כפית כמון טחון וכפית כוסברה טחונה, מלח ופלפל","3 כפות טחינה גולמית + מיץ מחצי לימון + מים קרים, לזילוף"],"instructions":["Simmer the red lentils in water for just 8-10 minutes until tender but still holding shape. Drain very well and cool slightly.","Preheat the oven to 200C / 390F and line a baking sheet with parchment.","In a food processor, pulse the onion, garlic and herbs until finely chopped. Add the lentils, cauliflower, egg, coconut flour, spices, salt and pepper and pulse to a thick, cohesive mash - not a puree.","Form 16 small balls with damp hands, flatten slightly and arrange on the sheet. Brush or spray lightly with oil.","Bake 25-30 minutes, flipping halfway, until browned and crisp outside.","Whisk the tahini with lemon juice, a pinch of salt and enough cold water to make a pourable sauce. Drizzle over the falafel and serve with chopped vegetables."],"instructionsHe":["בשלו את העדשים האדומות במים 8-10 דקות בלבד עד שהן רכות אך שומרות על צורה. סננו היטב מאוד וצננו מעט.","חממו תנור ל־200 מעלות ורפדו תבנית בנייר אפייה.","במעבד מזון קצצו את הבצל, השום והעשבים עד שהם קצוצים דק. הוסיפו את העדשים, הכרובית, הביצה, קמח הקוקוס, התבלינים, המלח והפלפל ועבדו בפולסים לעיסה סמיכה ומגובשת - לא מחית.","צרו 16 כדורים קטנים בידיים לחות, שטחו מעט וסדרו על התבנית. מברישים או מרססים מעט שמן.","אפו 25-30 דקות, הפכו באמצע, עד שהפלאפל שחום ופריך מבחוץ.","ערבבו את הטחינה עם מיץ הלימון, קורט מלח ומספיק מים קרים לרוטב נוזלי. זלפו על הפלאפל והגישו עם ירקות קצוצים."],"nutrition":{"calories":230,"fatG":10,"satFatG":2,"proteinG":10,"carbsG":23,"fiberG":7,"netCarbsG":16,"sugarG":3,"sodiumMg":460},"lowCarbVariant":"Serve over salad leaves with extra tahini instead of in a pita - a pita alone adds about 30 g net carbs.","lowCarbVariantHe":"הגישו על עלי סלט עם עוד טחינה במקום בפיתה - פיתה לבדה מוסיפה כ־30 גרם פחמימות נטו.","tips":"Drain the lentils thoroughly - excess water is the main reason baked falafel fall apart. The coconut flour absorbs moisture and adds fiber without meaningful carbs.","tipsHe":"סננו את העדשים ביסודיות - עודף מים הוא הסיבה העיקרית לפלאפל אפוי שמתפרק. קמח הקוקוס סופח לחות ומוסיף סיבים כמעט בלי פחמימות.","sources":[{"creator":"Slender Kitchen","url":"https://www.slenderkitchen.com/recipe/baked-lentil-falafel"},{"creator":"Darn Good Veggies","url":"https://www.darngoodveggies.
