}],"comparedVersions":"Compared Healthy Life Trainer\u0027s egg-white loaf (almond + coconut + psyllium, 16 slices, dairy-free) with My PCOS Kitchen\u0027s coconut-oil psyllium buns. The loaf format won for sandwich duty and avoids added fat entirely - egg whites plus vinegar give lift and a chewy, wheat-like crumb; the buns recipe validated the psyllium-to-flour ratio and the boiling/warm water technique.","comparedVersionsHe":"השווינו את לחם החלבונים של Healthy Life Trainer (שקדים + קוקוס + פסיליום, 16 פרוסות, ללא חלב) עם לחמניות הפסיליום עם שמן קוקוס של My PCOS Kitchen. פורמט הכיכר ניצח לצורכי כריכים ונמנע לגמרי משומן נוסף – חלבוני ביצה עם חומץ נותנים תפיחה ומרקם לעיס דמוי חיטה; מתכון הלחמניות אימת את יחס הפסיליום לקמח ואת טכניקת המים הרותחים/חמימים."},{"id":"keto-pocket-pita","name":"Keto Pocket Pita","nameHe":"פיתה קטו עם כיס","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":60,"cookTimeMin":10,"difficulty":"medium","ingredients":[{"amount":"1½ cups / 150 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"3 tbsp / 24 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"2 tsp","item":"instant dry yeast"},{"amount":"1 tsp","item":"sugar (feeds the yeast and is mostly consumed during rising)"},{"amount":"2 tsp","item":"baking powder"},{"amount":"½ tsp","item":"fine salt"},{"amount":"¾ cup / 180 ml","item":"warm water (about 40°C)"},{"amount":"3","item":"egg whites"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1 tsp","item":"apple cider vinegar"}],"ingredientsHe":[{"amount":"1½ כוסות / 150 גרם","item":"קמח שקדים מולבן","israelNote":"קמח שקדים"},{"amount":"3 כפות / 24 גרם","item":"אבקת פסיליום","israelNote":"פסיליום (סופר-פארם/חנויות טבע)"},{"amount":"2 כפיות","item":"שמרים יבשים"},{"amount":"1 כפית","item":"סוכר (מזין את השמרים ונצרך ברובו בזמן ההתפחה)"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"½ כפית","item":"מלח דק"},{"amount":"¾ כוס / 180 מ\"ל","item":"מים פושרים (בערך 40 מעלות)"},{"amount":"3","item":"חלבוני ביצה"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1 כפית","item":"חומץ תפוחים"}],"instructions":["Stir the yeast and sugar into the warm water and let stand 10 minutes until foamy.","Whisk the almond flour, psyllium, baking powder, and salt in a large bowl.","Add the yeast mixture, egg whites, olive oil, and vinegar; mix about 1 minute to a sticky dough, then rest 10 minutes so the psyllium firms it up.","Divide into 6 balls and roll each between parchment sheets into a 15 cm round about 7 mm thick.","Cover and let rise in a warm spot 30–40 minutes, until slightly puffy.","Meanwhile heat the oven to 250°C with a sturdy baking sheet inside.","Slide the pitas (on their parchment) onto the hot sheet and bake 8–10 minutes, until puffed with golden spots.","Stack under a clean towel for 5 minutes to soften, then split with a serrated knife to open the pocket."],"instructionsHe":["מערבבים את השמרים והסוכר במים הפושרים ומניחים 10 דקות עד להיווצרות קצף.","טורפים בקערה גדולה את קמח השקדים, הפסיליום, אבקת האפייה והמלח.","מוסיפים את תערובת השמרים, החלבונים, שמן הזית והחומץ; מערבבים כדקה לבצק דביק ומניחים 10 דקות עד שהפסיליום מייצב אותו.","מחלקים ל-6 כדורים ומרדדים כל אחד בין שני ניירות אפייה לעיגול בקוטר 15 ס\"מ ובעובי כ-7 מ\"מ.","מכסים ומתפיחים במקום חמים 30–40 דקות, עד שהפיתות תופחות מעט.","בינתיים מחממים תנור ל-250 מעלות עם תבנית אפייה יציבה בפנים.","מחליקים את הפיתות (עם הנייר) אל התבנית הלוהטת ואופים 8–10 דקות, עד שהן תפוחות עם כתמים זהובים.","עורמים מתחת למגבת נקייה ל-5 דקות לריכוך, ואז פותחים כיס בעזרת סכין משוננת."],"nutrition":{"calories":200,"fatG":15.9,"satFatG":1.3,"proteinG":8.1,"carbsG":9.2,"fiberG":6.3,"netCarbsG":2.9,"sugarG":0.7,"sodiumMg":380},"tips":"The blazing-hot preheated sheet is what makes them puff — do not skip it. Roll to an even thickness so steam collects in one bubble. If a pita doesn\u0027t balloon fully, the crumb is still soft and opens into a pocket with a knife.","tipsHe":"התבנית הלוהטת שחוממה מראש היא מה שגורם לפיתה לתפוח — לא לדלג על השלב הזה. מרדדים לעובי אחיד כדי שהאדים ייאספו לבועה אחת. גם אם פיתה לא תפחה לגמרי, הפנים נשאר רך ואפשר לפתוח כיס עם סכין.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/keto-flatbread/"},{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-flatbread/"},{"creator":"Keto Vegetarian Recipes","url":"https://ketovegetarianrecipes.com/keto-pita-bread-low-carb/"}],"comparedVersions":"Compared Wholesome Yum\u0027s pita (uses whey protein isolate — a dairy ingredient, replaced here with extra almond flour and egg whites to keep it pareve), Sugar Free Londoner\u0027s baking-powder-only flatbread, and a yeasted approach. Kept the simple almond-psyllium base, added real yeast, a short rise, and a very hot preheated tray — the closest thing to an Israeli pita that low-carb allows.","comparedVersionsHe":"הושוו הפיתה של Wholesome Yum (מכילה אבקת חלבון מי-גבינה חלבית — הוחלפה כאן בתוספת קמח שקדים וחלבוני ביצה כדי להישאר פרווה), הפיתה של Sugar Free Londoner על בסיס אבקת אפייה בלבד, וגישה עם שמרים. שמרנו על בסיס השקדים-פסיליום הפשוט והוספנו שמרים אמיתיים, התפחה קצרה ותבנית לוהטת — הכי קרוב לפיתה ישראלית שקטו מאפשר."},{"id":"garlic-breadsticks-mozzarella","name":"Garlic Breadsticks (Mozzarella Dough)","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":8,"prepTimeMin":15,"cookTimeMin":18,"difficulty":"easy","ingredients":[{"amount":"1 1/2 cups / 170 g","item":"shredded low-moisture mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"2 tbsp / 30 g","item":"cream cheese","israelNote":"gvinat shamenet (Napoleon/Ski-type, firm white cheese spread)"},{"amount":"3/4 cup / 75 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1 large","item":"egg"},{"amount":"1 tsp","item":"baking powder"},{"amount":"1 tsp + 1 clove minced","item":"garlic powder, plus fresh garlic for topping"},{"amount":"1/2 tsp each","item":"Italian herb seasoning and salt"},{"amount":"1 tbsp","item":"butter, melted (topping)"},{"amount":"1 tbsp + 1 tsp","item":"grated parmesan and chopped parsley (topping)"}],"instructions":["Preheat the oven to 200°C / 400°F and line a baking sheet with parchment.","Microwave the mozzarella and cream cheese in 30-second bursts, stirring, until fully melted and smooth (about 60-90 seconds).","Working while the cheese is warm, mix in the egg, almond flour, baking powder, garlic powder, herbs, and salt until a uniform dough forms — knead with oiled hands if needed.","Press or roll the dough between parchment sheets into a rectangle about 0.5 cm thick.","Mix the melted butter with the minced garlic and brush over the top.","Bake 13-15 minutes until puffed and golden.","Sprinkle with parmesan and parsley, cut into 8 sticks with a pizza cutter, and serve warm."],"nutrition":{"calories":159,"fatG":13.0,"satFatG":4.0,"proteinG":9.0,"carbsG":4.0,"fiberG":1.0,"netCarbsG":3.0,"sugarG":1.0,"sodiumMg":316},"lowCarbVariant":"Top with 1/2 cup extra mozzarella in the last 3 minutes for cheesy pull-apart sticks (adds ~35 kcal per stick, no meaningful carbs).","tips":"If the dough turns stringy and hard to mix, rewarm it 15 seconds — cold fathead dough fights back.","sources":[{"creator":"Katerina Petrovska, Diethood","url":"https://diethood.com/low-carb-keto-breadsticks/"},{"creator":"Jennifer Lee, Kirbie\u0027s Cravings","url":"https://kirbiecravings.com/low-carb-keto-garlic-breadsticks/"}],"comparedVersions":"Compared Diethood\u0027s minimal fathead sheet (7 dough ingredients, rolled flat) with Kirbie\u0027s richer hand-rolled sticks (adds coconut flour, 3 eggs, more cheese). Chose Diethood\u0027s leaner ratio — fewer ingredients, lower calories, faster — and kept Kirbie\u0027s garlic-butter-plus-parmesan finish, which is what makes them taste like pizzeria breadsticks.","nameHe":"מקלות שום מבצק מוצרלה","ingredientsHe":[{"amount":"1 1/2 כוסות / 170 גרם","item":"מוצרלה מגוררת דלת-לחות","israelNote":"טרה / גד"},{"amount":"2 כפות / 30 גרם","item":"גבינת שמנת","israelNote":"נפוליאון / סקי"},{"amount":"3/4 כוס / 75 גרם","item":"קמח שקדים"},{"amount":"1 גדולה","item":"ביצה"},{"amount":"1 כפית","item":"אבקת אפייה"},{"amount":"1 כפית + שן קצוצה","item":"אבקת שום, ושום טרי לציפוי"},{"amount":"1/2 כפית מכל אחד","item":"תערובת עשבי תיבול איטלקית ומלח"},{"amount":"1 כף","item":"חמאה מומסת (לציפוי)"},{"amount":"1 כף + 1 כפית","item":"פרמזן מגורר ופטרוזיליה קצוצה (לציפוי)"}],"instructionsHe":["מחממים תנור ל-200 מעלות ומרפדים תבנית בנייר אפייה.","ממיסים את המוצרלה וגבינת השמנת במיקרוגל בפולסים של 30 שניות תוך ערבוב, עד להמסה מלאה וחלקה (כ-60-90 שניות).","בעוד הגבינה חמה, מערבבים פנימה את הביצה, קמח השקדים, אבקת האפייה, אבקת השום, עשבי התיבול והמלח עד לקבלת בצק אחיד - לשים בידיים משומנות אם צריך.","משטחים או מרדדים את הבצק בין ניירות אפייה למלבן בעובי כ-0.5 ס\"מ.","מערבבים את החמאה המומסת עם השום הקצוץ ומברישים מעל.","אופים 13-15 דקות עד שהבצק תפוח וזהוב.","מפזרים פרמזן ופטרוזיליה, חותכים בגלגלת פיצה ל-8 מקלות ומגישים חם."],"lowCarbVariantHe":"מפזרים 1/2 כוס מוצרלה נוספת ב-3 הדקות האחרונות למקלות גבינה נמתחים (כ-35 קלוריות נוספות למקל, בלי פחמימות משמעותיות).","tipsHe":"אם הבצק נהיה חוטי וקשה לערבוב, מחממים אותו שוב 15 שניות - בצק פאטהד קר לא משתף פעולה.","comparedVersionsHe":"השווינו את משטח הפאטהד המינימליסטי של Diethood (7 מרכיבים, מרודד שטוח) עם המקלות המגולגלים והעשירים של Kirbie\u0027s (עם קמח קוקוס, 3 ביצים ויותר גבינה). בחרנו ביחס הרזה של Diethood - פחות מרכיבים, פחות קלוריות, מהיר יותר - ושמרנו על ציפוי חמאת השום והפרמזן של Kirbie\u0027s, שהוא מה שנותן טעם של מקלות שום מפיצרייה."},{"id":"quick-english-muffin-rounds","name":"Quick English-Muffin Rounds","nameHe":"אינגליש מאפין מהיר","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":2,"prepTimeMin":5,"cookTimeMin":4,"difficulty":"easy","ingredients":[{"amount":"6 tbsp / 42 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1 tbsp / 7 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"1 tsp","item":"baking powder"},{"amount":"1 pinch","item":"fine salt"},{"amount":"2","item":"large eggs"},{"amount":"1 tbsp / 15 ml","item":"olive oil or melted coconut oil"}],"ingredientsHe":[{"amount":"6 כפות / 42 גרם","item":"קמח שקדים מולבן","israelNote":"קמח שקדים"},{"amount":"1 כף / 7 גרם","item":"קמח קוקוס","israelNote":"קמח קוקוס"},{"amount":"1 כפית","item":"אבקת אפייה"},{"amount":"קורט","item":"מלח דק"},{"amount":"2","item":"ביצים גדולות"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית או שמן קוקוס מומס"}],"instructions":["Grease two ramekins or wide mugs (about 9 cm across).","Whisk the eggs with the oil; stir in the almond flour, coconut flour, baking powder, and salt until smooth.","Divide the batter between the ramekins and level the tops.","Microwave each 90 seconds until springy (or bake both 12 minutes at 180°C).","Cool 2 minutes, loosen the edges with a knife, and turn out.","Slice in half and toast until golden."],"instructionsHe":["משמנים שני רמקינים או ספלים רחבים (בקוטר כ-9 ס\"מ).","טורפים את הביצים עם השמן; מערבבים פנימה את קמח השקדים, קמח הקוקוס, אבקת האפייה והמלח עד לתערובת חלקה.","מחלקים את הבלילה בין הרמקינים ומיישרים את פני השטח.","מחממים כל אחד במיקרוגל 90 שניות עד שהמאפין קפיצי (או אופים את שניהם 12 דקות ב-180 מעלות).","מצננים 2 דקות, משחררים את השוליים עם סכין והופכים החוצה.","פורסים לשניים וקולים עד להזהבה."],"nutrition":{"calories":282,"fatG":23.3,"satFatG":3.7,"proteinG":12.0,"carbsG":6.7,"fiberG":3.6,"netCarbsG":3.1,"sugarG":0.6,"sodiumMg":390},"tips":"Toasting is not optional — that is where the English-muffin character comes from. Use a toaster oven or bagel mode; a fresh untoasted round is soft and eggy, a toasted one has crisp edges and nooks.","tipsHe":"הקלייה אינה אופציונלית — משם מגיע האופי של אינגליש מאפין. עדיף טוסטר-אובן או מצב בייגל; מאפין טרי לא קלוי הוא רך וביצתי, וקלוי מקבל שוליים פריכים וחורים יפים.","sources":[{"creator":"Kirbie\u0027s Cravings","url":"https://kirbiecravings.com/keto-microwave-english-muffin/"},{"creator":"The Big Man\u0027s World (Arman Liew)","url":"https://thebigmansworld.com/keto-english-muffin/"},{"creator":"Sweet As Honey (Carine Claudepierre)","url":"https://www.sweetashoney.co/keto-english-muffin-recipe/"}],"comparedVersions":"Compared Kirbie\u0027s Cravings 90-second muffin (made with butter — converted to olive/coconut oil for pareve), The Big Man\u0027s World\u0027s version, and Sweet As Honey\u0027s 1-minute muffin. Added a spoon of coconut flour to the almond base, which all comparisons suggest gives the drier, nook-and-cranny crumb that toasts best.","comparedVersionsHe":"הושוו המאפין של Kirbie\u0027s Cravings ב-90 שניות (עם חמאה — הומר לשמן זית/קוקוס כדי להישאר פרווה), הגרסה של The Big Man\u0027s World, והמאפין של Sweet As Honey. נוספה כף קמח קוקוס לבסיס השקדים — לפי כל ההשוואות זה מה שנותן את הפנים היבש והמחורר שנקלה הכי טוב."},{"id":"laffa-style-wraps","name":"Laffa-Style Soft Wraps","nameHe":"לאפה רכה דלת פחמימות","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":20,"cookTimeMin":20,"difficulty":"easy","ingredients":[{"amount":"¾ cup / 75 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"½ cup / 50 g","item":"ground golden flaxseed","israelNote":"pishtan tachun (ground flax)"},{"amount":"3 tbsp / 24 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"1 tsp","item":"baking powder"},{"amount":"¾ tsp","item":"fine salt"},{"amount":"3 tbsp / 45 ml","item":"olive oil"},{"amount":"1¾ cups / 420 ml","item":"warm water"}],"ingredientsHe":[{"amount":"¾ כוס / 75 גרם","item":"קמח קוקוס","israelNote":"קמח קוקוס"},{"amount":"½ כוס / 50 גרם","item":"זרעי פשתן זהוב טחונים","israelNote":"פשתן טחון"},{"amount":"3 כפות / 24 גרם","item":"אבקת פסיליום","israelNote":"פסיליום (סופר-פארם/חנויות טבע)"},{"amount":"1 כפית","item":"אבקת אפייה"},{"amount":"¾ כפית","item":"מלח דק"},{"amount":"3 כפות / 45 מ\"ל","item":"שמן זית"},{"amount":"1¾ כוסות / 420 מ\"ל","item":"מים פושרים"}],"instructions":["Whisk the coconut flour, flax, psyllium, baking powder, and salt.","Add the olive oil and warm water; stir into a soft dough and rest 10 minutes until the water is fully absorbed.","Divide into 6 balls and roll each between parchment sheets into a thin round, 22–25 cm across (1–2 mm).","Heat a dry nonstick or cast-iron pan over medium-high heat.","Cook each laffa 1½–2 minutes until brown spots appear, flip, and cook 1–1½ minutes more, pressing gently with a towel for char spots.","Stack the finished laffas under a towel so they stay warm and pliable.","Serve warm; reheat briefly in the pan to restore flexibility before rolling shawarma."],"instructionsHe":["טורפים יחד את קמח הקוקוס, הפשתן, הפסיליום, אבקת האפייה והמלח.","מוסיפים את שמן הזית והמים הפושרים; מערבבים לבצק רך ומניחים 10 דקות עד שהמים נספגים לגמרי.","מחלקים ל-6 כדורים ומרדדים כל אחד בין ניירות אפייה לעיגול דק בקוטר 22–25 ס\"מ (1–2 מ\"מ).","מחממים מחבת יבשה (נון-סטיק או ברזל יצוק) על אש בינונית-גבוהה.","צורבים כל לאפה 1½–2 דקות עד להופעת כתמים חומים, הופכים וצורבים עוד 1–1½ דקות, תוך לחיצה עדינה עם מגבת לקבלת חריכה.","עורמים את הלאפות המוכנות מתחת למגבת כדי שיישארו חמות וגמישות.","מגישים חם; לפני גלגול שווארמה מחממים שוב קצרות במחבת להחזרת הגמישות."],"nutrition":{"calories":168,"fatG":12.7,"satFatG":3.0,"proteinG":4.0,"carbsG":13.4,"fiberG":10.1,"netCarbsG":3.3,"sugarG":0.9,"sodiumMg":370},"tips":"Egg-free, so the wraps stay neutral in flavor and won\u0027t turn rubbery. Roll truly thin — that is what makes them pliable enough to wrap shawarma without cracking. They keep 3 days refrigerated; refresh in a hot pan.","tipsHe":"ללא ביצים, ולכן הטעם נייטרלי והמרקם לא גומי. חשוב לרדד ממש דק — זה מה שמאפשר לגלגל שווארמה בלי שהלאפה תיסדק. נשמרות 3 ימים במקרר; מרעננים במחבת חמה.","sources":[{"creator":"KETohh","url":"https://ketohh.com/easy-flatbread-wrap-recipe/"},{"creator":"Cassidy\u0027s Craveable Creations","url":"https://cassidyscraveablecreations.com/flatbread-and-psyllium-husks/"},{"creator":"Nutrition Refined","url":"https://nutritionrefined.com/flaxseed-wraps/"}],"comparedVersions":"Compared KETohh\u0027s flatbread wraps (made with butter — converted to olive oil for pareve, and the chia powder dropped to simplify), Cassidy\u0027s dairy-free psyllium flatbread, and Nutrition Refined\u0027s pure flax wraps. The coconut-flax-psyllium trio gave the most laffa-like chew and the best rollability of the three.","comparedVersionsHe":"הושוו הטורטיות של KETohh (עם חמאה — הומרה לשמן זית כדי להישאר פרווה, ואבקת הצ\u0027יה הושמטה לפישוט), הלחם השטוח ללא חלב של Cassidy\u0027s, וטורטיות הפשתן של Nutrition Refined. שילוב הקוקוס-פשתן-פסיליום נתן את הלעיסות הכי דומה ללאפה ואת הגמישות הטובה ביותר לגלגול."},{"id":"dairy-free-keto-naan","name":"Dairy-Free Keto Naan","nameHe":"נאן רך ללא חלב","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":20,"cookTimeMin":18,"difficulty":"easy","ingredients":[{"amount":"⅔ cup / 75 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tbsp / 16 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"1 tsp","item":"baking powder"},{"amount":"½ tsp","item":"fine salt"},{"amount":"¼ cup / 60 ml","item":"thick coconut cream","israelNote":"kremet kokos 22%+"},{"amount":"2 tbsp / 30 ml","item":"olive oil (for the dough)"},{"amount":"1 cup / 240 ml","item":"hot water"},{"amount":"2 tbsp / 30 ml","item":"olive oil (for the garlic brush)"},{"amount":"1 clove","item":"garlic, crushed"},{"amount":"1 tbsp","item":"chopped parsley or cilantro (optional)"}],"ingredientsHe":[{"amount":"⅔ כוס / 75 גרם","item":"קמח קוקוס","israelNote":"קמח קוקוס"},{"amount":"2 כפות / 16 גרם","item":"אבקת פסיליום","israelNote":"פסיליום (סופר-פארם/חנויות טבע)"},{"amount":"1 כפית","item":"אבקת אפייה"},{"amount":"½ כפית","item":"מלח דק"},{"amount":"¼ כוס / 60 מ\"ל","item":"קרם קוקוס סמיך","israelNote":"קרמת קוקוס 22% ומעלה"},{"amount":"2 כפות / 30 מ\"ל","item":"שמן זית (לבצק)"},{"amount":"1 כוס / 240 מ\"ל","item":"מים חמים"},{"amount":"2 כפות / 30 מ\"ל","item":"שמן זית (למשיחת השום)"},{"amount":"1 שן","item":"שום כתוש"},{"amount":"1 כף","item":"פטרוזיליה או כוסברה קצוצה (לא חובה)"}],"instructions":["Whisk the coconut flour, psyllium, baking powder, and salt.","Add the coconut cream, 2 tbsp olive oil, and hot water; stir to a dough and rest 10 minutes until no longer sticky.","Divide into 6 and pat or roll each between parchment into a teardrop oval about 5 mm thick.","Heat a nonstick pan over medium heat and cook each naan 2–3 minutes per side, until puffed with brown spots (or bake 12–15 minutes at 180°C).","Meanwhile warm the remaining 2 tbsp olive oil gently with the crushed garlic.","Brush the hot naan with the garlic oil and sprinkle with salt and herbs.","Serve warm."],"instructionsHe":["טורפים את קמח הקוקוס, הפסיליום, אבקת האפייה והמלח.","מוסיפים את קרם הקוקוס, 2 כפות שמן זית והמים החמים; מערבבים לבצק ומניחים 10 דקות עד שאינו דביק.","מחלקים ל-6 ומשטחים או מרדדים כל חלק בין ניירות אפייה לצורת טיפה בעובי כ-5 מ\"מ.","מחממים מחבת נון-סטיק על אש בינונית ומטגנים כל נאן 2–3 דקות מכל צד, עד שהוא תפוח עם כתמים חומים (או אופים 12–15 דקות ב-180 מעלות).","בינתיים מחממים בעדינות את 2 כפות שמן הזית הנותרות עם השום הכתוש.","מברישים את הנאן החם בשמן השום ומפזרים מלח ועשבי תיבול.","מגישים חם."],"nutrition":{"calories":168,"fatG":14.0,"satFatG":5.8,"proteinG":2.6,"carbsG":10.0,"fiberG":6.7,"netCarbsG":3.3,"sugarG":0.5,"sodiumMg":270},"tips":"Coconut cream stands in for the yogurt — it brings the same richness and slight tang with zero dairy, so this naan can sit next to a curry made with meat. The garlic-oil brush at the end is what makes it taste like restaurant naan.","tipsHe":"קרם הקוקוס מחליף את היוגורט — אותה עשירות וחמצמצות עדינה בלי טיפת חלב, כך שהנאן יכול להיות מוגש לצד קארי בשרי. משיחת שמן השום בסוף היא מה שנותן טעם של נאן ממסעדה.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-naan-low-carb-flatbread/"},{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/low-carb-keto-naan-bread-recipe/"},{"creator":"Sweet As Honey (Carine Claudepierre)","url":"https://www.sweetashoney.co/low-carb-naan-bread-vegan-keto/"}],"comparedVersions":"Based on Sugar Free Londoner\u0027s no-mozzarella keto naan (uses ¼ cup dairy yogurt — swapped for thick coconut cream, a substitution the author herself endorses; the xanthan gum was dropped since psyllium alone binds fine). Cross-checked with Wholesome Yum\u0027s naan and Sweet As Honey\u0027s vegan naan, and finished with the garlic-oil brush common to all three.","comparedVersionsHe":"מבוסס על הנאן ללא מוצרלה של Sugar Free Londoner (עם ¼ כוס יוגורט חלבי — הוחלף בקרם קוקוס סמיך, החלפה שהמחברת עצמה ממליצה עליה; הקסנטן גאם הושמט כי הפסיליום לבדו קושר היטב). הוצלב עם הנאן של Wholesome Yum והנאן הטבעוני של Sweet As Honey, וסיום במשיחת שמן שום המשותפת לשלושתם."},{"id":"cauliflower-pizza-crust","name":"Crispy Cauliflower Pizza Crust","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":20,"cookTimeMin":25,"difficulty":"medium","ingredients":[{"amount":"300 g / 10 oz","item":"frozen cauliflower rice, thawed (or fresh riced cauliflower, microwaved 4 min)","israelNote":"orez kruvit kafu (Sunfrost)"},{"amount":"1 cup / 113 g","item":"shredded low-moisture mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"1 oz / 28 g","item":"cream cheese","israelNote":"gvinat shamenet firm white cheese"},{"amount":"1/3 cup / 30 g","item":"grated parmesan","israelNote":"parmesan megurad (or aged kashkaval)"},{"amount":"1 large","item":"egg white"},{"amount":"1/4 tsp each","item":"garlic powder, dried oregano, dried basil"}],"instructions":["Preheat the oven to 220°C / 425°F with a parchment-lined baking sheet ready.","Squeeze the thawed cauliflower rice in a clean towel until no more liquid comes out — this single step decides whether the crust is crisp or soggy.","Microwave the mozzarella and cream cheese together about 60 seconds until melted.","In a food processor (or by vigorous mixing), combine the melted cheese, egg white, cauliflower, parmesan, and seasonings until a dough ball forms.","Pat the dough into a 25 cm circle about 0.5 cm thick on the parchment.","Bake 8-10 minutes, flip the crust, and bake another 8-10 minutes until browned and rigid.","Add sauce and toppings and return to the oven 3-5 minutes until the topping cheese melts. Cut into quarters."],"nutrition":{"calories":171,"fatG":11.0,"satFatG":6.0,"proteinG":16.4,"carbsG":5.1,"fiberG":1.8,"netCarbsG":3.3,"sugarG":2.0,"sodiumMg":366},"lowCarbVariant":"No flour of any kind needed; for a sturdier slice add 2 tbsp almond flour to the dough (+0.5 g net carbs per serving).","tips":"Cauliflower vs fathead: choose this crust when you want a thin, crisp, lighter pizza with fewer calories and a vegetable serving built in; choose fathead dough when you want a chewy, foldable New-York-style slice or need dough you can shape ahead. Cauliflower crust is more work (squeezing) but roughly half the calories.","sources":[{"creator":"Kim Hardesty, Low Carb Maven","url":"https://www.lowcarbmaven.com/cauliflower-pizza-crust-keto/"},{"creator":"Lisa Bryan, Downshiftology","url":"https://downshiftology.com/recipes/cauliflower-pizza-crust/"},{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/keto-cauliflower-pizza-crust/"}],"comparedVersions":"Compared Low Carb Maven\u0027s melted-cheese hybrid crust, Downshiftology\u0027s classic cauliflower-egg-cheese crust, and That Low Carb Life\u0027s coconut-flour version. The melted-mozzarella hybrid won decisively on crispness and structural integrity (slices hold one-handed); the flip-and-bake-twice step from LCM prevents the sogginess the classic versions fight.","nameHe":"בסיס פיצה פריך מכרובית","ingredientsHe":[{"amount":"300 גרם","item":"אורז כרובית קפוא מופשר (או כרובית מגוררת טרייה, 4 דקות במיקרוגל)","israelNote":"סאנפרוסט"},{"amount":"1 כוס / 113 גרם","item":"מוצרלה מגוררת דלת-לחות","israelNote":"טרה / גד"},{"amount":"28 גרם","item":"גבינת שמנת"},{"amount":"1/3 כוס / 30 גרם","item":"פרמזן מגורר","israelNote":"או קשקבל מיושן"},{"amount":"1 גדול","item":"חלבון ביצה"},{"amount":"1/4 כפית מכל אחד","item":"אבקת שום, אורגנו יבש ובזיליקום יבש"}],"instructionsHe":["מחממים תנור ל-220 מעלות ומכינים תבנית מרופדת בנייר אפייה.","סוחטים את אורז הכרובית המופשר במגבת נקייה עד שלא יוצא יותר נוזל - השלב הזה לבדו קובע אם הבסיס יהיה פריך או ספוגי.","ממיסים את המוצרלה וגבינת השמנת יחד במיקרוגל כ-60 שניות.","במעבד מזון (או בערבוב נמרץ) מאחדים את הגבינה המומסת, החלבון, הכרובית, הפרמזן והתבלינים עד לקבלת כדור בצק.","משטחים את הבצק על הנייר לעיגול בקוטר 25 ס\"מ ובעובי כ-0.5 ס\"מ.","אופים 8-10 דקות, הופכים את הבסיס ואופים עוד 8-10 דקות עד שהוא שחום וקשיח.","מוסיפים רוטב ותוספות ומחזירים לתנור 3-5 דקות עד שהגבינה שמעל נמסה. חותכים לרבעים."],"lowCarbVariantHe":"לא צריך שום קמח; לפרוסה יציבה יותר מוסיפים לבצק 2 כפות קמח שקדים (+0.5 גרם פחמימות נטו למנה).","tipsHe":"כרובית מול פאטהד: בוחרים בבסיס הזה כשרוצים פיצה דקה, פריכה וקלה יותר עם פחות קלוריות ומנת ירק מובנית; בוחרים בבצק פאטהד כשרוצים פרוסה לעיסה ומתקפלת בסגנון ניו-יורק או בצק שאפשר להכין מראש. בסיס כרובית דורש יותר עבודה (סחיטה) אבל מכיל בערך חצי מהקלוריות.","comparedVersionsHe":"השווינו את בסיס הגבינה המומסת ההיברידי של Low Carb Maven, את בסיס הכרובית-ביצה-גבינה הקלאסי של Downshiftology וגרסת קמח קוקוס של That Low Carb Life. ההיברידי עם המוצרלה המומסת ניצח בפער בפריכות וביציבות (פרוסות שמחזיקים ביד אחת); שלב ההפיכה והאפייה הכפולה של LCM מונע את הספוגיות שהגרסאות הקלאסיות נאבקות בה."},{"id":"keto-matzah-crackers","name":"Keto Matzah-Style Crackers","nameHe":"קרקרים בסגנון מצה","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"1½ cups / 150 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"1","item":"large egg"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"¼ tsp","item":"fine salt"}],"ingredientsHe":[{"amount":"1½ כוסות / 150 גרם","item":"קמח שקדים מולבן","israelNote":"קמח שקדים"},{"amount":"1","item":"ביצה גדולה"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"¼ כפית","item":"מלח דק"}],"instructions":["Heat the oven to 175°C.","Mix all the ingredients into a smooth dough ball.","Divide into 4 and roll each between parchment sheets paper-thin (about 1.5 mm), into a rough rectangle.","Prick all over in rows with a fork — the classic matzah perforation keeps the sheets flat and crisp.","Slide the sheets, on their parchment, onto trays and bake 12–15 minutes until golden at the edges; watch closely near the end.","Cool completely on a rack — they crisp fully as they cool.","Store airtight up to a week."],"instructionsHe":["מחממים תנור ל-175 מעלות.","מערבבים את כל הרכיבים לכדור בצק חלק.","מחלקים ל-4 ומרדדים כל חלק בין ניירות אפייה לעלה דק כנייר (כ-1.5 מ\"מ), בצורת מלבן גס.","מנקבים שורות-שורות עם מזלג — הניקוב הקלאסי של מצה שומר על העלים שטוחים ופריכים.","מחליקים את העלים עם הנייר לתבניות ואופים 12–15 דקות עד להזהבה בשוליים; משגיחים היטב לקראת הסוף.","מצננים לגמרי על רשת — הפריכות המלאה מגיעה עם הצינון.","שומרים בכלי אטום עד שבוע."],"nutrition":{"calories":292,"fatG":24.8,"satFatG":2.4,"proteinG":10.6,"carbsG":7.6,"fiberG":4.1,"netCarbsG":3.5,"sugarG":1.2,"sodiumMg":160},"tips":"Passover note: this dough contains no leavening at all — not even baking powder — so the kosher-for-Passover baking powder question never comes up. Almond flour is widely used on Pesach (check your community\u0027s kitniyot customs), but remember this is a matzah-style cracker, not halachic matzah, and does not fulfill the seder obligation.","tipsHe":"הערה לפסח: הבצק אינו מכיל שום חומר התפחה — אפילו לא אבקת אפייה — כך ששאלת אבקת אפייה כשרה לפסח כלל לא עולה. קמח שקדים מקובל מאוד בפסח (בדקו את מנהג הקטניות שלכם), אבל חשוב לזכור: זהו קרקר בסגנון מצה ולא מצה כשרה הלכתית, והוא אינו יוצא ידי חובת מצה בליל הסדר.","sources":[{"creator":"Savory Tooth","url":"https://www.savorytooth.com/low-carb-crackers/"},{"creator":"Plant Based with Amy","url":"https://plantbasedwithamy.com/gluten-free-matzah/"},{"creator":"Blissfully Low Carb","url":"https://blissfullylowcarb.com/keto-almond-flour-crackers/"}],"comparedVersions":"Compared Savory Tooth\u0027s almond flour crackers (made with parmesan — removed entirely and replaced with olive oil and a bit more salt, making them pareve), Plant Based with Amy\u0027s gluten-free matzah for the thin-roll-and-perforate technique, and Blissfully Low Carb\u0027s minimal-ingredient crackers. Kept the shortest possible ingredient list.","comparedVersionsHe":"הושוו הקרקרים של Savory Tooth (עם פרמזן — הוסר לגמרי והוחלף בשמן זית ומעט יותר מלח, כך שהם פרווה), המצה ללא גלוטן של Plant Based with Amy לטכניקת הרידוד הדק והניקוב, והקרקרים המינימליסטיים של Blissfully Low Carb. נשמרה רשימת הרכיבים הקצרה ביותר האפשרית."},{"id":"fathead-dinner-rolls","name":"Keto Dinner Rolls (Fathead Dough)","nameHe":"לחמניות קיטו (בצק פאטהד)","category":"baking-savory","kosherType":"dairy","dietTags":"keto","servings":8,"prepTimeMin":15,"cookTimeMin":22,"difficulty":"easy","ingredients":[{"amount":"1.5 cups / 170 g","item":"shredded low-moisture mozzarella","israelNote":"shredded mozzarella (Tara/Gad)"},{"amount":"2 oz / 56 g","item":"cream cheese","israelNote":"gevinat shamenet levana, e.g. Napoleon/Philadelphia style"},{"amount":"1.33 cups / 133 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"2 tbsp / 14 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"1.5 tbsp","item":"baking powder (yes, tablespoons - it is what makes them fluffy)","israelNote":"check kosher-for-passover if relevant"},{"amount":"3","item":"large eggs (1 reserved for egg wash)"},{"amount":"1 tsp","item":"sesame seeds (optional topping)"}],"ingredientsHe":[{"amount":"1.5 כוסות / 170 גרם","item":"מוצרלה מגוררת (דלת לחות)","israelNote":"מוצרלה מגוררת של טרה/גד"},{"amount":"56 גרם","item":"גבינת שמנת","israelNote":"גבינת שמנת לבנה, למשל נפוליאון או בסגנון פילדלפיה"},{"amount":"1 ושליש כוסות / 133 גרם","item":"קמח שקדים מולבן"},{"amount":"2 כפות / 14 גרם","item":"קמח קוקוס"},{"amount":"1.5 כפות","item":"אבקת אפייה (כן, כפות – זה מה שעושה אותן אווריריות)","israelNote":"אם רלוונטי – לוודא כשרות לפסח"},{"amount":"3","item":"ביצים גדולות (אחת שמורה להברשה)"},{"amount":"1 כפית","item":"שומשום (לפיזור, לא חובה)"}],"instructions":["Heat the oven to 350°F / 180°C and line a baking sheet with baking paper.","Whisk the almond flour, coconut flour and baking powder together in a small bowl.","Melt the mozzarella and cream cheese together in the microwave in 30-second bursts, stirring until smooth.","Combine the melted cheese, 2 eggs and the dry mix in a food processor (or knead by hand) until an even dough forms - if sticky, chill 10 minutes.","Divide into 8 balls and roll each smooth between damp palms; place on the sheet.","Brush with the remaining beaten egg, sprinkle with sesame seeds, and bake 20-23 minutes until deep golden.","Cool a few minutes before serving; reheat leftovers briefly - they are best warm."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מערבבים בקערה קטנה את קמח השקדים, קמח הקוקוס ואבקת האפייה.","ממיסים יחד את המוצרלה וגבינת השמנת במיקרוגל בפולסים של 30 שניות, תוך ערבוב, עד שהתערובת חלקה.","מאחדים במעבד מזון (או בלישה ידנית) את הגבינה המומסת, 2 ביצים והתערובת היבשה עד לקבלת בצק אחיד – אם הבצק דביק, מצננים 10 דקות במקרר.","מחלקים ל-8 כדורים ומגלגלים כל אחד לכדור חלק בין כפות ידיים לחות; מניחים על התבנית.","מברישים בביצה הטרופה הנותרת, מפזרים שומשום ואופים 20-23 דקות עד לגוון זהוב עמוק.","מצננים כמה דקות לפני ההגשה; שאריות מחממים קצרות – הן הכי טעימות חמות."],"nutrition":{"calories":214,"fatG":16.7,"satFatG":4.9,"proteinG":10.8,"carbsG":6.1,"fiberG":2.4,"netCarbsG":3.7,"sugarG":0.6,"sodiumMg":440},"ketoVariant":"Add 2 tsp dried yeast bloomed in 2 tbsp warm water with a pinch of inulin for a real bread aroma (Wholesome Yum\u0027s trick) - the yeast is for flavor only.","ketoVariantHe":"מוסיפים 2 כפיות שמרים יבשים שהותפחו ב-2 כפות מים חמימים עם קורט אינולין לניחוח לחם אמיתי (הטריק של Wholesome Yum) – השמרים לטעם בלבד.","tips":"Use pre-shredded low-moisture mozzarella; fresh mozzarella balls carry too much water and the dough will not hold shape.","tipsHe":"משתמשים במוצרלה מגוררת דלת לחות; כדורי מוצרלה טרייה מכילים יותר מדי מים והבצק לא ישמור על צורתו.","sources":[{"creator":"Kirbie\u0027s Cravings","url":"https://kirbiecravings.com/keto-bread-rolls/"},{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/fathead-keto-dinner-rolls-recipe/"}],"comparedVersions":"Compared Kirbie\u0027s Cravings\u0027 straightforward fathead rolls (no yeast, food-processor method, 4 g net) with Wholesome Yum\u0027s yeast-boosted version. Kirbie\u0027s ratio of almond + a little coconut flour with extra baking powder gave the fluffiest crumb with fewer steps; the yeast step is kept only as an optional flavor variant.","comparedVersionsHe":"השווינו את לחמניות הפאטהד הפשוטות של Kirbie\u0027s Cravings (בלי שמרים, שיטת מעבד מזון, 4 גרם פחמימות נטו) עם הגרסה מועשרת השמרים של Wholesome Yum. היחס של Kirbie – קמח שקדים עם מעט קמח קוקוס ותוספת אבקת אפייה – נתן את המרקם האוורירי ביותר בפחות שלבים; שלב השמרים נשמר רק כווריאציה לא חובה לטעם."},{"id":"almond-flour-pita-flatbread","name":"Almond Flour Pita-Style Flatbread","nameHe":"לחם שטוח בסגנון פיתה מקמח שקדים","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":22,"difficulty":"easy","ingredients":[{"amount":"0.5 cup / 65 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"0.25 cup / 35 g","item":"coconut flour, sifted","israelNote":"kemach kokos"},{"amount":"2 tbsp / 20 g","item":"psyllium husk powder","israelNote":"psyllium (pharma/health stores, e.g. iHerb/SuperPharm)"},{"amount":"1.5 tsp","item":"baking powder","israelNote":"check kosher-for-passover if relevant"},{"amount":"0.25 tsp","item":"salt"},{"amount":"1 tbsp","item":"olive oil"},{"amount":"1 cup / 240 ml","item":"warm water"},{"amount":"1 tsp","item":"sesame seeds for sprinkling (optional)"}],"ingredientsHe":[{"amount":"חצי כוס / 65 גרם","item":"קמח שקדים מולבן"},{"amount":"רבע כוס / 35 גרם","item":"קמח קוקוס, מנופה"},{"amount":"2 כפות / 20 גרם","item":"אבקת פסיליום","israelNote":"סופר-פארם / חנויות טבע / iHerb"},{"amount":"1.5 כפית","item":"אבקת אפייה","israelNote":"אם רלוונטי – לוודא כשרות לפסח"},{"amount":"רבע כפית","item":"מלח"},{"amount":"1 כף","item":"שמן זית"},{"amount":"1 כוס / 240 מ\"ל","item":"מים חמימים"},{"amount":"1 כפית","item":"שומשום לפיזור (לא חובה)"}],"instructions":["Heat the oven to 350°F / 180°C and line a baking sheet with baking paper.","Whisk the almond flour, coconut flour, psyllium, baking powder and salt.","Add the olive oil and warm water and knead briefly until a soft dough forms; rest 5 minutes to hydrate.","Divide into 4 balls and roll each into a ~15 cm round about 0.5 cm thick; sprinkle with sesame.","Bake 20-25 minutes until golden and puffed in places.","Serve warm - split for pockets, fold as a wrap, or cut into wedges for dips. Egg-free, so leftovers stay flexible."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מערבבים את קמח השקדים, קמח הקוקוס, הפסיליום, אבקת האפייה והמלח.","מוסיפים את שמן הזית והמים החמימים ולשים קצרות עד לקבלת בצק רך; מניחים למנוחה 5 דקות לספיגת הנוזלים.","מחלקים ל-4 כדורים ומרדדים כל אחד לעיגול של כ-15 ס\"מ בעובי כחצי ס\"מ; מפזרים שומשום.","אופים 20-25 דקות עד שהפיתות זהובות ותפוחות פה ושם.","מגישים חם – פותחים לכיס, מקפלים כראפ או חותכים למשולשים למטבלים. ללא ביצים, כך שהשאריות נשארות גמישות."],"nutrition":{"calories":170,"fatG":13.1,"satFatG":2.2,"proteinG":5.4,"carbsG":12.9,"fiberG":8.9,"netCarbsG":4.0,"sugarG":1.1,"sodiumMg":160},"ketoVariant":"Pan-fry 2 minutes per side in a dry skillet instead of baking for softer, shawarma-style wraps.","ketoVariantHe":"במקום לאפות, מטגנים 2 דקות מכל צד במחבת יבשה לראפים רכים יותר בסגנון שווארמה.","tips":"No eggs and no dairy - ideal alongside grilled meat with tahini and salad.","tipsHe":"בלי ביצים ובלי חלב – אידיאלי לצד בשר על האש עם טחינה וסלט.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-flatbread/"},{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/keto-flatbread/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s egg-free 6-ingredient pita (almond + coconut + psyllium + water) with Wholesome Yum\u0027s version that adds whey protein isolate and egg whites. The Londoner recipe won: fewer ingredients, no whey means it stays pareve for meat meals, and the psyllium-water dough still puffs and folds like real pita.","comparedVersionsHe":"השווינו את הפיתה ללא ביצים מ-6 מרכיבים של Sugar Free Londoner (שקדים + קוקוס + פסיליום + מים) עם הגרסה של Wholesome Yum שמוסיפה אבקת חלבון מי-גבינה וחלבוני ביצה. המתכון של Sugar Free Londoner ניצח: פחות מרכיבים, בלי מי-גבינה – כך שהוא נשאר פרווה לארוחות בשריות, ובצק הפסיליום-מים עדיין תופח ומתקפל כמו פיתה אמיתית."},{"id":"nordic-seed-crackers","name":"Nordic Seed Crackers","nameHe":"קרקרים נורדיים מזרעים","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":60,"difficulty":"easy","ingredients":[{"amount":"0.75 cup / 105 g","item":"sunflower seeds","israelNote":"garinei chamania (kalufim/shelled)"},{"amount":"0.5 cup / 65 g","item":"pumpkin seeds","israelNote":"garinei dla\u0027at"},{"amount":"0.5 cup / 72 g","item":"sesame seeds"},{"amount":"3 tbsp / 24 g","item":"chia seeds","israelNote":"health-food stores/supermarket health aisle"},{"amount":"1 tbsp","item":"psyllium husk powder (or 2 tbsp whole husks)","israelNote":"psyllium (pharma/health stores, e.g. iHerb/SuperPharm)"},{"amount":"0.5 tsp","item":"coarse salt, plus flakes for the top"},{"amount":"0.75 cup / 180 ml","item":"water"}],"ingredientsHe":[{"amount":"3/4 כוס / 105 גרם","item":"גרעיני חמנייה קלופים"},{"amount":"חצי כוס / 65 גרם","item":"גרעיני דלעת"},{"amount":"חצי כוס / 72 גרם","item":"שומשום"},{"amount":"3 כפות / 24 גרם","item":"זרעי צ\u0027יה","israelNote":"חנויות טבע / מדף הבריאות בסופר"},{"amount":"1 כף","item":"אבקת פסיליום (או 2 כפות פסיליום שלם)","israelNote":"סופר-פארם / חנויות טבע / iHerb"},{"amount":"חצי כפית","item":"מלח גס, ועוד מלח אטלנטי לפיזור מעל"},{"amount":"3/4 כוס / 180 מ\"ל","item":"מים"}],"instructions":["Heat the oven to 300°F / 150°C.","Stir all the seeds, psyllium and salt together, add the water, and let the mixture sit 20 minutes until it turns into a thick, spoonable gel.","Spread the mixture on baking paper, cover with a second sheet, and roll as thin as you can - a few millimeters, in one even layer.","Peel off the top paper and pre-cut the sheet into about 24 squares with a pizza cutter.","Bake about 60 minutes until crisp and lightly browned; if the center is still soft, break away the crisp edges and give it 5-10 more minutes.","Cool completely, then snap along the cut lines. Serving = 4 crackers."],"instructionsHe":["מחממים תנור ל-150 מעלות.","מערבבים את כל הזרעים, הפסיליום והמלח, מוסיפים את המים ומניחים לתערובת לעמוד 20 דקות עד שהיא הופכת לג\u0027ל סמיך.","מורחים את התערובת על נייר אפייה, מכסים בנייר נוסף ומרדדים דק ככל האפשר – מילימטרים ספורים, בשכבה אחידה אחת.","מסירים את הנייר העליון וחורצים מראש בעזרת גלגלת פיצה לכ-24 ריבועים.","אופים כ-60 דקות עד שהקרקרים פריכים ומזהיבים קלות; אם המרכז עדיין רך, שוברים את השוליים הפריכים ומחזירים לתנור ל-5-10 דקות נוספות.","מצננים לגמרי ואז שוברים לאורך קווי החריצה. מנה = 4 קרקרים."],"nutrition":{"calories":253,"fatG":21.5,"satFatG":2.6,"proteinG":9.7,"carbsG":9.8,"fiberG":5.6,"netCarbsG":4.2,"sugarG":0.7,"sodiumMg":190},"tips":"They keep 3 weeks in an airtight tin. Excellent pareve stand-in for bread at a meat meal - top with tahini or avocado.","tipsHe":"נשמרים 3 שבועות בקופסה אטומה. תחליף פרווה מצוין ללחם בארוחה בשרית – מגישים עם טחינה או אבוקדו.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-seed-crackers-recipe/"},{"creator":"Hilda\u0027s Kitchen Blog","url":"https://hildaskitchenblog.com/recipe/healthy-low-carb-seed-crackers/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s 5-ingredient psyllium-bound crackers with Hilda\u0027s Kitchen version that adds collagen powder and coconut oil plus boiling water. The Londoner ratio won on simplicity - no protein powder or added fat needed, since chia plus psyllium bind on their own - with the same crispness and about 1 g net carb per cracker.","comparedVersionsHe":"השווינו את הקרקרים של Sugar Free Londoner מ-5 מרכיבים על בסיס פסיליום עם הגרסה של Hilda\u0027s Kitchen שמוסיפה אבקת קולגן, שמן קוקוס ומים רותחים. היחס של Sugar Free Londoner ניצח בזכות הפשטות – אין צורך באבקת חלבון או בשומן נוסף, כי הצ\u0027יה והפסיליום נקשרים בעצמם – עם אותה פריכות וכ-1 גרם פחמימות נטו לקרקר."},{"id":"pareve-keto-bagels","name":"Pareve Keto Bagels","nameHe":"בייגל קטו פרווה","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":15,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"2 tbsp / 14 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tbsp / 16 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"2 tsp","item":"baking powder"},{"amount":"½ tsp","item":"fine salt"},{"amount":"3","item":"large eggs"},{"amount":"3 tbsp / 45 ml","item":"thick coconut cream","israelNote":"kremet kokos 22%+"},{"amount":"1 tsp","item":"apple cider vinegar"},{"amount":"2 tbsp","item":"everything bagel seasoning (sesame, poppy seeds, dried garlic and onion, coarse salt)"}],"ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים מולבן","israelNote":"קמח שקדים"},{"amount":"2 כפות / 14 גרם","item":"קמח קוקוס","israelNote":"קמח קוקוס"},{"amount":"2 כפות / 16 גרם","item":"אבקת פסיליום","israelNote":"פסיליום (סופר-פארם/חנויות טבע)"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"½ כפית","item":"מלח דק"},{"amount":"3","item":"ביצים גדולות"},{"amount":"3 כפות / 45 מ\"ל","item":"קרם קוקוס סמיך","israelNote":"קרמת קוקוס 22% ומעלה"},{"amount":"1 כפית","item":"חומץ תפוחים"},{"amount":"2 כפות","item":"תערובת תיבול לבייגל (שומשום, פרג, שום ובצל מיובשים, מלח גס)"}],"instructions":["Heat the oven to 180°C and line a tray with parchment.","Whisk the almond flour, coconut flour, psyllium, baking powder, and salt.","Whisk the eggs, coconut cream, and vinegar; fold into the dry mix and rest 5 minutes to thicken.","With wet hands, divide into 6, roll each into a 15 cm rope, and pinch the ends into a ring.","Brush the tops lightly with water, sprinkle generously with the seasoning, and press gently so it sticks.","Bake 22–25 minutes until golden and firm.","Cool at least 15 minutes before slicing — the crumb sets as it cools."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית בנייר אפייה.","טורפים את קמח השקדים, קמח הקוקוס, הפסיליום, אבקת האפייה והמלח.","טורפים את הביצים, קרם הקוקוס והחומץ; מקפלים אל היבשים ומניחים 5 דקות להסמכה.","בידיים רטובות מחלקים ל-6, מגלגלים כל חלק לנקניק באורך 15 ס\"מ ומצמידים את הקצוות לטבעת.","מברישים את החלק העליון במעט מים, מפזרים בנדיבות את תערובת התיבול ולוחצים קלות שתידבק.","אופים 22–25 דקות עד שהבייגלים זהובים ויציבים.","מצננים לפחות 15 דקות לפני פריסה — הפנים מתייצב בזמן הצינון."],"nutrition":{"calories":302,"fatG":23.9,"satFatG":4.7,"proteinG":12.1,"carbsG":11.6,"fiberG":7.0,"netCarbsG":4.6,"sugarG":1.6,"sodiumMg":460},"tips":"Deliberately not a fathead dough — no cheese means these are truly pareve and taste like bread, not pizza. Sliced and toasted they hold up to any spread; freeze pre-sliced for easy weekday breakfasts.","tipsHe":"בכוונה לא בצק פאטהד — בלי גבינה הבייגלים באמת פרווה וטעמם של לחם, לא של פיצה. פרוסים וקלויים הם מחזיקים כל ממרח; אפשר להקפיא פרוסים לארוחות בוקר מהירות.","sources":[{"creator":"Low Carb with Jennifer (Jennifer Banz)","url":"https://jenniferbanz.com/keto-bagels-no-cheese"},{"creator":"Real Balanced","url":"https://realbalanced.com/recipe/nut-free-keto-bagels/"},{"creator":"The Conscious Plant Kitchen","url":"https://www.theconsciousplantkitchen.com/almond-flour-bagels/"}],"comparedVersions":"Compared Jennifer Banz\u0027s no-cheese bagels (uses Greek yogurt — swapped for thick coconut cream plus a splash of vinegar for the same tang, making it pareve), Real Balanced\u0027s dairy-free nut-free bagels, and The Conscious Plant Kitchen\u0027s dairy-free almond bagels. Fathead/mozzarella bagels were rejected outright. Banz\u0027s psyllium-bound formula was the simplest and chewiest, so it is the backbone here.","comparedVersionsHe":"הושוו הבייגלים ללא גבינה של Jennifer Banz (עם יוגורט יווני — הוחלף בקרם קוקוס סמיך ומעט חומץ לאותה חמצמצות, כך שהמתכון פרווה), הבייגלים ללא חלב של Real Balanced, ואלה של The Conscious Plant Kitchen. גרסאות פאטהד עם מוצרלה נפסלו מראש. הנוסחה של Banz עם פסיליום הייתה הפשוטה והלעיסה ביותר, והיא הבסיס כאן."},{"id":"crusty-keto-baguette-rolls","name":"Crusty Keto Baguette Rolls","nameHe":"לחמניות באגט פריכות","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":55,"difficulty":"medium","ingredients":[{"amount":"2 cups / 200 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"5 tbsp / 40 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"2 tsp","item":"baking powder"},{"amount":"¾ tsp","item":"fine salt"},{"amount":"3","item":"egg whites"},{"amount":"2 tsp","item":"apple cider vinegar"},{"amount":"1 cup / 240 ml","item":"boiling water"},{"amount":"1 tbsp","item":"sesame seeds (optional)"}],"ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים מולבן","israelNote":"קמח שקדים"},{"amount":"5 כפות / 40 גרם","item":"אבקת פסיליום","israelNote":"פסיליום (סופר-פארם/חנויות טבע)"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"¾ כפית","item":"מלח דק"},{"amount":"3","item":"חלבוני ביצה"},{"amount":"2 כפיות","item":"חומץ תפוחים"},{"amount":"1 כוס / 240 מ\"ל","item":"מים רותחים"},{"amount":"1 כף","item":"שומשום (לא חובה)"}],"instructions":["Heat the oven to 180°C and line a tray with parchment.","Whisk the almond flour, psyllium, baking powder, and salt.","Add the egg whites and vinegar, then pour in the boiling water while beating about 1 minute — a thick, elastic dough forms.","Rest 5 minutes; with wet hands shape 4 mini-baguettes about 15 cm long and place well apart.","Score 3 shallow diagonal slashes on each and sprinkle with sesame.","Bake 50–55 minutes until deep golden and hollow-sounding when tapped.","Cool completely on a rack — the crumb finishes setting as it cools."],"instructionsHe":["מחממים תנור ל-180 מעלות ומרפדים תבנית בנייר אפייה.","טורפים את קמח השקדים, הפסיליום, אבקת האפייה והמלח.","מוסיפים את החלבונים והחומץ, ואז מוזגים את המים הרותחים תוך כדי הקצפה כדקה — נוצר בצק סמיך וגמיש.","מניחים 5 דקות; בידיים רטובות מעצבים 4 מיני-באגטים באורך כ-15 ס\"מ ומניחים במרווחים.","חורצים 3 חריצים אלכסוניים רדודים בכל באגט ומפזרים שומשום.","אופים 50–55 דקות עד לצבע זהוב עמוק וצליל חלול בהקשה.","מצננים לגמרי על רשת — הפנים ממשיך להתייצב בזמן הצינון."],"nutrition":{"calories":368,"fatG":28.3,"satFatG":2.2,"proteinG":15.1,"carbsG":19.3,"fiberG":14.0,"netCarbsG":5.3,"sugarG":1.2,"sodiumMg":710},"tips":"Boiling water plus vinegar activates the psyllium — that is the whole secret to the airy crumb and crackly crust. Do not underbake; a soft middle means gummy bread. A purple-grey tint comes from some psyllium brands and is harmless.","tipsHe":"מים רותחים עם חומץ מפעילים את הפסיליום — זה כל הסוד של הפנים האוורירי והקראסט הפריך. לא לקצר את האפייה; אמצע רך יוצא דביק. גוון סגלגל-אפור נובע מסוגי פסיליום מסוימים ואינו מזיק.","lowCarbVariant":"For sandwich-size rolls, divide into 6 shorter rolls and bake 40–45 minutes.","lowCarbVariantHe":"ללחמניות סנדוויץ\u0027 מחלקים ל-6 לחמניות קצרות יותר ואופים 40–45 דקות.","sources":[{"creator":"Sweet As Honey (Carine Claudepierre)","url":"https://www.sweetashoney.co/keto-french-baguette-recipe/"},{"creator":"Cooking LSL","url":"https://cookinglsl.com/psyllium-husk-bread-rolls/"},{"creator":"Naturally Balanced Eats","url":"https://naturallybalancedeats.com/keto-almond-flour-baguette-thats-shockingly-crusty/"}],"comparedVersions":"Compared Sweet As Honey\u0027s keto French baguette, Cooking LSL\u0027s psyllium husk rolls, and Naturally Balanced Eats\u0027 crusty baguette — all already pareve. All three share the almond flour + psyllium + egg whites + boiling water formula; this version uses a mid-range psyllium dose for real chew without gumminess, and the long bake all three agree is non-negotiable for crust.","comparedVersionsHe":"הושוו הבאגט הצרפתי של Sweet As Honey, לחמניות הפסיליום של Cooking LSL והבאגט הפריך של Naturally Balanced Eats — כולם פרווה מלכתחילה. שלושתם חולקים את הנוסחה קמח שקדים + פסיליום + חלבונים + מים רותחים; הגרסה הזו עם כמות פסיליום בינונית ללעיסות אמיתית בלי דביקות, והאפייה הארוכה שכולם מסכימים שהיא הכרחית לקראסט."},{"id":"zaatar-manakish-flatbread","name":"Za\u0027atar Manakish Flatbread","nameHe":"מנקיש זעתר","category":"baking-savory","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":45,"cookTimeMin":15,"difficulty":"medium","ingredients":[{"amount":"1 cup / 100 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"¼ cup / 30 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"2 tbsp / 16 g","item":"psyllium husk powder","israelNote":"psyllium (SuperPharm/health stores)"},{"amount":"1 tsp","item":"instant dry yeast"},{"amount":"2 tsp","item":"baking powder"},{"amount":"½ tsp","item":"fine salt"},{"amount":"1 cup / 240 ml","item":"warm water (about 40°C)"},{"amount":"3 tbsp","item":"za\u0027atar","israelNote":"za\u0027atar blend"},{"amount":"3 tbsp / 45 ml","item":"olive oil"},{"amount":"1 tsp","item":"sesame seeds (optional)"}],"ingredientsHe":[{"amount":"1 כוס / 100 גרם","item":"קמח שקדים מולבן","israelNote":"קמח שקדים"},{"amount":"¼ כוס / 30 גרם","item":"קמח קוקוס","israelNote":"קמח קוקוס"},{"amount":"2 כפות / 16 גרם","item":"אבקת פסיליום","israelNote":"פסיליום (סופר-פארם/חנויות טבע)"},{"amount":"1 כפית","item":"שמרים יבשים"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"½ כפית","item":"מלח דק"},{"amount":"1 כוס / 240 מ\"ל","item":"מים פושרים (בערך 40 מעלות)"},{"amount":"3 כפות","item":"זעתר","israelNote":"תערובת זעתר"},{"amount":"3 כפות / 45 מ\"ל","item":"שמן זית"},{"amount":"1 כפית","item":"שומשום (לא חובה)"}],"instructions":["Stir the yeast into the warm water and let stand 10 minutes.","Whisk the almond flour, coconut flour, psyllium, baking powder, and salt.","Add the yeast water, mix to a soft dough, and rest 10 minutes.","Divide into 4 and press each on parchment into a 15 cm round with a slightly raised rim.","Cover and rise 20 minutes; meanwhile heat the oven to 200°C.","Mix the za\u0027atar with the olive oil, spread generously over each round, dimple with your fingertips, and scatter sesame on the rims.","Bake 12–15 minutes until the edges are golden.","Serve warm, straight off the tray."],"instructionsHe":["מערבבים את השמרים במים הפושרים ומניחים 10 דקות.","טורפים את קמח השקדים, קמח הקוקוס, הפסיליום, אבקת האפייה והמלח.","מוסיפים את מי השמרים, מערבבים לבצק רך ומניחים 10 דקות.","מחלקים ל-4 ומשטחים כל חלק על נייר אפייה לעיגול בקוטר 15 ס\"מ עם שוליים מעט מורמים.","מכסים ומתפיחים 20 דקות; בינתיים מחממים תנור ל-200 מעלות.","מערבבים את הזעתר עם שמן הזית, מורחים בנדיבות על כל עיגול, מבצעים גומות עם קצות האצבעות ומפזרים שומשום על השוליים.","אופים 12–15 דקות עד שהשוליים זהובים.","מגישים חם, ישר מהתבנית."],"nutrition":{"calories":319,"fatG":27.4,"satFatG":3.5,"proteinG":8.3,"carbsG":15.8,"fiberG":10.2,"netCarbsG":5.6,"sugarG":1.4,"sodiumMg":600},"tips":"The dimples hold little pools of za\u0027atar oil, just like at the bakery. Buy a za\u0027atar blend that lists hyssop first, not wheat — some cheap blends add roasted wheat as filler.","tipsHe":"הגומות אוצרות שלוליות קטנות של שמן זעתר, בדיוק כמו במאפייה. כדאי לקנות תערובת זעתר שבה אזוב (זעתר) הוא הרכיב הראשון ולא חיטה — תערובות זולות לפעמים ממולאות בחיטה קלויה.","sources":[{"creator":"Low Carb Hoser","url":"https://lowcarbhoser.com/keto-manakish/"},{"creator":"Carb Manager","url":"https://www.carbmanager.com/recipe-detail/ug:a85cad9162f64921b04281f8b174e079/low-carb-manakeesh"},{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-flatbread/"}],"comparedVersions":"Low Carb Hoser\u0027s keto manakish is built on mozzarella, sour cream, and egg (fathead-style) — completely rebuilt here on a pareve almond-coconut-psyllium dough, keeping their yeast step and their 1:1 za\u0027atar-to-olive-oil topping ratio (made more generous). Cross-checked against Carb Manager\u0027s low-carb manakeesh and Sugar Free Londoner\u0027s water-based flatbread for the dough hydration.","comparedVersionsHe":"המנקיש של Low Carb Hoser בנוי על מוצרלה, שמנת חמוצה וביצה (סגנון פאטהד) — כאן נבנה מחדש לגמרי על בצק פרווה של שקדים-קוקוס-פסיליום, תוך שמירה על שלב השמרים שלהם ועל יחס 1:1 של זעתר לשמן זית בציפוי (בנדיבות רבה יותר). הוצלב מול המנקיש של Carb Manager והבצק על בסיס מים של Sugar Free Londoner לכיול הנוזלים."},{"id":"hazelnut-cookies","nameHe":"עוגיות אגוזי לוז","ingredientsHe":[{"amount":"3/4 כוס / 85 גרם","item":"קמח אגוזי לוז (אגוזי לוז טחונים דק)","israelNote":"אפשר לטחון אגוזי לוז קלויים וקלופים במעבד מזון עד לטחינה דקה"},{"amount":"1/2 כוס / 50 גרם","item":"קמח שקדים"},{"amount":"1/3 כוס / 55 גרם","item":"ממתיק אריתריטול אבקה"},{"amount":"6 כפות / 85 גרם","item":"שמן קוקוס מזוכך, רך"},{"amount":"1/2 כפית","item":"תמצית וניל"},{"amount":"1/8 כפית","item":"מלח"},{"amount":"14","item":"אגוזי לוז קלויים שלמים, לקישוט (לא חובה)"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית אפייה בנייר אפייה.","שמים בקערה את קמח אגוזי הלוז, קמח השקדים, ממתיק האבקה, שמן הקוקוס, הווניל והמלח.","מערבבים, ואז לשים בידיים עד שהבצק חלק ובלי כיסים יבשים.","מגלגלים ל-14 כדורים בגודל אגוז מלך, מניחים על התבנית ומשטחים בעדינות באצבעות לחות.","לוחצים אגוז לוז שלם למרכז כל עוגייה.","אופים 8-10 דקות עד שהשוליים מזהיבים - משגיחים מקרוב, אגוזי לוז משחימים מהר.","מצננים לגמרי על התבנית לפני ההרמה; הן שבירות מאוד כשהן חמות ופריכות אחרי הצינון."],"ketoVariantHe":"מזלפים על העוגיות המצוננות שוקולד מריר 85% מומס (לבדוק סימון פרווה) לטעם בסגנון נוטלה, תוספת של כ-0.5 גרם פחמימות נטו.","lowCarbVariantHe":"גרסת חמאה (חלבית): מחליפים את שמן הקוקוס בחמאה מלוחה לעשירות הנמסה-בפה המקורית.","tipsHe":"להכנת קמח אגוזי לוז בבית: קולים אגוזי לוז שלמים 8 דקות ב-180 מעלות, משפשפים את הקליפות במגבת, מצננים וטוחנים בפולסים קצרים - עוצרים לפני שזה הופך לממרח.","comparedVersionsHe":"הושוו עוגיות החמאה מ-5 מרכיבים של Low-Carb So Simple, עוגיות ה\u0027ברוטי מה בוני\u0027 האיטלקיות על בסיס חלבונים של Low Carb Yum וגרסת 3 המרכיבים של LikeHotKeto. היחסים של Low-Carb So Simple ניצחו בזכות הנמסות הכי דמוית שורטברד ואפייה של 10 דקות בלי מיקסר; החמאה הוחלפה בשמן קוקוס מזוכך כדי שהעוגייה תישאר פרווה, וגרסת החמאה נשמרה כווריאציה חלבית.","name":"Hazelnut Cookies","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":14,"prepTimeMin":15,"cookTimeMin":10,"difficulty":"easy","ingredients":[{"amount":"3/4 cup / 85 g","item":"hazelnut flour (finely ground hazelnuts)","israelNote":"kemach egozei luz - or grind roasted peeled hazelnuts in a food processor until fine"},{"amount":"1/2 cup / 50 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/3 cup / 55 g","item":"powdered erythritol-monk fruit blend"},{"amount":"6 tbsp / 85 g","item":"refined coconut oil, softened"},{"amount":"1/2 tsp","item":"vanilla extract"},{"amount":"1/8 tsp","item":"salt"},{"amount":"14","item":"whole roasted hazelnuts, for topping (optional)"}],"instructions":["Heat the oven to 175°C / 350°F and line a baking sheet with parchment.","Put the hazelnut flour, almond flour, powdered sweetener, coconut oil, vanilla, and salt in a bowl.","Mix, then knead with your hands until the dough is smooth with no dry pockets.","Roll into 14 walnut-sized balls, place on the sheet, and flatten gently with damp fingertips.","Press a whole hazelnut into the center of each cookie.","Bake 8-10 minutes until the edges are golden - watch closely, hazelnut browns fast.","Cool completely on the tray before lifting; they are very fragile while warm and crisp once cool."],"nutrition":{"calories":118,"fatG":11.8,"satFatG":5.3,"proteinG":1.9,"carbsG":1.9,"fiberG":1.1,"netCarbsG":0.8,"sugarG":0.4,"sodiumMg":22},"ketoVariant":"Drizzle the cooled cookies with melted 85% dark chocolate (check pareve label) for a Nutella-like flavor at about 0.5 g net carbs more.","lowCarbVariant":"Butter version (dairy): swap the coconut oil for salted butter for the original melt-in-the-mouth richness.","tips":"To make hazelnut flour at home, roast whole hazelnuts 8 minutes at 180°C, rub off the skins in a towel, cool, and pulse briefly - stop before it turns to butter.","sources":[{"creator":"Low-Carb So Simple","url":"https://www.lowcarbsosimple.com/low-carb-hazelnut-butter-cookies/"},{"creator":"Low Carb Yum","url":"https://lowcarbyum.com/hazelnut-keto-cookies-gluten-free/"},{"creator":"LikeHotKeto","url":"https://likehotketo.com/keto-hazelnut-cookies"}],"comparedVersions":"Compared Low-Carb So Simple\u0027s 5-ingredient butter cookies, Low Carb Yum\u0027s Italian brutti ma buoni (egg-white based), and LikeHotKeto\u0027s 3-ingredient version. Low-Carb So Simple\u0027s ratios won for the most shortbread-like melt and a 10-minute bake with no mixer; the butter was swapped for refined coconut oil so the cookie stays pareve, with the butter version kept as a dairy variant."},{"id":"coconut-macaroons","nameHe":"עוגיות קוקוס","ingredientsHe":[{"amount":"2 כוסות / 160 גרם","item":"קוקוס טחון/מגורד לא ממותק","israelNote":"לבדוק שהקוקוס ללא תוספת סוכר"},{"amount":"3 גדולות","item":"חלבוני ביצה בטמפרטורת החדר"},{"amount":"1/3 כוס / 65 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO; להימנע מקסיליטול - הוא גורם להן להתפשט"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/8 כפית","item":"מלח"},{"amount":"40 גרם","item":"שוקולד מריר 85%, מומס, לטבילה (לא חובה)","israelNote":"לוודא סימון פרווה"}],"instructionsHe":["מחממים תנור ל-160 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מקציפים את החלבונים עם המלח לקצף יציב.","מקציפים פנימה את הממתיק כף אחר כף, ואז את הווניל.","מקפלים פנימה בעדינות את הקוקוס עד לציפוי אחיד.","יוצרים 16 תלוליות קטנות על התבנית בעזרת שתי כפות או כף גלידה קטנה, במרווח של 2-3 ס״מ.","אופים 15-18 דקות, עד שהקצוות והשוליים מזהיבים.","מצננים לגמרי על התבנית, ואם רוצים טובלים את התחתיות בשוקולד מריר מומס ומקררים עד להתייצבות."],"ketoVariantHe":"לצלחת כשרה לפסח: העוגיות מתאימות באופן טבעי לפסח (ללא קמח בכלל) - רק לוודא שלממתיק יש הכשר לפסח.","tipsHe":"הקצפת החלבונים תחילה (במקום סתם לערבב הכול) היא מה ששומר על עוגיות קוקוס ללא סוכר אווריריות במקום דחוסות ורטובות.","comparedVersionsHe":"הושוו שיטת החלבונים המוקצפים של Sugar Free Londoner, גרסת האלמונד-ג\u0027וי העשירה עם שמנת של All Day I Dream About Food ו-Sweet As Honey. הגרסה הפשוטה עם החלבונים המוקצפים ניצחה: 5 מרכיבים, פרווה, והמרקם הקליל ביותר; השמנת והקסנטן של ADIDAF מוסיפים חלביות ומורכבות בלי יתרון ברור.","name":"Coconut Macaroons","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":16,"prepTimeMin":10,"cookTimeMin":18,"difficulty":"easy","ingredients":[{"amount":"2 cups / 160 g","item":"unsweetened shredded coconut","israelNote":"kokos tachun/megorad lo mamutak - check it is unsweetened"},{"amount":"3 large","item":"egg whites, room temperature"},{"amount":"1/3 cup / 65 g","item":"granulated erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products; avoid xylitol - it makes them spread"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/8 tsp","item":"salt"},{"amount":"40 g","item":"dark chocolate 85%, melted, for dipping (optional)","israelNote":"check pareve label"}],"instructions":["Heat the oven to 160C (325F) and line a baking sheet with parchment.","Beat the egg whites with the salt until stiff peaks form.","Beat in the sweetener a spoonful at a time, then the vanilla.","Gently fold in the shredded coconut until evenly coated.","Scoop 16 small mounds onto the sheet using two spoons or a small cookie scoop, spacing them 2-3 cm apart.","Bake 15-18 minutes, until the tips and edges are golden.","Cool fully on the sheet, then dip the bottoms in melted dark chocolate if you like and chill until set."],"nutrition":{"calories":75,"fatG":6.7,"satFatG":5.8,"proteinG":1.5,"carbsG":2.8,"fiberG":1.7,"netCarbsG":1.1,"sugarG":0.7,"sodiumMg":35},"ketoVariant":"For a Pesach-friendly plate, these are naturally kosher-for-Passover style (no flour at all) - just verify the sweetener\u0027s Passover certification.","tips":"Whipping the whites first (rather than just stirring everything) is what keeps sugar-free macaroons light instead of dense and wet.","sources":[{"creator":"Sugar Free Londoner (Katrin Nürnberger)","url":"https://sugarfreelondoner.com/keto-macaroons-sugar-free/"},{"creator":"All Day I Dream About Food (Carolyn Ketchum)","url":"https://alldayidreamaboutfood.com/keto-coconut-macaroons/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/keto-coconut-macaroons/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s whipped-egg-white method, All Day I Dream About Food\u0027s richer cream-based Almond-Joy version, and Sweet As Honey. The simple whipped-white version won: 5 ingredients, pareve, and the lightest texture; ADIDAF\u0027s cream and xanthan add dairy and complexity without a clear payoff."},{"id":"israeli-tahini-cookies","nameHe":"עוגיות טחינה","ingredientsHe":[{"amount":"1/2 כוס / 120 גרם","item":"טחינה גולמית נוזלית, מעורבבת היטב","israelNote":"טחינה גולמית איכותית, למשל הר ברכה או אחוה"},{"amount":"1/4 כוס / 50 גרם","item":"ממתיק אריתריטול מגורען","israelNote":"למשל סוכרזית זירו או לקנטו מ-iHerb"},{"amount":"2 כפות / 16 גרם","item":"פשתן טחון","israelNote":"נמכר במדפי הבריאות בסופרים"},{"amount":"2 כפות / 16 גרם","item":"קמח קוקוס"},{"amount":"1","item":"ביצה גדולה בטמפרטורת החדר"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/2 כפית","item":"אבקת אפייה"},{"amount":"1 כף","item":"שומשום, לפיזור מעל (לא חובה)"},{"amount":"קורט","item":"מלח ים בפתיתים (לא חובה)"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית אפייה בנייר אפייה.","מערבבים היטב את הטחינה בצנצנת עד לקבלת מרקם נוזלי וחלק, ואז מודדים ממנה לקערת ערבוב.","מוסיפים את הממתיק, הפשתן, קמח הקוקוס, הביצה, הווניל ואבקת האפייה. מערבבים במזלג עד שנוצר בצק רך וחלק.","מגלגלים ל-16 כדורים קטנים (כ-19 גרם כל אחד) ומניחים על התבנית במרווחים.","משטחים כל כדור לעיגול בקוטר 5 ס״מ בכף היד או במזלג; מפזרים שומשום ומעט מלח בפתיתים.","אופים 12-15 דקות עד שהשוליים מזהיבים.","מצננים לגמרי על התבנית - העוגיות מתייצבות ונעשות פריכות רק אחרי צינון מלא."],"lowCarbVariantHe":"מקפלים פנימה 2 כפות שוקולד צ\u0027יפס ללא סוכר או שוקולד מריר 85% קצוץ (לבדוק סימון פרווה) לגרסת טחינה-שוקולד, תוספת של כ-0.3 גרם פחמימות נטו לעוגייה.","tipsHe":"הבצק עובד רק עם טחינה נוזלית - אם הטחינה שלכם סמיכה ויבשה מתחתית הצנצנת, מחממים אותה מעט ומערבבים לפני המדידה.","comparedVersionsHe":"הושוותה גרסת הקערה האחת עם פשתן וקמח קוקוס של Sugar Free Londoner מול גרסאות קמח שקדים וחמאה של Life Made Sweeter ו-Stem and Spoon. היחס של Sugar Free Londoner ניצח בזכות היותו פרווה וללא אגוזים באופן טבעי, קערה אחת, רק 1.3 גרם פחמימות נטו והמרקם הפריך ביותר; פיזור השומשום נוסף למראה הישראלי הקלאסי.","name":"Israeli Tahini Cookies","category":"baking-sweet","kosherType":"pareve","dietTags":"keto","servings":16,"prepTimeMin":10,"cookTimeMin":14,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 120 g","item":"runny tahini, well stirred","israelNote":"raw tahini (Har Bracha or Achva)"},{"amount":"1/4 cup / 50 g","item":"granulated erythritol-monk fruit blend","israelNote":"Sucrazit Zero or iHerb Lakanto"},{"amount":"2 tbsp / 16 g","item":"ground flaxseed","israelNote":"pishtan tachun, sold in health sections"},{"amount":"2 tbsp / 16 g","item":"coconut flour","israelNote":"kemach kokos"},{"amount":"1","item":"large egg, room temperature"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/2 tsp","item":"baking powder"},{"amount":"1 tbsp","item":"sesame seeds, for topping (optional)"},{"amount":"pinch","item":"flaked sea salt (optional)"}],"instructions":["Heat the oven to 175°C / 350°F and line a baking sheet with parchment.","Stir the tahini well in its jar so you get a runny, oily-smooth spoonful, then measure it into a mixing bowl.","Add the sweetener, flaxseed, coconut flour, egg, vanilla, and baking powder. Mix with a fork until a soft, smooth dough forms.","Roll into 16 small balls (about 19 g each) and place on the sheet with space between them.","Flatten each ball into a 5 cm round with your palm or a fork; sprinkle with sesame seeds and a little flaked salt.","Bake 12-15 minutes until the edges turn golden.","Cool completely on the tray - they firm up and turn crisp only once fully cool."],"nutrition":{"calories":62,"fatG":5.2,"satFatG":0.7,"proteinG":2.2,"carbsG":2.8,"fiberG":1.5,"netCarbsG":1.3,"sugarG":0.1,"sodiumMg":28},"lowCarbVariant":"Fold in 2 tbsp sugar-free or 85% dark chocolate chips (check pareve label) for a tahini-chocolate version, about 0.3 g net carbs more per cookie.","tips":"The dough works only with runny tahini - if yours is thick and dry from the bottom of the jar, warm it slightly and stir before measuring.","sources":[{"creator":"Sugar Free Londoner","url":"https://sugarfreelondoner.com/keto-tahini-cookies/"},{"creator":"Life Made Sweeter","url":"https://lifemadesweeter.com/tahini-cookies/"},{"creator":"Stem and Spoon","url":"https://stemandspoon.com/coconut-chocolate-chip-tahini-cookies-keto-low-carb-gf/"}],"comparedVersions":"Compared Sugar Free Londoner\u0027s one-bowl flax-coconut flour version against almond-flour-plus-butter versions from Life Made Sweeter and Stem and Spoon. The Sugar Free Londoner ratio won for being naturally pareve and nut-free, one bowl, only 1.3 g net carbs, and the crispest texture; sesame topping added for the classic Israeli look."},{"id":"snickerdoodle-cookies","nameHe":"עוגיות סניקרדודל","ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים"},{"amount":"2 כפות / 16 גרם","item":"קמח קוקוס"},{"amount":"1/2 כוס / 113 גרם","item":"חמאה רכה"},{"amount":"1/3 כוס / 65 גרם","item":"ממתיק אריתריטול מגורען"},{"amount":"1","item":"ביצה גדולה בטמפרטורת החדר"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1 כפית","item":"קרם טרטר","israelNote":"נמכר כ\u0027קרם אוף טרטר\u0027 בחנויות אפייה; כפית מיץ לימון היא תחליף סביר"},{"amount":"1/2 כפית","item":"סודה לשתייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"2 כפות + 2 כפיות","item":"ממתיק מגורען + קינמון, לציפוי"}],"instructionsHe":["מחממים תנור ל-170 מעלות ומרפדים שתי תבניות אפייה בנייר אפייה.","מקציפים את החמאה הרכה עם הממתיק 2-3 דקות עד לקבלת תערובת בהירה ואוורירית, ואז מקציפים פנימה את הביצה והווניל.","מוסיפים את קמח השקדים, קמח הקוקוס, קרם הטרטר, הסודה לשתייה והמלח ומערבבים עד שנוצר בצק רך.","מערבבים בקערית את ממתיק הציפוי עם הקינמון.","מגלגלים את הבצק ל-20 כדורים (כ-2.5 ס״מ) ומגלגלים כל אחד בנדיבות בתערובת הקינמון.","מניחים על התבניות ומשטחים לעובי של כ-1.5 ס״מ, במרווח של 5 ס״מ בין העוגיות.","אופים 10-12 דקות עד להזהבה קלה בשוליים - הן ייראו לא אפויות במרכז.","מצננים על התבנית 10 דקות; הן מתייצבות תוך כדי הצינון."],"ketoVariantHe":"החלפה לפרווה: שמן קוקוס מזוכך (מוצק, לא מומס) במקום החמאה - המרקם מעט פירורי יותר אבל הטעם נשמר.","tipsHe":"קרם הטרטר הוא מה שנותן את החמיצות האופיינית - לא מדלגים עליו. מגלגלים את הכדורים בציפוי הקינמון פעמיים לקראסט עבה יותר.","comparedVersionsHe":"הושוו All Day I Dream About Food (מוסיפה אבקת קולגן), Gnom-Gnom (מוסיפה קסנטן גאם) ו-Low Carb Maven. סונתזה דרך האמצע: גוף קמח השקדים והקוקוס הפשוט של ADIDAF בלי הקולגן המיוחד, טכניקת הקצפת החמאה וכמות קרם הטרטר של Gnom-Gnom, ואפייה מתונה ב-170 מעלות בין שני הקצוות שלהם. פחות מ-2 גרם פחמימות נטו עם רשימת מזווה של 10 מרכיבים.","name":"Snickerdoodle Cookies","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":20,"prepTimeMin":15,"cookTimeMin":12,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"2 tbsp / 16 g","item":"coconut flour"},{"amount":"1/2 cup / 113 g","item":"butter, softened"},{"amount":"1/3 cup / 65 g","item":"granulated erythritol-monk fruit blend"},{"amount":"1","item":"large egg, room temperature"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1 tsp","item":"cream of tartar","israelNote":"sold as \u0027cream of tartar\u0027 in baking shops; 1 tsp lemon juice is a workable substitute"},{"amount":"1/2 tsp","item":"baking soda"},{"amount":"1/4 tsp","item":"salt"},{"amount":"2 tbsp + 2 tsp","item":"granulated sweetener + cinnamon, for coating"}],"instructions":["Heat the oven to 170°C / 340°F and line two baking sheets with parchment.","Beat the softened butter with the sweetener for 2-3 minutes until light and fluffy, then beat in the egg and vanilla.","Mix in the almond flour, coconut flour, cream of tartar, baking soda, and salt until a soft dough forms.","Stir the coating sweetener and cinnamon together in a small bowl.","Roll the dough into 20 balls (about 2.5 cm) and roll each generously in the cinnamon mixture.","Place on the sheets and flatten to about 1.5 cm thick, leaving 5 cm between cookies.","Bake 10-12 minutes until just golden at the edges - they will look underdone in the center.","Cool on the tray 10 minutes; they firm up as they cool."],"nutrition":{"calories":108,"fatG":10.1,"satFatG":3.5,"proteinG":2.9,"carbsG":3.0,"fiberG":1.4,"netCarbsG":1.6,"sugarG":0.4,"sodiumMg":78},"ketoVariant":"Pareve swap: use refined coconut oil (solid, not melted) instead of butter - texture is slightly more crumbly but flavor holds.","tips":"Cream of tartar is what gives the trademark tang - don\u0027t skip it. Roll the balls in the cinnamon coating twice for a thicker crust.","sources":[{"creator":"All Day I Dream About Food","url":"https://alldayidreamaboutfood.com/perfect-keto-snickerdoodles/"},{"creator":"Gnom-Gnom","url":"https://www.gnom-gnom.com/keto-snickerdoodle-cookies/"},{"creator":"Low Carb Maven","url":"https://www.lowcarbmaven.com/keto-snickerdoodle-cookies/"}],"comparedVersions":"Compared All Day I Dream About Food (adds collagen powder), Gnom-Gnom (adds xanthan gum), and Low Carb Maven. Synthesized the middle path: ADIDAF\u0027s simple almond+coconut flour body without the specialty collagen, Gnom-Gnom\u0027s well-creamed butter technique and cream of tartar amount, and a moderate 170°C bake between their two extremes. Under 2 g net carbs with a 10-ingredient pantry list."},{"id":"fudgy-keto-brownies","nameHe":"בראוניז פאדג\u0027יים קיטו","ingredientsHe":[{"amount":"1/2 כוס / 115 גרם","item":"חמאה"},{"amount":"115 גרם","item":"שוקולד אפייה ללא סוכר (100% קקאו), קצוץ","israelNote":"אם אין 100%, משתמשים בשוקולד מריר 85% ומפחיתים שליש מהממתיק (לבדוק סימון פרווה)"},{"amount":"2/3 כוס / 80 גרם","item":"ממתיק אריתריטול אבקה","israelNote":"תערובות אריתריטול/סטיביה נמכרות בסופרים ובחנויות טבע, למשל סוכרזית סטיביה או מוצרי BIO; טוחנים ממתיק מגורען במטחנת תבלינים"},{"amount":"2 גדולות","item":"ביצים בטמפרטורת החדר"},{"amount":"3/4 כוס / 75 גרם","item":"קמח שקדים טחון דק"},{"amount":"2 כפות / 11 גרם","item":"אבקת קקאו ללא סוכר"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/4 כפית","item":"מלח"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית 20x20 ס״מ בנייר אפייה.","ממיסים יחד את החמאה והשוקולד בפולסים קצרים במיקרוגל (או על בן מארי), תוך ערבוב עד לקבלת תערובת חלקה. מצננים 5 דקות.","טורפים את ממתיק האבקה לתוך השוקולד, ואז טורפים פנימה את הביצים והווניל.","מוסיפים את קמח השקדים, הקקאו והמלח ומערבבים רק עד לאיחוד.","משטחים את הבלילה הסמיכה בתבנית בשכבה אחידה.","אופים 14-18 דקות - קיסם צריך לצאת עם פירורים לחים, לא נקי. אפייה ארוכה מדי הורסת את הפאדג\u0027יות.","מצננים לגמרי לפני חיתוך ל-16 ריבועים."],"lowCarbVariantHe":"החלפה לפרווה: שמן קוקוס מזוכך במקום החמאה ושוקולד עם הכשר פרווה - עדיין דחוס ופאדג\u0027י.","tipsHe":"ביצים בטמפרטורת החדר מונעות מהשוקולד המומס להתגבש. 1/2 כפית אספרסו נמס (לא חובה) מעמיקה את טעם השוקולד.","comparedVersionsHe":"הושוו Wholesome Yum‏, Low Carb Spark ו-All Day I Dream About Food. הבסיס של Wholesome Yum עם שוקולד אפייה מומס ניצח: שוקולד אמיתי (ולא רק קקאו) נותן את המרקם הכי פאדג\u0027י עם 8 מרכיבים בלבד, לעומת שלב הג\u0027לטין הנוסף של ADIDAF ובלילות קקאו בלבד שנאפות עוגתיות יותר.","name":"Fudgy Keto Brownies","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":16,"prepTimeMin":10,"cookTimeMin":16,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 115 g","item":"butter"},{"amount":"115 g","item":"unsweetened baking chocolate (100% cacao), chopped","israelNote":"shokolad meridim 100%; if unavailable use 85% dark and cut the sweetener by a third (check pareve label)"},{"amount":"2/3 cup / 80 g","item":"powdered erythritol/monk-fruit blend","israelNote":"erythritol/stevia blends sold in Israeli supermarkets and health stores, e.g. Sukrazit Stevia, BIO products; grind granulated in a spice grinder"},{"amount":"2 large","item":"eggs, room temperature"},{"amount":"3/4 cup / 75 g","item":"blanched almond flour","israelNote":"kemach shkedim"},{"amount":"2 tbsp / 11 g","item":"unsweetened cocoa powder"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/4 tsp","item":"salt"}],"instructions":["Heat the oven to 175C (350F) and line a 20x20 cm (8x8 inch) pan with parchment.","Melt the butter and chocolate together in short microwave bursts (or over a water bath), stirring until smooth. Cool 5 minutes.","Whisk the powdered sweetener into the chocolate, then whisk in the eggs and vanilla.","Stir in the almond flour, cocoa, and salt until just combined.","Spread the thick batter evenly in the pan.","Bake 14-18 minutes - a toothpick should come out with moist crumbs, not clean. Overbaking kills the fudge factor.","Cool completely before cutting into 16 squares."],"nutrition":{"calories":127,"fatG":12.7,"satFatG":6.5,"proteinG":3.0,"carbsG":3.7,"fiberG":2.0,"netCarbsG":1.7,"sugarG":0.3,"sodiumMg":55},"lowCarbVariant":"Pareve swap: use refined coconut oil instead of butter and confirm the chocolate carries a pareve hechsher - still dense and fudgy.","tips":"Room-temperature eggs keep the melted chocolate from seizing. An optional 1/2 tsp instant espresso deepens the chocolate flavor.","sources":[{"creator":"Wholesome Yum (Maya Krampf)","url":"https://www.wholesomeyum.com/best-fudgy-keto-brownies-recipe/"},{"creator":"Low Carb Spark","url":"https://www.lowcarbspark.com/keto-brownies/"},{"creator":"All Day I Dream About Food (Carolyn Ketchum)","url":"https://alldayidreamaboutfood.com/fudgy-keto-brownies/"}],"comparedVersions":"Compared Wholesome Yum, Low Carb Spark, and All Day I Dream About Food. Wholesome Yum\u0027s melted-baking-chocolate base won: real chocolate (not just cocoa) gives the fudgiest texture with only 8 ingredients, versus ADIDAF\u0027s extra gelatin step and cocoa-only batters that bake up more cakey."},{"id":"butter-shortbread-cookies","nameHe":"עוגיות חמאה פריכות","ingredientsHe":[{"amount":"2 כוסות / 200 גרם","item":"קמח שקדים טחון דק","israelNote":"להשתמש בטחינה הדקה ביותר שמוצאים"},{"amount":"6 כפות / 85 גרם","item":"חמאה מומסת"},{"amount":"1/4 כוס / 40 גרם","item":"ממתיק אריתריטול אבקה","israelNote":"טוחנים ממתיק מגורען במטחנת תבלינים לאבקה"},{"amount":"1 כפית","item":"תמצית וניל"},{"amount":"1/8 כפית","item":"מלח"}],"instructionsHe":["מחממים תנור ל-160 מעלות ומרפדים תבנית אפייה בנייר אפייה.","טורפים את החמאה המומסת עם ממתיק האבקה, הווניל והמלח.","מוסיפים את קמח השקדים, מערבבים ואז לשים קצרות בידיים עד שנוצר בצק חלק.","מחלקים ל-12 חלקים, מגלגלים לכדורים ומשטחים על התבנית לעיגולים בקוטר 5 ס״מ ובעובי כ-6 מ״מ.","דוקרים כל עוגייה כמה פעמים במזלג למראה השורטברד הקלאסי.","אופים 12-15 דקות עד שהשוליים מזהיבים ועולה ריח נהדר.","מצננים לגמרי על התבנית - הן שבירות כשהן חמות ונשברות בפריכות אחרי הצינון."],"ketoVariantHe":"טובלים חצי מכל עוגייה מצוננת בשוקולד מריר 85% מומס - תוספת של כ-1 גרם פחמימות נטו.","lowCarbVariantHe":"החלפה לפרווה: שמן קוקוס מזוכך במקום החמאה; מוסיפים עוד 1/4 כפית וניל לפיצוי על טעם החמאה.","tipsHe":"מכיוון שהעוגיות כמעט כולן חמאה ושקדים, שומרים אותן במקרר - הן נשמרות שבועיים וטעימות הכי הרבה צוננות או בטמפרטורת חדר קרירה.","comparedVersionsHe":"הושוו שיטת 5 המרכיבים עם החמאה המומסת של Healthy Recipes Blog‏, Cast Iron Keto והגרסה של The Big Man\u0027s World. היחס של Healthy Recipes Blog ‏(200 גרם קמח שקדים : 85 גרם חמאה) ניצח - בלי קירור, בלי מערוך, 5 מרכיבים - עם אריתריטול אבקה במקום סטיביה גליצריט שקשה להשיג בישראל.","name":"Butter Shortbread Cookies","category":"baking-sweet","kosherType":"dairy","dietTags":"keto","servings":12,"prepTimeMin":10,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"2 cups / 200 g","item":"fine blanched almond flour","israelNote":"kemach shkedim - use the finest grind you can find"},{"amount":"6 tbsp / 85 g","item":"butter, melted"},{"amount":"1/4 cup / 40 g","item":"powdered erythritol-monk fruit blend","israelNote":"blitz granulated sweetener in a spice grinder to powder it"},{"amount":"1 tsp","item":"vanilla extract"},{"amount":"1/8 tsp","item":"salt"}],"instructions":["Heat the oven to 160°C / 325°F and line a baking sheet with parchment.","Whisk the melted butter with the powdered sweetener, vanilla, and salt.","Add the almond flour and mix, then knead briefly with your hands until a smooth dough forms.","Divide into 12 pieces, roll into balls, and flatten on the sheet into 5 cm rounds about 6 mm thick.","Prick each cookie a few times with a fork for the classic shortbread look.","Bake 12-15 minutes until golden at the edges and fragrant.","Cool on the tray completely - they are fragile hot and snap crisp once cool."],"nutrition":{"calories":149,"fatG":14.2,"satFatG":3.8,"proteinG":4.0,"carbsG":4.0,"fiberG":2.0,"netCarbsG":2.0,"sugarG":0.7,"sodiumMg":38},"ketoVariant":"Dip half of each cooled cookie in melted 85% dark chocolate for about 1 g net carbs more.","lowCarbVariant":"Pareve swap: refined coconut oil replaces butter; add an extra 1/4 tsp vanilla to compensate for the lost butter flavor.","tips":"Because these are nearly all butter and almonds, store them in the fridge - they keep 2 weeks and taste best chilled or at cool room temperature.","sources":[{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/almond-flour-shortbread-cookies/"},{"creator":"Cast Iron Keto","url":"https://www.castironketo.net/blog/almond-flour-shortbread-cookies/"},{"creator":"The Big Man\u0027s World","url":"https://thebigmansworld.com/keto-shortbread-cookies/"}],"comparedVersions":"Compared Healthy Recipes Blog\u0027s 5-ingredient melted-butter method, Cast Iron Keto, and The Big Man\u0027s World\u0027s version. The Healthy Recipes Blog ratio (200 g almond flour : 85 g butter) won - no chilling, no rolling pin, 5 ingredients - with powdered erythritol swapped in for her stevia glycerite, which is hard to find in Israel."},{"id":"lemon-poppy-seed-muffins","nameHe":"מאפינס לימון ופרג","ingredientsHe":[{"amount":"1 1/4 כוסות / 125 גרם","item":"קמח שקדים טחון דק"},{"amount":"3 כפות / 21 גרם","item":"קמח קוקוס"},{"amount":"2 כפיות","item":"אבקת אפייה"},{"amount":"1/4 כפית","item":"מלח"},{"amount":"2 כפות","item":"פרג","israelNote":"נמכר במדף התבלינים בכל סופר בישראל"},{"amount":"1/2 כוס / 100 גרם","item":"ממתיק אריתריטול מגורען","isr
