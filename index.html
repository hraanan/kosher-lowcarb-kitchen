com/30-minute-baked-lentil-falafel/"},{"creator":"Vegan Richa","url":"https://www.veganricha.com/lentil-split-pea-falafel-bowl-with/"}],"comparedVersions":"Compared Slender Kitchen, Darn Good Veggies and Vegan Richa: all bake instead of fry and process cooked lentils with fresh herbs; this version stretches the lentils with cauliflower rice and coconut flour to cut carbs per ball by roughly a third.","comparedVersionsHe":"הושוו Slender Kitchen, Darn Good Veggies ו־Vegan Richa: כולם אופים במקום לטגן ומעבדים עדשים מבושלות עם עשבי תיבול טריים; הגרסה הזו ממתחת את העדשים עם אורז כרובית וקמח קוקוס וחותכת כשליש מהפחמימות בכל כדור."},{"id":"quinoa-stuffed-peppers-tomato-herb","name":"Tomato-Herb Quinoa Stuffed Peppers","nameHe":"פלפלים ממולאים בקינואה, עגבניות ועשבי תיבול","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":20,"cookTimeMin":45,"difficulty":"medium","ingredients":[{"amount":"4 large","item":"bell peppers, tops cut off and seeded"},{"amount":"1/3 cup / 60 g","item":"dry quinoa, rinsed (15 g per serving)","israelNote":"קינואה"},{"amount":"1 tbsp","item":"olive oil"},{"amount":"1 small","item":"onion, finely chopped"},{"amount":"2 cloves","item":"garlic, minced"},{"amount":"200 g","item":"mushrooms or zucchini, finely chopped"},{"amount":"200 g","item":"crushed tomatoes","israelNote":"עגבניות מרוסקות (חצי קופסה)"},{"amount":"1 tsp each","item":"dried oregano and dried basil"},{"amount":"to taste","item":"salt, black pepper, chopped fresh parsley"}],"ingredientsHe":["4 פלפלים גדולים, חתוכים בחלקם העליון ומנוקים מגרעינים","שליש כוס / 60 גרם קינואה שטופה (15 גרם למנה)","כף שמן זית","בצל קטן קצוץ דק","2 שיני שום כתושות","200 גרם פטריות או קישואים קצוצים דק","200 גרם עגבניות מרוסקות (חצי קופסה)","כפית אורגנו יבש וכפית בזיליקום יבש","מלח, פלפל שחור ופטרוזיליה טרייה קצוצה - לפי הטעם"],"instructions":["Cook the quinoa in 2/3 cup lightly salted water: bring to a boil, cover, simmer 13 minutes, then rest 5 minutes and fluff.","Preheat the oven to 190C / 375F. Stand the peppers in a snug baking dish (trim bases flat if needed).","Heat the oil in a pan and saute the onion 4 minutes. Add the garlic and mushrooms or zucchini and cook 5 minutes until the moisture evaporates.","Stir in the crushed tomatoes, oregano, basil, salt and pepper; simmer 3 minutes. Fold in the cooked quinoa and parsley.","Fill the peppers with the quinoa mixture. Pour 1/2 cup water into the dish, cover with foil and bake 30 minutes.","Uncover and bake 10 more minutes until the peppers are tender and lightly charred at the edges. Serve warm."],"instructionsHe":["בשלו את הקינואה בשני שליש כוס מים עם מעט מלח: הביאו לרתיחה, כסו, בשלו 13 דקות על אש נמוכה, השאירו 5 דקות מכוסה ואווררו במזלג.","חממו תנור ל־190 מעלות. העמידו את הפלפלים בתבנית צפופה (חתכו מעט את הבסיס אם צריך לייצוב).","חממו את השמן במחבת וטגנו את הבצל 4 דקות. הוסיפו את השום והפטריות או הקישואים ובשלו 5 דקות עד שהנוזלים מתאדים.","הוסיפו את העגבניות המרוסקות, האורגנו, הבזיליקום, מלח ופלפל; בשלו 3 דקות. הוסיפו את הקינואה המבושלת והפטרוזיליה וערבבו.","מלאו את הפלפלים בתערובת הקינואה. מזגו חצי כוס מים לתבנית, כסו בנייר אלומיניום ואפו 30 דקות.","הסירו את הכיסוי ואפו 10 דקות נוספות עד שהפלפלים רכים ומעט חרוכים בקצוות. הגישו חם."],"nutrition":{"calories":190,"fatG":7,"satFatG":1,"proteinG":6,"carbsG":23,"fiberG":6,"netCarbsG":17,"sugarG":9,"sodiumMg":420},"ketoVariant":"Replace the quinoa entirely with 200 g cauliflower rice sauteed with the vegetables - about 10 g net carbs per pepper.","ketoVariantHe":"החליפו את הקינואה כולה ב־200 גרם אורז כרובית מוקפץ עם הירקות - כ־10 גרם פחמימות נטו לפלפל.","tips":"Most stuffed-pepper recipes use a full cup of dry quinoa plus beans and corn; here mushrooms carry the bulk so each pepper holds only 15 g dry quinoa. A crumble of feta on top is a nice optional dairy garnish.","tipsHe":"רוב מתכוני הפלפלים הממולאים משתמשים בכוס שלמה של קינואה יבשה בתוספת שעועית ותירס; כאן הפטריות נותנות את הנפח וכל פלפל מכיל רק 15 גרם קינואה יבשה. פירורי גבינה בולגרית מעל הם תוספת חלבית אופציונלית נחמדה.","sources":[{"creator":"Choosing Chia","url":"https://choosingchia.com/quinoa-stuffed-peppers/"},{"creator":"FeelGoodFoodie","url":"https://feelgoodfoodie.net/recipe/vegetarian-quinoa-stuffed-peppers/"},{"creator":"Well Plated","url":"https://www.wellplated.com/vegan-stuffed-peppers/"}],"comparedVersions":"Compared Choosing Chia, FeelGoodFoodie and Well Plated: dropped their beans, corn and cheese topping, kept the tomato-herb filling and covered-then-uncovered bake, and shrank the quinoa to a strict 15 g dry per pepper.","comparedVersionsHe":"הושוו Choosing Chia,‏ FeelGoodFoodie ו־Well Plated: הושמטו השעועית, התירס וציפוי הגבינה, נשמרו מלית העגבניות-עשבים והאפייה מכוסה ואז מגולה, והקינואה צומצמה ל־15 גרם יבשה לפלפל בדיוק."},{"id":"chickpea-spinach-stew-paprika","name":"Chickpea and Spinach Stew with Paprika and Garlic","nameHe":"תבשיל גרגירי חומוס ותרד עם פפריקה ושום","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":10,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"2 tbsp","item":"olive oil"},{"amount":"1 medium","item":"onion, chopped"},{"amount":"4 cloves","item":"garlic, sliced"},{"amount":"1 1/2 tsp","item":"smoked paprika (plus a pinch of hot paprika if you like)"},{"amount":"1 tsp","item":"ground cumin"},{"amount":"1 1/2 cups / 240 g","item":"canned chickpeas, drained and rinsed (60 g per serving - about half a large can)","israelNote":"גרגירי חומוס (שימורים)"},{"amount":"2 ripe","item":"tomatoes, grated, plus 1 tbsp tomato paste"},{"amount":"300 g","item":"fresh spinach, roughly chopped","israelNote":"תרד טרי - גם קפוא ומסונן עובד"},{"amount":"1 cup","item":"water"},{"amount":"to taste","item":"salt, black pepper, 1 tsp wine vinegar"}],"ingredientsHe":["2 כפות שמן זית","בצל בינוני קצוץ","4 שיני שום פרוסות","כפית וחצי פפריקה מעושנת (ועוד קורט פפריקה חריפה למי שאוהב)","כפית כמון טחון","כוס וחצי / 240 גרם גרגירי חומוס משימורים, מסוננים ושטופים (60 גרם למנה - כחצי קופסה גדולה)","2 עגבניות בשלות מגוררות + כף רסק עגבניות","300 גרם תרד טרי קצוץ גס - גם קפוא ומסונן עובד","כוס מים","מלח, פלפל שחור וכפית חומץ יין - לפי הטעם"],"instructions":["Heat the olive oil in a wide pot over medium heat and cook the onion 5-6 minutes until soft and golden.","Add the garlic and cook 1 minute, then stir in the smoked paprika, cumin and tomato paste and fry 30 seconds - do not let the paprika burn.","Add the grated tomatoes and simmer 3-4 minutes until slightly thickened.","Add the chickpeas and water, season with salt and pepper, and simmer uncovered 10 minutes. Lightly mash a few chickpeas against the pot to thicken the sauce.","Pile in the spinach in batches, stirring until wilted, and cook 3-4 more minutes.","Finish with the vinegar, taste for seasoning, and serve hot."],"instructionsHe":["חממו את שמן הזית בסיר רחב על אש בינונית ובשלו את הבצל 5-6 דקות עד שהוא רך וזהוב.","הוסיפו את השום ובשלו דקה, ואז הוסיפו את הפפריקה המעושנת, הכמון ורסק העגבניות וטגנו 30 שניות - אל תיתנו לפפריקה להישרף.","הוסיפו את העגבניות המגוררות ובשלו 3-4 דקות עד להסמכה קלה.","הוסיפו את גרגירי החומוס והמים, תבלו במלח ופלפל ובשלו ללא מכסה 10 דקות. מעכו קלות כמה גרגירים אל דופן הסיר להסמכת הרוטב.","הוסיפו את התרד בהדרגה תוך ערבוב עד שהוא קמל, ובשלו עוד 3-4 דקות.","סיימו בחומץ, טעמו ותקנו תיבול, והגישו חם."],"nutrition":{"calories":220,"fatG":10,"satFatG":1.4,"proteinG":8,"carbsG":25,"fiberG":8,"netCarbsG":17,"sugarG":5,"sodiumMg":560},"ketoVariant":"Halve the chickpeas to 120 g total and add 200 g sliced mushrooms with the onion - about 11 g net carbs per serving.","ketoVariantHe":"חצו את גרגירי החומוס ל־120 גרם בסך הכול והוסיפו 200 גרם פטריות פרוסות עם הבצל - כ־11 גרם פחמימות נטו למנה.","tips":"Chickpeas are the carb-heaviest legume in this collection, so the 60 g per-serving cap does the work: a typical espinacas con garbanzos serves double. The smoked paprika and vinegar make the small portion taste substantial.","tipsHe":"גרגירי חומוס הם הקטנייה העשירה ביותר בפחמימות באוסף הזה, ולכן מגבלת 60 הגרם למנה עושה את העבודה: מנה טיפוסית של אספינקס קון גרבנזוס מכילה כפול. הפפריקה המעושנת והחומץ גורמים למנה הקטנה להרגיש משמעותית.","sources":[{"creator":"The Mediterranean Dish","url":"https://www.themediterraneandish.com/spanish-chickpea-stew-espinacas-con-garbanzos/"},{"creator":"Milk Street (Christopher Kimball)","url":"https://www.177milkstreet.com/recipes/braised-chickpeas-and-spinach-with-smoked-paprika-and-garlic-guisat-de-cigrons"},{"creator":"Nik Sharma","url":"https://niksharmacooks.com/andalusian-style-chickpea-and-spinach-stew/"}],"comparedVersions":"Compared The Mediterranean Dish, Milk Street and Nik Sharma: all build on smoked paprika, garlic and olive oil; this version skips the traditional bread-almond picada, keeps Milk Street\u0027s vinegar finish, and caps chickpeas at 60 g per serving.","comparedVersionsHe":"הושוו The Mediterranean Dish,‏ Milk Street וניק שארמה: כולם בנויים על פפריקה מעושנת, שום ושמן זית; הגרסה הזו מוותרת על הפיקדה המסורתית של לחם ושקדים, שומרת על סיומת החומץ של Milk Street ומגבילה את גרגירי החומוס ל־60 גרם למנה."},{"id":"lentil-bolognese-zucchini-noodles","name":"Lentil Bolognese over Zucchini Noodles","nameHe":"בולונז עדשים על אטריות קישואים","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":15,"cookTimeMin":35,"difficulty":"easy","ingredients":[{"amount":"1 tbsp","item":"olive oil"},{"amount":"1 medium","item":"onion, finely chopped"},{"amount":"1 small","item":"carrot, finely diced"},{"amount":"3 cloves","item":"garlic, minced"},{"amount":"1/2 cup / 100 g","item":"dry brown or green lentils, rinsed (25 g per serving)","israelNote":"עדשים ירוקות או חומות"},{"amount":"1 can (400 g)","item":"crushed tomatoes","israelNote":"עגבניות מרוסקות"},{"amount":"1 tsp each","item":"dried oregano, dried basil and sweet paprika"},{"amount":"1 1/2 cups","item":"water"},{"amount":"3 medium (about 600 g)","item":"zucchini, spiralized or peeled into ribbons"},{"amount":"to taste","item":"salt and black pepper"}],"ingredientsHe":["כף שמן זית","בצל בינוני קצוץ דק","גזר קטן חתוך לקוביות קטנות","3 שיני שום כתושות","חצי כוס / 100 גרם עדשים ירוקות או חומות שטופות (25 גרם למנה)","קופסה (400 גרם) עגבניות מרוסקות","כפית אורגנו יבש, כפית בזיליקום יבש וכפית פפריקה מתוקה","כוס וחצי מים","3 קישואים בינוניים (כ־600 גרם) מגולגלים לספירלה או מקולפים לרצועות","מלח ופלפל שחור לפי הטעם"],"instructions":["Heat the oil in a wide pot over medium heat. Saute the onion and carrot 5 minutes, then add the garlic for 1 minute.","Add the lentils, crushed tomatoes, herbs, paprika and water. Bring to a boil.","Reduce the heat and simmer uncovered 25-30 minutes, stirring occasionally, until the lentils are tender and the sauce is thick like a meat ragu. Season generously.","Meanwhile, salt the zucchini noodles lightly and let them sit 10 minutes, then pat dry.","In a separate pan, saute the zucchini noodles over high heat for just 1-2 minutes - they should stay al dente.","Divide the noodles among bowls and top with the hot lentil bolognese."],"instructionsHe":["חממו את השמן בסיר רחב על אש בינונית. טגנו את הבצל והגזר 5 דקות, ואז הוסיפו את השום לדקה.","הוסיפו את העדשים, העגבניות המרוסקות, עשבי התיבול, הפפריקה והמים. הביאו לרתיחה.","הנמיכו את האש ובשלו ללא מכסה 25-30 דקות תוך ערבוב מדי פעם, עד שהעדשים רכות והרוטב סמיך כמו ראגו בשר. תבלו בנדיבות.","בינתיים המליחו קלות את אטריות הקישואים והניחו להן 10 דקות, ואז ייבשו בנייר סופג.","במחבת נפרדת הקפיצו את אטריות הקישואים על אש גבוהה 1-2 דקות בלבד - שיישארו נגיסים.","חלקו את האטריות לקערות והניחו מעל את בולונז העדשים החם."],"nutrition":{"calories":210,"fatG":6,"satFatG":0.9,"proteinG":10,"carbsG":28,"fiberG":10,"netCarbsG":18,"sugarG":10,"sodiumMg":520},"ketoVariant":"Halve the lentils and add 200 g finely chopped mushrooms to the soffritto - about 12 g net carbs per serving.","ketoVariantHe":"חצו את כמות העדשים והוסיפו 200 גרם פטריות קצוצות דק לבסיס - כ־12 גרם פחמימות נטו למנה.","tips":"Salting and drying the zucchini first prevents a watery plate. The sauce freezes well - make a double batch of the bolognese alone.","tipsHe":"המלחה וייבוש של הקישואים מראש מונעים צלחת מימית. הרוטב מצוין להקפאה - הכינו כמות כפולה של הבולונז לבדו.","sources":[{"creator":"Minimalist Baker","url":"https://minimalistbaker.com/zucchini-pasta-with-lentil-bolognese/"},{"creator":"The Stingy Vegan","url":"https://thestingyvegan.com/smoky-lentil-bolognese-zucchini-pasta/"},{"creator":"Co+op Grocery","url":"https://www.grocery.coop/recipes/lentil-bolognese-zucchini-noodles/"}],"comparedVersions":"Compared Minimalist Baker, The Stingy Vegan and Co+op: took the one-pot simmer-from-dry method and the barely-cooked zoodles they all share, added The Stingy Vegan\u0027s paprika note, and fixed the lentil portion at 25 g dry per serving.","comparedVersionsHe":"הושוו Minimalist Baker,‏ The Stingy Vegan ו־Co+op: נלקחו שיטת הבישול בסיר אחד מעדשים יבשות ואטריות הקישואים המוקפצות בקצרה המשותפות לכולם, נוספה נגיעת הפפריקה של The Stingy Vegan, ומנת העדשים קובעה על 25 גרם יבשות למנה."},{"id":"kasha-mushrooms-caramelized-onions","name":"Buckwheat Kasha with Mushrooms and Caramelized Onions","nameHe":"כוסמת עם פטריות ובצל מקורמל","category":"legumes-grains","kosherType":"pareve","dietTags":["lowcarb"],"servings":4,"prepTimeMin":10,"cookTimeMin":40,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 90 g","item":"toasted buckwheat groats (kasha) - about 22 g per serving","israelNote":"כוסמת קלויה"},{"amount":"1","item":"egg, beaten (classic coating; optional for vegans)"},{"amount":"1 cup / 240 ml","item":"boiling water or vegetable stock"},{"amount":"3 tbsp","item":"olive oil, divided"},{"amount":"2 large","item":"onions, halved and sliced"},{"amount":"250 g","item":"mushrooms, sliced","israelNote":"פטריות שמפיניון או פורטובלו"},{"amount":"1 tsp","item":"fresh thyme leaves or 1/2 tsp dried"},{"amount":"to taste","item":"salt and black pepper"}],"ingredientsHe":["חצי כוס / 90 גרם כוסמת קלויה - כ־22 גרם למנה","ביצה טרופה (הציפוי הקלאסי; אפשר לוותר לטבעונים)","כוס / 240 מ\"ל מים רותחים או ציר ירקות","3 כפות שמן זית, בחלוקה","2 בצלים גדולים חצויים ופרוסים","250 גרם פטריות פרוסות","כפית עלי טימין טריים או חצי כפית יבש","מלח ופלפל שחור לפי הטעם"],"instructions":["Heat 2 tbsp oil in a wide pan over medium heat. Cook the onions with a pinch of salt, stirring now and then, 20-25 minutes until deeply golden and sweet.","Push the onions aside, raise the heat, add the mushrooms and thyme and saute 6-8 minutes until browned. Season and transfer everything to a bowl.","In a dry saucepan, stir the buckwheat with the beaten egg over medium heat 2-3 minutes until the grains are dry and separate - this keeps them fluffy.","Add the remaining 1 tbsp oil, the boiling water or stock and 1/2 tsp salt. Cover and simmer on low 10-12 minutes until the liquid is absorbed.","Let the kasha rest 5 minutes off the heat, then fluff with a fork.","Fold in the mushrooms and onions, taste for salt and pepper, and serve hot."],"instructionsHe":["חממו 2 כפות שמן במחבת רחבה על אש בינונית. בשלו את הבצל עם קורט מלח, תוך ערבוב מדי פעם, 20-25 דקות עד שהוא זהוב עמוק ומתוק.","הזיזו את הבצל לצד, הגבירו את האש, הוסיפו את הפטריות והטימין וטגנו 6-8 דקות עד להשחמה. תבלו והעבירו הכול לקערה.","בסיר יבש ערבבו את הכוסמת עם הביצה הטרופה על אש בינונית 2-3 דקות עד שהגרגירים יבשים ונפרדים - כך הם נשארים אווריריים.","הוסיפו את כף השמן הנותרת, המים הרותחים או הציר וחצי כפית מלח. כסו ובשלו על אש נמוכה 10-12 דקות עד שהנוזלים נספגים.","השאירו את הכוסמת 5 דקות מחוץ לאש, ואז אווררו במזלג.","ערבבו פנימה את הפטריות והבצל, טעמו ותקנו מלח ופלפל, והגישו חם."],"nutrition":{"calories":215,"fatG":12,"satFatG":2,"proteinG":7,"carbsG":22,"fiberG":4,"netCarbsG":18,"sugarG":4,"sodiumMg":450},"ketoVariant":"Use only 1/4 cup / 45 g kasha and double the mushrooms - about 10 g net carbs per serving.","ketoVariantHe":"השתמשו רק ברבע כוס / 45 גרם כוסמת והכפילו את הפטריות - כ־10 גרם פחמימות נטו למנה.","tips":"This is kasha varnishkes without the pasta - the mushrooms and onions replace the bow ties. 22 g dry buckwheat per serving is the ceiling that keeps it under 20 g net. Butter instead of oil is delicious but makes it dairy.","tipsHe":"זו קאשה ורנישקעס בלי הפסטה - הפטריות והבצל מחליפים את עניבות הפרפר. 22 גרם כוסמת יבשה למנה היא התקרה ששומרת מתחת ל־20 גרם נטו. חמאה במקום שמן טעימה מאוד אבל הופכת את המנה לחלבית.","sources":[{"creator":"Babaganosh","url":"https://www.babaganosh.org/buckwheat-kasha-with-mushrooms/"},{"creator":"At the Immigrant\u0027s Table","url":"https://immigrantstable.com/kasha-with-caramelized-mushrooms-and-onions/"},{"creator":"Whole Foods Market","url":"https://www.wholefoodsmarket.com/recipes/kasha-varnishkes-caramelized-onions-and-mushrooms"}],"comparedVersions":"Compared Babaganosh, At the Immigrant\u0027s Table and Whole Foods\u0027 kasha varnishkes: kept the egg-coating trick and slow-caramelized onions common to the traditional versions, dropped the pasta entirely, and halved the typical grain quantity.","comparedVersionsHe":"הושוו Babaganosh,‏ At the Immigrant\u0027s Table וקאשה ורנישקעס של Whole Foods: נשמרו טריק ציפוי הביצה והבצל המקורמל לאט מהגרסאות המסורתיות, הפסטה הושמטה לגמרי, וכמות הדגן הרגילה נחצתה."},{"id":"quinoa-almond-pilaf","name":"Quinoa \"Rice\" Pilaf with Onions and Toasted Almonds","nameHe":"פילאף קינואה עם בצל ושקדים קלויים","category":"legumes-grains","kosherType":"pareve","dietTags":"lowcarb","servings":4,"prepTimeMin":10,"cookTimeMin":25,"difficulty":"easy","ingredients":[{"amount":"2/3 cup / 120 g","item":"quinoa, rinsed well","israelNote":"קינואה"},{"amount":"1 medium / 110 g","item":"onion, finely chopped"},{"amount":"2 tbsp","item":"olive oil"},{"amount":"1 1/3 cups / 320 ml","item":"vegetable broth or water"},{"amount":"1/3 cup / 30 g","item":"sliced almonds","israelNote":"שקדים פרוסים — sold in the baking aisle"},{"amount":"1/4 tsp","item":"ground turmeric (optional, for golden color)"},{"amount":"1","item":"bay leaf (optional)"},{"amount":"to taste","item":"salt and black pepper"},{"amount":"2 tbsp","item":"chopped fresh parsley"}],"ingredientsHe":[{"amount":"2/3 כוס / 120 גרם","item":"קינואה שטופה היטב","israelNote":"קינואה"},{"amount":"1 בינוני / 110 גרם","item":"בצל קצוץ דק"},{"amount":"2 כפות","item":"שמן זית"},{"amount":"1 ושליש כוסות / 320 מ\"ל","item":"ציר ירקות או מים"},{"amount":"1/3 כוס / 30 גרם","item":"שקדים פרוסים","israelNote":"שקדים פרוסים — במדף האפייה"},{"amount":"1/4 כפית","item":"כורכום טחון (לא חובה, לצבע זהוב)"},{"amount":"1","item":"עלה דפנה (לא חובה)"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"},{"amount":"2 כפות","item":"פטרוזיליה טרייה קצוצה"}],"instructions":["Toast the sliced almonds in a dry pan over medium heat 2-3 minutes, stirring constantly, until golden and fragrant. Set aside.","In the same pot, heat the olive oil and saute the onion 4-5 minutes until soft and golden.","Add the drained quinoa and toast it with the onion 2-3 minutes, stirring, until it smells nutty.","Pour in the broth, add turmeric, bay leaf, salt, and pepper, and bring to a boil.","Cover, reduce the heat to low, and cook 15 minutes until the liquid is absorbed.","Turn off the heat and let stand covered 5 minutes, then discard the bay leaf and fluff with a fork.","Fold in the toasted almonds and parsley and serve."],"instructionsHe":["קולים את השקדים הפרוסים במחבת יבשה על אש בינונית 2-3 דקות תוך ערבוב מתמיד, עד שהם זהובים וריחניים. מעבירים הצידה.","באותו סיר מחממים את שמן הזית ומטגנים את הבצל 4-5 דקות עד שהוא רך וזהוב.","מוסיפים את הקינואה המסוננת וקולים אותה עם הבצל 2-3 דקות תוך ערבוב, עד לניחוח אגוזי.","יוצקים את הציר, מוסיפים כורכום, עלה דפנה, מלח ופלפל ומביאים לרתיחה.","מכסים, מנמיכים לאש נמוכה ומבשלים 15 דקות עד שהנוזלים נספגים.","מכבים את האש ומשאירים מכוסה 5 דקות, מוציאים את עלה הדפנה ומפרידים במזלג.","מקפלים פנימה את השקדים הקלויים והפטרוזיליה ומגישים."],"nutrition":{"calories":215,"fatG":12,"satFatG":1.5,"proteinG":6,"carbsG":22,"fiberG":4,"netCarbsG":18,"sugarG":2,"sodiumMg":300},"tips":"Each serving is a scant 1/2 cup cooked quinoa — measure servings rather than refilling the plate, since this is the highest-carb dish in the category. Toasting the dry quinoa before adding liquid is what gives real pilaf flavor and separate grains.","tipsHe":"כל מנה היא פחות מ-1/2 כוס קינואה מבושלת — מודדים מנות במקום למלא שוב את הצלחת, כי זו המנה עם הכי הרבה פחמימות בקטגוריה. קליית הקינואה היבשה לפני הוספת הנוזלים היא שנותנת טעם פילאף אמיתי וגרגירים נפרדים.","ketoVariant":"Halve the quinoa (1/3 cup dry) and stir in 2 cups / 200 g cauliflower rice for the last 4 minutes of cooking — about 10 g net carbs per serving.","ketoVariantHe":"מפחיתים את הקינואה בחצי (1/3 כוס יבשה) ומוסיפים 2 כוסות / 200 גרם אורז כרובית ב-4 הדקות האחרונות של הבישול — כ-10 גרם פחמימות נטו למנה.","sources":[{"creator":"Two Purple Figs","url":"https://www.twopurplefigs.com/quinoa-pilaf/"},{"creator":"Ellie Krieger","url":"https://www.elliekrieger.com/recipe/quinoa-pilaf/"},{"creator":"The Real Food Dietitians","url":"https://therealfooddietitians.com/quinoa-pilaf/"}],"comparedVersions":"Compared three versions: Two Purple Figs toasts the quinoa in the aromatics for fluffy separate grains, Ellie Krieger proves a 3-ingredient minimal version works, and The Real Food Dietitians adds dried fruit and herbs. Took the saute-onion-then-toast-quinoa technique, kept almonds toasted separately for crunch, and dropped the dried apricots to keep carbs in bounds.","comparedVersionsHe":"השווינו שלוש גרסאות: טו פרפל פיגס קולה את הקינואה עם הבצל לגרגירים אווריריים ונפרדים, אלי קריגר מוכיחה שגרסה מינימלית מ-3 מרכיבים עובדת, והריל פוד דיאטישנס מוסיפות פירות יבשים ועשבים. לקחנו את שיטת טיגון הבצל וקליית הקינואה, השארנו את השקדים קלויים בנפרד לפריכות, וויתרנו על המשמשים המיובשים כדי לשמור על הפחמימות בגבולות."},{"id":"classic-deviled-eggs","name":"Classic Deviled Eggs","nameHe":"ביצים ממולאות קלאסיות","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":15,"cookTimeMin":13,"difficulty":"easy","ingredients":[{"amount":"6","item":"large eggs"},{"amount":"1/4 cup / 55 g","item":"mayonnaise","israelNote":"mayonnaise (e.g., Mayonez Telma — check kosher label)"},{"amount":"1 tsp","item":"Dijon mustard","israelNote":"any smooth mustard (chardal) works"},{"amount":"1 tsp","item":"white or apple cider vinegar"},{"amount":"1/8 tsp","item":"garlic powder"},{"amount":"to taste","item":"salt and black pepper"},{"amount":"for garnish","item":"sweet or smoked paprika"}],"ingredientsHe":[{"amount":"6","item":"ביצים גדולות"},{"amount":"1/4 כוס / 55 גרם","item":"מיונז","israelNote":"למשל מיונז תלמה — בודקים הכשר"},{"amount":"1 כפית","item":"חרדל דיז\u0027ון","israelNote":"כל חרדל חלק עובד"},{"amount":"1 כפית","item":"חומץ לבן או חומץ תפוחים"},{"amount":"1/8 כפית","item":"אבקת שום"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"},{"amount":"לקישוט","item":"פפריקה מתוקה או מעושנת"}],"instructions":["Place the eggs in a pot, cover with cold water by 3 cm, and bring to a rolling boil. Turn off the heat, cover, and let stand 13 minutes.","Move the eggs to a bowl of ice water for 5 minutes, then peel.","Halve the eggs lengthwise and pop the yolks into a bowl.","Mash the yolks with the mayonnaise, mustard, vinegar, garlic powder, salt, and pepper until completely smooth.","Spoon or pipe the filling back into the egg-white halves.","Dust with paprika and chill until serving. Keeps 4 days refrigerated."],"instructionsHe":["מניחים את הביצים בסיר, מכסים במים קרים 3 ס\"מ מעליהן ומביאים לרתיחה מלאה. מכבים את האש, מכסים ומשאירים 13 דקות.","מעבירים את הביצים לקערת מי קרח ל-5 דקות, ואז מקלפים.","חוצים את הביצים לאורכן ומוציאים את החלמונים לקערה.","מועכים את החלמונים עם המיונז, החרדל, החומץ, אבקת השום, מלח ופלפל עד לקבלת תערובת חלקה לגמרי.","ממלאים את חצאי החלבונים במילוי בעזרת כפית או שקית זילוף.","מפזרים פפריקה ומקררים עד ההגשה. נשמר 4 ימים במקרר."],"nutrition":{"calories":135,"fatG":11.5,"satFatG":2.6,"proteinG":6.5,"carbsG":0.6,"fiberG":0,"netCarbsG":0.6,"sugarG":0.3,"sodiumMg":160},"lowCarbVariant":"Fold a tablespoon of finely chopped pickles or chives into the filling for crunch.","lowCarbVariantHe":"מקפלים לתוך המילוי כף מלפפון חמוץ קצוץ דק או עירית לקראנץ\u0027.","tips":"Older eggs (a week in the fridge) peel much more easily than very fresh ones. For an ultra-smooth filling, press the yolks through a sieve or blitz with a stick blender.","tipsHe":"ביצים פחות טריות (שבוע במקרר) מתקלפות הרבה יותר בקלות מטריות מאוד. למילוי חלק במיוחד, מעבירים את החלמונים דרך מסננת או טוחנים בבלנדר מוט.","sources":[{"creator":"Drive Me Hungry","url":"https://drivemehungry.com/easy-classic-keto-deviled-eggs/"},{"creator":"KetoConnect","url":"https://www.ketoconnect.net/simple-deviled-eggs/"},{"creator":"Easy Low Carb","url":"https://easylowcarb.com/keto-deviled-eggs/"}],"comparedVersions":"Compared filling ratios and acid choices across three keto versions; Drive Me Hungry\u0027s 6-egg to 1/4-cup mayo ratio with both vinegar and Dijon gave the best balance of creaminess and tang, and its off-heat boiling method is the most reliable for clean peeling. Skipped bacon-loaded versions to keep the recipe simple and broadly usable.","comparedVersionsHe":"השווינו יחסי מילוי ובחירות חומציות בשלוש גרסאות קיטו; היחס של Drive Me Hungry — 6 ביצים ל-1/4 כוס מיונז עם גם חומץ וגם דיז\u0027ון — נתן את האיזון הטוב ביותר בין קרמיות לחמצמצות, ושיטת הבישול שלה מחוץ לאש היא האמינה ביותר לקילוף נקי. דילגנו על גרסאות עמוסות בייקון כדי לשמור על מתכון פשוט ושמיש לכולם."},{"id":"parmesan-crisps","name":"Parmesan Crisps","nameHe":"צ\u0027יפס פרמזן פריך","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":5,"cookTimeMin":7,"difficulty":"easy","ingredients":[{"amount":"1 cup / 100 g","item":"freshly grated parmesan cheese","israelNote":"parmesan or kashkaval — grate from a block, not pre-shredded"},{"amount":"1/4 tsp","item":"sweet or smoked paprika (optional)"},{"amount":"1/4 tsp","item":"dried oregano or za\u0027atar (optional)","israelNote":"za\u0027atar blend is widely available in Israel"}],"ingredientsHe":[{"amount":"1 כוס / 100 גרם","item":"פרמזן מגורר טרי","israelNote":"פרמזן או קשקבל — מגררים מגוש, לא קונים מגורר מראש"},{"amount":"1/4 כפית","item":"פפריקה מתוקה או מעושנת (לא חובה)"},{"amount":"1/4 כפית","item":"אורגנו מיובש או זעתר (לא חובה)"}],"instructions":["Heat the oven to 200°C / 400°F and line a baking tray with baking paper.","Grate the parmesan on the medium holes of a grater — freshly grated cheese melts into lacy, even crisps.","Drop level tablespoons of cheese onto the tray, about 3 cm apart, and flatten each mound gently into a thin round.","Sprinkle with paprika or oregano if using.","Bake 5–7 minutes, until the edges are golden and the centers are bubbling.","Cool completely on the tray — the crisps firm up and turn crunchy only as they cool.","Store in an airtight container at room temperature for up to 2 weeks."],"instructionsHe":["מחממים תנור ל-200 מעלות ומרפדים תבנית בנייר אפייה.","מגררים את הפרמזן על החורים הבינוניים של פומפייה — גבינה מגוררת טרי נמסה לצ\u0027יפסים אחידים ותחרתיים.","מניחים על התבנית כפות שטוחות של גבינה במרווחים של כ-3 ס\"מ, ומשטחים כל תלולית בעדינות לעיגול דק.","מפזרים פפריקה או אורגנו, למי שרוצה.","אופים 5–7 דקות, עד שהשוליים זהובים והמרכז מבעבע.","מצננים לגמרי על התבנית — הצ\u0027יפסים מתייצבים ונהיים פריכים רק כשהם מתקררים.","שומרים בכלי אטום בטמפרטורת החדר עד שבועיים."],"nutrition":{"calories":105,"fatG":7,"satFatG":4.5,"proteinG":9.5,"carbsG":1,"fiberG":0,"netCarbsG":1,"sugarG":0,"sodiumMg":400},"tips":"Do not use pre-grated bagged cheese — anti-caking starch keeps it from melting into a crisp. Kashkaval works but gives a chewier, less brittle crisp than parmesan.","tipsHe":"לא משתמשים בגבינה מגוררת מראש בשקית — עמילן נגד התגיישות מונע ממנה להימס לצ\u0027יפס. קשקבל עובד, אבל נותן צ\u0027יפס לעיס ופחות שביר מפרמזן.","sources":[{"creator":"Alphafoodie","url":"https://www.alphafoodie.com/how-to-make-parmesan-crisps/"},{"creator":"Savory Tooth","url":"https://www.savorytooth.com/parmesan-crisps/"},{"creator":"Low Carb Yum","url":"https://lowcarbyum.com/easy-parmesan-crisps/"}],"comparedVersions":"Compared oven temperatures (175–200°C) and portioning across three versions; all agree on one ingredient and cooling on the tray for crispness. Chose the hotter, faster 200°C bake with a 2-tablespoon portion, which browns evenly without extra fat, plus optional seasoning from the Low Carb Yum variations.","comparedVersionsHe":"השווינו טמפרטורות אפייה (175–200 מעלות) וגדלי מנות בשלוש גרסאות; כולן מסכימות על מרכיב אחד בלבד ועל צינון על התבנית לפריכות. בחרנו באפייה החמה והמהירה של 200 מעלות עם מנות של 2 כפות, שמשחימה אחיד בלי שומן נוסף, בתוספת התיבול האופציונלי מהווריאציות של Low Carb Yum."},{"id":"spinach-cheese-egg-muffins","name":"Spinach \u0026 Cheese Egg Muffins","nameHe":"מאפינס ביצים עם תרד וגבינה","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"8","item":"large eggs"},{"amount":"2 cups / 60 g","item":"fresh spinach, chopped","israelNote":"tered (chard) leaves also work; check leaves for insects"},{"amount":"1 cup / 100 g","item":"grated hard cheese","israelNote":"parmesan or kashkaval; Bulgarian feta (crumbled) is a good salty option"},{"amount":"2","item":"green onions, thinly sliced"},{"amount":"1/2 tsp","item":"salt"},{"amount":"1/4 tsp","item":"black pepper"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"for greasing","item":"olive oil or butter"}],"ingredientsHe":[{"amount":"8","item":"ביצים גדולות"},{"amount":"2 כוסות / 60 גרם","item":"תרד טרי, קצוץ","israelNote":"גם עלי מנגולד עובדים; בודקים את העלים מחרקים"},{"amount":"1 כוס / 100 גרם","item":"גבינה קשה מגוררת","israelNote":"פרמזן או קשקבל; גם בולגרית מפוררת היא אופציה מלוחה וטובה"},{"amount":"2","item":"בצלים ירוקים, פרוסים דק"},{"amount":"1/2 כפית","item":"מלח"},{"amount":"1/4 כפית","item":"פלפל שחור"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"לשימון","item":"שמן זית או חמאה"}],"instructions":["Heat the oven to 200°C / 400°F and grease a 12-cup muffin tin very well (or use silicone liners).","Whisk the eggs with the salt, pepper, and garlic powder until fully blended.","Stir in the chopped spinach, green onions, and most of the cheese.","Divide the mixture among the 12 cups, filling each about three-quarters full, and top with the remaining cheese.","Bake 12–15 minutes, until puffed and just set in the center.","Cool 5 minutes before removing from the tin. Serve warm, or refrigerate up to 4 days; two muffins per serving."],"instructionsHe":["מחממים תנור ל-200 מעלות ומשמנים היטב תבנית 12 שקעים למאפינס (או משתמשים במנג\u0027טים מסיליקון).","טורפים את הביצים עם המלח, הפלפל ואבקת השום עד שהתערובת אחידה.","מוסיפים את התרד הקצוץ, הבצל הירוק ורוב הגבינה ומערבבים.","מחלקים את התערובת בין 12 השקעים, ממלאים כל אחד עד כשלושה רבעים, ומפזרים מעל את שארית הגבינה.","אופים 12–15 דקות, עד שהמאפינס תופחים ומתייצבים בדיוק במרכז.","מצננים 5 דקות לפני שמוציאים מהתבנית. מגישים חמים, או שומרים במקרר עד 4 ימים; שני מאפינס למנה."],"nutrition":{"calories":165,"fatG":12,"satFatG":5,"proteinG":13,"carbsG":1.5,"fiberG":0.3,"netCarbsG":1.2,"sugarG":0.8,"sodiumMg":420},"lowCarbVariant":"Fold in 1/2 cup diced red pepper or sautéed mushrooms for variety (adds about 1 g net carbs per serving).","lowCarbVariantHe":"מקפלים פנימה 1/2 כוס פלפל אדום קצוץ או פטריות מוקפצות לגיוון (מוסיף כ-1 גרם פחמימות נטו למנה).","tips":"The muffins deflate slightly as they cool — normal. They freeze well; reheat 20–30 seconds in the microwave. Chop the spinach finely so it disperses instead of sinking.","tipsHe":"המאפינס שוקעים מעט כשהם מתקררים — זה נורמלי. הם מקפיאים היטב; מחממים 20–30 שניות במיקרוגל. קוצצים את התרד דק כדי שיתפזר במקום לשקוע.","sources":[{"creator":"Life Made Sweeter","url":"https://lifemadesweeter.com/spinach-and-cheese-egg-muffins/"},{"creator":"Low-Carb, So Simple","url":"https://www.lowcarbsosimple.com/spinach-and-feta-egg-muffins-or-frittata/"},{"creator":"KetoFocus","url":"https://www.ketofocus.com/recipes/mini-frittatas/"}],"comparedVersions":"Compared egg-to-cheese ratios and add-ins (cream, cottage cheese, bacon) across three versions; chose Life Made Sweeter\u0027s simple no-milk formula at 200°C for 12–15 minutes because it sets fastest and needs no dairy beyond the cheese itself. Dropped meat add-ins and scaled to 8 eggs so a serving of two muffins stays under 170 calories.","comparedVersionsHe":"השווינו יחסי ביצים-גבינה ותוספות (שמנת, קוטג\u0027, בייקון) בשלוש גרסאות; בחרנו בנוסחה הפשוטה ללא חלב של Life Made Sweeter ב-200 מעלות ל-12–15 דקות, כי היא מתייצבת הכי מהר ולא צריכה מוצרי חלב מעבר לגבינה עצמה. ויתרנו על תוספות בשריות והתאמנו ל-8 ביצים, כך שמנה של שני מאפינס נשארת מתחת ל-170 קלוריות."},{"id":"quick-pickled-vegetables","name":"Quick Pickled Cucumbers \u0026 Cauliflower","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":8,"prepTimeMin":15,"cookTimeMin":5,"difficulty":"easy","ingredients":[{"amount":"2 / 200 g","item":"Israeli cucumbers, sliced into spears or coins","israelNote":"melafefonim"},{"amount":"2 cups / 200 g","item":"small cauliflower florets","israelNote":"kruvit"},{"amount":"1 cup / 240 ml","item":"white vinegar (5%)","israelNote":"chometz sinteti 5%"},{"amount":"1 cup / 240 ml","item":"water"},{"amount":"1 tbsp / 18 g","item":"coarse salt","israelNote":"melach gas"},{"amount":"3 cloves","item":"garlic, lightly crushed"},{"amount":"3-4 sprigs","item":"fresh dill","israelNote":"shamir"},{"amount":"1 tsp","item":"black peppercorns"},{"amount":"1/2 tsp","item":"mustard seeds or chili flakes (optional)"}],"instructions":["Pack the cucumber slices, cauliflower florets, garlic, dill, peppercorns and mustard seeds into a clean 1-liter jar, leaving about 1 cm of space at the top.","Bring the vinegar, water and salt to a boil in a small pot, stirring until the salt dissolves.","Pour the hot brine over the vegetables until fully submerged.","Let the open jar cool to room temperature, then seal and refrigerate.","Wait at least 24 hours before eating (48 hours is better for the cauliflower). Keeps 3-4 weeks refrigerated."],"nutrition":{"calories":12,"fatG":0.1,"satFatG":0.0,"proteinG":0.6,"carbsG":2.3,"fiberG":0.9,"netCarbsG":1.4,"sugarG":1.0,"sodiumMg":400},"ketoVariant":"Already essentially zero-carb; add sliced jalapeño for spicy pickles.","tips":"No sugar and no sweetener needed - garlic and dill carry the flavor. Use the leftover brine once more for a second batch of cucumbers.","sources":[{"creator":"Sugar-Free Mom","url":"https://www.sugarfreemom.com/recipes/how-to-make-easy-sugar-free-quick-pickled-vegetables/comment-page-1/"},{"creator":"Mary\u0027s Nest","url":"https://marysnest.com/no-sugar-quick-pickles-master-recipe-for-pickling-any-vegetable/"},{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/pickled-cauliflower/"}],"comparedVersions":"Compared brine ratios and simmer times across a no-sugar master recipe, a sugar-free vegetable pickle and a dedicated cauliflower pickle. Settled on the common 1:1 vinegar-to-water ratio with a plain boil (no 10-minute simmer - unnecessary), which every version agrees produces crisp, tangy results in 24-48 hours.","nameHe":"חמוצים מהירים: מלפפונים וכרובית","ingredientsHe":[{"amount":"2 / 200 גרם","item":"מלפפונים ישראליים פרוסים לרצועות או למטבעות"},{"amount":"2 כוסות / 200 גרם","item":"פרחי כרובית קטנים"},{"amount":"1 כוס / 240 מ\"ל","item":"חומץ לבן 5%","israelNote":"חומץ סינתטי 5%"},{"amount":"1 כוס / 240 מ\"ל","item":"מים"},{"amount":"1 כף / 18 גרם","item":"מלח גס"},{"amount":"3 שיניים","item":"שום מעוך קלות"},{"amount":"3-4 ענפים","item":"שמיר טרי"},{"amount":"1 כפית","item":"גרגירי פלפל שחור"},{"amount":"1/2 כפית","item":"זרעי חרדל או פתיתי צ\u0027ילי (לא חובה)"}],"instructionsHe":["דוחסים את פרוסות המלפפון, פרחי הכרובית, השום, השמיר, גרגירי הפלפל וזרעי החרדל לצנצנת נקייה של 1 ליטר, ומשאירים כ-1 ס\"מ רווח למעלה.","מרתיחים את החומץ, המים והמלח בסיר קטן תוך ערבוב עד שהמלח נמס.","מוזגים את מי המלח החמים על הירקות עד שהם מכוסים לגמרי.","מניחים לצנצנת הפתוחה להצטנן לטמפרטורת החדר, ואז סוגרים ומעבירים למקרר.","ממתינים לפחות 24 שעות לפני האכילה (48 שעות עדיף לכרובית). נשמר 3-4 שבועות במקרר."],"ketoVariantHe":"כבר כמעט אפס פחמימות; מוסיפים פרוסות חלפיניו לחמוצים חריפים.","tipsHe":"לא צריך סוכר ולא ממתיק - השום והשמיר עושים את העבודה. אפשר להשתמש במי המלח שנשארו פעם נוספת למנה שנייה של מלפפונים.","comparedVersionsHe":"השווינו יחסי תמיסה וזמני בישול בין מתכון-אב ללא סוכר, מתכון ירקות כבושים ללא סוכר ומתכון ייעודי לכרובית כבושה. בחרנו ביחס המקובל של 1:1 חומץ למים עם הרתחה פשוטה (בלי בישול של 10 דקות - מיותר), שלפי כל הגרסאות נותן תוצאה פריכה וחמצמצה תוך 24-48 שעות."},{"id":"roasted-spiced-pumpkin-seeds","name":"Smoky Roasted Pumpkin Seeds","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":5,"cookTimeMin":15,"difficulty":"easy","ingredients":[{"amount":"1 cup / 130 g","item":"raw shelled pumpkin seeds (pepitas)","israelNote":"garinei dla\u0027at kelufim"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1 tsp","item":"smoked paprika","israelNote":"paprika me\u0027ushenet"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/2 tsp","item":"fine salt"},{"amount":"1/4 tsp","item":"cayenne pepper (optional)"}],"instructions":["Heat the oven to 175°C / 350°F and line a baking tray with baking paper.","In a bowl, toss the pumpkin seeds with the olive oil until every seed is coated.","Add the smoked paprika, garlic powder, salt and cayenne and toss again.","Spread the seeds in a single layer on the tray.","Roast 12-15 minutes, stirring once halfway, until golden and fragrant. A few seeds may pop - that is normal.","Cool completely on the tray; they crisp up as they cool. Store airtight up to 2 weeks."],"nutrition":{"calories":211,"fatG":19.1,"satFatG":3.3,"proteinG":9.8,"carbsG":3.7,"fiberG":2.1,"netCarbsG":1.6,"sugarG":0.5,"sodiumMg":290},"ketoVariant":"Already keto; for a curry version swap the paprika and cayenne for 1 tsp curry powder.","tips":"Watch closely after minute 12 - seeds go from golden to burnt fast.","sources":[{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/roasted-pumpkin-seeds/"},{"creator":"My Life Cookbook","url":"https://mylifecookbook.com/low-carb-pumpkin-seeds-roasted-everything-spice/"},{"creator":"WickedStuffed","url":"https://www.wickedstuffed.com/keto-holiday-recipes/roasted-pumpkin-seeds/"}],"comparedVersions":"Compared butter-roasted, everything-spice and smoked-paprika versions. The olive oil + smoked paprika profile won: it is pareve (pairs with any meal), uses pantry spices, and the moderate 175°C oven from Healthy Recipes Blog gave the most reliable even roast.","nameHe":"גרעיני דלעת קלויים בפפריקה מעושנת","ingredientsHe":[{"amount":"1 כוס / 130 גרם","item":"גרעיני דלעת קלופים לא קלויים","israelNote":"חנויות פיצוחים / מדף הבריאות בסופר"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1 כפית","item":"פפריקה מעושנת"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/2 כפית","item":"מלח דק"},{"amount":"1/4 כפית","item":"פלפל קאיין (לא חובה)"}],"instructionsHe":["מחממים תנור ל-175 מעלות ומרפדים תבנית בנייר אפייה.","בקערה, מערבבים את גרעיני הדלעת עם שמן הזית עד שכל גרעין מצופה.","מוסיפים את הפפריקה המעושנת, אבקת השום, המלח והקאיין ומערבבים שוב.","מפזרים את הגרעינים בשכבה אחת על התבנית.","קולים 12-15 דקות תוך ערבוב פעם אחת באמצע, עד שהגרעינים זהובים וריחניים. כמה גרעינים עשויים לקפוץ - זה תקין.","מצננים לגמרי על התבנית; הם נעשים פריכים תוך כדי הצינון. נשמרים בכלי אטום עד שבועיים."],"ketoVariantHe":"כבר קיטו; לגרסת קארי מחליפים את הפפריקה והקאיין בכפית אבקת קארי.","tipsHe":"משגיחים היטב אחרי הדקה ה-12 - הגרעינים עוברים מזהוב לשרוף מהר מאוד.","comparedVersionsHe":"השווינו קלייה בחמאה, תיבול אבריתינג ופפריקה מעושנת. הפרופיל של שמן זית ופפריקה מעושנת ניצח: הוא פרווה (מתאים לכל ארוחה), משתמש בתבלינים מהמזווה, והתנור המתון של 175 מעלות נתן את הקלייה האחידה והאמינה ביותר."},{"id":"tuna-salad-lettuce-cups","name":"Tuna Salad Lettuce Cups","nameHe":"סלט טונה בגביעי חסה","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"2 cans / 280 g drained","item":"tuna in water, drained and flaked","israelNote":"canned tuna (Starkist/Wili Food) — in water for lighter, in oil for richer"},{"amount":"1/3 cup / 75 g","item":"mayonnaise","israelNote":"mayonnaise (e.g., Mayonez Telma — check kosher label)"},{"amount":"1 tsp","item":"Dijon mustard"},{"amount":"2 stalks / 80 g","item":"celery, finely diced","israelNote":"selery — sold with leaves; use the crisp stalks"},{"amount":"1/4 / 30 g","item":"small red onion, finely chopped"},{"amount":"1 tbsp / 15 ml","item":"fresh lemon juice"},{"amount":"to taste","item":"salt and black pepper"},{"amount":"8 leaves","item":"romaine or iceberg lettuce, kept whole as cups","israelNote":"hasa — wash and check leaves per kosher practice"}],"ingredientsHe":[{"amount":"2 קופסאות / 280 גרם מסונן","item":"טונה במים, מסוננת ומפוררת","israelNote":"טונה בקופסה (סטארקיסט/וילי פוד) — במים לגרסה קלה, בשמן לעשירה יותר"},{"amount":"1/3 כוס / 75 גרם","item":"מיונז","israelNote":"למשל מיונז תלמה — בודקים הכשר"},{"amount":"1 כפית","item":"חרדל דיז\u0027ון"},{"amount":"2 גבעולים / 80 גרם","item":"סלרי, קצוץ דק","israelNote":"נמכר עם העלים; משתמשים בגבעולים הפריכים"},{"amount":"1/4 / 30 גרם","item":"בצל סגול קטן, קצוץ דק"},{"amount":"1 כף / 15 מ\"ל","item":"מיץ לימון טרי"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"},{"amount":"8 עלים","item":"חסה רומית או אייסברג, עלים שלמים כגביעים","israelNote":"שוטפים ובודקים את העלים לפי כללי הכשרות"}],"instructions":["Stir the mayonnaise, mustard, and lemon juice together in a bowl.","Fold in the flaked tuna, celery, and red onion; season with salt and pepper.","Wash and dry the lettuce leaves, keeping their natural cup shape.","Spoon the tuna salad into the leaves just before serving so they stay crisp.","Top with extra black pepper or chopped dill if you like."],"instructionsHe":["מערבבים בקערה את המיונז, החרדל ומיץ הלימון.","מקפלים פנימה את הטונה המפוררת, הסלרי והבצל הסגול; מתבלים במלח ופלפל.","שוטפים ומייבשים את עלי החסה, שומרים על צורת הגביע הטבעית שלהם.","ממלאים את העלים בסלט הטונה ממש לפני ההגשה, כדי שיישארו פריכים.","מוסיפים מעל עוד פלפל שחור או שמיר קצוץ, למי שאוהב."],"nutrition":{"calories":220,"fatG":16,"satFatG":2.5,"proteinG":17,"carbsG":2.5,"fiberG":0.8,"netCarbsG":1.7,"sugarG":1.2,"sodiumMg":380},"ketoVariant":"Swap half the mayo for mashed avocado for extra fiber and a creamier texture.","ketoVariantHe":"מחליפים חצי מהמיונז באבוקדו מעוך לתוספת סיבים ומרקם קרמי יותר.","tips":"Tuna is fish — pareve for kosher labeling, but many observe the custom of not eating fish and meat together at the same course. The salad keeps 2 days refrigerated; fill the leaves only at serving time.","tipsHe":"טונה היא דג — פרווה לעניין הכשרות, אבל רבים נוהגים שלא לאכול דגים ובשר יחד באותה מנה. הסלט נשמר יומיים במקרר; ממלאים את העלים רק בזמן ההגשה.","sources":[{"creator":"Healthy Fitness Meals","url":"https://healthyfitnessmeals.com/keto-tuna-salad/"},{"creator":"Kalyn\u0027s Kitchen","url":"https://kalynskitchen.com/recipe-for-tuna-salad-lettuce-wraps/"},{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/keto-tuna-salad/"}],"comparedVersions":"Compared bindings (Greek yogurt, mayo, avocado) and add-ins (eggs, radishes, pickles) across three versions; settled on a classic mayo-mustard-lemon binding with celery and red onion for crunch, which is the simplest crowd-pleasing formula, and borrowed the sturdy-leaf cup presentation the wrap versions all recommend.","comparedVersionsHe":"השווינו חומרי קישור (יוגורט יווני, מיונז, אבוקדו) ותוספות (ביצים, צנוניות, מלפפונים חמוצים) בשלוש גרסאות; התיישבנו על קישור קלאסי של מיונז-חרדל-לימון עם סלרי ובצל סגול לקראנץ\u0027 — הנוסחה הפשוטה שכולם אוהבים — ואימצנו את הגשת גביעי העלים היציבים שכל גרסאות הראפ ממליצות עליה."},{"id":"citrus-herb-marinated-olives","name":"Warm Citrus \u0026 Herb Marinated Olives","nameHe":"זיתים חמימים במרינדת הדרים ועשבי תיבול","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":8,"prepTimeMin":10,"cookTimeMin":5,"difficulty":"easy","ingredients":[{"amount":"2 cups / 300 g","item":"mixed olives with pits (green and black)","israelNote":"Israeli deli-counter olives — Syrian, Kalamata, or cracked green"},{"amount":"1/4 cup / 60 ml","item":"extra-virgin olive oil"},{"amount":"2 cloves","item":"garlic, smashed and sliced"},{"amount":"2 sprigs","item":"fresh rosemary"},{"amount":"1","item":"bay leaf"},{"amount":"3–4 wide strips","item":"orange zest, peeled with a vegetable peeler"},{"amount":"2 strips","item":"lemon zest"},{"amount":"1/4 tsp","item":"chili flakes"},{"amount":"1 tbsp / 15 ml","item":"fresh orange juice"}],"ingredientsHe":[{"amount":"2 כוסות / 300 גרם","item":"תערובת זיתים עם גלעינים (ירוקים ושחורים)","israelNote":"זיתים מהמעדנייה — סורי, קלמטה או ירוק מבוקע"},{"amount":"1/4 כוס / 60 מ\"ל","item":"שמן זית כתית מעולה"},{"amount":"2 שיניים","item":"שום, מעוך ופרוס"},{"amount":"2 ענפים","item":"רוזמרין טרי"},{"amount":"1","item":"עלה דפנה"},{"amount":"3–4 רצועות רחבות","item":"גרידת תפוז, מקולפת בקולפן ירקות"},{"amount":"2 רצועות","item":"גרידת לימון"},{"amount":"1/4 כפית","item":"פתיתי צ\u0027ילי"},{"amount":"1 כף / 15 מ\"ל","item":"מיץ תפוזים טרי"}],"instructions":["Drain and rinse the olives and pat them dry.","Warm the olive oil in a small pan over low heat with the garlic, rosemary, bay leaf, citrus zests, and chili flakes until fragrant and gently bubbling, 1–2 minutes — do not brown the garlic.","Take the pan off the heat and stir in the olives and orange juice, tossing to coat.","Let stand at least 30 minutes at room temperature, or refrigerate overnight — the flavor improves with time.","Serve at room temperature or gently rewarmed. Keeps refrigerated up to 4 days."],"instructionsHe":["מסננים ושוטפים את הזיתים ומייבשים אותם.","מחממים את שמן הזית במחבת קטנה על אש נמוכה עם השום, הרוזמרין, עלה הדפנה, גרידות ההדרים ופתיתי הצ\u0027ילי עד שעולה ריח והשמן מבעבע בעדינות, 1–2 דקות — לא נותנים לשום להשחים.","מורידים את המחבת מהאש ומערבבים פנימה את הזיתים ומיץ התפוזים, מערבבים לציפוי אחיד.","משאירים לפחות 30 דקות בטמפרטורת החדר, או מקררים ללילה — הטעם משתבח עם הזמן.","מגישים בטמפרטורת החדר או מחוממים קלות. נשמר במקרר עד 4 ימים."],"nutrition":{"calories":95,"fatG":9.5,"satFatG":1.3,"proteinG":0.8,"carbsG":3.5,"fiberG":1.5,"netCarbsG":2,"sugarG":0.5,"sodiumMg":480},"tips":"The leftover infused oil is excellent spooned over salads or roasted vegetables. Rinsing brined olives first keeps the dish from being overwhelmingly salty.","tipsHe":"השמן המתובל שנשאר מצוין על סלטים או ירקות צלויים. שטיפת הזיתים מהציר קודם שומרת על המנה מלהיות מלוחה מדי.","sources":[{"creator":"Gourmande in the Kitchen","url":"https://gourmandeinthekitchen.com/marinated-olives-recipe/"},{"creator":"Giada De Laurentiis (Food Network)","url":"https://www.foodnetwork.com/recipes/giada-de-laurentiis/warm-citrus-marinated-olives-4552731"},{"creator":"Well Seasoned Studio","url":"https://www.wellseasonedstudio.com/marinated-olives/"}],"comparedVersions":"Compared cold-marinated versions against warm-infusion versions; warming the oil with the aromatics (Gourmande in the Kitchen, Giada) won because it extracts the garlic, herb, and zest flavors in minutes instead of days. Trimmed the aromatics to items found in any Israeli supermarket, dropping grapefruit and fennel seed.","comparedVersionsHe":"השווינו גרסאות מרינדה קרה מול גרסאות חליטה חמה; חימום השמן עם התיבולים (Gourmande in the Kitchen, ג\u0027אדה) ניצח כי הוא מחלץ את טעמי השום, עשבי התיבול והגרידה בדקות במקום בימים. צמצמנו את התיבולים למה שנמצא בכל סופר ישראלי, וויתרנו על אשכולית וזרעי שומר."},{"id":"crispy-kale-chips","name":"Crispy Kale Chips","nameHe":"צ\u0027יפס קייל פריך","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":4,"prepTimeMin":10,"cookTimeMin":20,"difficulty":"easy","ingredients":[{"amount":"1 large bunch / 200 g leaves","item":"kale","israelNote":"kale (keil) — sold fresh at supermarkets and shuk stalls; check leaves carefully for insects per kosher practice"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1/4 tsp","item":"fine salt"},{"amount":"1/4 tsp","item":"garlic powder (optional)"}],"ingredientsHe":[{"amount":"1 צרור גדול / 200 גרם עלים","item":"קייל","israelNote":"נמכר טרי בסופרים ובשוק; בודקים היטב מחרקים לפי כללי הכשרות"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1/4 כפית","item":"מלח דק"},{"amount":"1/4 כפית","item":"אבקת שום (לא חובה)"}],"instructions":["Heat the oven to 150°C / 300°F and line two baking trays with baking paper.","Strip the leaves off the tough stems and tear into chip-sized pieces.","Wash well and dry completely — a salad spinner plus a towel; any moisture makes them steam instead of crisp.","Drizzle with the olive oil and massage it into every leaf with your hands, using no more oil than listed.","Spread in a single layer with space between leaves and sprinkle lightly with salt and garlic powder.","Bake 18–22 minutes until crisp but still green, rotating trays halfway and pulling out any leaves that finish early.","Cool a few minutes on the tray before eating; best the same day."],"instructionsHe":["מחממים תנור ל-150 מעלות ומרפדים שתי תבניות בנייר אפייה.","מפרידים את העלים מהגבעולים הקשים וקורעים לחתיכות בגודל צ\u0027יפס.","שוטפים היטב ומייבשים לגמרי — מסובבת סלט ואחריה מגבת; כל לחות תגרום להם להתאדות במקום להשתפרך.","מזליפים את שמן הזית ומעסים אותו לתוך כל עלה בידיים, בלי יותר שמן מהכמות הרשומה.","מפזרים בשכבה אחת עם רווח בין העלים ומפזרים מעט מלח ואבקת שום.","אופים 18–22 דקות עד שהעלים פריכים אך עדיין ירוקים, מסובבים את התבניות באמצע ומוציאים עלים שמוכנים מוקדם.","מצננים כמה דקות על התבנית לפני האכילה; הכי טעים באותו יום."],"nutrition":{"calories":55,"fatG":3.8,"satFatG":0.5,"proteinG":1.5,"carbsG":4.5,"fiberG":2,"netCarbsG":2.5,"sugarG":1,"sodiumMg":170},"lowCarbVariant":"Dust with 2 tbsp grated parmesan before baking (makes the recipe dairy).","lowCarbVariantHe":"מפזרים 2 כפות פרמזן מגורר לפני האפייה (הופך את המתכון לחלבי).","tips":"Salt lightly before baking — the leaves shrink a lot and over-salting is the most common mistake. Low and slow beats hot and fast: high heat scorches the thin edges before the centers dry.","tipsHe":"ממליחים מעט לפני האפייה — העלים מצטמקים מאוד והמלחת-יתר היא הטעות הנפוצה ביותר. נמוך ואיטי מנצח חם ומהיר: חום גבוה חורך את הקצוות הדקים לפני שהמרכז מתייבש.","sources":[{"creator":"Minimalist Baker","url":"https://minimalistbaker.com/how-to-make-kale-chips/"},{"creator":"Healthy Recipes Blog","url":"https://healthyrecipesblogs.com/kale-chips/"},{"creator":"The Busy Baker","url":"https://thebusybaker.ca/sea-salt-and-garlic-kale-chips/"}],"comparedVersions":"Compared bake temperatures from 150°C to 165°C and oil amounts across three versions; the lower-temperature bake with minimal oil won because every source agrees excess oil and heat are what make kale chips soggy or bitter. Merged the universal drying and single-layer tips into the steps since they are the actual keys to crispness.","comparedVersionsHe":"השווינו טמפרטורות אפייה מ-150 עד 165 מעלות וכמויות שמן בשלוש גרסאות; האפייה בטמפרטורה הנמוכה עם מינימום שמן ניצחה, כי כל המקורות מסכימים שעודף שמן וחום הם מה שהופך צ\u0027יפס קייל לרך או מריר. שילבנו את טיפי הייבוש והשכבה האחת, שחוזרים בכל הגרסאות, לתוך השלבים עצמם — כי הם המפתח האמיתי לפריכות."},{"id":"tuna-avocado-boats","name":"Tuna-Stuffed Avocado Boats","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":2,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1 large / 200 g flesh","item":"ripe avocado"},{"amount":"1 can / 140 g","item":"tuna in olive oil, well drained","israelNote":"ton bahar zayit (Starkist/Wili Food)"},{"amount":"2 tbsp / 30 g","item":"mayonnaise"},{"amount":"2 tbsp / 20 g","item":"red onion, finely chopped"},{"amount":"1 tbsp / 15 ml","item":"fresh lemon juice"},{"amount":"1 tbsp","item":"chopped fresh parsley"},{"amount":"to taste","item":"salt and black pepper"}],"instructions":["Drain the tuna very well, pressing it against the can with a fork so the filling stays firm and not watery.","In a bowl, flake the tuna and mix it with the mayonnaise, red onion, lemon juice, parsley, salt and pepper.","Halve the avocado lengthwise and remove the pit. Scoop out about a spoonful of flesh from each half to widen the hollow.","Dice the scooped-out avocado and fold it gently into the tuna mixture.","Pile the tuna salad into the two avocado halves, grind black pepper on top and serve immediately with a wedge of lemon."],"nutrition":{"calories":345,"fatG":29.0,"satFatG":4.6,"proteinG":15.5,"carbsG":10.0,"fiberG":6.9,"netCarbsG":3.1,"sugarG":1.5,"sodiumMg":380},"lowCarbVariant":"Top with halved cherry tomatoes for freshness (adds about 1 g net carbs).","tips":"Squeeze lemon juice over any exposed avocado to keep it green; eat the same day.","sources":[{"creator":"Downshiftology","url":"https://downshiftology.com/recipes/tuna-stuffed-avocados/"},{"creator":"KetoVale","url":"https://www.ketovale.com/tuna-avocado-boats/"},{"creator":"Tastes Lovely","url":"https://www.tasteslovely.com/paleo-tuna-avocado-boats/"}],"comparedVersions":"Compared three creators on filling binder (mayo vs. mashed avocado) and add-ins. Kept the classic mayo version for creaminess but borrowed Downshiftology\u0027s trick of folding the scooped avocado back into the salad, which stretches the filling and adds fiber without extra ingredients.","nameHe":"סירות אבוקדו במילוי טונה","ingredientsHe":[{"amount":"1 גדול / 200 גרם בשר הפרי","item":"אבוקדו בשל"},{"amount":"1 פחית / 140 גרם","item":"טונה בשמן זית, מסוננת היטב","israelNote":"סטארקיסט / ויליפוד"},{"amount":"2 כפות / 30 גרם","item":"מיונז"},{"amount":"2 כפות / 20 גרם","item":"בצל סגול קצוץ דק"},{"amount":"1 כף / 15 מ\"ל","item":"מיץ לימון טרי"},{"amount":"1 כף","item":"פטרוזיליה טרייה קצוצה"},{"amount":"לפי הטעם","item":"מלח ופלפל שחור"}],"instructionsHe":["מסננים את הטונה היטב ולוחצים עליה עם מזלג כנגד דפנות הפחית, כדי שהמילוי יישאר יציב ולא מימי.","בקערה, מפוררים את הטונה ומערבבים עם המיונז, הבצל הסגול, מיץ הלימון, הפטרוזיליה, מלח ופלפל.","חוצים את האבוקדו לאורכו ומוציאים את הגלעין. מוציאים בכף מעט מבשר הפרי מכל חצי כדי להרחיב את השקע.","קוצצים את האבוקדו שהוצאתם לקוביות ומקפלים בעדינות לתוך תערובת הטונה.","ממלאים את שני חצאי האבוקדו בסלט הטונה, טוחנים מעל פלפל שחור ומגישים מיד עם פלח לימון."],"lowCarbVariantHe":"מוסיפים מעל עגבניות שרי חצויות לרעננות (מוסיף כ-1 גרם פחמימות נטו).","tipsHe":"סוחטים מיץ לימון על האבוקדו החשוף כדי שיישאר ירוק; מומלץ לאכול באותו יום.","comparedVersionsHe":"השווינו שלושה מתכונים בשאלת הבסיס למילוי (מיונז לעומת אבוקדו מעוך) והתוספות. שמרנו על גרסת המיונז הקלאסית לקרמיות, אבל אימצנו מ-Downshiftology את הטריק של קיפול האבוקדו שהוצא חזרה לסלט - זה מגדיל את המילוי ומוסיף סיבים בלי מרכיבים נוספים."},{"id":"spiced-roasted-almonds","name":"Smoky Spiced Roasted Almonds","nameHe":"שקדים קלויים בתיבול מעושן","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":8,"prepTimeMin":5,"cookTimeMin":12,"difficulty":"easy","ingredients":[{"amount":"2 cups / 280 g","item":"raw whole almonds","israelNote":"shkedim tiv\u0027iyim — sold in every supermarket nut aisle"},{"amount":"1 tbsp / 15 ml","item":"olive oil"},{"amount":"1 tsp","item":"smoked paprika","israelNote":"paprika me\u0027usheneth; sweet paprika works too"},{"amount":"1 tsp","item":"ground cumin"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/4 tsp","item":"cayenne pepper (optional, for heat)"},{"amount":"3/4 tsp","item":"fine salt"}],"ingredientsHe":[{"amount":"2 כוסות / 280 גרם","item":"שקדים טבעיים שלמים","israelNote":"נמכרים בכל מדף פיצוחים בסופר"},{"amount":"1 כף / 15 מ\"ל","item":"שמן זית"},{"amount":"1 כפית","item":"פפריקה מעושנת","israelNote":"גם פפריקה מתוקה עובדת"},{"amount":"1 כפית","item":"כמון טחון"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/4 כפית","item":"פלפל קאיין (לא חובה, לחריפות)"},{"amount":"3/4 כפית","item":"מלח דק"}],"instructions":["Heat the oven to 160°C / 325°F and line a baking tray with baking paper.","Stir the paprika, cumin, garlic powder, cayenne, and salt together in a large bowl.","Add the almonds and olive oil and toss until every almond is evenly coated in spices.","Spread in a single layer on the tray.","Roast 10–12 minutes, stirring once halfway, until fragrant and lightly darkened — do not let them brown deeply, they keep cooking as they cool.","Cool completely on the tray (they crisp as they cool), then store airtight for up to 2 weeks."],"instructionsHe":["מחממים תנור ל-160 מעלות ומרפדים תבנית בנייר אפייה.","מערבבים בקערה גדולה את הפפריקה, הכמון, אבקת השום, הקאיין והמלח.","מוסיפים את השקדים ושמן הזית ומערבבים עד שכל שקד מצופה בתבלינים באופן אחיד.","מפזרים בשכבה אחת על התבנית.","קולים 10–12 דקות, מערבבים פעם אחת באמצע, עד שעולה ריח והשקדים מתכהים קלות — לא נותנים להם להשחים חזק, הם ממשיכים להיקלות גם כשהם מתקררים.","מצננים לגמרי על התבנית (הם נהיים פריכים תוך כדי הצינון), ושומרים בכלי אטום עד שבועיים."],"nutrition":{"calories":215,"fatG":19,"satFatG":1.5,"proteinG":7.4,"carbsG":7.6,"fiberG":4.4,"netCarbsG":3.2,"sugarG":1.5,"sodiumMg":225},"ketoVariant":"Add 1/2 tsp of powdered sweetener (erythritol) to the spice mix for a sweet-smoky coating without carbs.","ketoVariantHe":"מוסיפים לתערובת התבלינים 1/2 כפית ממתיק אבקתי (אריתריטול) לציפוי מתוק-מעושן בלי פחמימות.","tips":"Watch closely in the last 2 minutes — almonds go from toasted to burnt fast. A serving is a small handful (about 35 g); nuts are keto-friendly but calorie-dense.","tipsHe":"משגיחים היטב בשתי הדקות האחרונות — שקדים עוברים מקלויים לשרופים מהר. מנה היא חופן קטן (כ-35 גרם); אגוזים ידידותיים לקיטו אבל עתירי קלוריות.","sources":[{"creator":"Savory Tooth","url":"https://www.savorytooth.com/spiced-almonds/"},{"creator":"An Oregon Cottage","url":"https://anoregoncottage.com/spicy-roasted-almonds-recipe/"},{"creator":"The Gracious Pantry","url":"https://www.thegraciouspantry.com/clean-eating-spicy-roasted-almonds/"}],"comparedVersions":"Compared a 5-minute stovetop version (Savory Tooth) against oven-roasted versions; the oven method won because it toasts a double batch evenly with no stirring at the stove and starts from cheaper raw almonds. Kept Savory Tooth\u0027s smoked paprika–cumin–garlic profile, which had the best flavor balance, and dropped sriracha to keep the ingredient list to pantry spices.","comparedVersionsHe":"השווינו גרסת מחבת של 5 דקות (Savory Tooth) מול גרסאות קלייה בתנור; שיטת התנור ניצחה כי היא קולה מנה כפולה באופן אחיד בלי ערבוב ליד הכיריים, ומתחילה משקדים טבעיים זולים יותר. שמרנו על פרופיל הפפריקה המעושנת-כמון-שום של Savory Tooth, שנתן את איזון הטעמים הטוב ביותר, וויתרנו על הסריראצ\u0027ה כדי להישאר עם תבלינים שיש בכל מטבח."},{"id":"tahini-dip-crudites","name":"Lemon-Garlic Tahini Dip with Crudités","nameHe":"מטבל טחינה לימון-שום עם ירקות טריים","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":6,"prepTimeMin":10,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 120 g","item":"raw tahini, well stirred","israelNote":"raw tahini (Har Bracha/Achva)"},{"amount":"3 tbsp / 45 ml","item":"fresh lemon juice"},{"amount":"1 clove","item":"garlic, finely grated"},{"amount":"1/2 tsp","item":"fine salt"},{"amount":"1/4 tsp","item":"ground cumin (optional)"},{"amount":"4–8 tbsp / 60–120 ml","item":"cold water"},{"amount":"1 tbsp","item":"chopped parsley, for serving"},{"amount":"assorted / ~500 g","item":"crudités: cucumber, pepper strips, celery, cherry tomatoes, kohlrabi","israelNote":"kohlrabi (kolrabi) is excellent and cheap in Israel"}],"ingredientsHe":[{"amount":"1/2 כוס / 120 גרם","item":"טחינה גולמית, מעורבבת היטב","israelNote":"למשל הר ברכה או אחוה"},{"amount":"3 כפות / 45 מ\"ל","item":"מיץ לימון טרי"},{"amount":"1 שן","item":"שום, מגוררת דק"},{"amount":"1/2 כפית","item":"מלח דק"},{"amount":"1/4 כפית","item":"כמון טחון (לא חובה)"},{"amount":"4–8 כפות / 60–120 מ\"ל","item":"מים קרים"},{"amount":"1 כף","item":"פטרוזיליה קצוצה, להגשה"},{"amount":"מגוון / כ-500 גרם","item":"ירקות טריים: מלפפון, רצועות פלפל, סלרי, עגבניות שרי, קולורבי","israelNote":"קולורבי מצוין וזול בישראל"}],"instructions":["Whisk the tahini, lemon juice, grated garlic, salt, and cumin in a bowl — the mixture will seize and thicken; this is normal.","Whisk in water a tablespoon at a time until the dip loosens, turns pale, and becomes creamy. For a thick dip stop early; for a sauce keep going.","Taste and adjust the salt and lemon.","Spoon into a bowl, swirl the top, and scatter with parsley (and a drizzle of olive oil if you like).","Cut the vegetables into sticks and serve around the dip. Keeps refrigerated up to 5 days; re-loosen with a splash of water."],"instructionsHe":["טורפים בקערה את הטחינה, מיץ הלימון, השום המגורר, המלח והכמון — התערובת תיתפס ותסמיך; זה נורמלי.","טורפים פנימה מים כף אחר כף עד שהמטבל משתחרר, מחוויר ונהיה קרמי. למטבל סמיך עוצרים מוקדם; לרוטב ממשיכים.","טועמים ומתקנים מלח ולימון.","מעבירים לקערה, יוצרים מערבולת על פני השטח ומפזרים פטרוזיליה (וזרזיף שמן זית למי שאוהב).","חותכים את הירקות למקלות ומגישים סביב המטבל. נשמר במקרר עד 5 ימים; מרעננים במעט מים."],"nutrition":{"calories":140,"fatG":11,"satFatG":1.6,"proteinG":3.8,"carbsG":6,"fiberG":2.8,"netCarbsG":3.2,"sugarG":1.5,"sodiumMg":220},"ketoVariant":"Stick to cucumber, celery, and pepper for dipping; carrots roughly double the carbs per stick.","ketoVariantHe":"נשארים עם מלפפון, סלרי ופלפל לטבילה; גזר בערך מכפיל את הפחמימות למקל.","tips":"Grate the garlic and let it sit in the lemon juice for 10 minutes before whisking for a mellower, rounder garlic flavor.","tipsHe":"מגררים את השום ומשרים אותו במיץ הלימון 10 דקות לפני הטריפה — מקבלים טעם שום עדין ועגול יותר.","sources":[{"creator":"Inspired Taste","url":"https://www.inspiredtaste.net/27791/tahini-sauce-recipe/"},{"creator":"All the Healthy Things","url":"https://allthehealthythings.com/lemon-garlic-tahini-sauce/"},{"creator":"The Yellow Table","url":"https://www.theyellowtable.com/recipes/best-crudites-lemon-parsley-tahini-dip-recipe"}],"comparedVersions":"Compared tahini-to-lemon-to-water ratios across three versions; Inspired Taste\u0027s gradual-water whisking technique won because it reliably takes the tahini through the seized stage to creamy, and grating the garlic (All the Healthy Things) avoids raw garlic chunks. Scaled to a 1/2-cup batch sized for six with vegetables.","comparedVersionsHe":"השווינו יחסי טחינה-לימון-מים בשלוש גרסאות; טכניקת הוספת המים ההדרגתית של Inspired Taste ניצחה כי היא מעבירה את הטחינה באמינות דרך שלב ההיתפסות אל הקרמיות, וגירור השום (All the Healthy Things) מונע חתיכות שום חי. הותאם לכמות של חצי כוס, שמספיקה לשישה עם ירקות."},{"id":"keto-trail-mix","name":"Keto Trail Mix with Dark Chocolate","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":8,"prepTimeMin":5,"cookTimeMin":8,"difficulty":"easy","ingredients":[{"amount":"1/2 cup / 70 g","item":"raw almonds","israelNote":"shkedim tiv\u0027iyim"},{"amount":"1/2 cup / 50 g","item":"pecan halves","israelNote":"pekanim"},{"amount":"1/2 cup / 50 g","item":"walnut halves","israelNote":"egozei melech"},{"amount":"1/2 cup / 65 g","item":"shelled pumpkin seeds","israelNote":"garinei dla\u0027at kelufim"},{"amount":"1/4 cup / 35 g","item":"sunflower seeds","israelNote":"garinei chamania kelufim"},{"amount":"3/4 cup / 45 g","item":"unsweetened coconut chips","israelNote":"shvavei kokos lo mumtakim (health-food aisle)"},{"amount":"50 g","item":"85% dark chocolate, chopped into chunks","israelNote":"shokolad marir 85% - check for pareve certification (e.g. Splendid 85%)"},{"amount":"1/4 tsp","item":"flaky salt (optional)"}],"instructions":["Heat the oven to 160°C / 325°F.","Spread the almonds, pecans, walnuts, pumpkin seeds and sunflower seeds on a baking tray and toast 6-8 minutes, until fragrant.","Add the coconut chips for the last 2-3 minutes only - they brown much faster than the nuts.","Cool the tray completely. Warm nuts will melt the chocolate, so be patient.","Toss the cooled nuts and coconut with the chocolate chunks and flaky salt.","Store airtight at room temperature up to a month; portion 1/3-cup servings into small bags for grab-and-go."],"nutrition":{"calories":280,"fatG":25.7,"satFatG":7.0,"proteinG":8.0,"carbsG":8.1,"fiberG":4.7,"netCarbsG":3.4,"sugarG":1.6,"sodiumMg":75},"ketoVariant":"Already keto; use 90% chocolate or sugar-free chips to cut another gram of sugar.","lowCarbVariant":"Add 2 tbsp unsweetened dried cranberries for a fruitier mix (about +2 g net carbs per serving).","tips":"Measure portions - trail mix is easy to overeat and the calories add up fast.","sources":[{"creator":"Tastes Lovely","url":"https://www.tasteslovely.com/whole30-keto-nuts-coconut-trail-mix/"},{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/healthy-trail-mix/"},{"creator":"Wholly Tasteful","url":"https://www.whollytasteful.com/low-carb-trail-mix/"}],"comparedVersions":"Compared no-toast mixes against toasted versions and different chocolate choices (sugar-free chips vs. 85% bars). Toasting won decisively for flavor, and a chopped 85% pareve bar beat specialty sugar-free chips for Israeli availability; skipped dried cranberries from the base mix to keep it firmly keto.","nameHe":"תערובת שבילים קיטו עם שוקולד מריר","ingredientsHe":[{"amount":"1/2 כוס / 70 גרם","item":"שקדים טבעיים"},{"amount":"1/2 כוס / 50 גרם","item":"חצאי פקאן"},{"amount":"1/2 כוס / 50 גרם","item":"חצאי אגוזי מלך"},{"amount":"1/2 כוס / 65 גרם","item":"גרעיני דלעת קלופים"},{"amount":"1/4 כוס / 35 גרם","item":"גרעיני חמנייה קלופים"},{"amount":"3/4 כוס / 45 גרם","item":"שבבי קוקוס לא ממותקים","israelNote":"מדף הבריאות / חנויות טבע"},{"amount":"50 גרם","item":"שוקולד מריר 85% קצוץ לחתיכות","israelNote":"לבדוק הכשר פרווה (למשל ספלנדיד 85%)"},{"amount":"1/4 כפית","item":"מלח בפתיתים (לא חובה)"}],"instructionsHe":["מחממים תנור ל-160 מעלות.","מפזרים את השקדים, הפקאנים, אגוזי המלך, גרעיני הדלעת וגרעיני החמנייה על תבנית וקולים 6-8 דקות, עד שהם ריחניים.","מוסיפים את שבבי הקוקוס רק ב-2-3 הדקות האחרונות - הם משחימים הרבה יותר מהר מהאגוזים.","מצננים את התבנית לגמרי. אגוזים חמים ימיסו את השוקולד, אז מתאזרים בסבלנות.","מערבבים את האגוזים והקוקוס המצוננים עם חתיכות השוקולד והמלח.","נשמר בכלי אטום בטמפרטורת החדר עד חודש; מחלקים מנות של 1/3 כוס לשקיות קטנות לנשנוש בדרכים."],"ketoVariantHe":"כבר קיטו; שוקולד 90% או שבבי שוקולד ללא סוכר יחסכו עוד גרם סוכר.","lowCarbVariantHe":"מוסיפים 2 כפות חמוציות מיובשות לא ממותקות לתערובת פירותית יותר (כ-2 גרם פחמימות נטו נוספות למנה).","tipsHe":"שוקלים מנות - קל מאוד לאכול יותר מדי תערובת שבילים והקלוריות מצטברות מהר.","comparedVersionsHe":"השווינו תערובות ללא קלייה מול גרסאות קלויות, ובחירות שוקולד שונות (שבבים ללא סוכר מול חטיפי 85%). הקלייה ניצחה באופן חד-משמעי בטעם, וחטיף 85% פרווה קצוץ עדיף על שבבים ללא סוכר מבחינת זמינות בישראל; השמטנו את החמוציות מהתערובת הבסיסית כדי להישאר קיטו לגמרי."},{"id":"almond-crusted-cheese-sticks","name":"Baked Almond-Crusted Cheese Sticks","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":15,"cookTimeMin":6,"difficulty":"medium","ingredients":[{"amount":"8 sticks / 224 g","item":"mozzarella string cheese","israelNote":"makelot mozzarella / gvinat mozzarella cut into thick sticks"},{"amount":"1/2 cup / 56 g","item":"almond flour","israelNote":"kemach shkedim"},{"amount":"1/4 cup / 25 g","item":"finely grated parmesan","israelNote":"gvinat parmezan megureded"},{"amount":"2","item":"eggs, beaten"},{"amount":"1 tsp","item":"dried oregano or Italian herb mix"},{"amount":"1/2 tsp","item":"garlic powder"},{"amount":"1/2 tsp","item":"sweet paprika"}],"instructions":["Cut each cheese stick in half to make 16 short pieces.","Mix the almond flour, parmesan, oregano, garlic powder and paprika in one shallow bowl; beat the eggs in another.","Dip each cheese piece in egg, then in the almond mixture. Repeat the dip for a second coat - double coating is what keeps the cheese sealed in.","Arrange on a lined tray and freeze for at least 1 hour. Do not skip this or the cheese will leak before the crust sets.","Heat the oven to 200°C / 400°F (or an air fryer to 190°C).","Bake the frozen sticks 5-6 minutes, flipping once, just until golden and barely starting to soften. In the air fryer: about 5 minutes.","Rest 2 minutes and serve warm, with warm sugar-free tomato sauce for dipping if you like."],"nutrition":{"calories":300,"fatG":23.0,"satFatG":9.3,"proteinG":22.0,"carbsG":5.3,"fiberG":1.6,"netCarbsG":3.7,"sugarG":1.0,"sodiumMg":480},"ketoVariant":"Already keto.","tips":"Coat and freeze a double batch; bake straight from the freezer whenever a craving hits.","sources":[{"creator":"Wholesome Yum","url":"https://www.wholesomeyum.com/recipes/gluten-free-low-carb-mozzarella-sticks/"},{"creator":"That Low Carb Life","url":"https://thatlowcarblife.com/keto-mozzarella-sticks/"},{"creator":"KetoFocus","url":"https://www.ketofocus.com/recipes/keto-mozzarella-sticks/"}],"comparedVersions":"Compared coatings: Wholesome Yum\u0027s almond flour + crushed pork rinds is not kosher, so this version uses That Low Carb Life\u0027s almond flour + parmesan approach instead. Kept the two techniques every version agreed on - double dredging and a mandatory 1-hour freeze - which are what prevent cheese blowouts in a hot oven.","nameHe":"מקלות גבינה אפויים בציפוי שקדים","ingredientsHe":[{"amount":"8 מקלות / 224 גרם","item":"מקלות גבינת מוצרלה","israelNote":"או גוש מוצרלה חתוך למקלות עבים"},{"amount":"1/2 כוס / 56 גרם","item":"קמח שקדים"},{"amount":"1/4 כוס / 25 גרם","item":"פרמזן מגורר דק"},{"amount":"2","item":"ביצים טרופות"},{"amount":"1 כפית","item":"אורגנו יבש או תערובת עשבי תיבול איטלקית"},{"amount":"1/2 כפית","item":"אבקת שום"},{"amount":"1/2 כפית","item":"פפריקה מתוקה"}],"instructionsHe":["חותכים כל מקל גבינה לשניים לקבלת 16 מקלות קצרים.","מערבבים בקערה רדודה אחת את קמח השקדים, הפרמזן, האורגנו, אבקת השום והפפריקה; טורפים את הביצים בקערה שנייה.","טובלים כל חתיכת גבינה בביצה ואז בתערובת השקדים. חוזרים על הטבילה לציפוי שני - הציפוי הכפול הוא מה ששומר על הגבינה אטומה בפנים.","מסדרים על תבנית מרופדת ומקפיאים לפחות שעה. לא מדלגים על השלב הזה, אחרת הגבינה תדלוף לפני שהציפוי יתייצב.","מחממים תנור ל-200 מעלות (או מטגן אוויר ל-190 מעלות).","אופים את המקלות הקפואים 5-6 דקות עם הפיכה אחת, רק עד שהם זהובים ומתחילים להתרכך. במטגן אוויר: כ-5 דקות.","ממתינים 2 דקות ומגישים חם, עם רוטב עגבניות חם ללא סוכר לטבילה אם רוצים."],"ketoVariantHe":"כבר קיטו.","tipsHe":"מצפים ומקפיאים מנה כפולה; אופים ישר מהמקפיא בכל פעם שמתחשק.","comparedVersionsHe":"השווינו ציפויים: הציפוי של Wholesome Yum מבוסס על קמח שקדים עם פצפוצי עור חזיר ואינו כשר, ולכן כאן נבחרה הגישה של That Low Carb Life עם קמח שקדים ופרמזן. שמרנו על שתי הטכניקות שכל הגרסאות מסכימות עליהן - ציפוי כפול והקפאה חובה של שעה - שהן מה שמונע מהגבינה להתפרץ בתנור חם."},{"id":"smoked-salmon-cucumber-rolls","name":"Smoked Salmon Cucumber Rolls","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":4,"prepTimeMin":20,"cookTimeMin":0,"difficulty":"medium","ingredients":[{"amount":"1 large / 300 g","item":"long seedless cucumber","israelNote":"melafefon arokh; or use the widest Israeli cucumbers you can find"},{"amount":"100 g","item":"smoked salmon slices","israelNote":"salmon me\u0027ushan (fish - pareve, but dish is dairy from the cheese)"},{"amount":"100 g","item":"cream cheese, softened","israelNote":"gvinat shamenet (Napoleon/Ski)"},{"amount":"1 tbsp","item":"chopped fresh dill","israelNote":"shamir"},{"amount":"1 tsp / 5 ml","item":"fresh lemon juice"},{"amount":"1/2 tsp","item":"grated lemon zest"},{"amount":"to taste","item":"black pepper"},{"amount":"1 tbsp (optional)","item":"capers, drained"}],"instructions":["Stir the cream cheese with the dill, lemon juice, zest and black pepper until smooth.","Using a vegetable peeler, shave the cucumber lengthwise into thin wide ribbons; discard the first seedy strips. You need about 16 good ribbons.","Pat the ribbons completely dry with paper towels - this keeps the rolls from sliding apart.","Spread a thin layer of the cheese mixture along each ribbon.","Lay a strip of smoked salmon over the cheese, then roll the ribbon up snugly from one end.","Stand the rolls seam-side down on a plate, top each with a caper if using, and chill until serving."],"nutrition":{"calories":130,"fatG":9.8,"satFatG":5.3,"proteinG":6.4,"carbsG":4.3,"fiberG":0.5,"netCarbsG":3.8,"sugarG":2.2,"sodiumMg":300},"ketoVariant":"Already keto; add more salmon and cheese per roll for a fattier bite.","tips":"A mandoline gives more even ribbons than a peeler; secure loose rolls with a toothpick.","sources":[{"creator":"Simply Home Cooked","url":"https://simplyhomecooked.com/smoked-salmon-cucumber-rolls/"},{"creator":"The Endless Meal","url":"https://www.theendlessmeal.com/mini-cucumber-smoked-salmon-appetizer-bites/"},{"creator":"Appetizer Addiction","url":"https://www.appetizeraddiction.com/smoked-salmon-cucumber-rolls/"}],"comparedVersions":"Compared fillings across three versions: horseradish + heavy cream, Greek yogurt blends, and plain lemon-dill cream cheese. The lemon-dill version won for simplicity (no specialty ingredients) while keeping the flavor everyone praised; drying the cucumber ribbons was the technique all top versions agreed on.","nameHe":"גלילות מלפפון וסלמון מעושן","ingredientsHe":[{"amount":"1 גדול / 300 גרם","item":"מלפפון ארוך ללא גרעינים","israelNote":"או המלפפונים הישראליים הרחבים ביותר שתמצאו"},{"amount":"100 גרם","item":"פרוסות סלמון מעושן","israelNote":"הדג עצמו פרווה, אבל המנה חלבית בגלל הגבינה"},{"amount":"100 גרם","item":"גבינת שמנת מרוככת","israelNote":"נפוליאון / סקי"},{"amount":"1 כף","item":"שמיר טרי קצוץ"},{"amount":"1 כפית / 5 מ\"ל","item":"מיץ לימון טרי"},{"amount":"1/2 כפית","item":"גרידת לימון"},{"amount":"לפי הטעם","item":"פלפל שחור"},{"amount":"1 כף (לא חובה)","item":"צלפים מסוננים"}],"instructionsHe":["מערבבים את גבינת השמנת עם השמיר, מיץ הלימון, הגרידה והפלפל השחור עד לקבלת תערובת חלקה.","בעזרת קולפן ירקות, פורסים את המלפפון לאורכו לרצועות דקות ורחבות; זורקים את הרצועות הראשונות המלאות בגרעינים. צריך בערך 16 רצועות טובות.","מייבשים את הרצועות היטב במגבת נייר - זה מה שמונע מהגלילות להחליק ולהיפתח.","מורחים שכבה דקה של תערובת הגבינה לאורך כל רצועה.","מניחים רצועת סלמון מעושן על הגבינה ומגלגלים את הרצועה בהידוק מקצה אחד.","מעמידים את הגלילות עם התפר כלפי מטה על צלחת, מניחים צלף על כל אחת אם רוצים ומצננים עד ההגשה."],"ketoVariantHe":"כבר קיטו; מוסיפים יותר סלמון וגבינה בכל גלילה לביס שומני יותר.","tipsHe":"מנדולינה נותנת רצועות אחידות יותר מקולפן; גלילות רופפות אפשר לנעוץ בקיסם.","comparedVersionsHe":"השווינו מילויים בשלוש גרסאות: חזרת עם שמנת מתוקה, תערובות יוגורט יווני, וגבינת שמנת עם לימון ושמיר. גרסת הלימון-שמיר ניצחה בזכות הפשטות (בלי מרכיבים מיוחדים) עם הטעם שכולם שיבחו; ייבוש רצועות המלפפון הוא הטכניקה שכל הגרסאות המובילות הסכימו עליה."},{"id":"celery-almond-butter-boats","name":"Celery Boats with Almond Butter","category":"snacks","kosherType":"pareve","dietTags":"keto","servings":2,"prepTimeMin":8,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"4 stalks / 160 g","item":"celery","israelNote":"selery amerikai (stalk celery, not root)"},{"amount":"4 tbsp / 64 g","item":"natural almond butter (100% almonds, no added sugar)","israelNote":"chemat shkedim tiv\u0027it (health-food aisle)"},{"amount":"1 tbsp / 12 g","item":"chia or hemp seeds","israelNote":"zir\u0027ei chia"},{"amount":"1 pinch","item":"cinnamon or flaky salt"},{"amount":"1 tbsp (optional)","item":"sugar-free or 85% dark chocolate chips","israelNote":"check pareve certification"}],"instructions":["Wash the celery, trim the ends and pull off any tough outer strings with a peeler.","Cut each stalk into 2-3 hand-length boats and pat dry.","Stir the almond butter well (natural brands separate) and spread it into the groove of each boat.","Sprinkle with chia seeds, a pinch of cinnamon or flaky salt, and the chocolate chips if using. Serve immediately."],"nutrition":{"calories":233,"fatG":19.5,"satFatG":1.6,"proteinG":7.5,"carbsG":10.1,"fiberG":6.0,"netCarbsG":4.1,"sugarG":2.5,"sodiumMg":105},"ketoVariant":"Already keto.","lowCarbVariant":"Scatter a few unsweetened dried cranberries on top for classic \u0027ants on a log\u0027 (about +2 g net carbs).","tips":"Chill the assembled boats 10 minutes if you want the almond butter to set firm.","sources":[{"creator":"Sweet As Honey","url":"https://www.sweetashoney.co/ants-on-a-log/"},{"creator":"Ketogenic.com","url":"https://ketogenic.com/recipes/keto-ants-on-a-log/"},{"creator":"Carb Manager","url":"https://www.carbmanager.com/recipe-detail/ug:3817117d-5aca-52df-5e03-803b651f9ecb/celery-almond-butter"}],"comparedVersions":"Compared fillings (peanut butter, cream cheese, almond butter) and \u0027ant\u0027 toppings across keto versions of ants on a log. Almond butter with chia seeds won: pareve, no added sugar, more fiber than raisin-topped originals, and the chia adds the classic dotted look without the carbs.","nameHe":"סירות סלרי עם חמאת שקדים","ingredientsHe":[{"amount":"4 גבעולים / 160 גרם","item":"סלרי","israelNote":"סלרי אמריקאי (גבעולים, לא שורש)"},{"amount":"4 כפות / 64 גרם","item":"חמאת שקדים טבעית (100% שקדים, ללא סוכר מוסף)","israelNote":"מדף הבריאות / חנויות טבע"},{"amount":"1 כף / 12 גרם","item":"זרעי צ\u0027יה או המפ"},{"amount":"קורט","item":"קינמון או מלח בפתיתים"},{"amount":"1 כף (לא חובה)","item":"שבבי שוקולד ללא סוכר או מריר 85%","israelNote":"לבדוק הכשר פרווה"}],"instructionsHe":["שוטפים את הסלרי, חותכים את הקצוות ומושכים סיבים קשים מהצד החיצוני בעזרת קולפן.","חותכים כל גבעול ל-2-3 \u0027סירות\u0027 באורך כף יד ומייבשים.","מערבבים היטב את חמאת השקדים (במותגים טבעיים השמן נפרד) ומורחים אותה בשקע של כל סירה.","מפזרים זרעי צ\u0027יה, קורט קינמון או מלח בפתיתים, ושבבי שוקולד אם רוצים. מגישים מיד."],"ketoVariantHe":"כבר קיטו.","lowCarbVariantHe":"מפזרים מעל כמה חמוציות מיובשות לא ממותקות לגרסה הקלאסית של \u0027נמלים על בול עץ\u0027 (כ-2 גרם פחמימות נטו נוספות).","tipsHe":"מצננים את הסירות המוכנות 10 דקות אם רוצים שחמאת השקדים תתייצב.","comparedVersionsHe":"השווינו מילויים (חמאת בוטנים, גבינת שמנת, חמאת שקדים) ותוספות בגרסאות קיטו של \u0027נמלים על בול עץ\u0027. חמאת שקדים עם זרעי צ\u0027יה ניצחה: פרווה, ללא סוכר מוסף, יותר סיבים מהמקור עם הצימוקים, והצ\u0027יה נותנת את מראה הנקודות הקלאסי בלי הפחמימות."},{"id":"labneh-balls-zaatar","name":"Labneh Balls in Olive Oil \u0026 Za\u0027atar","category":"snacks","kosherType":"dairy","dietTags":"keto","servings":6,"prepTimeMin":15,"cookTimeMin":0,"difficulty":"easy","ingredients":[{"amount":"500 g","item":"thick labneh (or strain 1 kg full-fat yogurt with 1 tsp salt for 24-48 hours)","israelNote":"labaneh (widely available ready-made; buy the thickest one)"},{"amount":"2 tbsp / 15 g","item":"za\u0027atar","israelNote":"za\u0027atar blend"},{"amount":"about 1 cup / 240 ml","item":"extra-virgin olive oil (to cover)"},{"amount":"1/4 tsp","item":"chili flakes (optional)"},{"amount":"1 tsp","item":"sumac (optional)","israelNote":"sumak"}],"instructions":["If your labneh is soft, let it drain in a cheesecloth-lined sieve in the fridge for a few hours until it holds its shape; ready-made thick labaneh can be used as is.","With lightly oiled hands, roll the labneh into 12 walnut-sized balls and set them on a plate lined with baking paper.","Chill the balls for 30 minutes so they firm up.","Spread the za\u0027atar on a small plate and roll each ball in it to coat.","Place the balls in a clean jar, add the chili flakes and sumac if using, and pour in olive oil until fully covered.","Rest at least a few hours before serving. Keeps about a month in the fridge; bring to room temperature before serving so the oil liquefies."],"nutrition":{"calories":180,"fatG":13.4,"satFatG":5.8,"proteinG":6.6,"carbsG":4.8,"fiberG":0.6,"netCarbsG":4.2,"sugarG":3.5,"sodiumMg":380},"ketoVariant":"Already keto; serve with cucumber spears instead of bre
